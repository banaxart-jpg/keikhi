substitutions:
  _APP: admin
  _REGION: asia-northeast1
  _SERVICE: keikhi-admin
  _REPO: keikhi
  _SA: admin-run

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - ./apps/${_APP}/server

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,GCP_REGION=${_REGION}
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2

  - id: deploy-hosting
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install -g firebase-tools@latest --silent --no-audit --no-fund
        firebase deploy --only hosting \
          --project=$PROJECT_ID \
          --config=apps/${_APP}/firebase.json \
          --non-interactive

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
