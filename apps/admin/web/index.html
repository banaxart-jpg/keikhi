<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keikhi admin</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1116; --surface: #151a22; --surface2: #1e252f;
    --border: rgba(255,255,255,0.06);
    --text: #e6e8eb; --text2: rgba(230,232,235,0.6); --text3: rgba(230,232,235,0.35);
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --accent: #60a5fa;
  }
  html, body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .project { font-size: 11px; color: var(--text3); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .user-pill { display: flex; align-items: center; gap: 8px; }
  .user-email { font-size: 11px; color: var(--text2); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .btn:active { transform: scale(0.96); }

  section { margin-bottom: 28px; }
  .section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; padding-left: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; word-break: break-word; }
  .meta { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small { font-size: 11px; color: var(--text3); font-family: ui-monospace, monospace; word-break: break-all; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }
  .badge.ok    { color: var(--ok);   background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.25); }
  .badge.warn  { color: var(--warn); background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.25); }
  .badge.err   { color: var(--err);  background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.25); }
  .badge.muted { color: var(--text3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .link {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 12px; text-decoration: none; color: var(--text);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .link:active { transform: scale(0.97); background: var(--surface2); }
  .link .icn { font-size: 18px; }
  .link.accent { border-color: rgba(96,165,250,0.3); }
  .link.accent .icn { color: var(--accent); }

  .empty { color: var(--text3); font-size: 13px; padding: 8px 4px; }
  .err-box { color: var(--err); font-size: 11px; padding: 4px; word-break: break-word; white-space: pre-wrap; line-height: 1.4; }

  a { color: var(--accent); text-decoration: none; }
  a:active { opacity: 0.7; }

  /* Sign-in overlay */
  .signin-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: var(--bg); z-index: 100; padding: 24px; text-align: center; }
  .signin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%; }
  .signin-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .signin-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.55; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: white; color: #1f1f1f; border: none;
    padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .google-btn:active { transform: scale(0.97); }
  .google-icn { width: 18px; height: 18px; }
  .signin-status { color: var(--text3); font-size: 11px; margin-top: 14px; min-height: 14px; font-family: ui-monospace, monospace; }
  .signin-err { color: var(--err); font-size: 12px; margin-top: 14px; word-break: break-word; }
</style>
</head>
<body>

<div class="signin-overlay" id="signinOverlay">
  <div class="signin-card">
    <div class="signin-title">keikhi 管理</div>
    <div class="signin-sub">GCP リソースを読むため<br>Google アカウントの認可が必要</div>
    <button class="google-btn" onclick="window.doSignIn()">
      <svg class="google-icn" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.97 10.71A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.71V4.96H.96A9.003 9.003 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3.01-2.33z" fill="#FBBC05"/>
        <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.962 8.962 0 0 0 9 0 8.997 8.997 0 0 0 .96 4.96L3.97 7.29C4.68 5.17 6.66 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>
    <div class="signin-status" id="signinStatus"></div>
    <div class="signin-err" id="signinErr"></div>
  </div>
</div>

<main id="appMain" style="display:none">

<header>
  <div>
    <h1>keikhi 管理</h1>
    <div class="project" id="projectTag">…</div>
  </div>
  <div class="user-pill">
    <div class="user-email" id="userEmail"></div>
    <button class="btn" onclick="window.doSignOut()">ログアウト</button>
  </div>
</header>

<section>
  <div class="row" style="margin-bottom: 10px;">
    <div class="section-title" style="margin-bottom:0">Cloud Run サービス</div>
    <button class="btn" onclick="loadAll()">更新</button>
  </div>
  <div id="services"><div class="card empty">読み込み中…</div></div>
</section>

<section>
  <div class="section-title">Cloud SQL</div>
  <div id="sql"><div class="card empty">読み込み中…</div></div>
</section>

<section>
  <div class="section-title">Cloud Storage</div>
  <div id="buckets"><div class="card empty">読み込み中…</div></div>
</section>

<section>
  <div class="section-title">最近のビルド (10件)</div>
  <div id="builds"><div class="card empty">読み込み中…</div></div>
</section>

<section>
  <div class="section-title">課金 / コスト</div>
  <div class="link-grid" id="billingLinks"></div>
</section>

<section>
  <div class="section-title">GCP コンソール</div>
  <div class="link-grid" id="serviceLinks"></div>
</section>

<section>
  <div class="section-title">AI 使用量</div>
  <div class="link-grid" id="aiLinks"></div>
</section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider,
  signInWithPopup, signInWithRedirect, getRedirectResult,
  setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const $ = (id) => document.getElementById(id);

function setStatus(msg) { console.log("[admin]", msg); $("signinStatus").textContent = msg; }
function showErr(msg)   { console.error("[admin]", msg); $("signinErr").textContent = msg; }

window.addEventListener("error", (ev) => showErr("JS error: " + (ev.message || "unknown")));
window.addEventListener("unhandledrejection", (ev) => showErr("promise rejected: " + (ev.reason?.message || String(ev.reason))));

const REGION = "asia-northeast1";
const SCOPE = "https://www.googleapis.com/auth/cloud-platform.read-only";

setStatus("loading Firebase config...");
let cfg;
try {
  cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
} catch (e) {
  showErr("Firebase config の取得に失敗: " + e.message);
  throw e;
}

setStatus("init Firebase app...");
const fbApp = initializeApp(cfg);
const fbAuth = getAuth(fbApp);
const PROJECT = cfg.projectId;

try { await setPersistence(fbAuth, browserLocalPersistence); } catch (e) { showErr("persistence: " + e.message); }

const provider = new GoogleAuthProvider();
provider.addScope(SCOPE);
provider.setCustomParameters({ prompt: "select_account" });

// OAuth access token for GCP APIs (NOT the Firebase ID token).
let accessToken = sessionStorage.getItem("gcp_access_token") || null;

setStatus("checking redirect result...");
try {
  const result = await getRedirectResult(fbAuth);
  if (result) {
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (cred?.accessToken) {
      accessToken = cred.accessToken;
      sessionStorage.setItem("gcp_access_token", accessToken);
    }
    setStatus("redirect OK: " + result.user.email);
  } else {
    setStatus("ready");
  }
} catch (e) {
  showErr(`redirect: ${e.code || ""} ${e.message}`);
}

window.doSignIn = async () => {
  showErr(""); setStatus("opening popup...");
  try {
    const result = await signInWithPopup(fbAuth, provider);
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (cred?.accessToken) {
      accessToken = cred.accessToken;
      sessionStorage.setItem("gcp_access_token", accessToken);
    }
    setStatus("popup OK: " + result.user.email);
  } catch (e) {
    setStatus("popup failed: " + (e.code || e.message));
    if (
      e.code === "auth/popup-blocked" ||
      e.code === "auth/popup-closed-by-user" ||
      e.code === "auth/cancelled-popup-request" ||
      e.code === "auth/operation-not-supported-in-this-environment"
    ) {
      setStatus("falling back to redirect...");
      try { await signInWithRedirect(fbAuth, provider); return; }
      catch (e2) { showErr(`redirect: ${e2.code || ""} ${e2.message}`); return; }
    }
    showErr(`${e.code || ""} ${e.message}`);
  }
};

window.doSignOut = async () => {
  sessionStorage.removeItem("gcp_access_token");
  accessToken = null;
  await signOut(fbAuth);
};

onAuthStateChanged(fbAuth, (user) => {
  if (user) {
    $("signinOverlay").style.display = "none";
    $("appMain").style.display = "block";
    $("userEmail").textContent = user.email || "";
    $("projectTag").textContent = `${PROJECT} / ${REGION}`;
    loadAll();
  } else {
    $("signinOverlay").style.display = "flex";
    $("appMain").style.display = "none";
  }
});

// ──────────────── GCP API helpers ────────────────
async function gapi(url) {
  if (!accessToken) throw new Error("ログインし直してください (token なし)");
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (r.status === 401) {
    sessionStorage.removeItem("gcp_access_token");
    accessToken = null;
    throw new Error("Access token expired. ログインし直してください");
  }
  if (!r.ok) {
    const body = await r.text();
    throw new Error(`${r.status}\n${body.slice(0, 600)}`);
  }
  return r.json();
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const dd = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${dd(d.getMonth() + 1)}/${dd(d.getDate())} ${dd(d.getHours())}:${dd(d.getMinutes())}`;
}

function badge(state) {
  const s = (state || "").toLowerCase();
  if (s === "runnable" || s === "succeeded" || s === "success" || s === "ok" || s === "ready") return `<span class="badge ok"><span class="dot"></span>${state}</span>`;
  if (s === "failure" || s === "failed" || s === "error" || s === "suspended" || s === "stopped") return `<span class="badge err"><span class="dot"></span>${state}</span>`;
  if (s === "queued" || s === "working" || s === "pending" || s === "pending_create") return `<span class="badge warn"><span class="dot"></span>${state}</span>`;
  return `<span class="badge muted">${state || "—"}</span>`;
}

async function loadServices() {
  const el = $("services");
  try {
    const data = await gapi(`https://run.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/services`);
    const services = (data.services || []).map((s) => ({
      name: s.name?.split("/").pop(),
      url: s.uri,
      lastDeployed: s.updateTime,
      ready: (s.terminalCondition?.state || "") === "CONDITION_SUCCEEDED",
      conditionMsg: s.terminalCondition?.message || "",
    }));
    if (!services.length) return (el.innerHTML = `<div class="card empty">サービスなし</div>`);
    el.innerHTML = services.map((s) => `
      <div class="card">
        <div class="row">
          <div class="col">
            <div class="name">${s.name}</div>
            <div class="meta">${fmtTime(s.lastDeployed)}</div>
          </div>
          ${badge(s.ready ? "READY" : (s.conditionMsg ? "ERR" : "PENDING"))}
        </div>
        ${s.url ? `<div class="small" style="margin-top:6px"><a href="${s.url}" target="_blank">${s.url}</a></div>` : ""}
        ${s.conditionMsg && !s.ready ? `<div class="err-box" style="margin-top:6px">${s.conditionMsg}</div>` : ""}
      </div>
    `).join("");
  } catch (e) { el.innerHTML = `<div class="card err-box">${e.message}</div>`; }
}

async function loadSql() {
  const el = $("sql");
  try {
    const data = await gapi(`https://sqladmin.googleapis.com/v1/projects/${PROJECT}/instances`);
    const instances = (data.items || []).map((i) => ({
      name: i.name, state: i.state, databaseVersion: i.databaseVersion,
      tier: i.settings?.tier, region: i.region, ip: i.ipAddresses?.[0]?.ipAddress,
    }));
    if (!instances.length) return (el.innerHTML = `<div class="card empty">インスタンスなし</div>`);
    el.innerHTML = instances.map((i) => `
      <div class="card">
        <div class="row">
          <div class="col">
            <div class="name">${i.name}</div>
            <div class="meta">${i.databaseVersion} / ${i.tier} / ${i.region}</div>
          </div>
          ${badge(i.state)}
        </div>
        ${i.ip ? `<div class="small" style="margin-top:6px">IP: ${i.ip}</div>` : ""}
      </div>
    `).join("");
  } catch (e) { el.innerHTML = `<div class="card err-box">${e.message}</div>`; }
}

async function loadBuckets() {
  const el = $("buckets");
  try {
    const data = await gapi(`https://storage.googleapis.com/storage/v1/b?project=${PROJECT}`);
    const buckets = (data.items || []).map((b) => ({
      name: b.name, location: b.location, storageClass: b.storageClass,
    }));
    if (!buckets.length) return (el.innerHTML = `<div class="card empty">バケットなし</div>`);
    el.innerHTML = buckets.map((b) => `
      <div class="card">
        <div class="row">
          <div class="col">
            <div class="name">${b.name}</div>
            <div class="meta">${b.location} / ${b.storageClass}</div>
          </div>
          ${badge("OK")}
        </div>
      </div>
    `).join("");
  } catch (e) { el.innerHTML = `<div class="card err-box">${e.message}</div>`; }
}

async function loadBuilds() {
  const el = $("builds");
  try {
    const data = await gapi(`https://cloudbuild.googleapis.com/v1/projects/${PROJECT}/locations/${REGION}/builds?pageSize=10`);
    const builds = (data.builds || []).map((b) => ({
      id: b.id, status: b.status, startTime: b.startTime, logUrl: b.logUrl,
      sourceArchive: b.source?.storageSource?.object,
    }));
    if (!builds.length) return (el.innerHTML = `<div class="card empty">ビルド履歴なし</div>`);
    el.innerHTML = builds.map((b) => `
      <div class="card">
        <div class="row">
          <div class="col">
            <div class="name">${(b.sourceArchive || b.id || "").split("/").pop().slice(0, 24)}</div>
            <div class="meta">${fmtTime(b.startTime)}</div>
          </div>
          ${badge(b.status)}
        </div>
        ${b.logUrl ? `<div class="small" style="margin-top:6px"><a href="${b.logUrl}" target="_blank">ログ</a></div>` : ""}
      </div>
    `).join("");
  } catch (e) { el.innerHTML = `<div class="card err-box">${e.message}</div>`; }
}

function loadLinks() {
  const P = PROJECT;
  $("billingLinks").innerHTML = `
    <a class="link accent" href="https://console.cloud.google.com/billing/reports?project=${P}" target="_blank"><span class="icn">📊</span>レポート</a>
    <a class="link accent" href="https://console.cloud.google.com/billing/budgets?project=${P}" target="_blank"><span class="icn">🔔</span>予算</a>
    <a class="link" href="https://console.cloud.google.com/billing?project=${P}" target="_blank"><span class="icn">💳</span>概要</a>
  `;
  $("serviceLinks").innerHTML = `
    <a class="link" href="https://console.cloud.google.com/run?project=${P}" target="_blank"><span class="icn">🚀</span>Cloud Run</a>
    <a class="link" href="https://console.cloud.google.com/sql/instances?project=${P}" target="_blank"><span class="icn">🐘</span>Cloud SQL</a>
    <a class="link" href="https://console.cloud.google.com/storage/browser?project=${P}" target="_blank"><span class="icn">📦</span>Storage</a>
    <a class="link" href="https://console.cloud.google.com/cloud-build/builds?project=${P}" target="_blank"><span class="icn">🔨</span>Cloud Build</a>
    <a class="link" href="https://console.cloud.google.com/security/secret-manager?project=${P}" target="_blank"><span class="icn">🔐</span>Secrets</a>
    <a class="link" href="https://console.cloud.google.com/artifacts?project=${P}" target="_blank"><span class="icn">📚</span>Artifacts</a>
    <a class="link" href="https://console.cloud.google.com/logs/query?project=${P}" target="_blank"><span class="icn">📜</span>ログ</a>
    <a class="link" href="https://console.firebase.google.com/project/${P}" target="_blank"><span class="icn">🔥</span>Firebase</a>
  `;
  $("aiLinks").innerHTML = `
    <a class="link" href="https://aistudio.google.com/apikey" target="_blank"><span class="icn">✨</span>AI Studio</a>
    <a class="link" href="https://console.cloud.google.com/vertex-ai?project=${P}" target="_blank"><span class="icn">🤖</span>Vertex AI</a>
  `;
}

window.loadAll = () => {
  loadServices(); loadSql(); loadBuckets(); loadBuilds(); loadLinks();
};
</script>
</body>
</html>
