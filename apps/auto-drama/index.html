<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ドラマ置き場">
<title>ドラマ置き場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #be185d;
  --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 60px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; gap: 10px; }
.top-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; flex: 1; }
.pill { padding: 8px 14px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; flex-shrink: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.pill:active { box-shadow: inset 3px 3px 7px var(--sd), inset -3px -3px 7px var(--sl); }
.pill .icon.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.section { padding: 16px 18px 0; }
.section-title { font-size: 13px; font-weight: 800; color: var(--text2); margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } }

.card { border-radius: 16px; overflow: hidden; background: var(--bg2); box-shadow: 5px 5px 12px var(--sd), -5px -5px 12px var(--sl); cursor: pointer; }
.card .thumb { position: relative; aspect-ratio: 9/16; background: #23243a; }
.card video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card .thumb .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); font-size: 34px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.card .thumb .state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,0.8); font-size: 12px; font-weight: 700; }
.card .thumb .state .icon { font-size: 26px; }
.card .thumb .state.pending .icon { animation: spin 1.4s linear infinite; }
.card .thumb .state.failed { color: #f0a5a5; }
.card .meta { padding: 8px 10px 10px; }
.card .title { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

.empty { padding: 80px 30px; text-align: center; color: var(--text2); font-size: 13px; font-weight: 600; line-height: 2; }
.empty .icon { font-size: 40px; color: var(--text3); display: block; margin-bottom: 10px; }

/* 全画面プレイヤー */
.player { position: fixed; inset: 0; z-index: 50; background: rgba(10,10,18,0.96); display: none; flex-direction: column; align-items: center; justify-content: center; }
.player.open { display: flex; }
.player video { max-width: 100%; max-height: calc(100% - 90px); border-radius: 10px; }
.player .p-title { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 700; padding: 10px 20px 0; text-align: center; }
.player .close { position: absolute; top: 52px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="header-fix">
  <div class="top">
    <div class="top-title">ドラマ置き場</div>
    <button class="pill" id="refreshBtn"><span class="icon" id="refreshIcon">refresh</span>更新</button>
    <a class="pill" href="legacy.html"><span class="icon">history</span>旧アプリ</a>
  </div>
</div>

<div id="content"></div>

<div class="player" id="player">
  <button class="close" id="playerClose"><span class="icon">close</span></button>
  <video id="playerVideo" controls autoplay loop playsinline></video>
  <div class="p-title" id="playerTitle"></div>
</div>

<script src="/config.js"></script>
<script>
const API = (window.API_BASE || "");
const content = document.getElementById("content");
const refreshBtn = document.getElementById("refreshBtn");
const refreshIcon = document.getElementById("refreshIcon");
const player = document.getElementById("player");
const playerVideo = document.getElementById("playerVideo");
const playerTitle = document.getElementById("playerTitle");
let pollTimer = null;

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function fmtDate(s) { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`; }

function render(videos) {
  if (!videos.length) {
    content.innerHTML = `<div class="empty"><span class="icon">movie</span>まだ動画がありません。<br>Claude のチャットで作ると、ここに並びます。</div>`;
    return;
  }
  // プロジェクト別にまとめる (新しい順のまま)
  const groups = [];
  for (const v of videos) {
    let g = groups.find((x) => x.title === v.projectTitle);
    if (!g) { g = { title: v.projectTitle, items: [] }; groups.push(g); }
    g.items.push(v);
  }
  content.innerHTML = groups.map((g) => `
    <div class="section">
      <div class="section-title">${esc(g.title)}</div>
      <div class="grid">${g.items.map(card).join("")}</div>
    </div>`).join("");
}

function card(v) {
  let thumb;
  if (v.status === "done" && v.videoUrl) {
    thumb = `<video src="${esc(v.videoUrl)}#t=0.1" preload="metadata" muted playsinline></video>
             <div class="play"><span class="icon">play_circle</span></div>`;
  } else if (v.status === "failed") {
    thumb = `<div class="state failed"><span class="icon">error</span>失敗</div>`;
  } else {
    thumb = `<div class="state pending"><span class="icon">progress_activity</span>生成中</div>`;
  }
  return `
    <div class="card" data-id="${v.videoId}">
      <div class="thumb">${thumb}</div>
      <div class="meta">
        <div class="title">${esc(v.title || "無題")}</div>
        <div class="sub">${v.durationSec ? v.durationSec + "秒 · " : ""}${fmtDate(v.createdAt)}</div>
      </div>
    </div>`;
}

let lastVideos = [];
async function load() {
  refreshIcon.classList.add("spin");
  try {
    const res = await fetch(API + "/api/drama/gallery");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    lastVideos = data.videos || [];
    render(lastVideos);
    // 生成中があれば 30 秒ごとに追う (開いてるだけで進捗が進む)
    const pending = lastVideos.some((v) => ["queued", "running"].includes(v.status));
    clearTimeout(pollTimer);
    if (pending) pollTimer = setTimeout(load, 30000);
  } catch (e) {
    content.innerHTML = `<div class="empty"><span class="icon">cloud_off</span>読み込めませんでした<br>${esc(e.message)}</div>`;
  } finally {
    refreshIcon.classList.remove("spin");
  }
}

content.addEventListener("click", (ev) => {
  const el = ev.target.closest(".card");
  if (!el) return;
  const v = lastVideos.find((x) => String(x.videoId) === el.dataset.id);
  if (!v || v.status !== "done" || !v.videoUrl) return;
  playerVideo.src = v.videoUrl;
  playerTitle.textContent = v.title || "";
  player.classList.add("open");
});
function closePlayer() { player.classList.remove("open"); playerVideo.pause(); playerVideo.removeAttribute("src"); playerVideo.load(); }
document.getElementById("playerClose").addEventListener("click", closePlayer);
player.addEventListener("click", (ev) => { if (ev.target === player) closePlayer(); });

refreshBtn.addEventListener("click", load);
load();
</script>
</body>
</html>
