<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自動ドラマ作成">
<title>自動ドラマ作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #be185d; --accent2: #db2777;
  --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 100px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; gap: 10px; }
.top-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; flex-shrink: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: inherit; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(190,24,93,0.35), -3px -3px 10px var(--sl); }

.list { padding: 4px 16px 30px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 50px 0; }
.loading { text-align: center; color: var(--text3); padding: 60px 0; font-size: 13px; font-weight: 700; }
.err { color: var(--danger); font-size: 11px; padding: 0 18px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }

/* カード共通: collapsed = 最小限、タップで展開 */
.card { background: var(--bg); border-radius: 18px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); overflow: hidden; }
.card-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.card-main { flex: 1; min-width: 0; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); word-break: break-word; }
.card-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.chev { color: var(--text3); font-family: 'Material Symbols Outlined'; font-size: 20px; flex-shrink: 0; transition: transform 200ms ease; }
.card.open .chev { transform: rotate(180deg); }
.badge { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.02em; background: var(--bg2); color: var(--text2); box-shadow: inset 1.5px 1.5px 3px var(--sd), inset -1px -1px 2px var(--sl); flex-shrink: 0; }
.badge.state-exported { background: color-mix(in srgb, var(--accent) 18%, var(--bg2) 82%); color: var(--accent); }
.badge.status-confirmed { background: color-mix(in srgb, #16a34a 18%, var(--bg2) 82%); color: #16a34a; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg2); color: var(--text2); box-shadow: inset 1.5px 1.5px 3px var(--sd), inset -1px -1px 2px var(--sl); }

.card-detail { border-top: 1px solid rgba(168,172,192,0.18); padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: slide-open 200ms ease-out; }
@keyframes slide-open { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 1600px; } }
.field-label { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 4px; }
.field-value { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
textarea.field-input, input.field-input, select.field-input {
  width: 100%; padding: 10px 12px; border: none; border-radius: 10px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--bg2); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl);
  outline: none; box-sizing: border-box;
}
textarea.field-input { min-height: 70px; resize: vertical; }
.field-row { display: flex; gap: 8px; }
.field-row > * { flex: 1; min-width: 0; }
.actions-row { display: flex; gap: 8px; }
.actions-row button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text2); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); }
.actions-row button.primary { background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; box-shadow: 4px 4px 10px rgba(190,24,93,0.3); }
.actions-row button.danger { color: var(--danger); }
.actions-row button:disabled { opacity: 0.5; cursor: wait; }

.thumb-row { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--bg2); box-shadow: inset 2px 2px 5px var(--sd); }
.filepick { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text2); }
.filepick input { display: none; }

.warn-banner { margin: 0 16px 10px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #d97706 12%, var(--bg) 88%); box-shadow: inset 2px 2px 6px rgba(217,119,6,0.12); }
.warn-banner-title { font-size: 12px; font-weight: 800; color: #b45309; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.warn-banner ul { margin: 0; padding-left: 18px; }
.warn-banner li { font-size: 12px; color: #92400e; line-height: 1.7; }

.key-visual-box { margin: 0 16px 12px; }
.kv-img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 16px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); display: block; }
.kv-empty { padding: 40px 16px; text-align: center; border-radius: 16px; background: var(--bg2); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); color: var(--text3); font-size: 12px; font-weight: 700; }

.section-title { font-size: 12px; font-weight: 800; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 16px 6px; }

.cut-order-btn { width: 26px; height: 26px; border-radius: 13px; border: none; background: var(--bg); color: var(--text2); box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl); font-size: 14px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cut-order-btn:disabled { opacity: 0.3; cursor: default; }
.gen-video { width: 100%; border-radius: 12px; background: #000; margin-top: 6px; }
.gen-note { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* FAB 群: chat + add */
.fab-row { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; z-index: 30; }
.fab { width: 56px; height: 56px; border-radius: 28px; color: white; font-size: 26px; border: none; cursor: pointer; padding: 0; box-shadow: 6px 6px 18px rgba(190,24,93,0.4), -3px -3px 10px var(--sl); display: flex; align-items: center; justify-content: center; transition: transform 200ms ease; }
.fab:active { transform: scale(0.93); }
.fab.add { background: linear-gradient(145deg, var(--accent2), var(--accent)); }
.fab.chat { background: linear-gradient(145deg, #6366f1, #4338ca); box-shadow: 6px 6px 18px rgba(67,56,202,0.4), -3px -3px 10px var(--sl); }

/* チャット */
.chat-sheet { display: flex; flex-direction: column; height: 60vh; }
.chat-sheet.full { height: calc(100dvh - 150px); } /* 全画面時 (ハンドル+タイトル+padding 分を引く) */
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 12px; }
.msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--bg); color: var(--text); border-bottom-left-radius: 4px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); }
.chat-input-row { display: flex; gap: 8px; padding-top: 6px; }
.chat-input-row textarea { flex: 1; min-height: 42px; max-height: 120px; }
.chat-send { width: 42px; height: 42px; border-radius: 21px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-family: 'Material Symbols Outlined'; font-size: 20px; cursor: pointer; flex-shrink: 0; }
.chat-send:disabled { opacity: 0.5; }

.seed-row { padding: 10px 18px 0; text-align: center; }
.seed-btn { padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 700; color: var(--text3); background: none; border: 1px dashed var(--text3); cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted, onBeforeUnmount, nextTick } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
import { BottomSheet } from "/bottom-sheet.js";

const STATE_LABEL = {
  key_visual: "キービジュアル待ち", cuts: "カット割り待ち", generating: "動画生成中",
  review: "レビュー中", timeline: "タイムライン編集中", exported: "書き出し済み",
};
const IMG_KIND_LABEL = { full: "全身", face: "顔", expression: "表情" };

const TEMPLATE = `
<div>
  <!-- ───────── プロジェクト一覧 ───────── -->
  <template v-if="view === 'projects'">
    <div class="header-fix">
      <div class="top">
        <span class="top-title"><span class="icon" style="vertical-align:-0.18em;">movie</span> 自動ドラマ作成</span>
        <a class="pill" href="/">← 戻る</a>
      </div>
    </div>
    <div v-if="!ready" class="loading">接続中…</div>
    <template v-else>
      <div class="list">
        <div v-if="projects.length === 0" class="empty">右下の + から作品を選んで始めてください</div>
        <div v-for="p in projects" :key="p.id" class="card" @click="openProject(p.id)">
          <div class="card-row">
            <div class="card-main">
              <div class="card-title">{{ p.title }}</div>
              <div class="card-sub">{{ p.author || '作者不明' }}</div>
            </div>
            <span v-if="p.costYen >= 1" class="badge">API ¥{{ Math.round(p.costYen) }}</span>
            <button class="cut-order-btn" style="color:var(--danger);" title="削除"
              @click.stop="deleteProject(p)" :disabled="deletingProjectId === p.id">
              <span class="icon" style="font-size:15px;">{{ deletingProjectId === p.id ? 'hourglass_top' : 'delete' }}</span>
            </button>
            <span class="chev">chevron_right</span>
          </div>
        </div>
      </div>
    </template>
    <div class="err" v-if="err">{{ err }}</div>

    <div class="fab-row">
      <button class="fab add" @click="startCreate" title="新規プロジェクト">+</button>
    </div>
  </template>

  <!-- ───────── 作成ウィザード: 作品選択 → AI 構造化 → チャットへ ───────── -->
  <template v-else-if="view === 'create'">
    <div class="header-fix">
      <div class="top">
        <button class="pill" @click="view = 'projects'" :disabled="createStep === 'structuring'">← 戻る</button>
        <span class="top-title">新規プロジェクト</span>
      </div>
    </div>

    <!-- Step 1: 青空文庫から作品を選ぶ -->
    <template v-if="createStep === 'pick'">
      <div class="list">
        <div class="field-label">青空文庫から作品を選ぶ</div>
        <div class="field-row">
          <input class="field-input" v-model="aozoraQuery" placeholder="作品名や作者で検索 (例: 邪宗門)" style="flex:2;" @keydown.enter.prevent="searchAozora">
          <button class="tab" @click="searchAozora" :disabled="searching" style="flex:1;">検索</button>
        </div>
        <div v-if="searching" class="loading" style="padding:20px 0;">青空文庫を検索中…</div>
        <div v-for="r in aozoraResults" :key="r.cardUrl || r.title" class="card" @click="r.cardUrl && createFromAozora(r.cardUrl)">
          <div class="card-row">
            <div class="card-main">
              <div class="card-title">{{ r.title }}</div>
              <div class="card-sub">{{ r.author }}{{ r.cardUrl ? '' : ' (URL不明、下の欄に手動で)' }}</div>
            </div>
            <span class="chev">chevron_right</span>
          </div>
        </div>

        <div class="field-label" style="margin-top:14px;">または URL 直接貼り付け (図書カード / 本文どちらでも)</div>
        <div class="field-row">
          <input class="field-input" v-model="aozoraCreateUrl" placeholder="https://www.aozora.gr.jp/cards/...">
          <button class="tab" @click="createFromAozora(aozoraCreateUrl)" :disabled="!aozoraCreateUrl.trim()" style="flex:0 0 auto;">作成</button>
        </div>

        <button class="seed-btn" style="margin-top:16px; align-self:center;" @click="showNewProject = true">青空文庫を使わず手動で作る</button>
      </div>

      <bottom-sheet v-model="showNewProject" title="手動で作成">
        <form @submit.prevent="createProject" class="card-detail" style="border:none; padding:0;">
          <div><div class="field-label">タイトル</div><input class="field-input" v-model="newProject.title" required></div>
          <div><div class="field-label">作者</div><input class="field-input" v-model="newProject.author"></div>
          <div><div class="field-label">絵柄方針 (styleGuide)</div><input class="field-input" v-model="newProject.styleGuide" placeholder="例: 劇画・浮世絵×シネマティック"></div>
          <div><div class="field-label">世界観・トーン</div><textarea class="field-input" v-model="newProject.worldSetting"></textarea></div>
          <div class="actions-row"><button type="submit" class="primary" :disabled="creating">{{ creating ? '作成中…' : '作成' }}</button></div>
        </form>
      </bottom-sheet>
    </template>

    <!-- Step 2: AI 構造化の進行表示 -->
    <template v-else>
      <div class="list">
        <div class="card" style="padding: 18px 16px;">
          <div class="card-title" style="margin-bottom: 12px;">{{ createTitle || '作品' }} を構造化中…</div>
          <div v-for="s in createStages" :key="s.key" style="display:flex; align-items:center; gap:10px; padding:7px 0;">
            <span class="icon" :style="{ color: s.state === 'done' ? '#16a34a' : s.state === 'doing' ? 'var(--accent)' : 'var(--text3)' }">
              {{ s.state === 'done' ? 'check_circle' : s.state === 'doing' ? 'progress_activity' : 'radio_button_unchecked' }}</span>
            <span :style="{ fontSize: '13px', fontWeight: 600, color: s.state === 'wait' ? 'var(--text3)' : 'var(--text)' }">{{ s.label }}</span>
          </div>
          <div class="card-sub" style="margin-top:10px;">終わったらそのまま AI チャットが開きます。絵柄や画像の粒度をチャットで詰めてください。</div>
        </div>
      </div>
    </template>
    <div class="err" v-if="err">{{ err }}</div>
  </template>

  <!-- ───────── プロジェクト詳細 ───────── -->
  <template v-else-if="view === 'project' && currentProject">
    <div class="header-fix">
      <div class="top">
        <button class="pill" @click="backToProjects">← 一覧</button>
        <span class="top-title">{{ currentProject.title }}</span>
      </div>
      <div class="tabs">
        <button class="tab" :class="{ on: projectTab === 'episodes' }" @click="projectTab = 'episodes'">エピソード</button>
        <button class="tab" :class="{ on: projectTab === 'characters' }" @click="projectTab = 'characters'">キャラクター ({{ currentProject.characters.length }})</button>
        <button class="tab" :class="{ on: projectTab === 'locations' }" @click="projectTab = 'locations'">場所 ({{ (currentProject.locations || []).length }})</button>
        <button class="tab" :class="{ on: projectTab === 'source' }" @click="openSourceTab">原作 ({{ chapters.length }})</button>
        <button class="tab" :class="{ on: projectTab === 'settings' }" @click="openSettingsTab">設定</button>
      </div>
    </div>

    <!-- エピソード一覧 -->
    <div class="list" v-if="projectTab === 'episodes'">
      <div class="actions-row" v-if="chapters.length">
        <button @click="composeSeriesFn" :disabled="composingSeries">
          {{ composingSeries ? 'AIが話数割りを構成中…' : (currentProject.episodes.length ? 'AIでシリーズ構成を作り直す' : 'AIでシリーズ構成 (話数割り)') }}</button>
      </div>
      <div class="card-sub" v-if="chapters.length" style="padding:0 4px;">地味な章は圧縮・見せ場は引き伸ばす編集方針で、1章=1話にはしません</div>
      <div v-if="currentProject.episodes.length === 0" class="empty">まだ話がありません</div>
      <div v-for="ep in currentProject.episodes" :key="ep.id" class="card" @click="openEpisode(ep.id)">
        <div class="card-row">
          <div class="card-main">
            <div class="card-title">第{{ ep.number }}話 {{ ep.title || '(無題)' }}</div>
            <div class="card-sub" v-if="(ep.chapterNumbers || []).length">
              原作{{ ep.chapterNumbers.join('・') }}章{{ ep.pacing === 'compress' ? ' / 圧縮' : ep.pacing === 'stretch' ? ' / 引き伸ばし' : '' }}</div>
            <div class="card-sub" v-if="ep.focus">{{ ep.focus }}</div>
          </div>
          <span class="badge" :class="'state-' + ep.state">{{ STATE_LABEL[ep.state] || ep.state }}</span>
          <span class="chev">chevron_right</span>
        </div>
      </div>
    </div>

    <!-- 場所 (シーン背景の統一性) -->
    <div class="list" v-else-if="projectTab === 'locations'">
      <div v-if="(currentProject.locations || []).length === 0" class="empty">まだ場所がありません。原作タブの「AIでキャラ・時代背景を登録」でも自動登録されます</div>
      <div v-for="l in currentProject.locations" :key="l.id" class="card" :class="{ open: locOpenId === l.id }">
        <div class="card-row" @click="toggleLoc(l)">
          <div class="card-main">
            <div class="card-title">{{ l.name }}</div>
            <div class="card-sub">参照画像 {{ (l.referenceImages||[]).length }}枚</div>
          </div>
          <span class="badge" :class="'status-' + l.status">{{ l.status === 'confirmed' ? '確定' : '下書き' }}</span>
          <span class="chev">expand_more</span>
        </div>
        <div v-if="locOpenId === l.id" class="card-detail">
          <div><div class="field-label">名前</div><input class="field-input" v-model="locEdit.name"></div>
          <div><div class="field-label">状態</div>
            <select class="field-input" v-model="locEdit.status"><option value="draft">下書き</option><option value="confirmed">確定</option></select>
          </div>
          <div><div class="field-label">説明 (どんな場面で使うか)</div><textarea class="field-input" v-model="locEdit.description"></textarea></div>
          <div><div class="field-label">識別子 (背景の統一要素・読点区切り)</div><input class="field-input" v-model="locEdit.identityTokensText" placeholder="例: 朱塗りの門、篝火、砂利の前庭"></div>
          <div><div class="field-label">背景画像生成用プロンプト</div><textarea class="field-input" v-model="locEdit.appearancePrompt"></textarea></div>
          <div>
            <div class="field-label">参照画像</div>
            <div class="thumb-row">
              <img v-for="(img,i) in locEdit.referenceImages" :key="i" :src="img.url" class="thumb">
              <label class="filepick"><input type="file" accept="image/*" @change="e => onLocImagePick(e, l)"><span class="icon">add_photo_alternate</span>追加</label>

    async function apiFetch(path, opts = {}) {
      const token = await user.value.getIdToken();
      const res = await fetch((window.API_BASE || "") + path, {
        method: opts.method || "GET",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        let msg = res.statusText;
        try {
          const j = await res.json();
          msg = j.error || msg;
          if (j.reasons) msg += ": " + j.reasons.join(", ");
        } catch (_) {}
        const e = new Error(msg);
        e.status = res.status;
        throw e;
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function uploadImage(file, pathPrefix) {
      const storage = getStorage(fbApp, "gs://static-epigram-496002-v8.firebasestorage.app");
      const safe = file.name.replace(/[^\w.\-]/g, "_");
      const path = `${pathPrefix}/${Date.now()}_${safe}`;
      const r = storageRef(storage, path);
      await uploadBytes(r, file);
      return getDownloadURL(r);
    }

    async function createFromAozora(url) {
      if (!url || createStep.value === "structuring") return;
      err.value = "";
      createStep.value = "structuring";
      createTitle.value = "";
      createStages.value = [
        { key: "fetch", label: "青空文庫から本文を取得・章に分割", state: "doing" },
        { key: "setup", label: "AI が時代背景・絵柄・キャラクターを構造化", state: "wait" },
        { key: "index", label: "章ごとの要約と出演キャラ index を作成", state: "wait" },
      ];
      const setStage = (key, state) => {
        createStages.value = createStages.value.map((s) => s.key === key ? { ...s, state } : s);
      };
      try {
        // 1. 取り込み (Gemini なしでも通る)
        const r = await apiFetch("/api/drama/projects/from-aozora", { method: "POST", body: { url: url.trim(), skipSetup: true } });
        createTitle.value = r.title || "";
        setStage("fetch", "done");
        // 2. AI 初期構造化 (失敗しても続行)
        setStage("setup", "doing");
        try {
          await apiFetch(`/api/drama/projects/${r.id}/analyze-setup`, { method: "POST", body: {} });
          setStage("setup", "done");
        } catch (e) {
          setStage("setup", "wait");
          err.value = "AI 初期解析は失敗 (取り込みは成功、あとで原作タブから再実行可): " + e.message;
        }
        // 3. 章 index は裏で継続しつつ、先にチャットへ (数章ずつのバッチをループ)
        setStage("index", "doing");
        runChapterAnalysisLoop(r.id, () => {
          if (currentProject.value?.id === r.id) loadChapters(r.id);
        }).catch(() => {});
        await loadProjects();
        await openProject(r.id);
        openChat(); // 方向性詰めはチャットから
      } catch (e) {
        err.value = e.message;
        createStep.value = "pick";
      }
    }

    async function runChapterAnalysisLoop(projectId, onProgress) {
      let guard = 0;
      while (guard++ < 40) {
        const r = await apiFetch(`/api/drama/projects/${projectId}/chapters/analyze`, { method: "POST", body: {} });
        if (onProgress) onProgress(r);
        if (!r.remaining) return;

    async function moveCut(cut, dir) {
      const cuts = currentEpisode.value.cuts;
      const idx = cuts.findIndex((c) => c.id === cut.id);
      const j = idx + dir;
      if (j < 0 || j >= cuts.length) return;
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}`, { method: "PATCH", body: { order: cuts[j].order } });
        await apiFetch(`/api/drama/cuts/${cuts[j].id}`, { method: "PATCH", body: { order: cut.order } });

    }

    // ── 生成タスクの自動ポーリング ──
    let genPollTimer = null;
    function pendingGenerations() {
      const cuts = currentEpisode.value?.cuts || [];
      const out = [];
      cuts.forEach((c) => (c.generations || []).forEach((g, gi) => {
        if (g.status === "queued" || g.status === "running") out.push({ cutId: c.id, gi });
      }));
      return out;
    }
    function ensureGenPolling() {
      if (genPollTimer) return;
      genPollTimer = setInterval(async () => {
        const pending = pendingGenerations();
        if (!pending.length || view.value !== "episode") {
          clearInterval(genPollTimer); genPollTimer = null;
          return;
        }
        try {
          for (const p of pending) {
            await apiFetch(`/api/drama/cuts/${p.cutId}/generations/${p.gi}/refresh`, { method: "POST", body: {} });
          }
          await refreshEpisode();
        } catch (_) { /* 次の周回で再試行 */ }
      }, 8000);
    }
    async function refreshGeneration(cut, gi) {
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}/generations/${gi}/refresh`, { method: "POST", body: {} });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }
    async function selectGeneration(cut, idx) {
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}`, { method: "PATCH", body: { selectedGenerationIndex: idx } });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }

    async function exportEpisode() {
      exporting.value = true;
      exportErr.value = "";
      try {
        await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}/export`, { method: "POST", body: {} });
        await refreshEpisode();
      } catch (e) { exportErr.value = e.message; } finally { exporting.value = false; }
    }

    // ── チャット ──
    async function openChat(episodeId) {
      chatEpisodeId = episodeId || null;
      chatExpanded.value = false; // 開くたびに通常サイズから
      chatOpen.value = true;
      try {
        const qs = chatEpisodeId ? `?episodeId=${chatEpisodeId}` : "";
        chatMessages.value = await apiFetch(`/api/drama/projects/${currentProject.value.id}/chat${qs}`);
        nextTick(scrollChatToBottom);
      } catch (e) { err.value = e.message; }
    }
    function scrollChatToBottom() {
      if (chatLogEl.value) chatLogEl.value.scrollTop = chatLogEl.value.scrollHeight;
    }
    function onChatImagePick(e) {
      for (const file of e.target.files || []) {
        chatAttach.value.push({ file, preview: URL.createObjectURL(file) });
      }
      e.target.value = "";
    }
    async function sendChat() {
      const message = chatInput.value.trim();
      const attachments = [...chatAttach.value];
      if ((!message && !attachments.length) || chatSending.value) return;
      chatSending.value = true;
      chatInput.value = "";
      chatAttach.value = [];
      chatMessages.value.push({ role: "user", content: message, images: attachments.map((a) => a.preview) });
      nextTick(scrollChatToBottom);
      try {
        // 添付画像を Firebase Storage に上げてから URL をサーバーへ (サーバーが Gemini に渡す)
        const imageUrls = [];
        for (const a of attachments) {
          imageUrls.push(await uploadImage(a.file, `auto-drama/${currentProject.value.id}/chat`));
        }
        const res = await apiFetch(`/api/drama/projects/${currentProject.value.id}/chat`, {
          method: "POST", body: { message, episodeId: chatEpisodeId, imageUrls },
        });
        chatMessages.value.push({ role: "assistant", content: res.reply, images: res.images || [] });
        nextTick(scrollChatToBottom);
      } catch (e) {
        chatMessages.value.push({ role: "assistant", content: "(エラー: " + e.message + ")" });
      } finally { chatSending.value = false; }
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        fbApp = initializeApp(cfg);
        const auth = getAuth(fbApp);
        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, async (u) => {
          if (!u) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
          user.value = u;
          ready.value = true;
          await loadProjects();
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        ready.value = true;
      }
    });

    return {
      STATE_LABEL, IMG_KIND_LABEL,
      view, ready, err, projects, currentProject, currentEpisode, projectTab,
      creating, showNewProject, newProject, createProject,
      showNewEpisode, newEpisode, createEpisode,
      showNewCharacter, newCharacter, createCharacter,
      openProject, backToProjects, openEpisode, backToProject, deleteProject, deletingProjectId,
      charOpenId, charEdit, charSaving, toggleChar, onCharImagePick, saveCharacter, deleteCharacter,
      locOpenId, locEdit, locSaving, showNewLocation, newLocation, toggleLoc, createLocation, onLocImagePick, saveLocation, deleteLocation,
      cutOpenId, cutEdit, cutSaving, toggleCut, toggleCutChar, addCut, saveCut, deleteCut, moveCut,
      generatingCutId, genError, genErrorFor, generateCut, selectGeneration, refreshGeneration,
      composingSeries, composeSeriesFn, scriptEdit, scriptWriting, scriptSaving, writeScriptFn, saveScript,
      composingCuts, composeCutsFn, storyboardingCutId, generateStoryboard,
      isAppearing, toggleAppearing, onKeyVisualPick,
      exporting, exportErr, exportEpisode,
      chatOpen, chatExpanded, chatMessages, chatInput, chatSending, chatLogEl, chatAttach, openChat, sendChat, onChatImagePick,
      chapters, chapterOpenId, chapterContent, aozoraUrl, importing, analyzing, analyzeProgress,
      setupAnalyzing, runSetupAnalysis, settingsEdit, settingsSaving, usage, openSettingsTab, saveSettings,
      openSourceTab, importSource, analyzeChapters, toggleChapter, isRegisteredCharacter,
      aozoraQuery, aozoraResults, searching, aozoraCreateUrl,
      createStep, createTitle, createStages, chatStarters,
      startCreate, searchAozora, createFromAozora, sendStarter,
    };
  },
};

createApp(App).component("bottom-sheet", BottomSheet).mount("#app");
</script>
