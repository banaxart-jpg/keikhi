<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自動ドラマ作成">
<title>自動ドラマ作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #be185d; --accent2: #db2777;
  --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 100px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; gap: 10px; }
.top-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; flex-shrink: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: inherit; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(190,24,93,0.35), -3px -3px 10px var(--sl); }

.list { padding: 4px 16px 30px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 50px 0; }
.loading { text-align: center; color: var(--text3); padding: 60px 0; font-size: 13px; font-weight: 700; }
.err { color: var(--danger); font-size: 11px; padding: 0 18px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }

/* カード共通: collapsed = 最小限、タップで展開 */
.card { background: var(--bg); border-radius: 18px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); overflow: hidden; }
.card-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.card-main { flex: 1; min-width: 0; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); word-break: break-word; }
.card-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.chev { color: var(--text3); font-family: 'Material Symbols Outlined'; font-size: 20px; flex-shrink: 0; transition: transform 200ms ease; }
.card.open .chev { transform: rotate(180deg); }
.badge { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.02em; background: var(--bg2); color: var(--text2); box-shadow: inset 1.5px 1.5px 3px var(--sd), inset -1px -1px 2px var(--sl); flex-shrink: 0; }
.badge.state-exported { background: color-mix(in srgb, var(--accent) 18%, var(--bg2) 82%); color: var(--accent); }
.badge.status-confirmed { background: color-mix(in srgb, #16a34a 18%, var(--bg2) 82%); color: #16a34a; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg2); color: var(--text2); box-shadow: inset 1.5px 1.5px 3px var(--sd), inset -1px -1px 2px var(--sl); }

.card-detail { border-top: 1px solid rgba(168,172,192,0.18); padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; animation: slide-open 200ms ease-out; }
@keyframes slide-open { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 1600px; } }
.field-label { font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 4px; }
.field-value { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
textarea.field-input, input.field-input, select.field-input {
  width: 100%; padding: 10px 12px; border: none; border-radius: 10px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--bg2); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl);
  outline: none; box-sizing: border-box;
}
textarea.field-input { min-height: 70px; resize: vertical; }
.field-row { display: flex; gap: 8px; }
.field-row > * { flex: 1; min-width: 0; }
.actions-row { display: flex; gap: 8px; }
.actions-row button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; background: var(--bg); color: var(--text2); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); }
.actions-row button.primary { background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; box-shadow: 4px 4px 10px rgba(190,24,93,0.3); }
.actions-row button.danger { color: var(--danger); }
.actions-row button:disabled { opacity: 0.5; cursor: wait; }

.thumb-row { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--bg2); box-shadow: inset 2px 2px 5px var(--sd); }
.filepick { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text2); }
.filepick input { display: none; }

.warn-banner { margin: 0 16px 10px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #d97706 12%, var(--bg) 88%); box-shadow: inset 2px 2px 6px rgba(217,119,6,0.12); }
.warn-banner-title { font-size: 12px; font-weight: 800; color: #b45309; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.warn-banner ul { margin: 0; padding-left: 18px; }
.warn-banner li { font-size: 12px; color: #92400e; line-height: 1.7; }

.key-visual-box { margin: 0 16px 12px; }
.kv-img { width: 100%; max-height: 340px; object-fit: cover; border-radius: 16px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); display: block; }
.kv-empty { padding: 40px 16px; text-align: center; border-radius: 16px; background: var(--bg2); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); color: var(--text3); font-size: 12px; font-weight: 700; }

.section-title { font-size: 12px; font-weight: 800; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 16px 6px; }

.cut-order-btn { width: 26px; height: 26px; border-radius: 13px; border: none; background: var(--bg); color: var(--text2); box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl); font-size: 14px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cut-order-btn:disabled { opacity: 0.3; cursor: default; }
.gen-video { width: 100%; border-radius: 12px; background: #000; margin-top: 6px; }
.gen-note { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* FAB 群: chat + add */
.fab-row { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; z-index: 30; }
.fab { width: 56px; height: 56px; border-radius: 28px; color: white; font-size: 26px; border: none; cursor: pointer; padding: 0; box-shadow: 6px 6px 18px rgba(190,24,93,0.4), -3px -3px 10px var(--sl); display: flex; align-items: center; justify-content: center; transition: transform 200ms ease; }
.fab:active { transform: scale(0.93); }
.fab.add { background: linear-gradient(145deg, var(--accent2), var(--accent)); }
.fab.chat { background: linear-gradient(145deg, #6366f1, #4338ca); box-shadow: 6px 6px 18px rgba(67,56,202,0.4), -3px -3px 10px var(--sl); }

/* チャット */
.chat-sheet { display: flex; flex-direction: column; height: 60vh; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 12px; }
.msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--bg2); color: var(--text); border-bottom-left-radius: 4px; box-shadow: inset 2px 2px 5px var(--sd); }
.chat-input-row { display: flex; gap: 8px; padding-top: 6px; }
.chat-input-row textarea { flex: 1; min-height: 42px; max-height: 120px; }
.chat-send { width: 42px; height: 42px; border-radius: 21px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-family: 'Material Symbols Outlined'; font-size: 20px; cursor: pointer; flex-shrink: 0; }
.chat-send:disabled { opacity: 0.5; }

.seed-row { padding: 10px 18px 0; text-align: center; }
.seed-btn { padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 700; color: var(--text3); background: none; border: 1px dashed var(--text3); cursor: pointer; font-family: inherit; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted, onBeforeUnmount, nextTick } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
import { BottomSheet } from "/bottom-sheet.js";

const STATE_LABEL = {
  key_visual: "キービジュアル待ち", cuts: "カット割り待ち", generating: "動画生成中",
  review: "レビュー中", timeline: "タイムライン編集中", exported: "書き出し済み",
};
const IMG_KIND_LABEL = { full: "全身", face: "顔", expression: "表情" };

const TEMPLATE = `
<div>
  <!-- ───────── プロジェクト一覧 ───────── -->
  <template v-if="view === 'projects'">
    <div class="header-fix">
      <div class="top">
        <span class="top-title"><span class="icon" style="vertical-align:-0.18em;">movie</span> 自動ドラマ作成</span>
        <a class="pill" href="/">← 戻る</a>
      </div>
    </div>
    <div v-if="!ready" class="loading">接続中…</div>
    <template v-else>
      <div class="list">
        <div v-if="projects.length === 0" class="empty">プロジェクトがまだありません</div>
        <div v-for="p in projects" :key="p.id" class="card" @click="openProject(p.id)">
          <div class="card-row">
            <div class="card-main">
              <div class="card-title">{{ p.title }}</div>
              <div class="card-sub">{{ p.author || '作者不明' }}</div>
            </div>
            <span class="chev">chevron_right</span>
          </div>
        </div>
      </div>
      <div class="seed-row" v-if="projects.length === 0">
        <button class="seed-btn" @click="seedJashumon" :disabled="seeding">
          <span v-if="seeding">投入中…</span>
          <span v-else>邪宗門 (パイロット) を投入</span>
        </button>
      </div>
    </template>
    <div class="err" v-if="err">{{ err }}</div>

    <div class="fab-row">
      <button class="fab add" @click="showNewProject = true" title="新規プロジェクト">+</button>
    </div>

    <bottom-sheet v-model="showNewProject" title="新規プロジェクト">
      <form @submit.prevent="createProject" class="card-detail" style="border:none; padding:0;">
        <div><div class="field-label">タイトル</div><input class="field-input" v-model="newProject.title" required></div>
        <div><div class="field-label">作者</div><input class="field-input" v-model="newProject.author"></div>
        <div><div class="field-label">絵柄方針 (styleGuide)</div><input class="field-input" v-model="newProject.styleGuide" placeholder="例: 劇画・浮世絵×シネマティック"></div>
        <div><div class="field-label">世界観・トーン</div><textarea class="field-input" v-model="newProject.worldSetting"></textarea></div>
        <div><div class="field-label">原作テキスト (任意・後からでも可)</div><textarea class="field-input" v-model="newProject.sourceText" style="min-height:120px;"></textarea></div>
        <div class="actions-row"><button type="submit" class="primary" :disabled="creating">{{ creating ? '作成中…' : '作成' }}</button></div>
      </form>
    </bottom-sheet>
  </template>

  <!-- ───────── プロジェクト詳細 ───────── -->
  <template v-else-if="view === 'project' && currentProject">
    <div class="header-fix">
      <div class="top">
        <button class="pill" @click="backToProjects">← 一覧</button>
        <span class="top-title">{{ currentProject.title }}</span>
      </div>
      <div class="tabs">
        <button class="tab" :class="{ on: projectTab === 'episodes' }" @click="projectTab = 'episodes'">エピソード</button>
        <button class="tab" :class="{ on: projectTab === 'characters' }" @click="projectTab = 'characters'">キャラクター ({{ currentProject.characters.length }})</button>
      </div>
    </div>

    <!-- エピソード一覧 -->
    <div class="list" v-if="projectTab === 'episodes'">
      <div v-if="currentProject.episodes.length === 0" class="empty">まだ話がありません</div>
      <div v-for="ep in currentProject.episodes" :key="ep.id" class="card" @click="openEpisode(ep.id)">
        <div class="card-row">
          <div class="card-main">
            <div class="card-title">第{{ ep.number }}話 {{ ep.title || '(無題)' }}</div>
          </div>
          <span class="badge" :class="'state-' + ep.state">{{ STATE_LABEL[ep.state] || ep.state }}</span>
          <span class="chev">chevron_right</span>
        </div>
      </div>
    </div>

    <!-- キャラクター一覧 -->
    <div class="list" v-else>
      <div v-if="currentProject.characters.length === 0" class="empty">まだキャラクターがいません</div>
      <div v-for="c in currentProject.characters" :key="c.id" class="card" :class="{ open: charOpenId === c.id }">
        <div class="card-row" @click="toggleChar(c)">
          <div class="card-main">
            <div class="card-title">{{ c.name }}<span v-if="c.reading" style="font-weight:400; color:var(--text2); font-size:12px;"> ({{ c.reading }})</span></div>
            <div class="card-sub">参照画像 {{ (c.referenceImages||[]).length }}枚</div>
          </div>
          <span class="badge" :class="'status-' + c.status">{{ c.status === 'confirmed' ? '確定' : '下書き' }}</span>
          <span class="chev">expand_more</span>
        </div>
        <div v-if="charOpenId === c.id" class="card-detail">
          <div><div class="field-label">名前</div><input class="field-input" v-model="charEdit.name"></div>
          <div class="field-row">
            <div><div class="field-label">読み</div><input class="field-input" v-model="charEdit.reading"></div>
            <div><div class="field-label">状態</div>
              <select class="field-input" v-model="charEdit.status"><option value="draft">下書き</option><option value="confirmed">確定</option></select>
            </div>
          </div>
          <div><div class="field-label">人物像 (原文準拠のメモ)</div><textarea class="field-input" v-model="charEdit.description"></textarea></div>
          <div><div class="field-label">識別子 (identityTokens・読点区切り)</div><input class="field-input" v-model="charEdit.identityTokensText" placeholder="例: 渦巻く長髪、十字架の護符、ボロ法衣"></div>
          <div><div class="field-label">画像生成用プロンプト</div><textarea class="field-input" v-model="charEdit.appearancePrompt"></textarea></div>
          <div>
            <div class="field-label">参照画像</div>
            <div class="thumb-row">
              <img v-for="(img,i) in charEdit.referenceImages" :key="i" :src="img.url" class="thumb">
              <label class="filepick"><input type="file" accept="image/*" @change="e => onCharImagePick(e, c)"><span class="icon">add_photo_alternate</span>追加</label>
            </div>
          </div>
          <div class="actions-row">
            <button class="danger" @click="deleteCharacter(c)" :disabled="charSaving">削除</button>
            <button class="primary" @click="saveCharacter(c)" :disabled="charSaving">{{ charSaving ? '保存中…' : '保存' }}</button>
          </div>
        </div>
      </div>
    </div>

    <div class="fab-row">
      <button class="fab chat" @click="openChat()" title="AIチャット"><span class="icon" style="font-size:24px;">forum</span></button>
      <button class="fab add" @click="projectTab === 'episodes' ? (showNewEpisode = true) : (showNewCharacter = true)" title="追加">+</button>
    </div>

    <bottom-sheet v-model="showNewEpisode" title="新しい話">
      <form @submit.prevent="createEpisode" class="card-detail" style="border:none; padding:0;">
        <div class="field-row">
          <div><div class="field-label">話数</div><input class="field-input" type="number" v-model="newEpisode.number" required></div>
          <div><div class="field-label">目安秒数</div><input class="field-input" type="number" v-model="newEpisode.targetDurationSec"></div>
        </div>
        <div><div class="field-label">タイトル</div><input class="field-input" v-model="newEpisode.title"></div>
        <div class="field-row">
          <div><div class="field-label">原作範囲: 開始 (文字位置)</div><input class="field-input" type="number" v-model="newEpisode.sourceRangeStart"></div>
          <div><div class="field-label">終了</div><input class="field-input" type="number" v-model="newEpisode.sourceRangeEnd"></div>
        </div>
        <div class="actions-row"><button type="submit" class="primary" :disabled="creating">{{ creating ? '作成中…' : '作成' }}</button></div>
      </form>
    </bottom-sheet>

    <bottom-sheet v-model="showNewCharacter" title="新しいキャラクター">
      <form @submit.prevent="createCharacter" class="card-detail" style="border:none; padding:0;">
        <div><div class="field-label">名前</div><input class="field-input" v-model="newCharacter.name" required></div>
        <div><div class="field-label">読み</div><input class="field-input" v-model="newCharacter.reading"></div>
        <div><div class="field-label">人物像</div><textarea class="field-input" v-model="newCharacter.description"></textarea></div>
        <div class="actions-row"><button type="submit" class="primary" :disabled="creating">{{ creating ? '作成中…' : '作成' }}</button></div>
      </form>
    </bottom-sheet>
  </template>

  <!-- ───────── エピソード編集 ───────── -->
  <template v-else-if="view === 'episode' && currentEpisode">
    <div class="header-fix">
      <div class="top">
        <button class="pill" @click="backToProject">← 話一覧</button>
        <span class="top-title">第{{ currentEpisode.number }}話 {{ currentEpisode.title || '' }}</span>
        <span class="badge" :class="'state-' + currentEpisode.state">{{ STATE_LABEL[currentEpisode.state] || currentEpisode.state }}</span>
      </div>
    </div>

    <div class="warn-banner" v-if="currentEpisode.missingInfo && currentEpisode.missingInfo.length">
      <div class="warn-banner-title"><span class="icon">warning</span>不足している情報</div>
      <ul><li v-for="m in currentEpisode.missingInfo" :key="m">{{ m }}</li></ul>
    </div>

    <div class="section-title">登場キャラクター</div>
    <div class="list" style="padding-top:0;">
      <div style="display:flex; flex-wrap:wrap; gap:8px; padding: 0 16px;">
        <label v-for="c in currentProject.characters" :key="c.id" class="chip" :style="isAppearing(c.id) ? { background: 'var(--accent)', color: 'white' } : {}">
          <input type="checkbox" style="display:none;" :checked="isAppearing(c.id)" @change="toggleAppearing(c.id)">{{ c.name }}
        </label>
      </div>
    </div>

    <div class="section-title">キービジュアル</div>
    <div class="key-visual-box">
      <img v-if="currentEpisode.keyVisual && currentEpisode.keyVisual.url" :src="currentEpisode.keyVisual.url" class="kv-img">
      <div v-else class="kv-empty">まだキービジュアルがありません</div>
      <label class="filepick" style="margin-top:8px;"><input type="file" accept="image/*" @change="onKeyVisualPick"><span class="icon">add_photo_alternate</span>アップロード</label>
    </div>

    <div class="section-title">カット割り ({{ currentEpisode.cuts.length }})</div>
    <div class="list">
      <div v-for="(cut, idx) in currentEpisode.cuts" :key="cut.id" class="card" :class="{ open: cutOpenId === cut.id }">
        <div class="card-row" @click="toggleCut(cut)">
          <button class="cut-order-btn" @click.stop="moveCut(cut, -1)" :disabled="idx === 0">‹</button>
          <div class="card-main">
            <div class="card-title">カット{{ cut.order }} ({{ cut.durationSec }}秒)</div>
            <div class="card-sub">{{ (cut.prompt || '(プロンプト未設定)').slice(0, 40) }}</div>
          </div>
          <button class="cut-order-btn" @click.stop="moveCut(cut, 1)" :disabled="idx === currentEpisode.cuts.length - 1">›</button>
          <span class="chev">expand_more</span>
        </div>
        <div v-if="cutOpenId === cut.id" class="card-detail">
          <div><div class="field-label">プロンプト</div><textarea class="field-input" v-model="cutEdit.prompt"></textarea></div>
          <div class="field-row">
            <div><div class="field-label">秒数</div><input class="field-input" type="number" v-model="cutEdit.durationSec"></div>
          </div>
          <div>
            <div class="field-label">登場キャラ</div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <label v-for="c in currentProject.characters" :key="c.id" class="chip" :style="cutEdit.characterIds.includes(c.id) ? { background: 'var(--accent)', color: 'white' } : {}" @click="toggleCutChar(c.id)">{{ c.name }}</label>
            </div>
          </div>
          <div><div class="field-label">ナレーション</div><textarea class="field-input" v-model="cutEdit.narration"></textarea></div>
          <div><div class="field-label">字幕</div><input class="field-input" v-model="cutEdit.subtitle"></div>
          <div class="actions-row">
            <button class="danger" @click="deleteCut(cut)" :disabled="cutSaving">削除</button>
            <button @click="saveCut(cut)" :disabled="cutSaving">{{ cutSaving ? '保存中…' : '保存' }}</button>
          </div>
          <div class="actions-row">
            <button class="primary" @click="generateCut(cut)" :disabled="generatingCutId === cut.id">
              {{ generatingCutId === cut.id ? '生成中…' : '動画生成' }}
            </button>
          </div>
          <div v-if="genErrorFor === cut.id" class="err">{{ genError }}</div>
          <template v-for="(g, gi) in cut.generations" :key="gi">
            <video v-if="g.videoUrl" :src="g.videoUrl" controls class="gen-video" :style="cut.selectedGenerationIndex === gi ? { outline: '3px solid var(--accent)' } : {}" @click="selectGeneration(cut, gi)"></video>
            <div class="gen-note">{{ g.note || (g.status + ' / ' + g.model) }}</div>
          </template>
        </div>
      </div>
      <button class="pill" style="align-self:center;" @click="addCut">+ カットを追加</button>
    </div>

    <div class="section-title">タイムライン (書き出し順)</div>
    <div class="list" style="padding-top:0; gap:4px;">
      <div class="card-sub" style="padding: 0 16px;">カット順にそのまま連結されます。並べ替えはカット割りの ‹ › で。</div>
      <div class="actions-row" style="padding: 8px 16px 0;">
        <button class="primary" @click="exportEpisode" :disabled="exporting">{{ exporting ? '書き出し中…' : '書き出し' }}</button>
      </div>
      <div v-if="currentEpisode.timeline && currentEpisode.timeline.exportedVideoUrl" style="padding: 8px 16px;">
        <video :src="currentEpisode.timeline.exportedVideoUrl" controls class="gen-video"></video>
      </div>
      <div v-if="exportErr" class="err">{{ exportErr }}</div>
    </div>

    <div class="fab-row">
      <button class="fab chat" @click="openChat(currentEpisode.id)" title="AIチャット"><span class="icon" style="font-size:24px;">forum</span></button>
    </div>
  </template>

  <!-- ───────── AI チャット ───────── -->
  <bottom-sheet v-model="chatOpen" title="AI チャット">
    <div class="chat-sheet">
      <div class="chat-log" ref="chatLogEl">
        <div v-if="chatMessages.length === 0" class="empty" style="padding:20px 0;">「今なにをすればいい?」と聞いてみてください</div>
        <div v-for="m in chatMessages" :key="m.id || m.content" class="msg" :class="m.role">{{ m.content }}</div>
      </div>
      <div class="chat-input-row">
        <textarea class="field-input" v-model="chatInput" placeholder="メッセージを入力…" @keydown.enter.exact.prevent="sendChat"></textarea>
        <button class="chat-send" @click="sendChat" :disabled="chatSending || !chatInput.trim()"><span class="icon">send</span></button>
      </div>
    </div>
  </bottom-sheet>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const user = ref(null);
    const ready = ref(false);
    const err = ref("");
    let fbApp = null;

    const view = ref("projects"); // 'projects' | 'project' | 'episode'
    const projects = ref([]);
    const currentProject = ref(null);
    const currentEpisode = ref(null);
    const projectTab = ref("episodes");

    const creating = ref(false);
    const seeding = ref(false);
    const showNewProject = ref(false);
    const newProject = ref({ title: "", author: "", styleGuide: "", worldSetting: "", sourceText: "" });
    const showNewEpisode = ref(false);
    const newEpisode = ref({ number: "", title: "", targetDurationSec: 60, sourceRangeStart: null, sourceRangeEnd: null });
    const showNewCharacter = ref(false);
    const newCharacter = ref({ name: "", reading: "", description: "" });

    const charOpenId = ref(null);
    const charEdit = ref({});
    const charSaving = ref(false);

    const cutOpenId = ref(null);
    const cutEdit = ref({ characterIds: [] });
    const cutSaving = ref(false);
    const generatingCutId = ref(null);
    const genError = ref("");
    const genErrorFor = ref(null);
    const exporting = ref(false);
    const exportErr = ref("");

    const chatOpen = ref(false);
    const chatMessages = ref([]);
    const chatInput = ref("");
    const chatSending = ref(false);
    const chatLogEl = ref(null);
    let chatEpisodeId = null;

    async function apiFetch(path, opts = {}) {
      const token = await user.value.getIdToken();
      const res = await fetch((window.API_BASE || "") + path, {
        method: opts.method || "GET",
        headers: { "content-type": "application/json", authorization: "Bearer " + token },
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        let msg = res.statusText;
        try {
          const j = await res.json();
          msg = j.error || msg;
          if (j.reasons) msg += ": " + j.reasons.join(", ");
        } catch (_) {}
        const e = new Error(msg);
        e.status = res.status;
        throw e;
      }
      if (res.status === 204) return null;
      return res.json();
    }

    async function uploadImage(file, pathPrefix) {
      const storage = getStorage(fbApp, "gs://static-epigram-496002-v8.firebasestorage.app");
      const safe = file.name.replace(/[^\w.\-]/g, "_");
      const path = `${pathPrefix}/${Date.now()}_${safe}`;
      const r = storageRef(storage, path);
      await uploadBytes(r, file);
      return getDownloadURL(r);
    }

    async function loadProjects() {
      try {
        projects.value = await apiFetch("/api/drama/projects");
      } catch (e) { err.value = e.message; }
    }

    async function openProject(id) {
      err.value = "";
      try {
        currentProject.value = await apiFetch(`/api/drama/projects/${id}`);
        projectTab.value = "episodes";
        view.value = "project";
      } catch (e) { err.value = e.message; }
    }

    function backToProjects() { view.value = "projects"; currentProject.value = null; loadProjects(); }

    async function openEpisode(id) {
      err.value = "";
      try {
        currentEpisode.value = await apiFetch(`/api/drama/episodes/${id}`);
        view.value = "episode";
      } catch (e) { err.value = e.message; }
    }

    async function backToProject() {
      view.value = "project";
      currentEpisode.value = null;
      if (currentProject.value) await openProject(currentProject.value.id);
    }

    async function refreshEpisode() {
      if (currentEpisode.value) currentEpisode.value = await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}`);
    }

    // ── プロジェクト ──
    async function createProject() {
      creating.value = true;
      try {
        const b = newProject.value;
        const { id } = await apiFetch("/api/drama/projects", { method: "POST", body: b });
        showNewProject.value = false;
        newProject.value = { title: "", author: "", styleGuide: "", worldSetting: "", sourceText: "" };
        await loadProjects();
        await openProject(id);
      } catch (e) { err.value = e.message; } finally { creating.value = false; }
    }

    async function seedJashumon() {
      seeding.value = true;
      try {
        const { id } = await apiFetch("/api/drama/projects", {
          method: "POST",
          body: {
            title: "邪宗門", author: "芥川龍之介",
            styleGuide: "劇画・浮世絵×シネマティック",
            worldSetting: "戦国時代末期、南蛮渡来の妖術と土着信仰が交錯する京。若殿と姫君、邪法師 摩利信乃法師が絡む因縁の物語。",
          },
        });
        await loadProjects();
        await openProject(id);
      } catch (e) { err.value = e.message; } finally { seeding.value = false; }
    }

    // ── エピソード ──
    async function createEpisode() {
      creating.value = true;
      try {
        const b = { ...newEpisode.value, number: Number(newEpisode.value.number) };
        await apiFetch(`/api/drama/projects/${currentProject.value.id}/episodes`, { method: "POST", body: b });
        showNewEpisode.value = false;
        newEpisode.value = { number: "", title: "", targetDurationSec: 60, sourceRangeStart: null, sourceRangeEnd: null };
        await openProject(currentProject.value.id);
      } catch (e) { err.value = e.message; } finally { creating.value = false; }
    }

    function isAppearing(cid) { return (currentEpisode.value.appearingCharacterIds || []).includes(cid); }
    async function toggleAppearing(cid) {
      const cur = currentEpisode.value.appearingCharacterIds || [];
      const next = cur.includes(cid) ? cur.filter((x) => x !== cid) : [...cur, cid];
      try {
        await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}`, { method: "PATCH", body: { appearingCharacterIds: next } });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }

    async function onKeyVisualPick(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const url = await uploadImage(file, `auto-drama/${currentProject.value.id}/keyvisual`);
        await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}`, { method: "PATCH", body: { keyVisual: { url } } });
        await refreshEpisode();
      } catch (e2) { err.value = e2.message; }
    }

    // ── キャラクター ──
    function toggleChar(c) {
      if (charOpenId.value === c.id) { charOpenId.value = null; return; }
      charOpenId.value = c.id;
      charEdit.value = {
        name: c.name, reading: c.reading || "", description: c.description || "",
        appearancePrompt: c.appearancePrompt || "", status: c.status,
        identityTokensText: (c.identityTokens || []).join("、"),
        referenceImages: c.referenceImages || [],
      };
    }
    async function createCharacter() {
      creating.value = true;
      try {
        await apiFetch(`/api/drama/projects/${currentProject.value.id}/characters`, { method: "POST", body: newCharacter.value });
        showNewCharacter.value = false;
        newCharacter.value = { name: "", reading: "", description: "" };
        await openProject(currentProject.value.id);
      } catch (e) { err.value = e.message; } finally { creating.value = false; }
    }
    async function onCharImagePick(e, c) {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const url = await uploadImage(file, `auto-drama/${currentProject.value.id}/characters/${c.id}`);
        charEdit.value.referenceImages = [...(charEdit.value.referenceImages || []), { url, kind: "full", note: "" }];
      } catch (e2) { err.value = e2.message; }
    }
    async function saveCharacter(c) {
      charSaving.value = true;
      try {
        const b = charEdit.value;
        await apiFetch(`/api/drama/characters/${c.id}`, {
          method: "PATCH",
          body: {
            name: b.name, reading: b.reading, description: b.description, appearancePrompt: b.appearancePrompt,
            status: b.status, identityTokens: b.identityTokensText.split("、").map((s) => s.trim()).filter(Boolean),
            referenceImages: b.referenceImages,
          },
        });
        charOpenId.value = null;
        await openProject(currentProject.value.id);
      } catch (e) { err.value = e.message; } finally { charSaving.value = false; }
    }
    async function deleteCharacter(c) {
      charSaving.value = true;
      try {
        await apiFetch(`/api/drama/characters/${c.id}`, { method: "DELETE" });
        charOpenId.value = null;
        await openProject(currentProject.value.id);
      } catch (e) { err.value = e.message; } finally { charSaving.value = false; }
    }

    // ── カット ──
    function toggleCut(cut) {
      if (cutOpenId.value === cut.id) { cutOpenId.value = null; return; }
      cutOpenId.value = cut.id;
      cutEdit.value = {
        prompt: cut.prompt || "", durationSec: cut.durationSec, characterIds: [...(cut.characterIds || [])],
        narration: cut.narration || "", subtitle: cut.subtitle || "",
      };
    }
    function toggleCutChar(cid) {
      const cur = cutEdit.value.characterIds;
      cutEdit.value.characterIds = cur.includes(cid) ? cur.filter((x) => x !== cid) : [...cur, cid];
    }
    async function addCut() {
      try {
        await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}/cuts`, { method: "POST", body: {} });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }
    async function saveCut(cut) {
      cutSaving.value = true;
      try {
        const b = cutEdit.value;
        await apiFetch(`/api/drama/cuts/${cut.id}`, {
          method: "PATCH",
          body: { prompt: b.prompt, durationSec: Number(b.durationSec), characterIds: b.characterIds, narration: b.narration, subtitle: b.subtitle },
        });
        cutOpenId.value = null;
        await refreshEpisode();
      } catch (e) { err.value = e.message; } finally { cutSaving.value = false; }
    }
    async function deleteCut(cut) {
      cutSaving.value = true;
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}`, { method: "DELETE" });
        cutOpenId.value = null;
        await refreshEpisode();
      } catch (e) { err.value = e.message; } finally { cutSaving.value = false; }
    }
    async function moveCut(cut, dir) {
      const cuts = currentEpisode.value.cuts;
      const idx = cuts.findIndex((c) => c.id === cut.id);
      const j = idx + dir;
      if (j < 0 || j >= cuts.length) return;
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}`, { method: "PATCH", body: { order: cuts[j].order } });
        await apiFetch(`/api/drama/cuts/${cuts[j].id}`, { method: "PATCH", body: { order: cut.order } });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }
    async function generateCut(cut) {
      generatingCutId.value = cut.id;
      genErrorFor.value = null;
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}/generate`, { method: "POST", body: {} });
        await refreshEpisode();
      } catch (e) {
        genError.value = e.message;
        genErrorFor.value = cut.id;
      } finally { generatingCutId.value = null; }
    }
    async function selectGeneration(cut, idx) {
      try {
        await apiFetch(`/api/drama/cuts/${cut.id}`, { method: "PATCH", body: { selectedGenerationIndex: idx } });
        await refreshEpisode();
      } catch (e) { err.value = e.message; }
    }

    async function exportEpisode() {
      exporting.value = true;
      exportErr.value = "";
      try {
        await apiFetch(`/api/drama/episodes/${currentEpisode.value.id}/export`, { method: "POST", body: {} });
        await refreshEpisode();
      } catch (e) { exportErr.value = e.message; } finally { exporting.value = false; }
    }

    // ── チャット ──
    async function openChat(episodeId) {
      chatEpisodeId = episodeId || null;
      chatOpen.value = true;
      try {
        const qs = chatEpisodeId ? `?episodeId=${chatEpisodeId}` : "";
        chatMessages.value = await apiFetch(`/api/drama/projects/${currentProject.value.id}/chat${qs}`);
        nextTick(scrollChatToBottom);
      } catch (e) { err.value = e.message; }
    }
    function scrollChatToBottom() {
      if (chatLogEl.value) chatLogEl.value.scrollTop = chatLogEl.value.scrollHeight;
    }
    async function sendChat() {
      const message = chatInput.value.trim();
      if (!message || chatSending.value) return;
      chatSending.value = true;
      chatMessages.value.push({ role: "user", content: message });
      chatInput.value = "";
      nextTick(scrollChatToBottom);
      try {
        const res = await apiFetch(`/api/drama/projects/${currentProject.value.id}/chat`, {
          method: "POST", body: { message, episodeId: chatEpisodeId },
        });
        chatMessages.value.push({ role: "assistant", content: res.reply });
        nextTick(scrollChatToBottom);
      } catch (e) {
        chatMessages.value.push({ role: "assistant", content: "(エラー: " + e.message + ")" });
      } finally { chatSending.value = false; }
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        fbApp = initializeApp(cfg);
        const auth = getAuth(fbApp);
        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, async (u) => {
          if (!u) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
          user.value = u;
          ready.value = true;
          await loadProjects();
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        ready.value = true;
      }
    });

    return {
      STATE_LABEL, IMG_KIND_LABEL,
      view, ready, err, projects, currentProject, currentEpisode, projectTab,
      creating, seeding, showNewProject, newProject, createProject, seedJashumon,
      showNewEpisode, newEpisode, createEpisode,
      showNewCharacter, newCharacter, createCharacter,
      openProject, backToProjects, openEpisode, backToProject,
      charOpenId, charEdit, charSaving, toggleChar, onCharImagePick, saveCharacter, deleteCharacter,
      cutOpenId, cutEdit, cutSaving, toggleCut, toggleCutChar, addCut, saveCut, deleteCut, moveCut,
      generatingCutId, genError, genErrorFor, generateCut, selectGeneration,
      isAppearing, toggleAppearing, onKeyVisualPick,
      exporting, exportErr, exportEpisode,
      chatOpen, chatMessages, chatInput, chatSending, chatLogEl, openChat, sendChat,
    };
  },
};

createApp(App).component("bottom-sheet", BottomSheet).mount("#app");
</script>
</body>
</html>
