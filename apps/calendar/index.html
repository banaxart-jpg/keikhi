<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カレンダー">
<link rel="apple-touch-icon" href="/icon.png">
<title>カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #4f46e5;
  --sun: #c2557a; --sat: #4f6fc2;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; gap: 8px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; text-decoration: none; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.wrap { padding: 16px 14px 40px; max-width: 600px; margin: 0 auto; }

/* 月ナビ */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.month-nav .mlabel { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.month-nav .mlabel .yr { font-size: 13px; color: var(--text2); font-weight: 700; margin-right: 6px; }
.nav-btn { width: 40px; height: 40px; border-radius: 14px; border: none; background: var(--bg); color: var(--text); cursor: pointer; box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); display: flex; align-items: center; justify-content: center; }
.nav-btn:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.nav-btn .icon { font-size: 22px; vertical-align: 0; }

/* グリッド */
.cal { background: var(--bg); border-radius: 20px; padding: 12px 10px; box-shadow: 6px 6px 16px var(--sd), -5px -5px 14px var(--sl); }
.dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
.dow { text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--text2); padding: 2px 0; }
.dow.s0 { color: var(--sun); } .dow.s6 { color: var(--sat); }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cell { min-height: 58px; border-radius: 10px; padding: 4px 3px 3px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.cell:active { background: rgba(154,160,184,0.14); }
.cell.out { opacity: 0.38; }
.cell.sel { box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 6px var(--sl); }
.cell .dnum { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.4; width: 22px; height: 22px; margin: 0 auto; border-radius: 50%; }
.cell .dnum.s0 { color: var(--sun); } .cell .dnum.s6 { color: var(--sat); }
.cell .dnum.today { background: var(--accent); color: #fff; }
.bar-ev { font-size: 9px; font-weight: 700; line-height: 1.3; padding: 1px 4px; border-radius: 4px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-more { font-size: 9px; font-weight: 800; color: var(--text2); text-align: center; }

/* 選択日のアジェンダ */
.agenda { margin-top: 16px; }
.agenda-head { font-size: 14px; font-weight: 800; margin: 0 4px 10px; display: flex; align-items: baseline; gap: 8px; }
.agenda-head .sub { font-size: 11px; color: var(--text2); font-weight: 700; }
.ev-row { display: grid; grid-template-columns: 56px 1fr; align-items: start; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); margin-bottom: 8px; }
.ev-time { font-size: 12px; font-weight: 800; color: var(--text); line-height: 1.4; }
.ev-time .end { display: block; font-size: 11px; font-weight: 600; color: var(--text2); }
.ev-time.allday { color: var(--accent); }
.ev-body { min-width: 0; display: flex; align-items: flex-start; gap: 8px; }
.ev-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.ev-title { font-size: 14px; font-weight: 700; line-height: 1.4; word-break: break-word; }
.ev-loc { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 2px; }
.agenda-empty { text-align: center; color: var(--text2); font-weight: 600; font-size: 13px; padding: 22px; }

.notice { text-align: center; padding: 40px 20px; }
.notice .icon { font-size: 44px; color: var(--text3); vertical-align: 0; }
.notice .nt { font-size: 15px; font-weight: 800; margin-top: 14px; }
.notice .nd { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 8px; line-height: 1.6; }
.connect-btn { margin-top: 20px; padding: 14px 26px; border-radius: 20px; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; box-shadow: 5px 5px 12px var(--sd), -3px -3px 10px var(--sl); }
.connect-btn:active { transform: scale(0.97); }
.errbox { margin-top: 16px; font-size: 11px; color: var(--sun); font-family: monospace; white-space: pre-wrap; text-align: left; background: rgba(194,85,122,0.08); padding: 10px; border-radius: 10px; }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
</style>
</head>
<body>
<div id="signinOverlay">
  <div style="font-size:24px;font-weight:800;">カレンダー</div>
  <a class="pill" href="/" style="text-decoration:none;">トップに戻る</a>
  <div id="signinErr" style="font-size:11px;color:#b04040;font-family:monospace;"></div>
</div>

<div id="app" style="display:none;">
  <div class="bar">
    <a class="pill" href="/"><span class="icon">arrow_back</span> 戻る</a>
    <span style="font-size:11px;letter-spacing:0.22em;color:var(--text3);font-weight:700;text-transform:uppercase;">CALENDAR</span>
    <button class="pill" id="todayBtn" type="button"><span class="icon">today</span> 今日</button>
  </div>

  <div class="wrap" id="main"></div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initAuthBoot, getFbAuth } from "/api-auth.js";
import {
  GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const CAL_SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
const TOKEN_KEY = "gcal_access_token";
const $ = (id) => document.getElementById(id);

// ─────────────────────────────
// State
// ─────────────────────────────
let accessToken = sessionStorage.getItem(TOKEN_KEY) || null;
let cur = new Date(); cur.setDate(1);     // 表示中の月 (1日固定)
let selectedIso = isoDate(new Date());    // 選択中の日
let calendars = [];                       // [{ id, color }]
let events = [];                          // 表示月の正規化済みイベント
let loadedMonthKey = null;                // 取得済みの月 (重複 fetch 防止)
let loading = false;

const WD = ["日", "月", "火", "水", "木", "金", "土"];

function provider() {
  const p = new GoogleAuthProvider();
  p.addScope(CAL_SCOPE);
  p.setCustomParameters({ prompt: "consent" });
  return p;
}

// ─────────────────────────────
// 日付ユーティリティ
// ─────────────────────────────
function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function monthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }

// 表示する 42 セル (前月末〜次月頭の埋め草込み)
function monthCells() {
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const startDow = first.getDay();
  const totalDays = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
  const today = isoDate(new Date());
  const cells = [];
  const prevLast = new Date(cur.getFullYear(), cur.getMonth(), 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    const dt = new Date(cur.getFullYear(), cur.getMonth() - 1, prevLast - i);
    cells.push({ iso: isoDate(dt), day: dt.getDate(), dow: dt.getDay(), inMonth: false, isToday: false });
  }
  for (let day = 1; day <= totalDays; day++) {
    const dt = new Date(cur.getFullYear(), cur.getMonth(), day);
    const iso = isoDate(dt);
    cells.push({ iso, day, dow: dt.getDay(), inMonth: true, isToday: iso === today });
  }
  let nd = 1;
  while (cells.length < 42) {
    const dt = new Date(cur.getFullYear(), cur.getMonth() + 1, nd++);
    cells.push({ iso: isoDate(dt), day: dt.getDate(), dow: dt.getDay(), inMonth: false, isToday: false });
  }
  return cells;
}

// イベントが指定日 (iso) にかかっているか
function coversDay(ev, iso) {
  if (ev.allDay) return iso >= ev.startDate && iso < ev.endDate;
  return iso >= ev.startDay && iso <= ev.endDay;
}
function dayEvents(iso) {
  return events.filter((ev) => coversDay(ev, iso))
    .sort((a, b) => (b.allDay - a.allDay) || (a.startMs - b.startMs));
}

// ─────────────────────────────
// Google Calendar API
// ─────────────────────────────
async function gcal(url) {
  if (!accessToken) throw new Error("NO_TOKEN");
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (r.status === 401) {
    sessionStorage.removeItem(TOKEN_KEY);
    accessToken = null;
    throw new Error("TOKEN_EXPIRED");
  }
  if (!r.ok) {
    const body = await r.text();
    throw new Error(`${r.status}\n${body.slice(0, 500)}`);
  }
  return r.json();
}

async function fetchCalendars() {
  const j = await gcal("https://www.googleapis.com/calendar/v3/users/me/calendarList");
  calendars = (j.items || [])
    .filter((c) => c.primary || c.selected)
    .map((c) => ({ id: c.id, color: c.backgroundColor || "#4f46e5" }));
}

function normEvent(ev, color) {
  const s = ev.start || {}, e = ev.end || {};
  if (s.date) {
    return {
      id: ev.id, title: ev.summary || "(無題)", location: ev.location || "",
      allDay: true, color, startDate: s.date, endDate: e.date || s.date,
      startMs: new Date(s.date + "T00:00:00").getTime(),
    };
  }
  const sdt = new Date(s.dateTime), edt = new Date(e.dateTime || s.dateTime);
  return {
    id: ev.id, title: ev.summary || "(無題)", location: ev.location || "",
    allDay: false, color, startDateTime: sdt, endDateTime: edt,
    startDay: isoDate(sdt), endDay: isoDate(edt), startMs: sdt.getTime(),
  };
}

async function fetchEvents() {
  // 表示中の月セル範囲をまるごと取得 (前月末〜次月頭の埋め草も含む)
  const cells = monthCells();
  const timeMin = new Date(cells[0].iso + "T00:00:00").toISOString();
  const lastIso = cells[cells.length - 1].iso;
  const timeMax = new Date(lastIso + "T23:59:59").toISOString();
  const all = [];
  await Promise.all(calendars.map(async (c) => {
    const u = new URL(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(c.id)}/events`);
    u.searchParams.set("timeMin", timeMin);
    u.searchParams.set("timeMax", timeMax);
    u.searchParams.set("singleEvents", "true");
    u.searchParams.set("orderBy", "startTime");
    u.searchParams.set("maxResults", "500");
    try {
      const j = await gcal(u.toString());
      (j.items || []).forEach((ev) => { if (ev.status !== "cancelled") all.push(normEvent(ev, c.color)); });
    } catch (e) {
      if (e.message === "TOKEN_EXPIRED") throw e;   // 上位で再ログイン誘導
      console.warn("[calendar] events fetch failed:", c.id, e.message);
    }
  }));
  events = all;
  loadedMonthKey = monthKey(cur);
}

async function loadMonth(force = false) {
  if (!accessToken) { renderConnect(); return; }
  if (!force && loadedMonthKey === monthKey(cur)) { renderCalendar(); return; }
  loading = true;
  renderCalendar();
  try {
    if (calendars.length === 0) await fetchCalendars();
    await fetchEvents();
    loading = false;
    renderCalendar();
  } catch (e) {
    loading = false;
    if (e.message === "TOKEN_EXPIRED" || e.message === "NO_TOKEN") { renderConnect(); return; }
    renderConnect(`${e.message}`);
  }
}

// ─────────────────────────────
// 連携 (calendar scope の同意を取って access token を得る)
// ─────────────────────────────
async function connect() {
  const auth = getFbAuth();
  if (!auth) return;
  try {
    const result = await signInWithPopup(auth, provider());
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (cred?.accessToken) {
      accessToken = cred.accessToken;
      sessionStorage.setItem(TOKEN_KEY, accessToken);
      calendars = []; loadedMonthKey = null;
      loadMonth(true);
    } else {
      renderConnect(
        "サインインはできましたが、カレンダーの読み取り許可が下りませんでした。\n" +
        "Google 側で Calendar API の有効化と、同意画面への calendar.readonly スコープ登録が必要です（小西に依頼）。"
      );
    }
  } catch (e) {
    if (["auth/popup-blocked", "auth/popup-closed-by-user", "auth/cancelled-popup-request",
         "auth/operation-not-supported-in-this-environment"].includes(e.code)) {
      try { await signInWithRedirect(auth, provider()); return; } catch (_) {}
    }
    renderConnect(`${e.code || ""} ${e.message}`);
  }
}

// ─────────────────────────────
// 描画
// ─────────────────────────────
function renderConnect(err = "") {
  $("main").innerHTML = `
    <div class="cal" style="box-shadow:none;background:transparent;">
      <div class="notice">
        <span class="icon">calendar_month</span>
        <div class="nt">Google カレンダーと連携</div>
        <div class="nd">あなたの予定を読み取って、ここに見やすく表示します。<br>読み取り専用（予定の変更はしません）。</div>
        <button class="connect-btn" id="connectBtn" type="button"><span class="icon">link</span> 連携する</button>
        ${err ? `<div class="errbox">${escapeHtml(err)}</div>` : ""}
      </div>
    </div>
  `;
  $("connectBtn").addEventListener("click", connect);
}

function renderCalendar() {
  const cells = monthCells();
  const cellsHtml = cells.map((c) => {
    const evs = dayEvents(c.iso);
    const bars = evs.slice(0, 3).map((ev) =>
      `<div class="bar-ev" style="background:${ev.color}">${ev.allDay ? "" : timeShort(ev.startDateTime) + " "}${escapeHtml(ev.title)}</div>`
    ).join("");
    const more = evs.length > 3 ? `<div class="bar-more">+${evs.length - 3}</div>` : "";
    const dowCls = c.dow === 0 ? "s0" : c.dow === 6 ? "s6" : "";
    return `
      <div class="cell ${c.inMonth ? "" : "out"} ${c.iso === selectedIso ? "sel" : ""}" data-iso="${c.iso}">
        <div class="dnum ${dowCls} ${c.isToday ? "today" : ""}">${c.day}</div>
        ${bars}${more}
      </div>`;
  }).join("");

  $("main").innerHTML = `
    <div class="month-nav">
      <button class="nav-btn" id="prevBtn" type="button"><span class="icon">chevron_left</span></button>
      <div class="mlabel"><span class="yr">${cur.getFullYear()}</span>${cur.getMonth() + 1}月</div>
      <button class="nav-btn" id="nextBtn" type="button"><span class="icon">chevron_right</span></button>
    </div>
    <div class="cal">
      <div class="dow-row">
        ${WD.map((w, i) => `<div class="dow ${i === 0 ? "s0" : i === 6 ? "s6" : ""}">${w}</div>`).join("")}
      </div>
      <div class="grid" id="grid">${cellsHtml}</div>
    </div>
    <div class="agenda" id="agenda"></div>
  `;
  $("prevBtn").addEventListener("click", () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); loadMonth(); });
  $("nextBtn").addEventListener("click", () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); loadMonth(); });
  document.querySelectorAll(".cell").forEach((el) => {
    el.addEventListener("click", () => { selectedIso = el.dataset.iso; renderCalendar(); });
  });
  renderAgenda();
}

function renderAgenda() {
  const evs = dayEvents(selectedIso);
  const [y, m, d] = selectedIso.split("-").map(Number);
  const dow = WD[new Date(y, m - 1, d).getDay()];
  const rows = loading
    ? `<div class="agenda-empty">読み込み中…</div>`
    : evs.length === 0
      ? `<div class="agenda-empty">予定はありません</div>`
      : evs.map((ev) => `
        <div class="ev-row">
          <div class="ev-time ${ev.allDay ? "allday" : ""}">
            ${ev.allDay ? "終日" : `${timeShort(ev.startDateTime)}<span class="end">${timeShort(ev.endDateTime)}</span>`}
          </div>
          <div class="ev-body">
            <span class="ev-dot" style="background:${ev.color}"></span>
            <div>
              <div class="ev-title">${escapeHtml(ev.title)}</div>
              ${ev.location ? `<div class="ev-loc"><span class="icon" style="font-size:13px;">place</span> ${escapeHtml(ev.location)}</div>` : ""}
            </div>
          </div>
        </div>`).join("");
  $("agenda").innerHTML = `
    <div class="agenda-head">${m}月${d}日 <span class="sub">(${dow}) ${loading ? "" : evs.length + " 件"}</span></div>
    ${rows}
  `;
}

function timeShort(d) { return `${d.getHours()}:${pad(d.getMinutes())}`; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

$("todayBtn").addEventListener("click", () => {
  cur = new Date(); cur.setDate(1);
  selectedIso = isoDate(new Date());
  loadMonth();
});

// ─────────────────────────────
// 起動
// ─────────────────────────────
initAuthBoot({
  returnPath: "/calendar/",
  onReady: async () => {
    $("app").style.display = "";
    $("main").innerHTML = '<div class="agenda-empty">読み込み中…</div>';
    // redirect フォールバックから戻ってきた場合に token を回収
    try {
      const auth = getFbAuth();
      const result = await getRedirectResult(auth);
      const cred = result && GoogleAuthProvider.credentialFromResult(result);
      if (cred?.accessToken) {
        accessToken = cred.accessToken;
        sessionStorage.setItem(TOKEN_KEY, accessToken);
      }
    } catch (_) {}
    loadMonth();
  },
});
</script>
</body>
</html>
