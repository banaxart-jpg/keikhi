<!DOCTYPE html>
<html lang="ja">
<!-- AIコスト累積ダッシュボード：実際の利用件数から累積コストを概算 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AIコスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.42); --text3: rgba(66,69,94,0.22);
  --accent: #ff9a10;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 50px 22px 0; gap: 12px; }
.back, .refresh { background: var(--bg); border: none; padding: 10px 16px; border-radius: 24px; font-family: 'Outfit',sans-serif; font-size: 12px; font-weight: 700; color: var(--text2); cursor: pointer; box-shadow: 5px 5px 12px var(--sd), -5px -5px 12px var(--sl); }
.back:active, .refresh:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.96); }

.wrap { padding: 28px 22px 60px; max-width: 540px; margin: 0 auto; }
.title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 24px; line-height: 1.6; }

/* タブ */
.tabs { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 11px 18px; border-radius: 18px; background: var(--bg); border: none; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; color: var(--text2); cursor: pointer; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); white-space: nowrap; flex-shrink: 0; }
.tab.active { color: var(--accent); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }
.tab:disabled { opacity: 0.4; cursor: not-allowed; }
.tab:active:not(:disabled):not(.active) { transform: scale(0.96); }

/* メインコスト表示 */
.cost-hero { background: var(--bg); border-radius: 22px; padding: 32px 22px 28px; margin-bottom: 16px; box-shadow: inset 6px 6px 16px var(--sd), inset -5px -5px 14px var(--sl); text-align: center; }
.cost-hero-label { font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
.cost-hero-value { font-size: 48px; font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -0.03em; margin-bottom: 6px; }
.cost-hero-usd { font-size: 13px; color: var(--text2); font-weight: 700; }

/* 統計グリッド */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--bg); border-radius: 18px; padding: 18px; box-shadow: 8px 8px 20px var(--sd), -6px -6px 16px var(--sl); }
.stat-label { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
.stat-value { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -0.01em; }
.stat-unit { font-size: 12px; font-weight: 700; color: var(--text2); margin-left: 2px; }

/* セクション */
.section { background: var(--bg); border-radius: 18px; padding: 20px; margin-bottom: 16px; box-shadow: 8px 8px 20px var(--sd), -6px -6px 16px var(--sl); }
.section-title { font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text2); margin-bottom: 14px; }

/* 月別履歴 */
.month-row { display: grid; grid-template-columns: 70px 1fr 90px 60px; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; }
.month-row + .month-row { border-top: 1px dashed var(--text3); }
.month-label { font-weight: 700; color: var(--text); }
.month-bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; box-shadow: inset 2px 2px 4px var(--sd), inset -1px -1px 3px var(--sl); }
.month-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }
.month-cost { text-align: right; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.month-count { text-align: right; font-size: 11px; color: var(--text2); font-weight: 600; }

/* 内訳 */
.breakdown { font-size: 12px; color: var(--text2); line-height: 1.9; }
.breakdown strong { color: var(--text); font-weight: 700; }
.breakdown code { background: var(--bg3); padding: 2px 6px; border-radius: 5px; font-family: 'Outfit', monospace; font-size: 11px; font-weight: 700; }

/* 状態表示 */
.state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; font-weight: 600; }
.state.error { color: #b04040; }

/* サインインオーバーレイ */
#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay .title { font-size: 24px; }
.gbtn { padding: 14px 26px; border-radius: 30px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; color: var(--text); background: var(--bg); box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); }
.note { font-size: 11px; color: var(--text2); line-height: 1.7; padding: 14px 18px; background: var(--bg3); border-radius: 12px; font-weight: 500; margin-top: 6px; }
.note strong { color: var(--text); font-weight: 700; }
</style>
</head>
<body>

<div id="signinOverlay">
  <div class="title">AIコスト</div>
  <div class="note">トップでログインしてください</div>
  <button class="gbtn" onclick="location.href='/'">トップに戻る</button>
</div>

<div id="app" style="display:none;">
  <div class="top">
    <button class="back" onclick="location.href='/'">←  戻る</button>
    <button class="refresh" id="refreshBtn">⟳ 更新</button>
  </div>

  <div class="wrap">
    <div class="title">AIコスト</div>
    <div class="subtitle">各ミニアプリの累積 AI 利用コスト（概算）</div>

    <div class="tabs" id="tabs"></div>

    <div id="content">
      <div class="state">読み込み中...</div>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ───────── AI 利用するミニアプリの設定 ─────────
// 新しいAIアプリを追加するときは、ここに1ブロック足すだけ。
// 必要なのは: 表示名・データ取得API・1呼出あたりの概算コスト(円)
const APPS = [
  {
    id: "keihi",
    label: "経費",
    fetchPath: "/api/records",
    perCallJpy: 0.18,          // gemini-2.5-flash, 画像+JSON出力の概算
    perCallBreakdown: {
      model: "gemini-2.5-flash",
      inputTokens: 2000,       // 画像 ≒1500-2000 tokens + プロンプト
      outputTokens: 250,
      inPriceUsdPerM: 0.30,
      outPriceUsdPerM: 2.50,
    },
    unitName: "レシート",
    dateField: "createdAt",
  },
  // 新アプリ追加例 (コメントアウト):
  // {
  //   id: "nippou", label: "日報",
  //   fetchPath: "/api/nippou",
  //   perCallJpy: 0.5, perCallBreakdown: {...},
  //   unitName: "日報", dateField: "createdAt",
  // },
];

const USD_TO_JPY = 150;
const $ = (id) => document.getElementById(id);

// ───────── Auth ─────────
let fbAuth = null;
(async function init() {
  try {
    const cfg = await fetch("/__/firebase/init.json").then(r => r.json());
    cfg.authDomain = location.hostname;
    fbAuth = getAuth(initializeApp(cfg));
    await setPersistence(fbAuth, browserLocalPersistence);

    onAuthStateChanged(fbAuth, async (user) => {
      if (!user) {
        $("signinOverlay").style.display = "flex";
        $("app").style.display = "none";
        return;
      }
      $("signinOverlay").style.display = "none";
      $("app").style.display = "block";
      renderTabs();
      switchTo(APPS[0].id);
    });
  } catch (e) {
    $("signinOverlay").style.display = "flex";
    console.error("init失敗:", e);
  }
})();

// ───────── タブ ─────────
let activeAppId = null;

function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  for (const app of APPS) {
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = app.label;
    b.dataset.appId = app.id;
    b.onclick = () => switchTo(app.id);
    tabs.appendChild(b);
  }
  // 追加用ボタン（無効化、開発者リマインダ）
  const add = document.createElement("button");
  add.className = "tab";
  add.textContent = "+ 追加";
  add.disabled = true;
  add.title = "APPS 配列に追加してデプロイ";
  tabs.appendChild(add);
}

async function switchTo(appId) {
  activeAppId = appId;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.appId === appId);
  });
  await loadApp(appId);
}

// ───────── データ取得 + 集計 ─────────
async function loadApp(appId) {
  const app = APPS.find(a => a.id === appId);
  if (!app) return;
  $("content").innerHTML = `<div class="state">読み込み中...</div>`;

  try {
    const token = await fbAuth.currentUser.getIdToken();
    const res = await fetch(window.API_BASE + app.fetchPath, {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status} ${res.statusText}\n${body.slice(0, 200)}`);
    }
    const records = await res.json();
    render(app, Array.isArray(records) ? records : []);
  } catch (e) {
    console.error(e);
    $("content").innerHTML = `<div class="state error">読み込みエラー<br>${escapeHtml(e.message)}</div>`;
  }
}

// ───────── 描画 ─────────
function fmtJpy(n) { return "¥" + Math.round(n).toLocaleString(); }
function fmtUsd(n) { return "$" + (n < 0.01 ? n.toFixed(5) : n < 1 ? n.toFixed(4) : n.toFixed(2)); }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(app, records) {
  const totalCount = records.length;
  const totalJpy = totalCount * app.perCallJpy;
  const totalUsd = totalJpy / USD_TO_JPY;

  // 月別集計
  const byMonth = {};   // "YYYY-MM" → count
  const now = new Date();
  const thisYm = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  for (const r of records) {
    const d = r[app.dateField] ? new Date(r[app.dateField]) : null;
    if (!d || isNaN(d)) continue;
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    byMonth[ym] = (byMonth[ym] || 0) + 1;
  }
  const thisMonthCount = byMonth[thisYm] || 0;
  const thisMonthJpy = thisMonthCount * app.perCallJpy;

  // 最近6ヶ月のリスト（多い順ではなく時系列で）
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    months.push({ ym, count: byMonth[ym] || 0 });
  }
  const maxCount = Math.max(...months.map(m => m.count), 1);

  const monthHtml = months.map(m => {
    const cost = m.count * app.perCallJpy;
    const w = (m.count / maxCount) * 100;
    return `<div class="month-row">
      <div class="month-label">${m.ym}</div>
      <div class="month-bar"><div class="month-bar-fill" style="width:${w}%"></div></div>
      <div class="month-cost">${fmtJpy(cost)}</div>
      <div class="month-count">${m.count}件</div>
    </div>`;
  }).join("");

  const bd = app.perCallBreakdown;
  const inUsd = (bd.inputTokens * bd.inPriceUsdPerM) / 1_000_000;
  const outUsd = (bd.outputTokens * bd.outPriceUsdPerM) / 1_000_000;
  const perCallUsd = inUsd + outUsd;

  $("content").innerHTML = `
    <div class="cost-hero">
      <div class="cost-hero-label">累積コスト</div>
      <div class="cost-hero-value">${fmtJpy(totalJpy)}</div>
      <div class="cost-hero-usd">${fmtUsd(totalUsd)}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">読取総数</div>
        <div class="stat-value">${totalCount.toLocaleString()}<span class="stat-unit">${app.unitName}</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">1${app.unitName}平均</div>
        <div class="stat-value">${fmtJpy(app.perCallJpy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今月</div>
        <div class="stat-value">${fmtJpy(thisMonthJpy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今月の件数</div>
        <div class="stat-value">${thisMonthCount}<span class="stat-unit">${app.unitName}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">月別推移（直近6ヶ月）</div>
      ${monthHtml}
    </div>

    <div class="section">
      <div class="section-title">1${app.unitName}あたりの内訳</div>
      <div class="breakdown">
        モデル: <strong>${bd.model}</strong><br>
        入力: <code>${bd.inputTokens.toLocaleString()} tokens</code> × <code>$${bd.inPriceUsdPerM}/M</code> = ${fmtUsd(inUsd)}<br>
        出力: <code>${bd.outputTokens.toLocaleString()} tokens</code> × <code>$${bd.outPriceUsdPerM}/M</code> = ${fmtUsd(outUsd)}<br>
        合計: <strong>${fmtUsd(perCallUsd)}</strong> ≒ <strong>${fmtJpy(perCallUsd * USD_TO_JPY)}</strong>
      </div>
    </div>

    <div class="note">
      <strong>注意</strong>：これは概算値。実際のトークン数は画像サイズや内容で変動するので、厳密な課金額は GCP Billing で確認してください：<br>
      <a href="https://console.cloud.google.com/billing/01DA00-93CCBF-AB55B7/reports?project=static-epigram-496002-v8" target="_blank" style="color:var(--accent);font-weight:700;text-decoration:none;">課金レポートを開く →</a>
    </div>
  `;
}

// ───────── 更新ボタン ─────────
$("refreshBtn").addEventListener("click", () => {
  if (activeAppId) loadApp(activeAppId);
});
</script>
</body>
</html>
