<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奥行き">
<link rel="apple-touch-icon" href="/icon.png">
<title>奥行きビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #4f46e5; --danger: #c0392b;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; }
.pill { padding: 8px 15px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; text-decoration: none; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }

.wrap { padding: 16px 16px 40px; max-width: 720px; margin: 0 auto; }
.title { font-size: 24px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 2px; margin-bottom: 16px; }

.upload { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 18px; border-radius: 18px; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); }
.upload:active { transform: scale(0.99); }
.upload.busy { pointer-events: none; opacity: 0.6; }
#file { display: none; }

.progress { display: none; margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.progress.show { display: block; }
.p-label { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
.p-label .sec { color: var(--text2); font-variant-numeric: tabular-nums; }
.p-track { margin-top: 10px; height: 6px; border-radius: 3px; background: rgba(66,69,94,0.12); overflow: hidden; }
.p-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.p-fill.indet { width: 35%; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
.p-err { color: var(--danger); font-size: 12px; font-weight: 700; margin-top: 8px; white-space: pre-wrap; }

.sec-title { font-size: 13px; font-weight: 800; color: var(--text2); margin: 26px 2px 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { position: relative; border-radius: 14px; overflow: hidden; background: #cfd2dc; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); }
.card a { display: block; aspect-ratio: 3 / 4; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .more { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(0,0,0,0.38); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.card .detail { display: none; padding: 8px 10px 10px; background: var(--bg); font-size: 11px; color: var(--text2); font-weight: 600; }
.card.open .detail { display: block; }
.card .detail .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.card .detail .row { display: flex; gap: 6px; margin-top: 8px; }
.card .detail button { flex: 1; padding: 7px 0; border-radius: 10px; border: none; font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; background: var(--bg); box-shadow: 3px 3px 7px var(--sd), -3px -3px 7px var(--sl); color: var(--text); }
.card .detail button.del { color: var(--danger); }
.empty { font-size: 13px; color: var(--text3); font-weight: 600; text-align: center; padding: 30px 0; }

.toast { display: none; position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #42455e; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 500; max-width: 90vw; }
.toast.err { background: var(--danger); }
#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
</style>
</head>
<body>
<div id="signinOverlay">
  <div style="font-size:24px;font-weight:800;">奥行きビューア</div>
  <a class="pill" href="/" style="text-decoration:none;">トップに戻る</a>
  <div id="signinErr" style="font-size:11px;color:#b04040;font-family:monospace;"></div>
</div>

<div id="app" style="display:none;">
  <div class="bar">
    <a class="pill" href="/"><span class="icon">arrow_back</span> トップ</a>
  </div>
  <div class="wrap">
    <div class="title">奥行きビューア</div>
    <div class="subtitle">写真を選ぶと、傾けると奥行きが出るページを作ります</div>

    <button class="upload" id="pick"><span class="icon">add_photo_alternate</span>写真を選ぶ</button>
    <input type="file" id="file" accept="image/*">

    <div class="progress" id="progress">
      <div class="p-label"><span id="pText"></span><span class="sec" id="pSec"></span></div>
      <div class="p-track"><div class="p-fill" id="pFill"></div></div>
      <div class="p-err" id="pErr"></div>
    </div>

    <div class="sec-title">作品</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script type="module">
import { initAuthBoot, api, idToken } from "/api-auth.js";

const $ = (id) => document.getElementById(id);
const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
const LONG_SIDE = 1600;
let works = [];

let _tt = null;
function toast(msg, isErr = false) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!isErr);
  t.style.display = "block"; clearTimeout(_tt);
  _tt = setTimeout(() => { t.style.display = "none"; }, isErr ? 4500 : 1800);
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ── 進捗表示 ──
let secTimer = null;
function progress(text, pct, { indet = false, elapsed = false } = {}) {
  $("progress").classList.add("show");
  $("pErr").textContent = "";
  $("pText").textContent = text;
  const f = $("pFill");
  f.classList.toggle("indet", indet);
  f.style.width = indet ? "" : `${Math.round(pct * 100)}%`;
  clearInterval(secTimer); $("pSec").textContent = "";
  if (elapsed) {
    const t0 = Date.now();
    secTimer = setInterval(() => { $("pSec").textContent = `${Math.floor((Date.now() - t0) / 1000)} 秒`; }, 250);
  }
}
function progressError(msg) {
  clearInterval(secTimer);
  $("pFill").classList.remove("indet");
  $("pErr").textContent = msg;
  $("pick").classList.remove("busy");
}

// ── 画像 → 長辺 1600px の JPEG (q0.9)。HEIC も EXIF の向きもブラウザに任せてここで片付ける ──
async function decode(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch {
    // 古い Safari など createImageBitmap が HEIC / オプションに未対応のとき。<img> は向きを反映して描く
    return await new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("この画像は読み込めませんでした")); };
      img.src = url;
    });
  }
}
async function toJpeg(file) {
  const src = await decode(file);
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const r = Math.min(1, LONG_SIDE / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * r); c.height = Math.round(h * r);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  src.close?.();
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
  if (!blob) throw new Error("JPEG への変換に失敗しました");
  return blob;
}
const blobToBase64 = (blob) => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(String(fr.result).split(",")[1]);
  fr.onerror = () => reject(fr.error);
  fr.readAsDataURL(blob);
});

// 送信は XHR (fetch だと送信の進捗が取れない)。送り終わったら推論待ちに切り替える
function postWithProgress(body, token) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", API_BASE + "/api/depth");
    x.setRequestHeader("content-type", "application/json");
    if (token) x.setRequestHeader("Authorization", "Bearer " + token);
    x.upload.onprogress = (e) => { if (e.lengthComputable) progress("送信中", e.loaded / e.total); };
    x.upload.onload = () => progress("奥行きを計算中", 0, { indet: true, elapsed: true });
    x.onload = () => {
      let j = null; try { j = JSON.parse(x.responseText); } catch {}
      if (x.status >= 200 && x.status < 300 && j?.id) resolve(j);
      else reject(new Error(j?.error || `HTTP ${x.status}`));
    };
    x.onerror = () => reject(new Error("通信に失敗しました"));
    x.send(body);
  });
}

async function upload(file) {
  $("pick").classList.add("busy");
  try {
    progress("写真を読み込み中", 0, { indet: true });
    const jpeg = await toJpeg(file);
    const body = JSON.stringify({ image: await blobToBase64(jpeg), fileName: file.name || "" });
    progress("送信中", 0);
    const res = await postWithProgress(body, await idToken());
    progress("できました", 1);
    location.href = `/depth/v/${res.id}`;
  } catch (e) {
    progressError(e.message);
  }
}

// ── 一覧 ──
function fmtDate(s) {
  const d = new Date(s);
  return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function render() {
  const g = $("grid");
  if (!works.length) { g.innerHTML = `<div class="empty">まだありません</div>`; return; }
  g.innerHTML = works.map((w) => `
    <div class="card" data-id="${w.id}">
      <a href="/depth/v/${w.id}"><img loading="lazy" src="${API_BASE}/depth/v/${w.id}/thumb.jpg" alt=""></a>
      <button class="more" data-act="toggle"><span class="icon">more_horiz</span></button>
      <div class="detail">
        <div class="name">${escapeHtml(w.file_name || "(名前なし)")}</div>
        <div>${fmtDate(w.created_at)} ・ ${w.width}×${w.height}</div>
        <div class="row">
          <button data-act="copy">URLをコピー</button>
          <button class="del" data-act="delete">削除</button>
        </div>
      </div>
    </div>`).join("");
}
async function load() {
  try { works = await api("GET", "/api/depth"); render(); }
  catch (e) { toast(e.message, true); }
}

$("grid").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const card = btn.closest(".card"), id = card.dataset.id;
  const act = btn.dataset.act;
  if (act === "toggle") { card.classList.toggle("open"); return; }
  if (act === "copy") {
    const url = `${location.origin}/depth/v/${id}`;
    try { await navigator.clipboard.writeText(url); toast("URLをコピーしました"); }
    catch { prompt("URL", url); }
    return;
  }
  if (act === "delete") {
    if (!confirm("この作品を削除しますか？送ったURLも見られなくなります")) return;
    try {
      await api("DELETE", `/api/depth/${id}`);
      works = works.filter((w) => w.id !== id); render(); toast("削除しました");
    } catch (err) { toast(err.message, true); }
  }
});

$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => {
  const f = e.target.files?.[0];
  e.target.value = "";
  if (f) upload(f);
});

// ビューアから「戻る」で bfcache から復帰したとき、処理中のままの表示を戻して一覧を取り直す
window.addEventListener("pageshow", (e) => {
  if (!e.persisted) return;
  clearInterval(secTimer);
  $("pick").classList.remove("busy");
  $("progress").classList.remove("show");
  load();
});

initAuthBoot({
  returnPath: "/depth/",
  onReady: () => { $("app").style.display = ""; load(); },
});
</script>
</body>
</html>
