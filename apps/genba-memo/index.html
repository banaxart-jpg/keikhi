<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="現場メモ">
<title>現場メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #b08968; --accent2: #c4a18a;
  --accent-glow: rgba(176,137,104,0.32);
  --danger: #b04040;
}
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 10px; gap: 8px; }
.title { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 9px 14px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: 'Outfit', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

/* 現場タブ (kaimono/task と同じパターン、MRU 順) */
.tabs { display: flex; gap: 8px; padding: 4px 18px 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: 'Outfit', sans-serif; transition: all 200ms ease; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px var(--accent-glow), -3px -3px 10px var(--sl); }

/* 日付ナビ (前日 / 今日ラベル / 翌日) */
.date-bar { display: flex; align-items: center; padding: 4px 14px 12px; gap: 8px; }
.date-nav { width: 36px; height: 36px; border-radius: 18px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); color: var(--text2); cursor: pointer; font-family: inherit; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.date-nav:active { box-shadow: inset 3px 3px 8px var(--sd); transform: scale(0.95); }
.date-nav:disabled { opacity: 0.35; cursor: default; }
.date-lbl { flex: 1; text-align: center; font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: 0.02em; }
.date-lbl .sub { font-size: 10px; font-weight: 700; color: var(--text2); margin-left: 8px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); box-shadow: inset 2px 2px 5px var(--sd); }
.date-lbl .sub.today { color: var(--accent); }
.today-btn { padding: 7px 13px; border-radius: 16px; font-size: 11px; font-weight: 800; border: none; cursor: pointer; font-family: inherit; color: var(--accent); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); flex-shrink: 0; }
.today-btn:active { box-shadow: inset 2px 2px 6px var(--sd); transform: scale(0.96); }

/* メイン: 1枚のテキストエリア。書いたら debounce 1s で auto save */
.wrap { padding: 8px 16px 100px; }
.empty-state { text-align: center; padding: 60px 24px; color: var(--text3); font-size: 13px; font-weight: 600; line-height: 1.7; }
.empty-state a { color: var(--accent); font-weight: 800; text-decoration: none; }
.editor-card { background: var(--bg); border-radius: 18px; padding: 16px; box-shadow: 6px 6px 16px var(--sd), -5px -5px 14px var(--sl); }
.editor-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text2); font-weight: 700; margin-bottom: 8px; }
.editor-meta .lhs { display: inline-flex; align-items: center; gap: 6px; }
.editor-meta .rhs { display: inline-flex; align-items: center; gap: 5px; }
.editor-meta .status { font-size: 10px; }
.status.dirty { color: var(--accent); }
.status.saved { color: var(--text3); }
.status.error { color: var(--danger); }
.memo-area {
  width: 100%; min-height: 220px;
  border: none; outline: none; resize: vertical;
  font-family: 'Outfit', -apple-system, sans-serif; font-size: 15px; line-height: 1.7; color: var(--text);
  background: var(--bg2); border-radius: 12px; padding: 14px;
  box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl);
}
.memo-area::placeholder { color: var(--text3); font-style: italic; }
.memo-area.readonly { background: var(--bg3); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); opacity: 0.92; cursor: default; min-height: 80px; }
.memo-area.readonly:empty::before { content: "(まだ書かれてません)"; color: var(--text3); font-style: italic; }
.editor-card + .editor-card { margin-top: 14px; }
.editor-card.mine .editor-meta .lhs { color: var(--accent); }
.editor-card.theirs .editor-meta .lhs { color: var(--text2); }
.author-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); font-size: 10px; font-weight: 800; }
.author-chip.natori { background: rgba(121,134,203,0.18); color: #4a5499; }
.author-chip.konishi { background: rgba(176,137,104,0.22); color: #7a5c3d; }

/* 過去ログ折りたたみ */
.history { margin-top: 18px; background: var(--bg); border-radius: 16px; box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); overflow: hidden; }
.history-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; font-size: 12px; font-weight: 800; color: var(--text2); }
.history-h .chev { transition: transform 200ms ease; }
.history.open .history-h .chev { transform: rotate(180deg); }
.history-body { display: none; padding: 4px 4px 8px; }
.history.open .history-body { display: block; animation: fade-in 200ms ease-out; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.hist-row { padding: 10px 12px; margin: 0 8px 6px; background: var(--bg2); border-radius: 10px; cursor: pointer; transition: background 150ms ease; }
.hist-row:active { background: var(--bg3); transform: scale(0.99); }
.hist-row-head { font-size: 12px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: baseline; }
.hist-row-head .date { letter-spacing: 0.02em; }
.hist-row-head .len { font-size: 10px; color: var(--text3); font-weight: 700; }
.hist-row .preview { font-size: 11px; color: var(--text2); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4; }
.hist-empty { padding: 24px; text-align: center; color: var(--text3); font-size: 11px; }

#signinOverlay { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay.show { display: flex; }
.signin-err { font-size: 11px; color: var(--danger); max-width: 340px; white-space: pre-wrap; font-family: monospace; word-break: break-word; }
.loading { text-align: center; padding: 30px; color: var(--text3); font-size: 12px; font-weight: 700; }
</style>
</head>
<body>

<div id="signinOverlay">
  <div class="pill">サインインしてください</div>
  <a class="pill" href="/">ランチャーへ戻る</a>
  <div class="signin-err" id="signinErr"></div>
</div>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, watch, onMounted, onBeforeUnmount, nextTick } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, onSnapshot, query, where, orderBy, limit,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { gateInternal } from "/internal-gate.js";

const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
const MEMOS = "genba_memos";
const SAVE_DEBOUNCE_MS = 800;
const HISTORY_LIMIT = 60;   // 過去 60 件まで読み込み

// 著者キー: 名取は 2 メアド持ち、両方 "natori" に正規化
const AUTHOR_KEY = {
  "info@banax.tokyo": "natori",
  "banaxart@gmail.com": "natori",
  "konishi0221@gmail.com": "konishi",
};
const AUTHOR_LABEL = { natori: "名取", konishi: "小西" };
const OTHER_KEY = { natori: "konishi", konishi: "natori" };

// JST で YYYY-MM-DD を返す
function todayJst() {
  const now = new Date();
  const jst = new Date(now.getTime() + (now.getTimezoneOffset() + 9 * 60) * 60 * 1000);
  return jst.toISOString().slice(0, 10);
}
function shiftDateIso(iso, days) {
  const d = new Date(iso + "T12:00:00Z"); // 中央寄せして TZ ぶれ回避
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function dateLabel(iso) {
  // "M/D (曜)" 形式
  const d = new Date(iso + "T12:00:00Z");
  const wd = ["日", "月", "火", "水", "木", "金", "土"][d.getUTCDay()];
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()} (${wd})`;
}
function memoDocId(site, date) {
  return `${site}__${date}`;
}

const TEMPLATE = `
<div v-if="signedIn">
  <div class="header-fix">
    <div class="top">
      <a class="pill" href="/"><span class="icon">arrow_back</span> 戻る</a>
      <span class="title"><span class="icon">edit_note</span> 現場メモ</span>
      <button class="pill" @click="doSignOut" title="サインアウト"><span class="icon">logout</span></button>
    </div>
    <div v-if="sortedSites.length" class="tabs">
      <button v-for="s in sortedSites" :key="s" class="tab" :class="{ on: activeSite === s }" @click="selectSite(s)">{{ s }}</button>
    </div>
  </div>

  <div v-if="!ready" class="loading">読み込み中…</div>

  <template v-else-if="!sortedSites.length">
    <div class="empty-state">
      現場がまだ登録されていません<br>
      <a href="/genba/?return=/genba-memo/">現場アプリで追加 →</a>
    </div>
  </template>

  <template v-else-if="activeSite">
    <div class="date-bar">
      <button class="date-nav" @click="shiftDate(-1)" title="前日"><span class="icon">chevron_left</span></button>
      <div class="date-lbl">
        {{ dateLabelOf(currentDate) }}
        <span class="sub" :class="{ today: isToday }">{{ isToday ? '今日' : (isYesterday ? '昨日' : '過去') }}</span>
      </div>
      <button class="date-nav" @click="shiftDate(1)" :disabled="isToday" title="翌日"><span class="icon">chevron_right</span></button>
      <button v-if="!isToday" class="today-btn" @click="goToday">今日へ</button>
    </div>

    <div class="wrap">
      <!-- 自分のメモ (編集可) -->
      <div class="editor-card mine">
        <div class="editor-meta">
          <span class="lhs"><span class="author-chip" :class="myKey">{{ myLabel }}</span> のメモ</span>
          <span class="rhs">
            <span class="status" :class="statusClass">{{ statusLabel }}</span>
          </span>
        </div>
        <textarea class="memo-area"
                  v-model="myContent"
                  :placeholder="placeholderText"
                  @input="onInput"
                  ref="memoEl"></textarea>
      </div>

      <!-- 相手のメモ (read-only、リアルタイム同期) -->
      <div class="editor-card theirs">
        <div class="editor-meta">
          <span class="lhs"><span class="author-chip" :class="theirKey">{{ theirLabel }}</span> のメモ</span>
          <span class="rhs"><span class="status saved">{{ theirContent ? '受信中' : '' }}</span></span>
        </div>
        <div class="memo-area readonly">{{ theirContent }}</div>
      </div>

      <div class="history" :class="{ open: historyOpen }">
        <div class="history-h" @click="historyOpen = !historyOpen">
          <span><span class="icon">history</span> 過去のメモ ({{ pastMemos.length }})</span>
          <span class="icon chev">expand_more</span>
        </div>
        <div class="history-body">
          <div v-if="!pastMemos.length" class="hist-empty">過去のメモはまだありません</div>
          <div v-for="m in pastMemos" :key="m.id" class="hist-row" @click="jumpTo(m.date)">
            <div class="hist-row-head">
              <span class="date">{{ dateLabelOf(m.date) }}</span>
              <span class="len">{{ previewLenOf(m) }} 字</span>
            </div>
            <div class="preview">{{ previewTextOf(m) }}</div>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const signedIn = ref(false);
    const ready = ref(false);
    const sites = ref([]);
    const activeSite = ref("");
    const currentDate = ref(todayJst());
    const myContent = ref("");      // 自分のテキスト (v-model)
    const status = ref("saved");   // "dirty" | "saving" | "saved" | "error"
    const errorMsg = ref("");
    const historyOpen = ref(false);
    const memoEl = ref(null);
    const memos = ref([]);   // 全現場・全日付の memo (snapshot で受信)
    const myKey = ref("natori");  // boot で確定 (natori/konishi)
    const theirKey = computed(() => OTHER_KEY[myKey.value]);
    const myLabel = computed(() => AUTHOR_LABEL[myKey.value]);
    const theirLabel = computed(() => AUTHOR_LABEL[theirKey.value]);

    let fbAuth = null;
    let db = null;
    let user = null;
    let unsubMemos = null;
    let saveTimer = null;
    let suppressNextSave = false;   // onSnapshot で content 更新する時、その後の watch から save しないように

    // ─── MRU (現場タブの並び) ───
    const mruKey = computed(() => `genba_memo_mru_${(user?.email || "anon").toLowerCase()}`);
    const mru = ref({});
    function loadMru() {
      try { mru.value = JSON.parse(localStorage.getItem(mruKey.value) || "{}") || {}; }
      catch (_) { mru.value = {}; }
    }
    function bumpMru(s) {
      mru.value = { ...mru.value, [s]: Date.now() };
      try { localStorage.setItem(mruKey.value, JSON.stringify(mru.value)); } catch (_) {}
    }
    const sortedSites = computed(() => {
      const idx = new Map(sites.value.map((s, i) => [s, i]));
      return sites.value.slice().sort((a, b) => {
        const ra = mru.value[a] || 0, rb = mru.value[b] || 0;
        if (ra !== rb) return rb - ra;
        return idx.get(a) - idx.get(b);
      });
    });

    function selectSite(s) {
      activeSite.value = s;
      bumpMru(s);
      // 現場を切り替えたら今日にリセット (= まっさら start の挙動を維持)
      currentDate.value = todayJst();
    }

    // ─── 日付ラベル ───
    const isToday = computed(() => currentDate.value === todayJst());
    const isYesterday = computed(() => currentDate.value === shiftDateIso(todayJst(), -1));
    function dateLabelOf(iso) { return dateLabel(iso); }
    function shiftDate(days) {
      currentDate.value = shiftDateIso(currentDate.value, days);
    }
    function goToday() { currentDate.value = todayJst(); }
    function jumpTo(iso) {
      currentDate.value = iso;
      historyOpen.value = false;
      nextTick(() => memoEl.value?.focus());
    }

    // ─── status 表示 ───
    const statusClass = computed(() => ({
      dirty: status.value === "dirty" || status.value === "saving",
      saved: status.value === "saved",
      error: status.value === "error",
    }));
    const statusLabel = computed(() => {
      if (status.value === "error") return "保存失敗: " + errorMsg.value;
      if (status.value === "saving") return "保存中…";
      if (status.value === "dirty") return "未保存";
      return "保存済み";
    });

    const placeholderText = computed(() =>
      isToday.value ? "ここに今日のメモを書く…" : `${dateLabelOf(currentDate.value)} のメモ`
    );

    // ─── 表示中のメモ ↔ Firestore の sync ───
    //   activeSite or currentDate が変わったら memos.value から該当ドキュメント拾ってきて
    //   content にセット。ユーザーがタイプしたら debounce で save。
    const currentMemo = computed(() => {
      if (!activeSite.value || !currentDate.value) return null;
      const id = memoDocId(activeSite.value, currentDate.value);
      return memos.value.find((m) => m.id === id) || null;
    });

    // 自分・相手の content をドキュメントから取り出す。
    // 旧形式 (m.content) との後方互換: フィールド未分離なら "natori" 側に詰めとく。
    function pickContent(m, key) {
      if (!m) return "";
      if (m[key]?.content != null) return m[key].content;
      if (key === "natori" && typeof m.content === "string") return m.content;
      return "";
    }
    const theirContent = computed(() => pickContent(currentMemo.value, theirKey.value));

    watch([activeSite, currentDate, myKey], () => {
      // 切替え時はサーバ側の最新コンテンツに揃える (まっさら start = 該当日の doc が無ければ空文字)
      const m = currentMemo.value;
      suppressNextSave = true;
      myContent.value = pickContent(m, myKey.value);
      status.value = "saved";
      errorMsg.value = "";
    });

    // currentMemo が realtime 更新で変わった時 (他デバイスからの書込み)、
    // 自分側の content を上書き。ただし自分が今編集中の保留分は保護したい:
    //   → 自分の save 直後の echo は status === "saving" 中なので、その間は受けない。
    //   theirContent は computed なので別途 watch 不要、自動反映。
    watch(currentMemo, (m) => {
      if (!m) return;
      if (status.value === "saving" || status.value === "dirty") return;
      const incoming = pickContent(m, myKey.value);
      if (incoming !== myContent.value) {
        suppressNextSave = true;
        myContent.value = incoming;
      }
    });

    function onInput() {
      if (suppressNextSave) { suppressNextSave = false; return; }
      status.value = "dirty";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCurrent, SAVE_DEBOUNCE_MS);
    }

    async function saveCurrent() {
      if (!db || !activeSite.value || !currentDate.value) return;
      const id = memoDocId(activeSite.value, currentDate.value);
      const text = myContent.value || "";
      const key = myKey.value;   // natori | konishi
      status.value = "saving";
      try {
        // merge:true で自分のサブツリーだけ更新 → 相手の content は触らない
        await setDoc(doc(db, MEMOS, id), {
          site: activeSite.value,
          date: currentDate.value,
          [key]: {
            content: text,
            updatedAt: serverTimestamp(),
            updatedBy: (user?.email || "").toLowerCase(),
          },
        }, { merge: true });
        status.value = "saved";
      } catch (e) {
        status.value = "error";
        errorMsg.value = e?.message || String(e);
      }
    }

    // ─── 過去メモ一覧 (現在の現場のみ、今日以外を新しい順) ───
    const pastMemos = computed(() => {
      const today = todayJst();
      return memos.value
        .filter((m) => m.site === activeSite.value && m.date !== today)
        .sort((a, b) => (a.date < b.date ? 1 : -1));
    });
    // 過去リストプレビュー: 両者のメモを「名取: ...  小西: ...」形式で連結
    function previewTextOf(m) {
      const n = pickContent(m, "natori");
      const k = pickContent(m, "konishi");
      const parts = [];
      if (n) parts.push(`名取: ${n}`);
      if (k) parts.push(`小西: ${k}`);
      return parts.join("  /  ") || "(空)";
    }
    function previewLenOf(m) {
      return pickContent(m, "natori").length + pickContent(m, "konishi").length;
    }

    // ─── auth + データ初期化 ───
    function doSignOut() {
      if (fbAuth) signOut(fbAuth).then(() => location.reload());
    }

    async function boot(u) {
      user = u;
      myKey.value = AUTHOR_KEY[(u.email || "").toLowerCase()] || "natori";
      loadMru();
      signedIn.value = true;
      // 現場一覧 (失敗しても続行)
      try {
        const token = await u.getIdToken();
        const r = await fetch(API_BASE + "/api/sites", {
          headers: { authorization: "Bearer " + token },
        });
        if (r.ok) {
          const sj = await r.json();
          sites.value = (Array.isArray(sj) ? sj : []).map((s) => s.name).filter(Boolean);
        }
      } catch (e) { console.warn("[memo] sites fetch failed", e); }
      // 初期 active site: MRU 最上位 or sortedSites[0]
      if (!activeSite.value && sortedSites.value.length) {
        activeSite.value = sortedSites.value[0];
      }
      // メモ全件購読 (社内 3 人だけなので件数少なめ。HISTORY_LIMIT で念のため絞る)
      try {
        const q = query(collection(db, MEMOS), orderBy("date", "desc"), limit(HISTORY_LIMIT));
        unsubMemos = onSnapshot(q, (snap) => {
          memos.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          // 初回受信時、表示中の日付の自分側 content を埋める
          const m = currentMemo.value;
          if (m && status.value === "saved") {
            suppressNextSave = true;
            myContent.value = pickContent(m, myKey.value);
          }
        }, (e) => { console.warn("[memo] snapshot failed", e); });
      } catch (e) { console.warn("[memo] subscribe failed", e); }
      ready.value = true;
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const fbApp = initializeApp(cfg);
        fbAuth = getAuth(fbApp);
        db = getFirestore(fbApp);
        await setPersistence(fbAuth, browserLocalPersistence);
        gateInternal(fbAuth);
        let entered = false;
        onAuthStateChanged(fbAuth, async (u) => {
          if (u) {
            if (entered) return;
            entered = true;
            sessionStorage.removeItem("authBounce");
            try { await boot(u); }
            catch (e) {
              console.error("[memo] boot failed:", e);
              document.getElementById("signinErr").textContent = "起動失敗: " + (e?.message || e);
              document.getElementById("signinOverlay").classList.add("show");
            }
            return;
          }
          if (sessionStorage.getItem("authBounce")) {
            document.getElementById("signinOverlay").classList.add("show");
            return;
          }
          sessionStorage.setItem("authBounce", "1");
          location.replace("/?next=" + encodeURIComponent("/genba-memo/"));
        });
      } catch (e) {
        document.getElementById("signinOverlay").classList.add("show");
        document.getElementById("signinErr").textContent = "init失敗: " + (e?.message || e);
      }

      // 日付切替 (例: 真夜中をまたぐ) でラベルがズレないよう 5 分毎に再評価
      const tick = setInterval(() => {
        // currentDate.value を再代入することで isToday computed が更新される
        // (実際には何もしない、reactive trigger のため)
        const cd = currentDate.value;
        currentDate.value = "";
        currentDate.value = cd;
      }, 5 * 60 * 1000);
      onBeforeUnmount(() => clearInterval(tick));
    });

    onBeforeUnmount(() => {
      if (unsubMemos) unsubMemos();
      clearTimeout(saveTimer);
    });

    return {
      signedIn, ready, sites, sortedSites, activeSite, currentDate,
      myContent, theirContent, myKey, theirKey, myLabel, theirLabel,
      status, errorMsg, historyOpen, memoEl,
      isToday, isYesterday, dateLabelOf,
      placeholderText, statusClass, statusLabel,
      selectSite, shiftDate, goToday, jumpTo, onInput,
      pastMemos, previewTextOf, previewLenOf,
      doSignOut,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
