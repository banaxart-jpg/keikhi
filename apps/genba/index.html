<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="現場">
<title>現場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #0891b2; --accent2: #06b6d4; --accent-glow: rgba(8,145,178,0.32);
  --danger: #b04040;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

#signinOverlay { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay.show { display: flex; }
.pill { padding: 14px 28px; border-radius: 30px; background: var(--bg); box-shadow: 6px 6px 16px var(--sd), -6px -6px 16px var(--sl); font-weight: 700; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; color: var(--text); }
.signin-err { font-size: 11px; color: #b04040; max-width: 340px; white-space: pre-wrap; font-family: monospace; word-break: break-word; }

.top { padding: 54px 18px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.back, .add-pill { font-size: 13px; font-weight: 800; color: var(--text2); background: var(--bg); border: none; cursor: pointer; font-family: 'Outfit', sans-serif; padding: 9px 14px; border-radius: 24px; box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.back:active, .add-pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.96); }
.add-pill { color: var(--accent); font-weight: 800; }
.title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

.return-pill { display: inline-flex; align-items: center; gap: 5px; margin: 4px 18px 0; padding: 6px 12px; border-radius: 18px; background: var(--bg); box-shadow: inset 3px 3px 7px var(--sd), inset -3px -3px 7px var(--sl); font-size: 11px; font-weight: 700; color: var(--text2); text-decoration: none; }

.list { padding: 14px 16px 130px; display: flex; flex-direction: column; gap: 10px; }
.empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; font-weight: 600; }
.loading { text-align: center; padding: 30px; color: var(--text3); font-size: 12px; font-weight: 600; }

.card { background: var(--bg); border-radius: 16px; box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); transition: box-shadow 200ms ease; overflow: hidden; }
.card.open { box-shadow: 9px 9px 20px var(--sd), -6px -6px 14px var(--sl); }
.row { padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.row .icon-lead { color: var(--accent); font-size: 22px; vertical-align: -0.22em; }
.name { flex: 1; font-size: 15px; font-weight: 700; min-width: 0; word-break: break-word; }
.chev { color: var(--text3); transition: transform 200ms ease; }
.card.open .chev { transform: rotate(180deg); }

.detail { padding: 4px 16px 14px; border-top: 1px solid rgba(168,172,192,0.18); display: flex; flex-direction: column; gap: 10px; animation: slide-down 200ms ease-out; }
@keyframes slide-down { from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; } to { opacity: 1; max-height: 400px; padding-top: 12px; padding-bottom: 14px; } }
.field-row { font-size: 12px; color: var(--text2); display: flex; gap: 6px; align-items: baseline; }
.field-row .lbl { font-weight: 800; letter-spacing: 0.04em; color: var(--text2); flex-shrink: 0; min-width: 70px; display: flex; align-items: center; gap: 4px; }
.field-row .val { color: var(--text); font-weight: 600; word-break: break-word; flex: 1; }
.field-row .val.empty-val { color: var(--text3); font-style: italic; }
.actions { display: flex; gap: 8px; margin-top: 4px; }
.act-btn { padding: 8px 14px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12px; color: var(--text2); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); }
.act-btn:active { box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl); transform: scale(0.96); }
.act-btn.del { color: var(--danger); }
.act-btn.edit { color: var(--accent); }

/* モーダル: 下から sheet */
.modal { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(180,184,205,0); visibility: hidden; opacity: 0; pointer-events: none; z-index: 50; transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 200ms; }
.modal.open { background: rgba(180,184,205,0.42); visibility: visible; opacity: 1; pointer-events: auto; transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 0s; }
.sheet { background: var(--bg); border-radius: 32px 32px 0 0; box-shadow: -2px -10px 35px rgba(148,152,176,0.4); width: 100%; max-width: 480px; padding: 14px 22px 32px; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 200ms cubic-bezier(.2,.8,.2,1); }
.modal.open .sheet { transform: translateY(0); }
.handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(100,104,130,0.22); margin: 0 auto 16px; }
.sheet h3 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 700; letter-spacing: 0.04em; display: flex; align-items: center; gap: 5px; }
.inp { width: 100%; padding: 12px 14px; font-size: 15px; color: var(--text); outline: none; border: none; border-radius: 14px; font-family: 'Outfit', sans-serif; font-weight: 600; background: var(--bg2); box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl); -webkit-appearance: none; appearance: none; }
.inp::placeholder { color: var(--text3); }
textarea.inp { resize: vertical; min-height: 60px; font-family: 'Outfit', sans-serif; }
.save { width: 100%; padding: 16px; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: 800; color: white; font-family: 'Outfit', sans-serif; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 18px var(--accent-glow), -3px -3px 10px var(--sl); margin-top: 8px; transition: opacity 200ms ease; }
.save:active { transform: scale(0.97); }
.save:disabled { opacity: 0.55; cursor: wait; }
.err-msg { color: var(--danger); font-size: 12px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>

<div id="signinOverlay">
  <div class="pill">サインインしてください</div>
  <a class="pill" href="/">ランチャーへ戻る</a>
  <div class="signin-err" id="signinErr"></div>
</div>

<div id="app" style="display:none;">
  <div class="top">
    <a class="back" href="/"><span class="icon">arrow_back</span> 戻る</a>
    <div class="title">現場</div>
    <button class="add-pill" id="addBtn" type="button"><span class="icon">add</span> 追加</button>
  </div>
  <a id="returnPill" class="return-pill" style="display:none;" href="#"><span class="icon">arrow_back</span> <span id="returnLabel"></span></a>

  <div class="list" id="list">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<!-- 追加 / 編集モーダル -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="modalTitle">新規現場</h3>
    <div class="field">
      <label><span class="icon">domain</span> 現場名</label>
      <input class="inp" id="fName" placeholder="例: 西新井焼肉屋" maxlength="80">
    </div>
    <div class="field">
      <label><span class="icon">location_on</span> 住所</label>
      <textarea class="inp" id="fAddress" placeholder="例: 東京都足立区西新井1-2-3" rows="2"></textarea>
    </div>
    <div class="field">
      <label><span class="icon">vpn_key</span> キーボックス</label>
      <input class="inp" id="fKeyBox" placeholder="例: 1234 / 玄関左、暗証4桁">
    </div>
    <button class="save" id="saveBtn" type="button">保存</button>
    <div class="err-msg" id="modalErr"></div>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { gateInternal } from "/internal-gate.js";

const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
const $ = (id) => document.getElementById(id);

// URL パラメータ: ?return=/keihi/&newSite=true で他アプリから誘導され、
// 保存後はその return URL に戻る (?site=<name> を付けて新規追加した現場を教える)
const urlParams = new URLSearchParams(location.search);
const returnTo = urlParams.get("return") || "";
const autoOpenAdd = urlParams.get("newSite") === "true";
// パラメータを履歴から消す (リロード/戻るで毎回モーダル auto-open しないように)
if (returnTo || autoOpenAdd) {
  history.replaceState(null, "", "/genba/");
}

let fbAuth = null;
let sites = [];
let openId = null;
let editingId = null;  // null = 新規モード

function setReturnPill() {
  if (!returnTo || !returnTo.startsWith("/")) return;
  const m = /^\/([^/?]+)/.exec(returnTo);
  const label = m ? m[1] : "戻る";
  $("returnPill").style.display = "inline-flex";
  $("returnPill").href = returnTo;
  $("returnLabel").textContent = `${label} に戻る`;
}

async function api(method, path, body) {
  const headers = { "content-type": "application/json" };
  if (fbAuth?.currentUser) {
    headers.authorization = "Bearer " + (await fbAuth.currentUser.getIdToken());
  }
  const r = await fetch(API_BASE + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch (_) {}
    throw new Error(msg);
  }
  if (r.status === 204) return null;
  return r.json();
}

async function loadSites() {
  try {
    sites = await api("GET", "/api/sites");
    render();
  } catch (e) {
    $("list").innerHTML = `<div class="empty">読み込み失敗: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const list = $("list");
  if (!sites.length) {
    list.innerHTML = `<div class="empty">現場はまだありません<br>右上の「追加」から作成してください</div>`;
    return;
  }
  list.innerHTML = "";
  for (const s of sites) {
    // 注意: id は PostgreSQL BIGSERIAL → pg ライブラリが文字列で返す。
    // 数値化すると行展開 / 編集 / 削除ボタンの id 比較が一致しなくなるので
    // 全て String(...) で揃える。
    const sid = String(s.id);
    const card = document.createElement("div");
    card.className = "card" + (openId === sid ? " open" : "");
    const isOpen = openId === sid;
    card.innerHTML = `
      <div class="row" data-id="${sid}">
        <span class="icon icon-lead">domain</span>
        <div class="name">${escapeHtml(s.name)}</div>
        <span class="icon chev">expand_more</span>
      </div>
      ${isOpen ? `
        <div class="detail">
          <div class="field-row">
            <span class="lbl"><span class="icon">location_on</span> 住所</span>
            <span class="val ${s.address ? "" : "empty-val"}">${s.address ? escapeHtml(s.address) : "未入力"}</span>
          </div>
          <div class="field-row">
            <span class="lbl"><span class="icon">vpn_key</span> キーボックス</span>
            <span class="val ${s.keyBox ? "" : "empty-val"}">${s.keyBox ? escapeHtml(s.keyBox) : "未入力"}</span>
          </div>
          <div class="actions">
            <button class="act-btn edit" data-act="edit" data-id="${sid}">編集</button>
            <button class="act-btn del" data-act="del" data-id="${sid}">削除</button>
          </div>
        </div>
      ` : ""}
    `;
    list.appendChild(card);
  }
}

$("list").addEventListener("click", (e) => {
  const actBtn = e.target.closest("[data-act]");
  if (actBtn) {
    const id = actBtn.dataset.id;   // 文字列のまま
    const s = sites.find((x) => String(x.id) === id);
    if (!s) return;
    if (actBtn.dataset.act === "edit") openEditModal(s);
    if (actBtn.dataset.act === "del") onDelete(s);
    return;
  }
  const row = e.target.closest(".row");
  if (!row) return;
  const id = row.dataset.id;
  openId = openId === id ? null : id;
  render();
});

function openAddModal() {
  editingId = null;
  $("modalTitle").textContent = "新規現場";
  $("fName").value = "";
  $("fAddress").value = "";
  $("fKeyBox").value = "";
  $("modalErr").textContent = "";
  $("modal").classList.add("open");
  setTimeout(() => $("fName").focus(), 220);
}
function openEditModal(s) {
  editingId = s.id;
  $("modalTitle").textContent = "現場を編集";
  $("fName").value = s.name || "";
  $("fAddress").value = s.address || "";
  $("fKeyBox").value = s.keyBox || "";
  $("modalErr").textContent = "";
  $("modal").classList.add("open");
  setTimeout(() => $("fName").focus(), 220);
}
function closeModal() { $("modal").classList.remove("open"); }
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
$("addBtn").addEventListener("click", openAddModal);

$("saveBtn").addEventListener("click", async () => {
  const name = $("fName").value.trim();
  if (!name) { $("modalErr").textContent = "現場名を入力してください"; $("fName").focus(); return; }
  const address = $("fAddress").value.trim();
  const keyBox = $("fKeyBox").value.trim();
  const btn = $("saveBtn");
  btn.disabled = true;
  btn.textContent = "保存中…";
  try {
    let saved;
    if (editingId) {
      saved = await api("PUT", "/api/sites/" + editingId, { name, address, keyBox });
    } else {
      saved = await api("POST", "/api/sites", { name, address, keyBox });
    }
    closeModal();
    // 戻り先指定があれば、新規追加した現場名を ?site= で渡して遷移
    if (returnTo && returnTo.startsWith("/") && !editingId) {
      location.href = returnTo + (returnTo.includes("?") ? "&" : "?") + "site=" + encodeURIComponent(saved.name);
      return;
    }
    await loadSites();
  } catch (e) {
    $("modalErr").textContent = "失敗: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "保存";
  }
});

async function onDelete(s) {
  if (!confirm(`「${s.name}」を削除しますか?\n(過去の取引・経費・タスク等のデータはそのまま残ります)`)) return;
  try {
    await api("DELETE", "/api/sites/" + s.id);
    sites = sites.filter((x) => x.id !== s.id);
    openId = null;
    render();
  } catch (e) {
    alert("削除失敗: " + e.message);
  }
}

// ─── auth boot ───
async function boot() {
  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    cfg.authDomain = location.hostname;
    const app = initializeApp(cfg);
    fbAuth = getAuth(app);
    await setPersistence(fbAuth, browserLocalPersistence);
    gateInternal(fbAuth);
    onAuthStateChanged(fbAuth, async (user) => {
      if (user) {
        $("signinOverlay").classList.remove("show");
        $("app").style.display = "block";
        setReturnPill();
        await loadSites();
        if (autoOpenAdd) openAddModal();
      } else {
        if (sessionStorage.getItem("authBounce")) {
          $("signinOverlay").classList.add("show");
          return;
        }
        sessionStorage.setItem("authBounce", "1");
        location.replace("/?next=" + encodeURIComponent("/genba/" + location.search));
      }
    });
  } catch (e) {
    $("signinOverlay").classList.add("show");
    $("signinErr").textContent = "init失敗: " + (e.message || e);
  }
}
boot();
</script>
</body>
</html>
