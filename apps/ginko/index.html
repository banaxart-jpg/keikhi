<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="銀行">
<link rel="apple-touch-icon" href="/ginko/icon.svg">
<title>銀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #0d9488; --accent2: #14b8a6;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--bg) 86%);
  --in: #16a34a; --out: #dc2626; --warn: #d97706; --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 12px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.summary { padding: 4px 18px 12px; display: flex; gap: 14px; font-size: 12px; color: var(--text2); font-weight: 700; }
.summary .sum-col { display: flex; flex-direction: column; gap: 2px; }
.summary .sum-lbl { font-size: 10px; letter-spacing: 0.04em; }
.summary .sum-val { font-size: 16px; font-weight: 800; color: var(--text); }
.summary .sum-val.in { color: var(--in); }
.summary .sum-val.out { color: var(--out); }

.send-btn-top { margin: 0 18px 12px; padding: 12px 16px; border-radius: 16px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 5px 5px 12px rgba(13,148,136,0.32), -3px -3px 8px var(--sl); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 36px); }
.send-btn-top:disabled { opacity: 0.5; box-shadow: 3px 3px 8px var(--sd); }
.send-btn-top:active:not(:disabled) { transform: scale(0.98); }
.send-btn-top .icon { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 600; }

/* CSV upload エリア (取り込み前) */
.upload-area { margin: 30px 18px; background: var(--bg); border-radius: 22px; padding: 36px 20px; text-align: center; box-shadow: inset 4px 4px 12px var(--sd), inset -3px -3px 10px var(--sl); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.upload-area .icon-big { font-size: 56px; color: var(--accent); font-variation-settings: 'FILL' 1, 'wght' 400; }
.upload-area .lbl { font-size: 13px; color: var(--text2); font-weight: 700; line-height: 1.6; }
.upload-area .bank-name { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: 0.1em; }
.upload-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 28px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 5px 5px 14px rgba(13,148,136,0.35), -3px -3px 10px var(--sl); font-family: inherit; }
.upload-btn:active { transform: scale(0.97); }
.upload-btn .icon { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 600; }
.upload-hint { font-size: 11px; color: var(--text3); margin-top: 6px; line-height: 1.7; }

/* 行リスト */
.list { padding: 0 14px 30px; display: flex; flex-direction: column; gap: 6px; }
.row { background: var(--bg); border-radius: 14px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); padding: 10px 12px; display: flex; gap: 10px; align-items: center; transition: opacity 200ms ease; }
.row.off { opacity: 0.45; }
.row.unknown { box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl), inset 0 0 0 2px rgba(217,119,6,0.35); }
.check { width: 24px; height: 24px; border-radius: 12px; border: none; cursor: pointer; background: var(--bg); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; flex-shrink: 0; font-family: 'Material Symbols Outlined'; }
.row.on .check { background: var(--accent); color: white; box-shadow: 3px 3px 8px rgba(13,148,136,0.35); }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-top { display: flex; gap: 6px; align-items: baseline; }
.row-date { font-size: 10px; color: var(--text2); font-weight: 700; font-family: ui-monospace, Menlo, monospace; flex-shrink: 0; }
.row-tag { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 6px; letter-spacing: 0.05em; }
.row-tag.in  { background: rgba(22,163,74,0.16); color: var(--in); }
.row-tag.out { background: rgba(220,38,38,0.16); color: var(--out); }
.row-tag.unknown { background: rgba(217,119,6,0.16); color: var(--warn); }
.row-cat { font-size: 11px; color: var(--text); font-weight: 700; }
.row-desc { font-size: 10px; color: var(--text3); font-weight: 600; line-height: 1.4; word-break: break-all; }
.row-amount { font-size: 13px; font-weight: 800; flex-shrink: 0; font-family: ui-monospace, Menlo, monospace; }
.row-amount.in { color: var(--in); }
.row-amount.out { color: var(--out); }

/* エラー / ステータス */
.err { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fde0e0; color: #8a2727; font-size: 12px; font-weight: 600; }
.warn-banner { margin: 0 18px 14px; padding: 10px 14px; border-radius: 14px; background: #fff3d6; color: #7a5b18; font-size: 11px; font-weight: 600; line-height: 1.6; }
.loading { text-align: center; color: var(--text2); font-size: 13px; padding: 40px 0; }
.toast { position: fixed; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: white; padding: 12px 18px; border-radius: 22px; font-size: 13px; font-weight: 700; z-index: 100; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
.bulk-actions { padding: 4px 18px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.bulk-actions .mini { padding: 6px 12px; border-radius: 14px; font-size: 11px; font-weight: 700; border: none; background: var(--bg); color: var(--text2); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); cursor: pointer; font-family: inherit; }
.bulk-actions .mini:active { box-shadow: inset 2px 2px 6px var(--sd); }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const TEMPLATE = `
<div>
  <div class="header-fix">
    <div class="top">
      <span class="title"><span class="icon">account_balance</span> 銀行</span>
      <a class="pill" href="/" style="text-decoration:none; display:inline-block;">← 戻る</a>
    </div>
    <div v-if="rows.length" class="summary">
      <div class="sum-col">
        <div class="sum-lbl">取込</div>
        <div class="sum-val">{{ activeCount }}/{{ rows.length }}件</div>
      </div>
      <div class="sum-col">
        <div class="sum-lbl">入金</div>
        <div class="sum-val in">¥{{ formatYen(activeIn) }}</div>
      </div>
      <div class="sum-col">
        <div class="sum-lbl">出金</div>
        <div class="sum-val out">¥{{ formatYen(activeOut) }}</div>
      </div>
      <div class="sum-col" style="margin-left:auto;">
        <div class="sum-lbl">未分類</div>
        <div class="sum-val">{{ unknownCount }}件</div>
      </div>
    </div>
    <button v-if="rows.length"
            class="send-btn-top"
            :disabled="sending || activeCount === 0"
            @click="confirmSend">
      <span class="icon">cloud_upload</span>
      {{ sending ? '送信中… ' + sendProgress : activeCount + ' 件を取引タブに送信' }}
    </button>
    <div v-if="rows.length" class="bulk-actions">
      <button class="mini" @click="toggleAll(true)">全選択</button>
      <button class="mini" @click="toggleAll(false)">全解除</button>
      <button class="mini" @click="toggleUnknown(false)" v-if="unknownCount">未分類を除外</button>
      <button class="mini" @click="reset">CSVを選び直す</button>
    </div>
  </div>

  <div v-if="err" class="err">{{ err }}</div>

  <div v-if="!rows.length && !parsing" class="upload-area">
    <span class="icon icon-big">upload_file</span>
    <div class="lbl">銀行の取引CSVをアップロード</div>
    <div class="bank-name">PAYPAY BANK</div>
    <label class="upload-btn">
      <span class="icon">attach_file</span>
      CSVを選択
      <input type="file" accept=".csv,text/csv" :disabled="parsing" @change="onUpload" hidden>
    </label>
    <div class="upload-hint">
      PayPay銀行の管理画面から、月単位の取引明細を CSV ダウンロード → ここでアップ。<br>
      自動で「入金/出金」「カテゴリ」を分類して表示します。
    </div>
  </div>

  <div v-if="parsing" class="loading">CSV を解析中…</div>

  <div class="list" v-if="rows.length">
    <div v-for="(r, i) in rows" :key="i" class="row"
         :class="{ on: r.include, off: !r.include, unknown: r.subcategory === '未分類' }"
         @click="r.include = !r.include">
      <button class="check" @click.stop="r.include = !r.include">
        <span v-if="r.include">check</span>
      </button>
      <div class="row-body">
        <div class="row-top">
          <span class="row-date">{{ r.date.slice(5) }}</span>
          <span class="row-tag" :class="r.type === '収入' ? 'in' : 'out'">{{ r.type === '収入' ? '入' : '出' }}</span>
          <span class="row-tag unknown" v-if="r.subcategory === '未分類'">未</span>
        </div>
        <div class="row-cat">{{ r.category }} · {{ r.subcategory }}<span v-if="r.counterparty"> · {{ r.counterparty }}</span></div>
        <div class="row-desc">{{ r.rawDesc }}</div>
      </div>
      <div class="row-amount" :class="r.type === '収入' ? 'in' : 'out'">¥{{ formatYen(r.amount) }}</div>
    </div>
  </div>

  <div v-if="rows.length && unknownCount" class="warn-banner">
    <span class="icon">info</span>
    「未分類」が <b>{{ unknownCount }}件</b> あります。そのまま送信すると取引タブで「大分類=未分類」となるので、シートで後から手で直してください。除外したい場合は上の「未分類を除外」をタップ。
  </div>

  <div v-if="toast" class="toast">{{ toast }}</div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const rows = ref([]);
    const parsing = ref(false);
    const sending = ref(false);
    const sendProgress = ref("");
    const err = ref("");
    const toast = ref("");
    const user = ref(null);

    function formatYen(n) { return Math.round(Number(n) || 0).toLocaleString("ja-JP"); }
    function back() { location.href = "/"; }
    function reset() { rows.value = []; err.value = ""; }

    const activeCount = computed(() => rows.value.filter((r) => r.include).length);
    const unknownCount = computed(() => rows.value.filter((r) => r.subcategory === "未分類").length);
    const activeIn = computed(() => rows.value.reduce((s, r) => r.include && r.type === "収入" ? s + r.amount : s, 0));
    const activeOut = computed(() => rows.value.reduce((s, r) => r.include && r.type === "支出" ? s + r.amount : s, 0));

    function toggleAll(on) { for (const r of rows.value) r.include = on; }
    function toggleUnknown(on) { for (const r of rows.value) if (r.subcategory === "未分類") r.include = on; }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function onUpload(ev) {
      const file = ev.target.files?.[0];
      if (!file || !user.value) return;
      parsing.value = true; err.value = "";
      try {
        const token = await user.value.getIdToken();
        const fileBase64 = await fileToBase64(file);
        const res = await fetch((window.API_BASE || "") + "/api/ginko/parse", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({ fileBase64, bank: "paypay" }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        rows.value = j.rows || [];
        if (!rows.value.length) err.value = "CSV に取引データが見つかりませんでした (空ファイル / ヘッダーのみ等)";
      } catch (e) {
        err.value = "解析失敗: " + (e.message || e);
      } finally {
        parsing.value = false;
        ev.target.value = "";
      }
    }

    async function confirmSend() {
      const targets = rows.value.filter((r) => r.include);
      if (!targets.length) return;
      const msg = `${targets.length} 件を「取引」タブに送信します。\n入金 ¥${formatYen(activeIn.value)} / 出金 ¥${formatYen(activeOut.value)}\n\nよろしいですか？`;
      if (!confirm(msg)) return;
      await sendAll(targets);
    }

    async function sendAll(targets) {
      if (sending.value) return;
      sending.value = true; err.value = "";
      let ok = 0, failed = 0;
      try {
        const token = await user.value.getIdToken();
        for (let i = 0; i < targets.length; i++) {
          sendProgress.value = `(${i + 1}/${targets.length})`;
          const r = targets[i];
          const res = await fetch((window.API_BASE || "") + "/api/tx/append", {
            method: "POST",
            headers: { authorization: "Bearer " + token, "content-type": "application/json" },
            body: JSON.stringify({
              date: r.date, type: r.type,
              category: r.category, subcategory: r.subcategory,
              amount: r.amount, counterparty: r.counterparty,
              site: r.site || "", status: "確定",
              paymentMethod: r.paymentMethod, memo: r.memo,
              photoCell: "", source: r.source, refId: r.refId,
            }),
          });
          if (res.ok) ok++; else failed++;
        }
        toast.value = failed
          ? `送信完了: 成功 ${ok} / 失敗 ${failed}`
          : `${ok} 件を取引タブに送信しました`;
        setTimeout(() => { toast.value = ""; }, 3500);
        if (!failed) rows.value = [];   // 完了したらリセット (二重送信防止)
      } catch (e) {
        err.value = "送信失敗: " + (e.message || e);
      } finally {
        sending.value = false;
        sendProgress.value = "";
      }
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, (u) => {
          if (!u) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
          user.value = u;
        });
      } catch (e) { err.value = "初期化失敗: " + (e.message || e); }
    });

    return {
      rows, parsing, sending, sendProgress, err, toast,
      activeCount, unknownCount, activeIn, activeOut,
      formatYen, back, reset, toggleAll, toggleUnknown,
      onUpload, confirmSend,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
