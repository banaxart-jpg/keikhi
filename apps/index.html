<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アプリ">
<link rel="apple-touch-icon" href="/icon.png">
<title>アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0">
<style>
.icon, .app-icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 40; color: var(--text); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.42); --text3: rgba(66,69,94,0.22);
  --bulb: #ffb940; --bulb2: #ff9a10;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 54px 22px 0; }
.hint-text { font-size: 11px; letter-spacing: 0.24em; color: var(--text3); text-transform: uppercase; font-weight: 700; }
.pill-btn { padding: 9px 18px; border-radius: 30px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; color: var(--text2); font-family: 'Outfit', sans-serif; background: var(--bg); box-shadow: 5px 5px 12px var(--sd), -5px -5px 12px var(--sl); transition: all 0.12s; }
.pill-btn:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.96); }

.wrap { padding: 40px 22px 60px; }
.title { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 32px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.app-card { position: relative; overflow: visible; border-radius: 24px; padding: 26px 18px; background: var(--bg); cursor: pointer; text-align: center; border: none; font-family: 'Outfit', sans-serif; color: var(--text); box-shadow: 10px 10px 24px var(--sd), -8px -8px 20px var(--sl); transition: box-shadow 0.18s, transform 0.14s; }
.warn-badge { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 8px; border-radius: 12px; background: #ef4444; color: white; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(239,68,68,0.4); animation: warnpulse 1.6s infinite; z-index: 2; }
@keyframes warnpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.app-card::before { content: ""; position: absolute; top: 0; left: 8%; right: 8%; height: 44%; background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%); border-radius: 30px 30px 50% 50%; pointer-events: none; }
.app-card:active { box-shadow: inset 7px 7px 18px var(--sd), inset -5px -5px 14px var(--sl); transform: scale(0.96); }
.app-card.soon { opacity: 0.5; cursor: default; }
.app-card.soon:active { box-shadow: 10px 10px 24px var(--sd), -8px -8px 20px var(--sl); transform: none; }
.app-icon { font-size: 48px; line-height: 1; margin-bottom: 12px; color: color-mix(in srgb, var(--accent, var(--text)) 55%, white 45%); font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 48; }
.app-card.soon .app-icon { color: var(--text2); }
.app-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.app-desc { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.5; }
.app-badge { position: absolute; top: 12px; right: 12px; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: var(--text3); }

/* ───── 編集モード (iOS 風 jiggle + ドラッグ並べ替え + × で非表示) ───── */
body.edit-mode .app-card { animation: jiggle 0.25s ease-in-out infinite alternate; cursor: grab; }
body.edit-mode .app-card.is-dragging { animation: none; opacity: 0.4; transform: scale(0.96); transition: none; cursor: grabbing; }
body.edit-mode .app-card.hidden-tile { opacity: 0.42; filter: grayscale(0.6); animation-delay: 0.12s; }
@keyframes jiggle {
  from { transform: rotate(-0.7deg); }
  to   { transform: rotate(0.7deg); }
}
.app-card .hide-btn {
  position: absolute; top: -6px; left: -6px; width: 26px; height: 26px; border-radius: 13px;
  background: #ef4444; color: white; border: 2px solid var(--bg);
  display: none; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; line-height: 1; padding: 0; cursor: pointer; z-index: 3;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-family: -apple-system, sans-serif;
}
.app-card .hide-btn.show-btn { background: #22c55e; }
body.edit-mode .app-card .hide-btn { display: flex; }
body.edit-mode .app-card { user-select: none; -webkit-user-select: none; }
body.edit-mode #editBtn { background: var(--bulb2); color: white; box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15); }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay .title { font-size: 26px; }
.gbtn { padding: 16px 30px; border-radius: 40px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; color: var(--text); background: var(--bg); box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.gbtn:active { box-shadow: inset 5px 5px 12px var(--sd), inset -4px -4px 10px var(--sl); transform: scale(0.97); }
.sub { font-size: 12px; color: var(--text2); line-height: 1.7; }
.err { font-size: 11px; color: #b04040; font-weight: 600; max-width: 320px; word-break: break-all; }
.diag { font-size: 10px; color: var(--text2); font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; text-align: left; max-width: 320px; max-height: 220px; overflow: auto; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.4); margin-top: 4px; cursor: pointer; line-height: 1.5; }
.diag:empty { display: none; }
</style>
</head>
<body>

<div id="app" style="display:none;">
  <div class="top-bar">
    <span class="hint-text">App Launcher</span>
    <div style="display:flex; gap:8px;">
      <button class="pill-btn" id="editBtn" onclick="toggleEditMode()">編集</button>
      <button class="pill-btn" onclick="doSignOut()">ログアウト</button>
    </div>
  </div>
  <div class="wrap">
    <div class="title">アプリ</div>
    <div class="subtitle" id="who">サインイン済み</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="signinOverlay">
  <div class="title">アプリ</div>
  <div class="sub" id="signinSub">Google アカウントでログイン</div>
  <button class="gbtn" id="signinBtn">Sign in with Google</button>
  <div class="sub" id="signinStatus"></div>
  <div class="err" id="signinErr"></div>
  <div class="diag" id="signinDiag" title="タップで全文コピー"></div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ───────── ミニアプリ一覧 ─────────
// 新しいミニアプリを追加する手順:
//   1. apps/<id>/index.html を作る（1アプリ1ディレクトリ）
//   2. 下の APPS 配列に1行足す
// soon:true にすると「準備中」表示でタップ不可。
const APPS = [
  // icon: Material Symbols (Outlined) のアイコン名。https://fonts.google.com/icons から選ぶ。
  // accent: アイコン円形背景の色（カードのテーマカラー）。
  { id: "keihi",  name: "経費",         icon: "receipt_long",  accent: "#2a8c3a", desc: "領収書をAIで読取・記録",      path: "/keihi/" },
  { id: "keihi2", name: "経費2",        icon: "add_a_photo",   accent: "#10b981", desc: "撮影連発→後でまとめて仕分け",  path: "/keihi2/" },
  { id: "seikyu", name: "請求書",       icon: "request_quote", accent: "#d97706", desc: "光熱費・税金の未払い管理",    path: "/seikyu/" },
  { id: "task",   name: "タスク",       icon: "checklist",     accent: "#4961ff", desc: "",                             path: "/task/" },
  { id: "cost",   name: "AIコスト計算", icon: "calculate",     accent: "#7c3aed", desc: "Gemini/GPT/Claude の費用見積", path: "/cost/" },
  { id: "kaigi",  name: "AI会議",       icon: "forum",         accent: "#4961ff", desc: "3者AIで検討して結論を出す",    path: "/kaigi/" },
  { id: "techstudy", name: "techstudy", icon: "school",        accent: "#6d28d9", desc: "ITまわりの用語・仕組みを身につける", path: "/techstudy/" },
  { id: "denki",  name: "電気図面",     icon: "bolt",          accent: "#eab308", desc: "準備中",                       soon: true },
];

// ───── アプリ毎のバッジ取得 (今日未活動の警告など) ─────
const appBadges = {}; // id → "!" などのバッジ文字
async function fetchTechstudyBadge(user) {
  try {
    if (!user) return;
    const token = await user.getIdToken();
    const res = await fetch((window.API_BASE || "") + "/api/kotonoha/me", {
      headers: { authorization: "Bearer " + token },
    });
    if (!res.ok) return;
    const j = await res.json();
    const s = j.streak;
    if (s && s.streak > 0 && !s.today_active) {
      appBadges.techstudy = "!";
      renderGrid();
    }
  } catch (e) { /* silent */ }
}

// 社内 (= 全ミニアプリ可) 限定の email。これ以外は techstudy だけ表示。
const INTERNAL_EMAILS = new Set(["info@banax.tokyo", "konishi0221@gmail.com", "banaxart@gmail.com"]);
let currentUserEmail = null;
function isInternal() { return INTERNAL_EMAILS.has((currentUserEmail || "").toLowerCase()); }

// ─── ユーザー別ランチャー設定 (Firestore: launcher_prefs/{uid} に保存) ───
// uid をキーにすれば Firebase Auth 1本でユーザー識別できて、メアド変更にも追従する。
let prefs = { order: [], hidden: [] };
let editMode = false;
let prefsSaveTimer = null;
let fsDb = null;

async function loadPrefs(user) {
  try {
    if (!fsDb || !user) return;
    const snap = await getDoc(doc(fsDb, "launcher_prefs", user.uid));
    if (snap.exists()) {
      const p = snap.data() || {};
      prefs = {
        order: Array.isArray(p.order) ? p.order : [],
        hidden: Array.isArray(p.hidden) ? p.hidden : [],
      };
      renderGrid();
    }
  } catch (e) { console.warn("loadPrefs:", e?.message || e); }
}

function savePrefs() {
  clearTimeout(prefsSaveTimer);
  prefsSaveTimer = setTimeout(async () => {
    try {
      const user = fbAuth?.currentUser;
      if (!user || !fsDb) return;
      await setDoc(doc(fsDb, "launcher_prefs", user.uid), {
        order: prefs.order || [],
        hidden: prefs.hidden || [],
        updatedAt: Date.now(),
      }, { merge: true });
    } catch (e) { console.warn("savePrefs:", e?.message || e); }
  }, 600); // debounce
}

function orderedApps() {
  const visible = APPS.filter((a) => isInternal() || a.id === "techstudy");
  const pos = new Map(prefs.order.map((id, i) => [id, i]));
  return visible.slice().sort((a, b) => {
    const ai = pos.has(a.id) ? pos.get(a.id) : 1e9;
    const bi = pos.has(b.id) ? pos.get(b.id) : 1e9;
    return ai - bi;
  });
}

function isHidden(id) { return prefs.hidden.includes(id); }

function renderGrid() {
  const g = document.getElementById("grid");
  g.innerHTML = "";
  const ordered = orderedApps();
  // 通常: 非表示はスキップ。編集モード: 非表示も薄く出して再表示できるように。
  for (const a of ordered) {
    if (!editMode && isHidden(a.id)) continue;
    const card = document.createElement("button");
    card.className = "app-card" + (a.soon ? " soon" : "") + (isHidden(a.id) ? " hidden-tile" : "");
    card.dataset.appId = a.id;
    if (a.accent) card.style.setProperty("--accent", a.accent);
    const badge = appBadges[a.id];
    const hidden = isHidden(a.id);
    card.innerHTML =
      `<button class="hide-btn${hidden ? " show-btn" : ""}" onclick="event.stopPropagation();toggleHidden('${a.id}')">${hidden ? "+" : "×"}</button>` +
      `<div class="app-icon">${a.icon}</div>` +
      `<div class="app-name">${a.name}</div>` +
      `<div class="app-desc">${a.desc}</div>` +
      (a.soon ? `<div class="app-badge">SOON</div>` : "") +
      (badge ? `<div class="warn-badge">${badge}</div>` : "");
    if (!a.soon) {
      card.onclick = (e) => {
        if (editMode) return; // 編集モード中はナビ無効
        location.href = a.path;
      };
    }
    attachDragHandlers(card, a.id);
    g.appendChild(card);
  }
}

function toggleHidden(id) {
  if (prefs.hidden.includes(id)) prefs.hidden = prefs.hidden.filter((x) => x !== id);
  else prefs.hidden = [...prefs.hidden, id];
  renderGrid();
  savePrefs();
}
window.toggleHidden = toggleHidden;

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle("edit-mode", editMode);
  document.getElementById("editBtn").textContent = editMode ? "完了" : "編集";
  renderGrid();
}
window.toggleEditMode = toggleEditMode;

// ───── ドラッグ並び替え (pointer events, mobile/desktop 両対応) ─────
let dragId = null;
let dragEl = null;
function attachDragHandlers(card, id) {
  card.addEventListener("pointerdown", (e) => {
    if (!editMode || card.classList.contains("soon")) return;
    // hide-btn 直接タップはドラッグ開始しない
    if (e.target.closest(".hide-btn")) return;
    dragId = id;
    dragEl = card;
    card.classList.add("is-dragging");
    card.setPointerCapture?.(e.pointerId);
  });
  card.addEventListener("pointermove", (e) => {
    if (!dragId || !dragEl) return;
    e.preventDefault();
    // 指の下にある別のカードを探して順序入れ替え
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".app-card");
    if (under && under.dataset.appId && under.dataset.appId !== dragId) {
      swapOrder(dragId, under.dataset.appId);
      renderGrid();
      // 再 render 後の自分の card を再 grab (dragEl はもう DOM から消えてる)
      const grid = document.getElementById("grid");
      const next = grid.querySelector(`[data-app-id="${dragId}"]`);
      if (next) {
        next.classList.add("is-dragging");
        try { next.setPointerCapture?.(e.pointerId); } catch (_) {}
        dragEl = next;
      }
    }
  });
  card.addEventListener("pointerup", () => endDrag());
  card.addEventListener("pointercancel", () => endDrag());
}
function endDrag() {
  if (!dragId) return;
  dragId = null;
  if (dragEl) dragEl.classList.remove("is-dragging");
  dragEl = null;
  savePrefs();
}

function swapOrder(a, b) {
  // 現状の visible 順序を取得 → a を b の位置へ移動
  const cur = orderedApps().map((x) => x.id);
  const ia = cur.indexOf(a);
  const ib = cur.indexOf(b);
  if (ia < 0 || ib < 0) return;
  cur.splice(ia, 1);
  cur.splice(ib, 0, a);
  prefs.order = cur;
}

// ───────── 共通ログイン（全ミニアプリで共有） ─────────
// Firebase セッションは browserLocalPersistence で永続化され、同一オリジンの
// 各 /<app>/ で共有される。API 認証は各アプリ側で getIdToken() を使用。
const sStatus = (m) => { document.getElementById("signinStatus").textContent = m; };
const sErr = (m) => { document.getElementById("signinErr").textContent = m; };

// ログイン診断ログ (redirect を跨いで残るよう sessionStorage に蓄積)。
// 画面に表示してタップで全文コピー。詰まった時はここを貼ってもらう。
function diagLog(msg) {
  const arr = JSON.parse(sessionStorage.getItem("loginLog") || "[]");
  const ts = new Date().toISOString().slice(11, 19);
  arr.push(`[${ts}] ${msg}`);
  if (arr.length > 40) arr.shift();
  sessionStorage.setItem("loginLog", JSON.stringify(arr));
  renderDiag();
}
function renderDiag() {
  const el = document.getElementById("signinDiag");
  if (!el) return;
  const arr = JSON.parse(sessionStorage.getItem("loginLog") || "[]");
  el.textContent = arr.join("\n");
}
function clearDiag() {
  sessionStorage.removeItem("loginLog");
  renderDiag();
}
document.getElementById("signinDiag")?.addEventListener("click", () => {
  const t = document.getElementById("signinDiag").textContent;
  if (!t) return;
  navigator.clipboard?.writeText(t).then(
    () => sStatus("診断ログをコピーしました"),
    () => sStatus("コピー失敗")
  );
});
renderDiag(); // 前回 redirect 前のログがあれば表示
let fbAuth = null;

(async function initAuth() {
  // dev プレビュー: cloudshell.dev で Firebase ログイン不可のためスキップ。
  if (window.DEV_NO_AUTH) {
    document.getElementById("signinOverlay").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("who").textContent = "dev@local";
    renderGrid();
    return;
  }
  // 別ミニアプリ(/keihi/ 等)から未ログインで飛ばされてきた場合の戻り先
  const nextUrl = new URLSearchParams(location.search).get("next");
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  diagLog(`load host=${location.hostname} mobile=${isMobile} next=${nextUrl || "-"}`);

  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    const origAuthDomain = cfg.authDomain;
    cfg.authDomain = location.hostname; // 認証フローを Hosting と同一オリジンに（iOS Safari ITP でセッション喪失するため）
    diagLog(`init.json project=${cfg.projectId} authDomain=${origAuthDomain}→${cfg.authDomain}`);
    const fbApp = initializeApp(cfg);
    fbAuth = getAuth(fbApp);
    fsDb = getFirestore(fbApp);
    await setPersistence(fbAuth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    try {
      const rr = await getRedirectResult(fbAuth);
      diagLog(`redirectResult=${rr ? rr.user.email : "null"}`);
    } catch (e) {
      diagLog(`redirectResult ERR ${e.code || ""} ${e.message}`);
      sErr("redirect: " + (e.code || e.message));
    }

    let done = false;
    function onAuthed(user) {
      if (done) return;
      done = true;
      diagLog(`onAuthed → ${nextUrl || "grid"}`);
      clearDiag();
      currentUserEmail = user?.email || null;
      // 元のミニアプリへ自動復帰（ログイン後に経費へ戻る等）
      if (nextUrl && nextUrl.startsWith("/")) { location.replace(nextUrl); return; }
      document.getElementById("signinOverlay").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("who").textContent = user?.email || "サインイン済み";
      renderGrid();
      // バッジ + ユーザー設定 (Firestore) は後追いで取得 → 取れたら再 render
      fetchTechstudyBadge(user);
      loadPrefs(user);
    }

    document.getElementById("signinBtn").addEventListener("click", async () => {
      sErr(""); sStatus("ログイン中…");
      diagLog("click signin");
      // モバイルは popup が不安定なので redirect 一択
      if (isMobile) {
        try { diagLog("→ signInWithRedirect"); await signInWithRedirect(fbAuth, provider); }
        catch (e) { diagLog(`redirect ERR ${e.code || ""} ${e.message}`); sErr((e.code || "") + " " + e.message); }
        return;
      }
      try {
        diagLog("→ signInWithPopup");
        const res = await signInWithPopup(fbAuth, provider);
        onAuthed(res.user);
      } catch (e) {
        diagLog(`popup ERR ${e.code || ""} ${e.message}`);
        if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"].includes(e.code)) {
          try { diagLog("→ fallback signInWithRedirect"); await signInWithRedirect(fbAuth, provider); }
          catch (e2) { diagLog(`fallback redirect ERR ${e2.code || ""} ${e2.message}`); sErr(e2.message); }
        } else { sErr((e.code || "") + " " + e.message); }
      }
    });

    onAuthStateChanged(fbAuth, (user) => {
      diagLog(`authState ${user ? user.email : "null"}`);
      if (user) onAuthed(user);
      else document.getElementById("signinOverlay").style.display = "flex";
    });
  } catch (e) {
    diagLog(`init ERR ${e.message}`);
    document.getElementById("signinOverlay").style.display = "flex";
    sErr("init失敗: " + e.message);
  }
})();

window.doSignOut = async () => {
  if (fbAuth) await signOut(fbAuth);
  location.reload();
};
</script>
</body>
</html>
