<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アプリ">
<link rel="apple-touch-icon" href="/icon.png">
<title>アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0">
<style>
.icon, .app-icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 40; color: var(--text); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.42); --text3: rgba(66,69,94,0.22);
  --bulb: #ffb940; --bulb2: #ff9a10;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100dvh; }
#app { display: flex; flex-direction: column; height: 100dvh; }

.top-bar { display: flex; justify-content: flex-end; align-items: center; padding: calc(14px + env(safe-area-inset-top)) 18px 0; }
.pill-btn { padding: 8px 14px; border-radius: 30px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; color: var(--text2); font-family: 'Outfit', sans-serif; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); transition: all 0.12s; }
.pill-btn:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.96); }
.pill-btn .icon { vertical-align: -0.2em; }

/* ───── カテゴリー別ページ (左右スワイプ、iPhone ホーム画面風) ───── */
.pager-scroll { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.pager-scroll::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: 10px 16px 8px; overflow-y: auto; scrollbar-width: none; }
.page::-webkit-scrollbar { display: none; }
.page-label { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 0.12em; text-align: center; margin: 4px 0 16px; }
.dots { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 8px 0 calc(18px + env(safe-area-inset-bottom)); }
.dot { width: 8px; height: 8px; border-radius: 5px; background: var(--sd2); border: none; padding: 0; cursor: pointer; transition: width 0.2s, background 0.2s; }
.dot.active { width: 22px; background: var(--text2); }

/* iPhone のホーム画面と同じ: 4 列の小さいアイコン + 下に名前。説明文なし */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 6px; }
.app-card { position: relative; overflow: visible; padding: 0; background: none; box-shadow: none; cursor: pointer; text-align: center; border: none; font-family: 'Outfit', sans-serif; color: var(--text); }
.app-card .tile { position: relative; width: 60px; height: 60px; margin: 0 auto; border-radius: 18px; background: var(--bg); box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); display: flex; align-items: center; justify-content: center; transition: box-shadow 0.15s, transform 0.12s; }
.app-card:active .tile { box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl); transform: scale(0.94); }
.warn-badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ef4444; color: white; font-weight: 900; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(239,68,68,0.4); animation: warnpulse 1.6s infinite; z-index: 2; }
@keyframes warnpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.app-card.soon { opacity: 0.5; cursor: default; }
.app-card.soon:active .tile { box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); transform: none; }
.app-icon { font-size: 28px; line-height: 1; color: color-mix(in srgb, var(--accent, var(--text)) 62%, white 38%); font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 48; }
.app-card.soon .app-icon { color: var(--text2); }
.app-name { font-size: 10.5px; font-weight: 700; margin-top: 7px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.app-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 800; letter-spacing: 0.08em; color: var(--text3); background: var(--bg); border-radius: 6px; padding: 1px 5px; box-shadow: 2px 2px 6px var(--sd); }

/* ───── 編集モード (iOS 風 jiggle + × で非表示、ドラッグでカテゴリー内手動並べ替え) ───── */
/* jiggle は .tile 側に掛ける (.app-card の transform を FLIP 移動アニメに空けておくため) */
body.edit-mode .app-card .tile { animation: jiggle 0.25s ease-in-out infinite alternate; }
body.edit-mode .app-card { cursor: default; touch-action: none; -webkit-touch-callout: none; }
body.edit-mode .app-card.hidden-tile { opacity: 0.42; filter: grayscale(0.6); }
body.edit-mode .app-card.hidden-tile .tile { animation-delay: 0.12s; }
@keyframes jiggle {
  from { transform: rotate(-0.7deg); }
  to   { transform: rotate(0.7deg); }
}
.app-card .hide-btn {
  position: absolute; top: -8px; left: -8px; width: 22px; height: 22px; border-radius: 11px;
  background: #ef4444; color: white; border: 2px solid var(--bg);
  display: none; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; line-height: 1; padding: 0; cursor: pointer; z-index: 3;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-family: -apple-system, sans-serif;
}
.app-card .hide-btn.show-btn { background: #22c55e; }
body.edit-mode .app-card .hide-btn { display: flex; }
body.edit-mode .app-card { user-select: none; -webkit-user-select: none; }
body.edit-mode #editBtn { background: var(--bulb2); color: white; box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15); }

/* ドラッグ並べ替え (カテゴリーページ内のみ・手動順序。ホームページは常に MRU 自動)
   iPhone と同じ: 編集モード中にタイルを掴んで動かす → 他のタイルが FLIP で避ける */
.tg-move { transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.3, 1); }
.app-card.drag-src { opacity: 0; }
.drag-ghost {
  position: fixed; z-index: 500; width: 84px; pointer-events: none;
  text-align: center; font-family: 'Outfit', sans-serif; color: var(--text);
  transform: translate(-50%, -30px) scale(1.12);
  filter: drop-shadow(0 12px 20px rgba(0,0,0,0.25));
}
.drag-ghost .tile {
  width: 60px; height: 60px; margin: 0 auto; border-radius: 18px; background: var(--bg);
  box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl);
  display: flex; align-items: center; justify-content: center;
}
.drag-ghost .app-name { font-size: 10.5px; font-weight: 700; margin-top: 7px; line-height: 1.3; }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay .title { font-size: 26px; font-weight: 800; }
.gbtn { padding: 16px 30px; border-radius: 40px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; color: var(--text); background: var(--bg); box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.gbtn:active { box-shadow: inset 5px 5px 12px var(--sd), inset -4px -4px 10px var(--sl); transform: scale(0.97); }
.sub { font-size: 12px; color: var(--text2); line-height: 1.7; }
.err { font-size: 11px; color: #b04040; font-weight: 600; max-width: 320px; word-break: break-all; }
.diag { font-size: 10px; color: var(--text2); font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; text-align: left; max-width: 320px; max-height: 220px; overflow: auto; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.4); margin-top: 4px; cursor: pointer; line-height: 1.5; }
.diag:empty { display: none; }
</style>
</head>
<body>

<div id="app" style="display:none;">
  <!-- 中身は Vue が描画する (iPhone ホーム画面風)。TEMPLATE はスクリプト内 -->
</div>

<div id="signinOverlay">
  <div class="title">アプリ</div>
  <div class="sub" id="signinSub">Google アカウントでログイン</div>
  <button class="gbtn" id="signinBtn">Sign in with Google</button>

  <div class="diag" id="signinDiag" title="タップで全文コピー"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, reactive, computed, watchEffect, onMounted } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { registerPushForUser } from "/push-register.js";

// ───────── ミニアプリ一覧 ─────────
// 新しいミニアプリを追加する手順:
//   1. apps/<id>/index.html を作る（1アプリ1ディレクトリ）
//   2. 下の APPS 配列に1行足す
// soon:true にすると「準備中」表示でタップ不可。
const APPS = [
  // icon: Material Symbols (Outlined) のアイコン名。https://fonts.google.com/icons から選ぶ。
  // accent: アイコン円形背景の色（カードのテーマカラー）。
  // category: CATEGORIES のどのページに出すか。gyomu=業務 / manabi=学習 / tool=ツール / toshi=投資
  { id: "genba",   name: "現場",         icon: "domain",         accent: "#0891b2", desc: "現場の登録・住所・キーボックス管理", path: "/genba/", category: "gyomu" },
  { id: "genba-memo", name: "現場メモ",   icon: "edit_note",      accent: "#b08968", desc: "現場×日ごとに realtime 同期メモ", path: "/genba-memo/", category: "gyomu" },
  { id: "keihi",  name: "経費",         icon: "receipt_long",  accent: "#2a8c3a", desc: "領収書をAIで読取・記録",      path: "/keihi/", category: "gyomu" },
  { id: "keihi2", name: "領収書",       icon: "add_a_photo",   accent: "#10b981", desc: "撮影連発→後でまとめて仕分け",  path: "/keihi2/", category: "gyomu" },
  { id: "seikyu", name: "請求書",       icon: "request_quote", accent: "#d97706", desc: "光熱費・税金の未払い管理",    path: "/seikyu/", category: "gyomu" },
  { id: "task",    name: "タスク",       icon: "checklist",      accent: "#4961ff", desc: "",                             path: "/task/", category: "gyomu" },
  { id: "kaimono", name: "手配リスト",   icon: "inventory_2",    accent: "#2a8c3a", desc: "現場ごとに必要な工具・材料を共有", path: "/kaimono/", category: "gyomu" },
  { id: "yado",    name: "宿",           icon: "hotel",          accent: "#b45309", desc: "満竹華庵の予約・売上・戦略",     path: "/yado/", category: "toshi" },
  { id: "koteihi", name: "固定費",       icon: "event_repeat",   accent: "#3949ab", desc: "毎月の固定費を1タップで取引に登録", path: "/koteihi/", category: "gyomu" },
  // 銀行 (ginko) は固定費・請求書・宿・領収書アプリと二重計上になるため、ランチャー
  // からは外す。コードは apps/ginko/ と /api/ginko/parse に残置。差分検出モード等に
  // 作り変える時は APPS 配列に戻すだけで復活する。
  // { id: "ginko",   name: "銀行",         icon: "account_balance",accent: "#0d9488", desc: "PayPay銀行CSVから取引を一括取込", path: "/ginko/", category: "gyomu" },
  { id: "keiri",   name: "経理",         icon: "analytics",      accent: "#4338ca", desc: "売上・支出・現場別の集計ダッシュボード", path: "/keiri/", category: "gyomu" },
  { id: "cost",    name: "AIコスト計算", icon: "calculate",      accent: "#7c3aed", desc: "Gemini/GPT/Claude の費用見積", path: "/cost/", category: "tool" },
  { id: "kaigi",  name: "AI会議",       icon: "forum",         accent: "#4961ff", desc: "3者AIで検討して結論を出す",    path: "/kaigi/", category: "tool" },
  { id: "techstudy", name: "techstudy", icon: "school",        accent: "#6d28d9", desc: "ITまわりの用語・仕組みを身につける", path: "/techstudy/", category: "manabi" },
  { id: "seko-kanri", name: "施工管理2級", icon: "engineering", accent: "#b08968", desc: "2級建築施工管理技士 (一次・二次) 対策", path: "/seko-kanri/", category: "manabi" },
  { id: "fx-bot", name: "FX bot", icon: "smart_toy", accent: "#0f766e", desc: "OANDA × Gemini で 1 通貨単位の自動売買", path: "/fx-bot/", category: "toshi" },
  { id: "denki-zumen", name: "電気積算",  icon: "bolt",         accent: "#eab308", desc: "図面をAIで読取→品番・数量・発注リスト", path: "/denki-zumen/", category: "tool" },
  { id: "fungi",   name: "菌学",         icon: "psychiatry",     accent: "#b08968", desc: "キノコ・菌類の 4 択クイズ",         path: "/fungi/", category: "manabi" },
  { id: "shark",   name: "鮫学",         icon: "phishing",       accent: "#0e7490", desc: "サメ (鮫) の 4 択クイズ",            path: "/shark/", category: "manabi" },
  { id: "calendar", name: "カレンダー",   icon: "calendar_month", accent: "#4f46e5", desc: "Googleカレンダーを見やすく表示",     path: "/calendar/", category: "tool" },
  { id: "auto-drama", name: "自動ドラマ作成", icon: "movie", accent: "#be185d", desc: "青空文庫の小説からAI協調でショート動画を制作", path: "/auto-drama/", category: "tool" },
  { id: "sekkei-qa", name: "設計質問", icon: "architecture", accent: "#3b6ea5", desc: "図面に印をつけて設計屋に質問・回答管理", path: "/sekkei-qa/", category: "gyomu" },
  { id: "genba-qa", name: "現場質問", icon: "forum", accent: "#2f6b9e", desc: "確認事項をチャットで回す (客・設計も参加可)", path: "/genba-qa/", category: "gyomu" },
  { id: "genka", name: "原価計算", icon: "savings", accent: "#059669", desc: "現場ごとに見積−業者=利益をざっくり計算", path: "/genka/", category: "gyomu" },
  { id: "meishi", name: "名刺", icon: "contact_page", accent: "#6d5bd0", desc: "名刺を撮ってAIで連絡先に", path: "/meishi/", category: "tool" },
];

// カテゴリーページの順序と表示名。先頭は MRU 上位 8 件を横断表示する「よく使う」。
// 各カテゴリー内の並びは MRU 自動 → 編集モードでタイルをドラッグして手動調整すると
// それ以降そのカテゴリーは手動順優先になる (launcher_prefs.catOrder に保存)。
const CATEGORIES = [
  { id: "home",   name: "よく使う" },
  { id: "gyomu",  name: "業務" },
  { id: "manabi", name: "学習" },
  { id: "tool",   name: "ツール" },
  { id: "toshi",  name: "投資" },
];

// ───── Vue アプリ本体 (タイル描画・MRU・prefs・編集モード) ─────
// 認証フロー (下の initAuth) は実績のある vanilla のまま残し、
// window.__launcherAuthed / __launcherDev で Vue 側に橋渡しする。

const PUBLIC_APPS = new Set(["techstudy", "kaimono", "task"]); // 社外 auth ユーザーにも公開
const INTERNAL_EMAILS = new Set(["info@banax.tokyo", "konishi0221@gmail.com", "banaxart@gmail.com"]);

const TEMPLATE = `
<div class="top-bar">
  <div style="display:flex; gap:8px; margin-left:auto;">
    <button class="pill-btn" id="editBtn" @click="toggleEditMode">{{ editMode ? '完了' : '編集' }}</button>
    <button class="pill-btn" @click="doSignOut"><span class="icon" style="font-size:15px;">logout</span></button>
  </div>
</div>
<div class="pager-scroll" ref="pagerEl" @scroll.passive="onPagerScroll">
  <section v-for="pg in pages" :key="pg.cat.id" class="page" :data-cat="pg.cat.id">
    <div class="page-label">{{ pg.cat.name }}</div>
    <TransitionGroup tag="div" name="tg" class="grid">
      <button v-for="a in pg.list" :key="a.id"
        class="app-card" :class="{ soon: a.soon, 'hidden-tile': isHidden(a.id), 'drag-src': drag.active && drag.app.id === a.id && drag.catId === pg.cat.id }"
        :style="a.accent ? { '--accent': a.accent } : null"
        @pointerdown="onDown($event, a, pg)" @pointermove="onMove($event)"
        @pointerup="onUp($event, a)" @pointercancel="onCancel">
        <div class="tile">
          <button class="hide-btn" :class="{ 'show-btn': isHidden(a.id) }" @click.stop="toggleHidden(a.id)">{{ isHidden(a.id) ? '+' : '−' }}</button>
          <div class="app-icon">{{ a.icon }}</div>
          <div v-if="a.soon" class="app-badge">SOON</div>
          <div v-if="badges[a.id]" class="warn-badge">{{ badges[a.id] }}</div>
        </div>
        <div class="app-name">{{ a.name }}</div>
      </button>
    </TransitionGroup>
  </section>
</div>
<div v-if="drag.active" class="drag-ghost" :style="ghostStyle">
  <div class="tile"><div class="app-icon">{{ drag.app.icon }}</div></div>
  <div class="app-name">{{ drag.app.name }}</div>
</div>
<div class="dots">
  <button v-for="(pg, pi) in pages" :key="pg.cat.id" class="dot" :class="{ active: currentPage === pi }" :aria-label="pg.cat.name" @click="scrollToPage(pi)"></button>
</div>
`;

let fbAuth = null;
let fsDb = null;

const App = {
  template: TEMPLATE,
  setup() {
    const userEmail = ref(null);
    const editMode = ref(false);
    const currentPage = ref(0);
    const pagerEl = ref(null);
    const badges = reactive({}); // id → "!" などのバッジ文字
    // 初期 prefs は localStorage から先に拾う → Firestore ロード前でも MRU 並びが出る
    const prefs = reactive((() => {
      try {
        const cached = localStorage.getItem("launcher_mru_cache");
        return { mru: cached ? (JSON.parse(cached) || {}) : {}, hidden: [], catOrder: {} };
      } catch (_) { return { mru: {}, hidden: [], catOrder: {} }; }
    })());

    const isInternal = () => INTERNAL_EMAILS.has((userEmail.value || "").toLowerCase());
    const visibleApps = () => APPS.filter((a) => isInternal() || PUBLIC_APPS.has(a.id));
    const isHidden = (id) => prefs.hidden.includes(id);

    // MRU (最近開いた順)。同点は APPS 配列内の順序で解決
    function mruSort(list) {
      const mru = prefs.mru || {};
      const fallback = new Map(APPS.map((a, i) => [a.id, i]));
      return list.slice().sort((a, b) => {
        const ra = mru[a.id] || 0, rb = mru[b.id] || 0;
        if (ra !== rb) return rb - ra;
        return fallback.get(a.id) - fallback.get(b.id);
      });
    }
    // 手動並べ替え (catOrder) があればそれを優先。未登録の新アプリは MRU 順で末尾
    function manualSort(catId, list) {
      const order = prefs.catOrder && prefs.catOrder[catId];
      if (!order || !order.length) return list;
      const idx = new Map(order.map((id, i) => [id, i]));
      const known = list.filter((a) => idx.has(a.id)).sort((a, b) => idx.get(a.id) - idx.get(b.id));
      const rest = list.filter((a) => !idx.has(a.id));
      return [...known, ...rest];
    }
    function categoryOrderedApps(catId) {
      return manualSort(catId, mruSort(visibleApps().filter((a) => a.category === catId)));
    }

    const pages = computed(() => CATEGORIES.map((cat) => {
      let list;
      if (cat.id === "home") {
        // ホーム = 全カテゴリー横断の MRU 上位 8 件。並べ替え不可、常に自動
        list = mruSort(visibleApps()).filter((a) => !isHidden(a.id)).slice(0, 8);
      } else {
        list = categoryOrderedApps(cat.id);
        if (editMode.value) {
          const vis = list.filter((a) => !isHidden(a.id));
          const hid = list.filter((a) => isHidden(a.id));
          list = [...vis, ...hid];
        } else {
          list = list.filter((a) => !isHidden(a.id));
        }
      }
      return { cat, list, visibleIds: list.filter((a) => !isHidden(a.id)).map((a) => a.id) };
    }));

    // ── prefs の Firestore 同期 (localStorage と last-write-wins merge) ──
    let prefsSaveTimer = null;
    async function loadPrefs(user) {
      let localMru = {};
      try {
        const cached = localStorage.getItem("launcher_mru_cache");
        if (cached) localMru = JSON.parse(cached) || {};
      } catch (_) {}
      let remote = null;
      try {
        if (fsDb && user) {
          const snap = await getDoc(doc(fsDb, "launcher_prefs", user.uid));
          if (snap.exists()) remote = snap.data() || {};
        }
      } catch (e) { console.warn("loadPrefs:", e?.message || e); }
      const remoteMru = (remote?.mru && typeof remote.mru === "object") ? { ...remote.mru } : {};
      // 旧 prefs.order からの後方互換
      if (Object.keys(remoteMru).length === 0 && Array.isArray(remote?.order) && remote.order.length) {
        const base = Date.now() - remote.order.length * 1000;
        remote.order.forEach((id, i) => { remoteMru[id] = base + (remote.order.length - i) * 1000; });
      }
      const merged = { ...remoteMru };
      for (const [id, ts] of Object.entries(localMru)) {
        if (!merged[id] || ts > merged[id]) merged[id] = ts;
      }
      prefs.mru = merged;
      prefs.hidden = Array.isArray(remote?.hidden) ? remote.hidden : [];
      prefs.catOrder = (remote?.catOrder && typeof remote.catOrder === "object" && !Array.isArray(remote.catOrder))
        ? remote.catOrder : {};
    }
    function savePrefs() {
      clearTimeout(prefsSaveTimer);
      prefsSaveTimer = setTimeout(async () => {
        try {
          const user = fbAuth?.currentUser;
          if (!user || !fsDb) return;
          await setDoc(doc(fsDb, "launcher_prefs", user.uid), {
            mru: prefs.mru || {}, hidden: prefs.hidden || [], catOrder: prefs.catOrder || {},
            updatedAt: Date.now(),
          }, { merge: true });
        } catch (e) { console.warn("savePrefs:", e?.message || e); }
      }, 600);
    }
    // アプリタップ: mru を即時更新 (localStorage が真のソース、Firestore は best-effort)
    function bumpMru(appId) {
      const ts = Date.now();
      prefs.mru = { ...(prefs.mru || {}), [appId]: ts };
      try { localStorage.setItem("launcher_mru_cache", JSON.stringify(prefs.mru)); } catch (_) {}
      try {
        const user = fbAuth?.currentUser;
        if (user && fsDb) {
          setDoc(doc(fsDb, "launcher_prefs", user.uid), { mru: prefs.mru, updatedAt: ts }, { merge: true }).catch(() => {});
        }
      } catch (_) {}
    }

    async function fetchTechstudyBadge(user) {
      try {
        if (!user) return;
        const token = await user.getIdToken();
        const res = await fetch((window.API_BASE || "") + "/api/kotonoha/me", {
          headers: { authorization: "Bearer " + token },
        });
        if (!res.ok) return;
        const j = await res.json();
        const s = j.streak;
        if (s && s.streak > 0 && !s.today_active) badges.techstudy = "!";
      } catch (e) { /* silent */ }
    }

    // ── 編集モード / 非表示 / 並べ替え ──
    function toggleEditMode() { editMode.value = !editMode.value; }
    watchEffect(() => { document.body.classList.toggle("edit-mode", editMode.value); });
    function toggleHidden(id) {
      if (prefs.hidden.includes(id)) prefs.hidden = prefs.hidden.filter((x) => x !== id);
      else prefs.hidden = [...prefs.hidden, id];
      savePrefs();
    }
    // ── ドラッグ並べ替え (iPhone 風。編集モード中・カテゴリーページのみ) ──
    // pointerdown で「掴む候補」を覚え、TAP_MAX_MOVE 超の移動でドラッグ開始。
    // 掴んだタイルは fixed のゴーストで指に追従、元タイルは opacity:0 の空き枠になり、
    // 指の位置に最も近いスロットへ catOrder を随時更新 → TransitionGroup が FLIP で避ける。
    const drag = reactive({ active: false, app: null, catId: null, x: 0, y: 0 });
    const ghostStyle = computed(() => {
      const s = { left: drag.x + "px", top: drag.y + "px" };
      if (drag.app && drag.app.accent) s["--accent"] = drag.app.accent;
      return s;
    });
    let dragCtx = null; // 非 reactive な内部状態 { appId, catId, ids, slots, grabDx, grabDy, card }

    function armDrag(e, a, pg) {
      dragCtx = {
        appId: a.id, app: a, catId: pg.cat.id, ids: pg.visibleIds.slice(),
        card: e.currentTarget, pointerId: e.pointerId, slots: null, grabDx: 0, grabDy: 0,
      };
    }
    function activateDrag(e) {
      const ctx = dragCtx;
      const grid = ctx.card.closest(".grid");
      if (!grid) { dragCtx = null; return; }
      // スロット位置は掴んだ瞬間のタイル中心座標で固定 (枠自体は動かないので snapshot でよい)
      const cards = [...grid.children].filter((el) => el.classList && el.classList.contains("app-card"));
      ctx.slots = cards.slice(0, ctx.ids.length).map((el) => {
        const r = (el.querySelector(".tile") || el).getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
      const tr = (ctx.card.querySelector(".tile") || ctx.card).getBoundingClientRect();
      ctx.grabDx = e.clientX - (tr.left + tr.width / 2);
      ctx.grabDy = e.clientY - (tr.top + tr.height / 2);
      try { ctx.card.setPointerCapture(ctx.pointerId); } catch (_) {}
      drag.app = ctx.app;
      drag.catId = ctx.catId;
      drag.x = e.clientX - ctx.grabDx;
      drag.y = e.clientY - ctx.grabDy;
      drag.active = true;
      if (navigator.vibrate) navigator.vibrate(10);
    }
    function dragMoveTo(e) {
      const ctx = dragCtx;
      drag.x = e.clientX - ctx.grabDx;
      drag.y = e.clientY - ctx.grabDy;
      let best = 0, bd = Infinity;
      for (let i = 0; i < ctx.slots.length; i++) {
        const c = ctx.slots[i];
        const d = (drag.x - c.x) * (drag.x - c.x) + (drag.y - c.y) * (drag.y - c.y);
        if (d < bd) { bd = d; best = i; }
      }
      const cur = ctx.ids.indexOf(ctx.appId);
      if (best !== cur) {
        ctx.ids.splice(cur, 1);
        ctx.ids.splice(best, 0, ctx.appId);
        prefs.catOrder = { ...(prefs.catOrder || {}), [ctx.catId]: ctx.ids.slice() };
      }
    }
    function endDrag(commit) {
      if (drag.active && commit) savePrefs();
      drag.active = false;
      drag.app = null;
      drag.catId = null;
      dragCtx = null;
    }

    // ── ページャ (スワイプ + ドット) ──
    let ticking = false;
    function onPagerScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const el = pagerEl.value;
        if (el) {
          const idx = Math.round(el.scrollLeft / (el.clientWidth || 1));
          if (idx !== currentPage.value) currentPage.value = idx;
        }
        ticking = false;
      });
    }
    function scrollToPage(idx) {
      currentPage.value = idx;
      const el = pagerEl.value;
      if (el) el.scrollTo({ left: idx * el.clientWidth, behavior: "smooth" });
    }

    // ── 長押し → 編集モード (iPhone 風)。短タップ → 起動。編集中ドラッグ → 並べ替え ──
    const LONGPRESS_MS = 450;
    const TAP_MAX_MOVE = 8;
    let pressTimer = null, pressX = 0, pressY = 0, moved = false;
    function onDown(e, a, pg) {
      if (a.soon) return;
      if (drag.active || dragCtx) return; // ドラッグ中に別の指で触っても無視
      if (e.target.closest(".hide-btn")) return;
      pressX = e.clientX; pressY = e.clientY; moved = false;
      if (!editMode.value) {
        pressTimer = setTimeout(() => {
          pressTimer = null;
          toggleEditMode();
          if (navigator.vibrate) navigator.vibrate(20);
        }, LONGPRESS_MS);
      } else if (pg.cat.id !== "home" && !isHidden(a.id)) {
        armDrag(e, a, pg); // 実際のドラッグ開始は onMove で移動を検知してから
      }
    }
    function onMove(e) {
      if (drag.active) {
        if (dragCtx && e.pointerId === dragCtx.pointerId) dragMoveTo(e);
        return;
      }
      const dx = Math.abs(e.clientX - pressX), dy = Math.abs(e.clientY - pressY);
      if (dx > TAP_MAX_MOVE || dy > TAP_MAX_MOVE) moved = true;
      if (pressTimer && moved) { clearTimeout(pressTimer); pressTimer = null; }
      if (dragCtx && moved && e.pointerId === dragCtx.pointerId) activateDrag(e);
    }
    function onUp(e, a) {
      if (drag.active) {
        if (dragCtx && e.pointerId === dragCtx.pointerId) endDrag(true);
        return;
      }
      dragCtx = null;
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
        if (!editMode.value && !moved && a.path) {
          bumpMru(a.id);
          location.href = a.path;
        }
      }
    }
    function onCancel(e) {
      if (drag.active) {
        if (dragCtx && e.pointerId === dragCtx.pointerId) endDrag(true);
        return;
      }
      dragCtx = null;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }

    async function doSignOut() {
      if (fbAuth) await signOut(fbAuth);
      location.reload();
    }

    // 認証フロー (vanilla 側) からの橋渡し
    window.__launcherAuthed = (user) => {
      userEmail.value = user?.email || null;
      loadPrefs(user);
      fetchTechstudyBadge(user);
    };
    window.__launcherDev = () => { userEmail.value = "dev@local"; };

    return {
      editMode, currentPage, pagerEl, badges, pages, drag, ghostStyle,
      isHidden, toggleEditMode, toggleHidden,
      onPagerScroll, scrollToPage, onDown, onMove, onUp, onCancel, doSignOut,
    };
  },
};

createApp(App).mount("#app");


// ───────── 共通ログイン（全ミニアプリで共有） ─────────
// Firebase セッションは browserLocalPersistence で永続化され、同一オリジンの
// 各 /<app>/ で共有される。API 認証は各アプリ側で getIdToken() を使用。
const sStatus = (m) => { document.getElementById("signinStatus").textContent = m; };
const sErr = (m) => { document.getElementById("signinErr").textContent = m; };

// ログイン診断ログ (redirect を跨いで残るよう sessionStorage に蓄積)。
// 画面に表示してタップで全文コピー。詰まった時はここを貼ってもらう。
function diagLog(msg) {
  const arr = JSON.parse(sessionStorage.getItem("loginLog") || "[]");
  const ts = new Date().toISOString().slice(11, 19);
  arr.push(`[${ts}] ${msg}`);
  if (arr.length > 40) arr.shift();
  sessionStorage.setItem("loginLog", JSON.stringify(arr));
  renderDiag();
}
function renderDiag() {
  const el = document.getElementById("signinDiag");
  if (!el) return;
  const arr = JSON.parse(sessionStorage.getItem("loginLog") || "[]");
  el.textContent = arr.join("\n");
}
function clearDiag() {
  sessionStorage.removeItem("loginLog");
  renderDiag();
}
document.getElementById("signinDiag")?.addEventListener("click", () => {
  const t = document.getElementById("signinDiag").textContent;
  if (!t) return;
  navigator.clipboard?.writeText(t).then(
    () => sStatus("診断ログをコピーしました"),
    () => sStatus("コピー失敗")
  );
});
renderDiag(); // 前回 redirect 前のログがあれば表示

(async function initAuth() {
  // dev プレビュー: cloudshell.dev で Firebase ログイン不可のためスキップ。
  if (window.DEV_NO_AUTH) {
    document.getElementById("signinOverlay").style.display = "none";
    // インライン style を消して stylesheet の display:flex に戻す
    // ("block" を書くと縦 flex レイアウトが壊れて画面上半分に潰れる — 実測)
    document.getElementById("app").style.display = "";
    window.__launcherDev?.();
    return;
  }
  // 別ミニアプリ(/keihi/ 等)から未ログインで飛ばされてきた場合の戻り先
  const nextUrl = new URLSearchParams(location.search).get("next");
  const isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
  diagLog(`load host=${location.hostname} mobile=${isMobile} next=${nextUrl || "-"}`);

  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    const origAuthDomain = cfg.authDomain;
    cfg.authDomain = location.hostname; // 認証フローを Hosting と同一オリジンに（iOS Safari ITP でセッション喪失するため）
    diagLog(`init.json project=${cfg.projectId} authDomain=${origAuthDomain}→${cfg.authDomain}`);
    const fbApp = initializeApp(cfg);
    window._fbApp = fbApp;
    fbAuth = getAuth(fbApp);
    fsDb = getFirestore(fbApp);
    await setPersistence(fbAuth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    try {
      const rr = await getRedirectResult(fbAuth);
      diagLog(`redirectResult=${rr ? rr.user.email : "null"}`);
    } catch (e) {
      diagLog(`redirectResult ERR ${e.code || ""} ${e.message}`);
      sErr("redirect: " + (e.code || e.message));
    }

    let done = false;
    function onAuthed(user) {
      if (done) return;
      done = true;
      diagLog(`onAuthed → ${nextUrl || "grid"}`);
      clearDiag();
      // 元のミニアプリへ自動復帰（ログイン後に経費へ戻る等）
      if (nextUrl && nextUrl.startsWith("/")) { location.replace(nextUrl); return; }
      document.getElementById("signinOverlay").style.display = "none";
      // インライン style を消して stylesheet の display:flex に戻す (block だと縦 flex が壊れる)
      document.getElementById("app").style.display = "";
      // Vue 側へ橋渡し (email 反映 → 表示アプリ確定、prefs / バッジ取得)
      window.__launcherAuthed?.(user);
      // FCM ハンドシェイク (Notification 許可 + token を Firestore に保存)。
      // 失敗しても致命じゃないので fire-and-forget。
      registerPushForUser(window._fbApp, user);
    }

    document.getElementById("signinBtn").addEventListener("click", async () => {
      sErr(""); sStatus("ログイン中…");
      diagLog("click signin");
      // モバイルは popup が不安定なので redirect 一択
      if (isMobile) {
        try { diagLog("→ signInWithRedirect"); await signInWithRedirect(fbAuth, provider); }
        catch (e) { diagLog(`redirect ERR ${e.code || ""} ${e.message}`); sErr((e.code || "") + " " + e.message); }
        return;
      }
      try {
        diagLog("→ signInWithPopup");
        const res = await signInWithPopup(fbAuth, provider);
        onAuthed(res.user);
      } catch (e) {
        diagLog(`popup ERR ${e.code || ""} ${e.message}`);
        if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"].includes(e.code)) {
          try { diagLog("→ fallback signInWithRedirect"); await signInWithRedirect(fbAuth, provider); }
          catch (e2) { diagLog(`fallback redirect ERR ${e2.code || ""} ${e2.message}`); sErr(e2.message); }
        } else { sErr((e.code || "") + " " + e.message); }
      }
    });

    onAuthStateChanged(fbAuth, (user) => {
      diagLog(`authState ${user ? user.email : "null"}`);
      if (user) onAuthed(user);
      else document.getElementById("signinOverlay").style.display = "flex";
    });
  } catch (e) {
    diagLog(`init ERR ${e.message}`);
    document.getElementById("signinOverlay").style.display = "flex";
    sErr("init失敗: " + e.message);
  }
})();
</script>
</body>
