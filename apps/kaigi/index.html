<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI会議</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --gemini: #4285f4; --claude: #d97706; --gpt: #10a37f;
  --err: #b04040;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 170px; }

.fixed-footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(228,230,238,0) 0%, rgba(228,230,238,0.95) 30%, rgba(228,230,238,1) 70%); display: none; flex-direction: column; gap: 8px; z-index: 100; }
.fixed-footer.show { display: flex; }
.fixed-footer .row { display: flex; gap: 10px; }
.fixed-footer .row .btn { flex: 1; }
.fixed-footer .btn.tiny { padding: 8px; font-size: 11px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 20px 0; }
.hint { font-size: 11px; letter-spacing: 0.22em; color: var(--text3); font-weight: 700; text-transform: uppercase; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.wrap { padding: 24px 18px 40px; }
.title { font-size: 26px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 2px; margin-bottom: 22px; }

.card { background: var(--bg); border-radius: 22px; padding: 18px; margin-bottom: 16px; box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
textarea, input { width: 100%; border: none; background: var(--bg); padding: 12px 14px; border-radius: 14px; font-size: 14px; font-family: inherit; color: var(--text); resize: none; box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
textarea { min-height: 60px; line-height: 1.5; }
textarea:focus, input:focus { outline: none; }

.speakers { display: flex; gap: 10px; }
.speaker { flex: 1; padding: 12px 8px; border-radius: 14px; text-align: center; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.speaker .dot { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 6px; color: white; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 6px var(--sd); }
.speaker .nm { font-size: 12px; font-weight: 700; }
.speaker .sub { font-size: 9px; color: var(--text2); font-weight: 600; margin-top: 2px; }

.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; padding: 14px; border-radius: 18px; border: none; font-size: 14px; font-weight: 700; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: 6px 6px 14px var(--sd), -5px -5px 14px var(--sl); cursor: pointer; }
.btn:active { box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 10px var(--sl); transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { color: white; background: linear-gradient(135deg, #6b7eff, #4961ff); }
.btn.primary:disabled { background: #aaa; }
.btn.danger { color: #b04040; }
.btn.compact { flex: 0 0 auto; min-width: auto; padding: 10px 16px; font-size: 12px; }

.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; animation: fade 0.3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg .dot { width: 36px; height: 36px; border-radius: 50%; color: white; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 8px var(--sd); }
.msg .body { background: var(--bg); padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.6; box-shadow: 4px 4px 10px var(--sd), -3px -3px 10px var(--sl); white-space: pre-wrap; word-break: break-word; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
.msg .meta { font-size: 9px; color: var(--text3); }
.msg.thinking .body { color: var(--text2); font-style: italic; display: flex; align-items: center; gap: 8px; }
.msg.thinking .dot { animation: dot-pulse 1.4s ease-in-out infinite; }
@keyframes dot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.85); opacity: 0.55; } }
.spinner { width: 12px; height: 12px; border: 2px solid rgba(73,97,255,0.2); border-top-color: #4961ff; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.elapsed { font-size: 10px; color: var(--text3); margin-left: 4px; font-variant-numeric: tabular-nums; }

.msg.system .body { background: rgba(154,160,184,0.12); color: var(--text2); font-size: 12.5px; line-height: 1.6; }
.msg.system .who { color: var(--text3); }
.summary-card { margin-top: 16px; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, #fff4e0, #ffe7d0); box-shadow: 6px 6px 14px var(--sd), -4px -4px 12px var(--sl); white-space: pre-wrap; word-break: break-word; }
.summary-card .label { color: #a86a2b; }
.summary-card .text { font-size: 13.5px; line-height: 1.7; color: #5a3a1a; white-space: pre-wrap; }

.session-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 12px; border-radius: 14px; cursor: pointer; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 10px var(--sl); margin-bottom: 10px; }
.session-row:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.99); }
.session-row .topic { font-size: 13px; font-weight: 700; flex: 1; margin-right: 10px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.session-row .meta { font-size: 10px; color: var(--text3); font-weight: 600; text-align: right; min-width: 90px; }
.session-row .badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-bottom: 4px; }
.session-row .badge.active { background: #e0e7ff; color: #4961ff; }
.session-row .badge.auto { background: #fff4e0; color: #a86a2b; }
.session-row .badge.completed { background: #d4f0d4; color: #2a8c3a; }
.session-row .badge.failed { background: #fbd5d5; color: #b04040; }

.empty { text-align: center; color: var(--text3); font-size: 12px; padding: 30px 0; font-weight: 600; }
.note { font-size: 10px; color: var(--text3); text-align: center; margin-top: 6px; font-weight: 600; }
.status-line { font-size: 11px; color: var(--text2); margin-top: 8px; font-weight: 600; text-align: center; }

.err { color: var(--err); font-size: 11px; margin-top: 10px; font-weight: 600; padding: 10px 12px; border-radius: 12px; background: rgba(176, 64, 64, 0.08); white-space: pre-wrap; word-break: break-all; cursor: pointer; line-height: 1.5; max-height: 200px; overflow: auto; font-family: ui-monospace, Menlo, monospace; }
.err:empty { display: none; padding: 0; }
.err::before { content: "📋 タップでコピー  "; font-weight: 800; color: var(--text3); font-family: 'Outfit', sans-serif; }
.err.copied::before { content: "✅ コピーしました  "; color: #2a8c3a; }

.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>

<div class="bar">
  <span class="hint">AI Kaigi</span>
  <button class="pill" onclick="location.href='/'">← 戻る</button>
</div>

<div class="wrap">
  <div class="title">AI会議</div>
  <div class="subtitle">Gemini / Claude / GPT の3者で検討して結論を出す</div>

  <!-- 一覧ビュー -->
  <div class="view active" id="listView">
    <div class="card">
      <div class="label">新しい会議</div>
      <textarea id="newTopic" placeholder="例: 来期、AI受託開発の新規事業を立ち上げるべきか？市場規模・競合・自社の強み・必要な投資・撤退ラインまで含めて検討してほしい。"></textarea>
      <div class="actions">
        <button class="btn primary" id="createBtn" onclick="createSession()">この議題で会議を作る</button>
      </div>
    </div>

    <div class="card">
      <div class="label">参加者（固定）</div>
      <div class="speakers" id="speakersPreview"></div>
    </div>

    <div class="card">
      <div class="label">過去の会議</div>
      <div id="sessionList"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="err" id="listErr"></div>
  </div>

  <!-- セッション詳細ビュー -->
  <div class="view" id="sessionView">
    <div class="card">
      <div class="actions" style="margin-top: 0;">
        <button class="btn compact" onclick="showList()">← 一覧</button>
        <button class="btn compact danger" onclick="deleteSession()">削除</button>
      </div>
      <div class="label" style="margin-top: 14px;">お題</div>
      <div id="topicView" style="font-size: 14px; font-weight: 600; line-height: 1.5;"></div>
      <textarea id="topicEdit" style="display:none; margin-top: 6px;"></textarea>
      <div class="status-line" id="sessionStatus"></div>
    </div>

    <div class="err" id="sessionErr"></div>

    <div class="card" style="margin-top: 20px;">
      <div class="label">検討ログ</div>
      <div class="chat" id="chat"><div class="empty">下の「会議スタート」を押すと検討が始まります</div></div>
      <div id="conclusionWrap"></div>
    </div>
  </div>
</div>

<!-- 画面下固定ボタン（セッション詳細時のみ。状態で出し分け） -->
<div class="fixed-footer" id="fixedFooter">
  <!-- 未開始 / 結論なし: スタートボタン -->
  <div class="row" id="startRow">
    <button class="btn primary" id="startBtn" onclick="startKaigi()">🚀 会議スタート（3R→結論）</button>
  </div>
  <!-- 自動進行中 -->
  <div class="row" id="autoRow" style="display:none;">
    <button class="btn" id="stopAutoBtn" onclick="stopAuto()">⏸ 自動進行を止める</button>
  </div>
  <!-- 完了後: 延長 -->
  <div class="row" id="extendRow" style="display:none;">
    <button class="btn primary" id="editExtendBtn" onclick="openEditExtend()">✏️ 議題編集して+3R</button>
    <button class="btn" id="sameExtendBtn" onclick="extendSame()">🔄 そのまま+3R</button>
  </div>
  <!-- 議題編集中 -->
  <div class="row" id="editRow" style="display:none;">
    <button class="btn primary" id="confirmEditBtn" onclick="confirmEditExtend()">この議題で+3R</button>
    <button class="btn" onclick="cancelEdit()">キャンセル</button>
  </div>
  <!-- 共通: リセット -->
  <div class="row">
    <button class="btn tiny danger" id="resetBtn" onclick="resetSession()">リセット（履歴クリア）</button>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const SPEAKERS = [
  { name: "Gemini", provider: "gemini", short: "G", color: "var(--gemini)" },
  { name: "Claude", provider: "claude", short: "C", color: "var(--claude)" },
  { name: "GPT",    provider: "gpt",    short: "Φ", color: "var(--gpt)" },
];
const speakerOf = (name) => SPEAKERS.find((s) => s.name === name) || SPEAKERS[0];

const state = {
  view: "list",
  sessionId: null,
  session: null,
  messages: [],
  busy: false,
  pollTimer: null,
  editing: false,
};

const $ = (id) => document.getElementById(id);
const errList = (m) => { $("listErr").textContent = m || ""; };
const errSession = (m) => { $("sessionErr").textContent = m || ""; };

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

const fmtDate = (s) => {
  if (!s) return "";
  const d = new Date(s);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return sameDay
    ? d.toTimeString().slice(0, 5)
    : `${d.getMonth() + 1}/${d.getDate()} ${d.toTimeString().slice(0, 5)}`;
};

function renderSpeakersPreview() {
  const wrap = $("speakersPreview");
  wrap.innerHTML = "";
  for (const s of SPEAKERS) {
    const d = document.createElement("div");
    d.className = "speaker";
    d.innerHTML = `<div class="dot" style="background:${s.color}">${s.short}</div><div class="nm">${s.name}</div><div class="sub">${s.provider}</div>`;
    wrap.appendChild(d);
  }
}

// ─── view 切替 ───
function showList() {
  stopPoll();
  state.view = "list";
  state.sessionId = null;
  state.session = null;
  state.messages = [];
  errSession("");
  $("listView").classList.add("active");
  $("sessionView").classList.remove("active");
  $("fixedFooter").classList.remove("show");
  loadSessionList();
}

async function openSession(id) {
  state.view = "session";
  state.sessionId = id;
  errList(""); errSession("");
  $("listView").classList.remove("active");
  $("sessionView").classList.add("active");
  $("fixedFooter").classList.add("show");
  await refreshSession();
}

window.showList = showList;
window.openSession = openSession;

// ─── 一覧 ───
async function loadSessionList() {
  errList("");
  const wrap = $("sessionList");
  wrap.innerHTML = `<div class="empty">読み込み中…</div>`;
  try {
    const list = await api("GET", "/api/kaigi/sessions");
    if (!list.length) {
      wrap.innerHTML = `<div class="empty">まだ会議はありません</div>`;
      return;
    }
    wrap.innerHTML = "";
    for (const s of list) {
      const div = document.createElement("div");
      div.className = "session-row";
      const badgeClass = s.status;
      const badgeLabel = { active: "進行中", auto: "自動進行中", completed: "完了", failed: "失敗" }[s.status] || s.status;
      div.innerHTML = `
        <div class="topic">${escapeHtml(s.topic)}</div>
        <div class="meta">
          <div class="badge ${badgeClass}">${badgeLabel}</div>
          <div>${s.msg_count}発言 ${s.has_conclusion ? "🏛️" : ""}</div>
          <div>${fmtDate(s.updated_at)}</div>
        </div>`;
      div.onclick = () => openSession(s.id);
      wrap.appendChild(div);
    }
  } catch (e) {
    errList(e.message);
    wrap.innerHTML = "";
  }
}

async function createSession() {
  errList("");
  const topic = $("newTopic").value.trim();
  if (!topic) { errList("お題を入れてください"); return; }
  if (state.busy) return;
  state.busy = true;
  $("createBtn").disabled = true;
  try {
    const s = await api("POST", "/api/kaigi/sessions", {
      topic,
      speakers: SPEAKERS.map(({ name, provider }) => ({ name, provider })),
    });
    $("newTopic").value = "";
    await openSession(s.id);
  } catch (e) {
    errList(e.message);
  } finally {
    state.busy = false;
    $("createBtn").disabled = false;
  }
}
window.createSession = createSession;

// ─── セッション詳細 ───
async function refreshSession() {
  if (!state.sessionId) return;
  try {
    const { session, messages } = await api("GET", `/api/kaigi/sessions/${state.sessionId}`);
    state.session = session;
    state.messages = messages;
    // メッセージが増えてたら thinking タイマーをリセット
    if (messages.length !== lastMsgCount) {
      lastMsgCount = messages.length;
      if (session.status === "auto") resetThinkingTimer();
    }
    renderSession();
    if (session.status === "auto") {
      ensurePoll();
      if (!thinkingStartedAt) resetThinkingTimer();
    } else {
      stopPoll();
      stopThinkingTimer();
    }
  } catch (e) {
    errSession(e.message);
  }
}

function renderSession() {
  if (!state.session) return;
  $("topicView").textContent = state.session.topic;
  const ext = state.session.extension_count || 0;
  const remaining = state.session.auto_rounds_remaining;
  const statusMap = {
    active: ext > 0 ? `準備完了（延長 ${ext} 回済）` : "準備完了",
    auto: `自動進行中（残り ${remaining}R）${ext > 0 ? ` ／延長 ${ext} 回目` : ""}`,
    completed: ext > 0 ? `完了（延長 ${ext} 回）` : "完了",
    failed: `失敗: ${state.session.last_error || ""}`,
  };
  $("sessionStatus").textContent = statusMap[state.session.status] || state.session.status;

  const speeches = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote);
  const systemNotes = state.messages.filter((m) => m.isSystemNote);
  const concl = state.messages.find((m) => m.isConclusion);
  const isAuto = state.session.status === "auto";
  const isCompleted = state.session.status === "completed" || !!concl;

  // フッターの出し分け
  $("startRow").style.display = "none";
  $("autoRow").style.display = "none";
  $("extendRow").style.display = "none";
  $("editRow").style.display = "none";
  $("topicEdit").style.display = "none";
  $("topicView").style.display = "";
  if (state.editing) {
    $("editRow").style.display = "flex";
    $("topicEdit").style.display = "";
    $("topicView").style.display = "none";
  } else if (isAuto) {
    $("autoRow").style.display = "flex";
  } else if (isCompleted) {
    $("extendRow").style.display = "flex";
  } else {
    $("startRow").style.display = "flex";
  }

  $("startBtn").disabled = state.busy;
  $("stopAutoBtn").disabled = state.busy;
  $("editExtendBtn").disabled = state.busy;
  $("sameExtendBtn").disabled = state.busy;
  $("confirmEditBtn").disabled = state.busy;
  $("resetBtn").disabled = isAuto || state.busy || !state.messages.length;

  // チャット
  const chat = $("chat");
  // 表示は speech + systemNote（順番通り）
  const visible = state.messages.filter((m) => !m.isConclusion);
  if (!visible.length) {
    chat.innerHTML = `<div class="empty">下の「会議スタート」を押すと検討が始まります</div>`;
  } else {
    chat.innerHTML = "";
    for (const m of visible) {
      const div = document.createElement("div");
      if (m.isSystemNote) {
        div.className = "msg system";
        div.innerHTML = `
          <div class="dot" style="background:#9aa0b8">📋</div>
          <div>
            <div class="who">司会（システム）</div>
            <div class="body">${escapeHtml(m.content)}</div>
          </div>`;
      } else {
        const s = speakerOf(m.speaker);
        div.className = "msg";
        div.innerHTML = `
          <div class="dot" style="background:${s.color}">${s.short}</div>
          <div>
            <div class="who">${escapeHtml(m.speaker)} <span class="meta">R${m.roundNum} · ${m.modelUsed || m.provider}</span></div>
            <div class="body">${escapeHtml(m.content)}</div>
          </div>`;
      }
      chat.appendChild(div);
    }
  }
  // thinking placeholder (auto 中も次の speaker が出るまで待ち状態)
  if (isAuto) {
    const next = SPEAKERS[speeches.length % SPEAKERS.length];
    const div = document.createElement("div");
    div.className = "msg thinking";
    div.innerHTML = `
      <div class="dot" style="background:${next.color}">${next.short}</div>
      <div>
        <div class="who">${next.name}</div>
        <div class="body"><div class="spinner"></div>考え中<span class="elapsed" id="thinkingElapsed"></span></div>
      </div>`;
    chat.appendChild(div);
    updateThinkingElapsed();
  }

  // 結論
  if (concl) {
    $("conclusionWrap").innerHTML = `<div class="summary-card"><div class="label">結論${ext > 0 ? `（延長 ${ext} 回後）` : ""}</div><div class="text">${escapeHtml(concl.content)}</div></div>`;
  } else {
    $("conclusionWrap").innerHTML = "";
  }
  chat.scrollIntoView({ behavior: "smooth", block: "end" });
}

// 会議スタート（3R + 自動結論）
async function startKaigi() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    const r = await api("POST", `/api/kaigi/sessions/${state.sessionId}/auto`, { rounds: 3 });
    if (r.note) errSession(`⚠️ ${r.note}`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.startKaigi = startKaigi;

// 延長: 議題そのまま +3R
async function extendSame() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/extend`, { rounds: 3 });
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.extendSame = extendSame;

// 延長: 議題編集モード開始
function openEditExtend() {
  if (!state.session) return;
  state.editing = true;
  $("topicEdit").value = state.session.topic;
  renderSession();
  setTimeout(() => $("topicEdit").focus(), 50);
}
window.openEditExtend = openEditExtend;

function cancelEdit() {
  state.editing = false;
  renderSession();
}
window.cancelEdit = cancelEdit;

async function confirmEditExtend() {
  if (state.busy || !state.sessionId) return;
  const newTopic = $("topicEdit").value.trim();
  if (!newTopic) { errSession("議題を入れてください"); return; }
  errSession("");
  state.busy = true;
  state.editing = false;
  renderSession();
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/extend`, { rounds: 3, newTopic });
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.confirmEditExtend = confirmEditExtend;

async function stopAuto() {
  if (!state.sessionId) return;
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/auto/stop`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  }
}
window.stopAuto = stopAuto;

async function resetSession() {
  if (state.busy || !state.sessionId) return;
  if (!confirm("このセッションの履歴を全部消して、同じお題で最初からやり直しますか？")) return;
  errSession("");
  state.busy = true;
  $("resetBtn").disabled = true;
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/reset`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
    $("resetBtn").disabled = false;
  }
}
window.resetSession = resetSession;

async function deleteSession() {
  if (!state.sessionId) return;
  if (!confirm("この会議を削除しますか？")) return;
  try {
    await api("DELETE", `/api/kaigi/sessions/${state.sessionId}`);
    showList();
  } catch (e) {
    errSession(e.message);
  }
}
window.deleteSession = deleteSession;

// ─── ポーリング（自動進行中の更新取得） ───
function ensurePoll() {
  if (state.pollTimer) return;
  state.pollTimer = setInterval(refreshSession, 5000);
}
function stopPoll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

// thinking 経過秒数の表示（1秒ごとに更新）
let thinkingTimer = null;
let thinkingStartedAt = null;
let lastMsgCount = 0;
function updateThinkingElapsed() {
  const el = $("thinkingElapsed");
  if (!el || !thinkingStartedAt) return;
  const sec = Math.floor((Date.now() - thinkingStartedAt) / 1000);
  const min = Math.floor(sec / 60);
  el.textContent = ` (${min ? min + "分" : ""}${sec % 60}秒経過)`;
  // 60秒超えても進まなければ停滞警告
  if (sec > 60) {
    el.textContent += " — 詰まってる可能性あり";
    el.style.color = "var(--err)";
  }
}
function ensureThinkingTimer() {
  if (!thinkingTimer) thinkingTimer = setInterval(updateThinkingElapsed, 1000);
}
function resetThinkingTimer() {
  thinkingStartedAt = Date.now();
  ensureThinkingTimer();
}
function stopThinkingTimer() {
  if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
  thinkingStartedAt = null;
}

// ─── API 呼び出し（Firebase ID token 付き） ───
let authToken = null;
let firebaseUser = null;
async function ensureToken() {
  if (firebaseUser) authToken = await firebaseUser.getIdToken();
  if (!authToken) throw new Error("ログインが切れました。トップへ戻ってログインし直してください。");
}
async function api(method, path, body) {
  await ensureToken();
  const res = await fetch(window.API_BASE + path, {
    method,
    headers: {
      authorization: "Bearer " + authToken,
      ...(body ? { "content-type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

// ─── エラータップでコピー ───
function bindErrCopy(id) {
  const el = $(id);
  el.addEventListener("click", () => {
    const t = el.textContent;
    if (!t) return;
    navigator.clipboard?.writeText(t).then(() => {
      el.classList.add("copied");
      setTimeout(() => el.classList.remove("copied"), 1500);
    });
  });
}
bindErrCopy("listErr");
bindErrCopy("sessionErr");

renderSpeakersPreview();

// ─── 認証 → 一覧ロード ───
(async () => {
  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    cfg.authDomain = location.hostname;
    const auth = getAuth(initializeApp(cfg));
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
      firebaseUser = user;
      authToken = await user.getIdToken();
      setInterval(async () => { authToken = await user.getIdToken(true); }, 30 * 60 * 1000);
      loadSessionList();
    });
  } catch (e) {
    errList("認証初期化エラー: " + e.message);
  }
})();
</script>
</body>
