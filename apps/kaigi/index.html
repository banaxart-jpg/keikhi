<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI会議</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 1.1em; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.btn .icon { margin-right: 6px; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --gemini: #4285f4; --claude: #d97706; --gpt: #10a37f;
  --err: #b04040;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 220px; }

.fixed-footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(228,230,238,0) 0%, rgba(228,230,238,0.95) 30%, rgba(228,230,238,1) 70%); display: none; flex-direction: column; gap: 8px; z-index: 100; }
.fixed-footer.show { display: flex; }
.fixed-footer .row { display: flex; gap: 10px; }
.fixed-footer .row .btn { flex: 1; }
.fixed-footer .btn.tiny { padding: 8px; font-size: 11px; }
.fixed-footer .edit-mode { padding: 6px 4px 4px; }
.fixed-footer .edit-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.fixed-footer .edit-mode textarea { width: 100%; min-height: 100px; max-height: 220px; padding: 12px 14px; border-radius: 14px; border: none; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); font-family: 'Outfit', -apple-system, sans-serif; font-size: 14px; line-height: 1.5; resize: vertical; color: var(--text); }
.fixed-footer .edit-mode textarea:focus { outline: none; box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl), 0 0 0 2px rgba(73,97,255,0.3); }
.fixed-footer .edit-mode .edit-buttons { display: flex; gap: 10px; }
.fixed-footer .edit-mode .edit-buttons .btn { flex: 1; }
body.editing { padding-bottom: 360px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 20px 0; }
.hint { font-size: 11px; letter-spacing: 0.22em; color: var(--text3); font-weight: 700; text-transform: uppercase; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.wrap { padding: 24px 18px 40px; }
.title { font-size: 26px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 2px; margin-bottom: 22px; }

.card { background: var(--bg); border-radius: 22px; padding: 18px; margin-bottom: 16px; box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
textarea, input { width: 100%; border: none; background: var(--bg); padding: 12px 14px; border-radius: 14px; font-size: 14px; font-family: inherit; color: var(--text); resize: none; box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
textarea { min-height: 140px; line-height: 1.6; font-size: 15px; }
textarea:focus, input:focus { outline: none; }

.speakers { display: flex; gap: 10px; }
.speaker { flex: 1; padding: 12px 8px; border-radius: 14px; text-align: center; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.speaker .dot { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 6px; color: white; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 6px var(--sd); }
.speaker .nm { font-size: 12px; font-weight: 700; }
.speaker .sub { font-size: 9px; color: var(--text2); font-weight: 600; margin-top: 2px; }

.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 120px; padding: 14px; border-radius: 18px; border: none; font-size: 14px; font-weight: 700; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: 6px 6px 14px var(--sd), -5px -5px 14px var(--sl); cursor: pointer; }
.btn:active { box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 10px var(--sl); transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { color: white; background: linear-gradient(135deg, #6b7eff, #4961ff); }
.btn.primary:disabled { background: #aaa; }
.btn.danger { color: #b04040; }
.btn.compact { flex: 0 0 auto; min-width: auto; padding: 10px 16px; font-size: 12px; }

.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; animation: fade 0.3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg .dot { width: 36px; height: 36px; border-radius: 50%; color: white; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 8px var(--sd); }
.msg .body { background: var(--bg); padding: 10px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.6; box-shadow: 4px 4px 10px var(--sd), -3px -3px 10px var(--sl); white-space: pre-wrap; word-break: break-word; }
.msg .who { font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
.msg .meta { font-size: 9px; color: var(--text3); }
.msg.thinking .body { color: var(--text2); font-style: italic; display: flex; align-items: center; gap: 8px; }
.msg.thinking .dot { animation: dot-pulse 1.4s ease-in-out infinite; }
@keyframes dot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.85); opacity: 0.55; } }
.spinner { width: 12px; height: 12px; border: 2px solid rgba(73,97,255,0.2); border-top-color: #4961ff; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.elapsed { font-size: 10px; color: var(--text3); margin-left: 4px; font-variant-numeric: tabular-nums; }

.msg.system .body { background: rgba(154,160,184,0.12); color: var(--text2); font-size: 12.5px; line-height: 1.6; }
.msg.system .who { color: var(--text3); }
.summary-card { margin-top: 16px; padding: 20px 18px; border-radius: 18px; background: linear-gradient(135deg, #fff4e0, #ffe7d0); box-shadow: 6px 6px 14px var(--sd), -4px -4px 12px var(--sl); word-break: break-word; }
.summary-card .label { color: #a86a2b; }
.summary-card .headline { font-size: 17px; font-weight: 800; color: #4a2e0a; line-height: 1.4; margin: 4px 0 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(168, 106, 43, 0.25); }
.summary-card .detail { font-size: 13.5px; line-height: 1.85; color: #5a3a1a; white-space: pre-wrap; }
.summary-card .sub-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: #a86a2b; margin: 14px 0 6px; text-transform: uppercase; }
.summary-card .sub-text { font-size: 12px; line-height: 1.6; color: #6a4520; white-space: pre-wrap; }

.session-row { display: flex; flex-direction: column; padding: 14px 14px; border-radius: 14px; cursor: pointer; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 10px var(--sl); margin-bottom: 10px; gap: 8px; }
.session-row:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.99); }
.session-row .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.session-row .topic { font-size: 11px; color: var(--text2); font-weight: 600; flex: 1; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.session-row .row-del { background: transparent; border: none; color: var(--text3); font-size: 18px; font-weight: 700; padding: 2px 8px; cursor: pointer; line-height: 1; align-self: flex-start; flex-shrink: 0; border-radius: 50%; }
.session-row .row-del:hover { color: var(--err); }
.session-row .row-del:active { transform: scale(0.85); background: rgba(176,64,64,0.1); }
.session-row .conclusion { font-size: 13.5px; font-weight: 800; color: var(--text); line-height: 1.45; padding-top: 2px; border-top: 1px solid rgba(168,172,192,0.25); padding-top: 8px; }

.session-row .thread { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.session-row .turn { padding-top: 10px; border-top: 1px solid rgba(168,172,192,0.3); }
.session-row .turn:first-child { padding-top: 0; border-top: none; }
.session-row .turn-label { font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.session-row .turn-topic { font-size: 11px; color: var(--text2); font-weight: 600; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.session-row .turn-headline { font-size: 13.5px; font-weight: 800; color: var(--text); line-height: 1.45; }
.session-row .turn-pending { font-size: 12px; color: var(--text3); font-style: italic; }
.session-row .meta { font-size: 10px; color: var(--text3); font-weight: 600; text-align: right; min-width: 90px; flex-shrink: 0; }
.session-row .badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-bottom: 4px; }
.session-row .badge.active { background: #e0e7ff; color: #4961ff; }
.session-row .badge.auto { background: #fff4e0; color: #a86a2b; }
.session-row .badge.completed { background: #d4f0d4; color: #2a8c3a; }
.session-row .badge.failed { background: #fbd5d5; color: #b04040; }

.empty { text-align: center; color: var(--text3); font-size: 12px; padding: 30px 0; font-weight: 600; }
.note { font-size: 10px; color: var(--text3); text-align: center; margin-top: 6px; font-weight: 600; }
.status-line { font-size: 11px; color: var(--text2); margin-top: 8px; font-weight: 600; text-align: center; }

.steps { display: flex; gap: 6px; margin-top: 12px; justify-content: center; }
.steps .step { flex: 1; max-width: 64px; padding: 6px 4px; border-radius: 10px; font-size: 10px; font-weight: 700; text-align: center; background: rgba(154,160,184,0.15); color: var(--text3); letter-spacing: 0.04em; }
.steps .step.done { background: #d4f0d4; color: #2a8c3a; }
.steps .step.active { background: linear-gradient(135deg, #6b7eff, #4961ff); color: white; animation: pulse 1.6s ease-in-out infinite; }
.steps .step.completed { background: linear-gradient(135deg, #ffae5e, #ff8a5b); color: white; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }

.next-topic-btn { margin-top: 16px; width: 100%; padding: 14px; border-radius: 14px; border: none; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #6b7eff, #4961ff); box-shadow: 4px 4px 10px var(--sd); }
.next-topic-btn:active { transform: scale(0.98); box-shadow: inset 2px 2px 6px rgba(0,0,0,0.15); }
.next-topic-btn:disabled { opacity: 0.5; }

/* 結論後のチャット (アシスタントAI Gemini Flash と1対1) */
.chat-card { margin-top: 16px; padding: 18px; border-radius: 18px; background: var(--bg); box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl); }
.chat-card .label { color: var(--text2); margin-bottom: 12px; }
.chat-thread { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 400px; overflow-y: auto; }
.chat-thread:empty::before { content: "結論について質問したり、補足情報を追加したり、次の議題を相談できる"; font-size: 11.5px; color: var(--text3); font-style: italic; text-align: center; padding: 16px 0; display: block; }
.chat-msg { display: grid; gap: 4px; padding: 8px 10px; border-radius: 12px; max-width: 88%; }
.chat-msg .who { font-size: 9px; font-weight: 800; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; }
.chat-msg .body { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.chat-msg.user { background: rgba(73,97,255,0.1); align-self: flex-end; }
.chat-msg.user .who { color: #4961ff; }
.chat-msg.assistant { background: rgba(255,255,255,0.6); align-self: flex-start; }
.chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-input-row textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 12px; border-radius: 12px; border: none; background: var(--bg); box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 6px var(--sl); font-family: inherit; font-size: 13px; line-height: 1.4; resize: none; color: var(--text); }
.chat-input-row textarea:focus { outline: none; }
.chat-send-btn { padding: 0 16px; height: 44px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6b7eff, #4961ff); color: white; font-weight: 800; font-size: 13px; font-family: inherit; cursor: pointer; box-shadow: 3px 3px 8px var(--sd); flex-shrink: 0; }
.chat-send-btn:disabled { opacity: 0.5; }
.chat-send-btn:active:not(:disabled) { transform: scale(0.95); box-shadow: inset 2px 2px 6px rgba(0,0,0,0.15); }
.chat-start-r2-btn { margin-top: 10px; margin-bottom: 4px; width: 100%; padding: 12px; border-radius: 12px; border: none; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); }
.chat-start-r2-btn:disabled { opacity: 0.45; }
.chat-start-r2-btn:active:not(:disabled) { transform: scale(0.98); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }

.err { color: var(--err); font-size: 11px; margin-top: 10px; font-weight: 600; padding: 10px 12px; border-radius: 12px; background: rgba(176, 64, 64, 0.08); white-space: pre-wrap; word-break: break-all; cursor: pointer; line-height: 1.5; max-height: 200px; overflow: auto; font-family: ui-monospace, Menlo, monospace; }
.err:empty { display: none; padding: 0; }
.err::before { content: "タップでコピー"; font-weight: 800; color: var(--text3); font-family: 'Outfit', sans-serif; }
.err.copied::before { content: "コピーしました"; color: #2a8c3a; }

.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>

<div class="bar">
  <span class="hint">AI Kaigi</span>
  <button class="pill" onclick="location.href='/'">← 戻る</button>
</div>

<div class="wrap">
  <div class="title">AI会議</div>
  <div class="subtitle">Gemini / Claude / GPT の3者で検討して結論を出す</div>

  <!-- 一覧ビュー -->
  <div class="view active" id="listView">
    <div class="card">
      <div class="label">新しい会議</div>
      <textarea id="newTopic" placeholder="例: 来期、AI受託開発の新規事業を立ち上げるべきか？市場規模・競合・自社の強み・必要な投資・撤退ラインまで含めて検討してほしい。"></textarea>
      <div class="speakers-mini" style="font-size: 10px; color: var(--text3); text-align: center; margin: 8px 0 -4px; font-weight: 600; letter-spacing: 0.06em;">Gemini ・ Claude ・ GPT の3者で検討</div>
      <div class="actions">
        <button class="btn primary" id="createBtn" onclick="createSession()">この議題で会議を作る</button>
      </div>
    </div>

    <div class="card">
      <div class="label">過去の会議</div>
      <div id="sessionList"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="err" id="listErr"></div>
  </div>

  <!-- セッション詳細ビュー -->
  <div class="view" id="sessionView">
    <div class="card">
      <div class="actions" style="margin-top: 0;">
        <button class="btn compact" onclick="showList()">← 一覧</button>
        <button class="btn compact danger" onclick="deleteSession()">削除</button>
      </div>
      <div class="label" style="margin-top: 14px;">お題</div>
      <div id="topicView" style="font-size: 14px; font-weight: 600; line-height: 1.5;"></div>
      <div class="steps" id="steps"></div>
      <div class="status-line" id="sessionStatus"></div>
    </div>

    <div class="err" id="sessionErr"></div>

    <div class="card" style="margin-top: 20px;">
      <div class="label">検討ログ</div>
      <div class="chat" id="chat"><div class="empty">下の「会議スタート」を押すと検討が始まります</div></div>
      <div id="conclusionWrap"></div>
    </div>
  </div>
</div>

<!-- 画面下固定ボタン（セッション詳細時のみ。状態で出し分け） -->
<div class="fixed-footer" id="fixedFooter">
  <!-- 未開始 / 結論なし: スタートボタン -->
  <div class="row" id="startRow">
    <button class="btn primary" id="startBtn" onclick="startKaigi()"><span class="icon">rocket_launch</span>会議スタート（3R→結論）</button>
  </div>
  <!-- 自動進行中 -->
  <div class="row" id="autoRow" style="display:none;">
    <button class="btn" id="stopAutoBtn" onclick="stopAuto()"><span class="icon">pause</span>自動進行を止める</button>
  </div>
  <!-- 途中停止: 続きから or 強制結論 -->
  <div class="row" id="resumeRow" style="display:none;">
    <button class="btn primary" id="resumeBtn" onclick="resumeAuto()"><span class="icon">play_arrow</span>続きから進める</button>
    <button class="btn" id="forceConcludeBtn" onclick="doForceConclude()"><span class="icon">flag</span>ここで結論を出す</button>
  </div>
  <!-- 完了後: 結論に不満なときの再検討（次の議題は結論カード内のボタンへ） -->
  <div class="row" id="extendRow" style="display:none;">
    <button class="btn" id="editExtendBtn" onclick="openEditExtend()"><span class="icon">edit</span>議題編集して再検討</button>
    <button class="btn" id="sameExtendBtn" onclick="extendSame()"><span class="icon">refresh</span>そのまま再検討</button>
  </div>
  <!-- 議題編集中（議題編集して再検討 / 次の議題 共通）— フッター内に textarea とボタン -->
  <div class="row edit-mode" id="editRow" style="display:none; flex-direction: column;">
    <div class="edit-label" id="editLabel"></div>
    <textarea id="topicEditInline" placeholder=""></textarea>
    <div class="edit-buttons">
      <button class="btn primary" id="confirmEditBtn" onclick="confirmEdit()">この議題で+3R</button>
      <button class="btn" onclick="cancelEdit()">キャンセル</button>
    </div>
  </div>
  <!-- 共通: リセット -->
  <div class="row">
    <button class="btn tiny danger" id="resetBtn" onclick="resetSession()">リセット（履歴クリア）</button>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const SPEAKERS = [
  { name: "Gemini", provider: "gemini", short: "G", color: "var(--gemini)" },
  { name: "Claude", provider: "claude", short: "C", color: "var(--claude)" },
  { name: "GPT",    provider: "gpt",    short: "Φ", color: "var(--gpt)" },
];
const speakerOf = (name) => SPEAKERS.find((s) => s.name === name) || SPEAKERS[0];

const state = {
  view: "list",
  sessionId: null,
  session: null,
  messages: [],
  busy: false,
  pollTimer: null,
  editing: false,
};

const $ = (id) => document.getElementById(id);
const errList = (m) => { $("listErr").textContent = m || ""; };
const errSession = (m) => { $("sessionErr").textContent = m || ""; };

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

// 結論テキストを【ひと言結論】【結論】【3者の立場の違い / 未解決の論点】に分解
// topic_summary から「【核の問い】」部分だけを取り出す（一覧の見出し用）
function extractCoreQuestion(topicSummary) {
  if (!topicSummary) return null;
  const m = String(topicSummary).match(/【核の問い】\s*\n?([\s\S]+?)(?=\n【|$)/);
  return m ? m[1].trim() : null;
}

// 表示用の議題: 長文お題なら topic_summary の核の問いを優先、なければ topic
// 一覧 API は topicSummary (camel)、詳細 API は SELECT * のため topic_summary (snake) で返るので両対応
function displayTopic(session) {
  if (!session) return "";
  const ts = session.topicSummary || session.topic_summary;
  return extractCoreQuestion(ts) || session.topic || "";
}

// system note の content から「新しい議題」を抽出
function extractNewTopicFromNote(content) {
  const c = String(content || "");
  // 議題編集: 「新議題:「◯◯」」
  let m = c.match(/新議題[:：]\s*[「『]([^」』]+)[」』]/);
  if (m) return m[1].trim();
  // 次の議題に進む: 「【新しい議題】\n◯◯」
  m = c.match(/【新しい議題】\s*\n?([\s\S]+?)(?=\n【|$)/);
  if (m) return m[1].trim().slice(0, 300);
  return null;
}

// セッションの議題変更履歴と結論を時系列でマージし、各「ターン」(議題＋結論ペア) を構築
function buildTurns(session, conclusions, topicChanges) {
  const turns = [];
  // 最初の議題は長文の可能性が高いので core question を優先
  let initialTopic = displayTopic(session);
  const sortedChanges = [...topicChanges].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  for (let i = 0; i < conclusions.length; i++) {
    const concl = conclusions[i];
    const conclTime = new Date(concl.createdAt).getTime();
    let topic = initialTopic;
    for (const tc of sortedChanges) {
      const tcTime = new Date(tc.createdAt).getTime();
      if (tcTime < conclTime) topic = tc.topic;
      else break;
    }
    const parsed = parseConclusion(concl.content);
    turns.push({ topic, headline: parsed.headline || "", conclusionId: concl.id });
  }
  // 最後の結論より後にも議題変更があれば、未結論ターンを追加
  const lastConclTime = conclusions.length ? new Date(conclusions[conclusions.length - 1].createdAt).getTime() : 0;
  const pending = sortedChanges.filter((tc) => new Date(tc.createdAt).getTime() > lastConclTime);
  if (pending.length > 0) {
    turns.push({
      topic: pending[pending.length - 1].topic,
      headline: null,
      pendingLabel: session.status === "auto" ? "検討中…" : session.status === "completed" ? "" : "未完",
    });
  } else if (conclusions.length === 0) {
    turns.push({
      topic: initialTopic,
      headline: null,
      pendingLabel: session.status === "auto" ? "検討中…" : "未開始",
    });
  }
  return turns;
}

function parseConclusion(raw) {
  const text = String(raw || "");
  const headers = [
    { key: "headline",   pattern: /【ひと言結論】/ },
    { key: "detail",     pattern: /【結論】/ },
    { key: "unresolved", pattern: /【3者の立場の違い[^】]*】/ },
  ];
  const indices = headers.map((h) => {
    const m = h.pattern.exec(text);
    return m ? { ...h, start: m.index, headerEnd: m.index + m[0].length } : null;
  }).filter(Boolean).sort((a, b) => a.start - b.start);
  const out = { headline: "", detail: "", unresolved: "" };
  for (let i = 0; i < indices.length; i++) {
    const cur = indices[i];
    const next = indices[i + 1];
    out[cur.key] = text.slice(cur.headerEnd, next ? next.start : text.length).trim();
  }
  if (!out.headline && !out.detail) out.detail = text;
  return out;
}

function renderConclusion(content, ext, isLast = true) {
  const parts = parseConclusion(content);
  const extLabel = ext > 0 ? `（延長 ${ext} 回後）` : "";
  let html = `<div class="summary-card"><div class="label">結論${extLabel}</div>`;
  if (parts.headline) {
    html += `<div class="headline">${escapeHtml(parts.headline)}</div>`;
  }
  if (parts.detail) {
    html += `<div class="detail">${escapeHtml(parts.detail)}</div>`;
  }
  if (parts.unresolved && !/^無し$/i.test(parts.unresolved.trim())) {
    html += `<div class="sub-label">未解決の論点</div><div class="sub-text">${escapeHtml(parts.unresolved)}</div>`;
  }
  html += `</div>`;
  // 最新の結論の直下にチャットUI（質問・補足・次議題の相談） + 「議題作って次へ」ボタン
  // 過去の結論には何も追加しない
  if (isLast) {
    html += `<div class="chat-card" id="chatCard">
      <div class="label">アシスタントと話す（Gemini）</div>
      <div class="chat-thread" id="chatThread"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="例：◯◯の根拠は？ / 次は△△について議論したい"></textarea>
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendChat()">送信</button>
      </div>
      <button class="chat-start-r2-btn" id="chatStartR2Btn" onclick="startFromChat()" disabled>この会話から議題を作って次のラウンドへ</button>
    </div>`;
  }
  return html;
}

const fmtDate = (s) => {
  if (!s) return "";
  const d = new Date(s);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return sameDay
    ? d.toTimeString().slice(0, 5)
    : `${d.getMonth() + 1}/${d.getDate()} ${d.toTimeString().slice(0, 5)}`;
};

function renderSpeakersPreview() {
  const wrap = $("speakersPreview");
  if (!wrap) return;  // 旧 UI で参加者カードがあった時用、今は不要
  wrap.innerHTML = "";
  for (const s of SPEAKERS) {
    const d = document.createElement("div");
    d.className = "speaker";
    d.innerHTML = `<div class="dot" style="background:${s.color}">${s.short}</div><div class="nm">${s.name}</div><div class="sub">${s.provider}</div>`;
    wrap.appendChild(d);
  }
}

// ─── 一覧 ───
async function loadSessionList() {
  errList("");
  const wrap = $("sessionList");
  wrap.innerHTML = `<div class="empty">読み込み中…</div>`;
  try {
    const list = await api("GET", "/api/kaigi/sessions");
    if (!list.length) {
      wrap.innerHTML = `<div class="empty">まだ会議はありません</div>`;
      return;
    }
    wrap.innerHTML = "";
    for (const s of list) {
      const div = document.createElement("div");
      div.className = "session-row";
      const badgeClass = s.status;
      const ext = s.extension_count || 0;
      const badgeLabel = ({
        active: "進行中",
        auto: "自動進行中",
        completed: ext > 0 ? `完了（延長${ext}回）` : "完了",
        failed: "失敗",
      })[s.status] || s.status;
      // 議題と結論のスレッドを組み立てる（延長で複数の議題・結論が積まれている場合）
      const conclusions = s.conclusions || [];
      const topicChanges = (s.topic_changes || []).map((tc) => ({
        topic: extractNewTopicFromNote(tc.content),
        createdAt: tc.createdAt,
      })).filter((t) => t.topic);

      // 議題変更時刻と結論時刻を時系列でマージして、各ターンを構築
      // 初期議題は session 作成時に登場、その後は topic_changes が新議題を提供
      const turns = buildTurns(s, conclusions, topicChanges);

      const threadHTML = `<div class="thread">${turns.map((t, i) => `
        <div class="turn">
          <div class="turn-label">テーマ ${i + 1}${turns.length > 1 ? "" : ""}</div>
          <div class="turn-topic">${escapeHtml(t.topic)}</div>
          ${t.headline
            ? `<div class="turn-headline">${escapeHtml(t.headline)}</div>`
            : `<div class="turn-pending">${escapeHtml(t.pendingLabel || "検討中…")}</div>`
          }
        </div>
      `).join("")}</div>`;

      div.innerHTML = `
        <div class="row-top">
          <div class="meta" style="text-align: right; min-width: auto;">
            <div class="badge ${badgeClass}">${badgeLabel}</div>
            <div>${s.msg_count}発言</div>
            <div>${fmtDate(s.updated_at)}</div>
          </div>
          <button class="row-del" title="削除" aria-label="削除">×</button>
        </div>
        ${threadHTML}`;
      div.onclick = () => openSession(s.id);
      div.querySelector(".row-del").addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm(`「${s.topic.slice(0, 40)}${s.topic.length > 40 ? "…" : ""}」を削除しますか？`)) return;
        try {
          await api("DELETE", `/api/kaigi/sessions/${s.id}`);
          loadSessionList();
        } catch (err) {
          errList(err.message);
        }
      });
      wrap.appendChild(div);
    }
  } catch (e) {
    errList(e.message);
    wrap.innerHTML = "";
  }
}

async function createSession() {
  errList("");
  const topic = $("newTopic").value.trim();
  if (!topic) { errList("お題を入れてください"); return; }
  if (state.busy) return;
  state.busy = true;
  $("createBtn").disabled = true;

    createdId = s.id;
  } catch (e) {

  } finally {
    // openSession 内の renderSession が走る前に busy を解除しないと、
    // 「会議スタート」ボタンが disabled のままレンダリングされてしまう。

// ─── セッション詳細 ───
function isNearBottom() {
  return (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 200);
}
function scrollToBottom() {
  window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
}

async function refreshSession() {
  if (!state.sessionId) return;
  const wasAtBottom = isNearBottom();
  const oldLen = state.messages.length;
  try {
    const { session, messages } = await api("GET", `/api/kaigi/sessions/${state.sessionId}`);
    state.session = session;
    state.messages = messages;
    // メッセージが増えてたら thinking タイマーをリセット
    if (messages.length !== lastMsgCount) {
      lastMsgCount = messages.length;
      if (session.status === "auto") resetThinkingTimer();
    }
    renderSession();
    // 新着あり && 下端付近にいた時のみ自動スクロール（読んでる最中に飛ばない）
    if (messages.length > oldLen && wasAtBottom) {
      requestAnimationFrame(scrollToBottom);
    }
    if (session.status === "auto") {
      ensurePoll();
      if (!thinkingStartedAt) resetThinkingTimer();
    } else {
      stopPoll();
      stopThinkingTimer();
    }
    // 自動結論: 3R (= speakers * 3) 発言済みなのに結論未生成かつ auto でもない場合、
    // 勝手に conclude を呼んで終わらせる。サーバー側の tick が落ちて止まっても救う。
    await autoConcludeIfReady();
  } catch (e) {
    errSession(e.message);
  }
}

async function autoConcludeIfReady() {
  if (state.busy || !state.sessionId || !state.session) return;
  const speakerCnt = (state.session.speakers || SPEAKERS).length;
  const speechCnt = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote).length;
  const hasConcl = state.messages.some((m) => m.isConclusion);
  if (speechCnt >= speakerCnt * 3 && !hasConcl && state.session.status !== "auto") {
    state.busy = true;
    renderSession();
    try {
      await api("POST", `/api/kaigi/sessions/${state.sessionId}/conclude`);
      const { session, messages } = await api("GET", `/api/kaigi/sessions/${state.sessionId}`);
      state.session = session;
      state.messages = messages;
      renderSession();
    } catch (e) {
      errSession("自動結論失敗: " + e.message);
    } finally {
      state.busy = false;
    }
  }
}

function renderSession() {
  if (!state.session) return;
  // 長文お題は topic_summary の核の問いを優先表示（読みやすさ重視）
  $("topicView").textContent = displayTopic(state.session);
  const ext = state.session.extension_count || 0;
  const remaining = state.session.auto_rounds_remaining;
  const speakerCount = (state.session.speakers || SPEAKERS).length;
  const speechesCount = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote).length;
  const currentRound = Math.floor(speechesCount / speakerCount) + (speechesCount % speakerCount === 0 ? 0 : 1);
  const completedRounds = Math.floor(speechesCount / speakerCount);
  const hasConcl = state.messages.some((m) => m.isConclusion);

  // ステップインジケーター（3R + 結論）
  const totalRounds = 3;
  const stepsHTML = [];
  for (let r = 1; r <= totalRounds; r++) {
    let cls = "step";
    if (r <= completedRounds) cls += " done";
    else if (r === currentRound && state.session.status === "auto") cls += " active";
    stepsHTML.push(`<div class="${cls}">R${r}</div>`);
  }
  let conclCls = "step";
  if (hasConcl) conclCls += " completed";
  else if (state.session.status === "auto" && completedRounds >= totalRounds) conclCls += " active";
  stepsHTML.push(`<div class="${conclCls}">結論</div>`);
  $("steps").innerHTML = stepsHTML.join("");

  const statusMap = {
    active: ext > 0 ? `準備完了（延長 ${ext} 回済）` : "準備完了",
    auto: completedRounds >= totalRounds
      ? `結論を生成中…${ext > 0 ? ` ／延長 ${ext} 回目` : ""}`
      : `自動進行中（残り ${remaining}R）${ext > 0 ? ` ／延長 ${ext} 回目` : ""}`,
    completed: ext > 0 ? `完了（延長 ${ext} 回）` : "完了",
    failed: `失敗: ${state.session.last_error || ""}`,
  };
  $("sessionStatus").textContent = statusMap[state.session.status] || state.session.status;

  const speeches = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote && !m.isChat);
  const systemNotes = state.messages.filter((m) => m.isSystemNote);
  const concl = state.messages.find((m) => m.isConclusion);
  const isAuto = state.session.status === "auto";
  const isCompleted = state.session.status === "completed" || !!concl;

  // フッターの出し分け
  // フッターの出し分け
  const speakerCnt = (state.session.speakers || SPEAKERS).length;
  const speechCnt = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote).length;
  const isStalled = !isAuto && !isCompleted && speechCnt > 0;  // 途中まで進んで止まってる

  $("startRow").style.display = "none";
  $("autoRow").style.display = "none";
  $("resumeRow").style.display = "none";
  $("extendRow").style.display = "none";
  $("editRow").style.display = "none";
  if (state.editing) {
    $("editRow").style.display = "flex";
  } else if (isAuto) {
    $("autoRow").style.display = "flex";
  } else if (isCompleted) {
    $("extendRow").style.display = "flex";
  } else if (isStalled) {
    $("resumeRow").style.display = "flex";
  } else {
    $("startRow").style.display = "flex";
  }

  $("startBtn").disabled = state.busy;
  $("stopAutoBtn").disabled = state.busy;
  $("editExtendBtn").disabled = state.busy;
  $("sameExtendBtn").disabled = state.busy;
  $("confirmEditBtn").disabled = state.busy;
  $("resetBtn").disabled = isAuto || state.busy || !state.messages.length;

  // チャット
  const chat = $("chat");
  // 表示は speech + systemNote（順番通り）
  const visible = state.messages;  // 結論カードも時系列でインライン挿入する
  const conclMsgs = state.messages.filter((m) => m.isConclusion);
  const lastConclId = conclMsgs.length ? conclMsgs[conclMsgs.length - 1].id : null;
  if (!visible.length) {
    chat.innerHTML = `<div class="empty">下の「会議スタート」を押すと検討が始まります</div>`;
  } else {
    chat.innerHTML = "";
    for (const m of visible) {
      if (m.isChat) continue;  // チャットは結論カード直下のチャット欄に描画する
      if (m.isConclusion) {
        // 結論カードを時系列で挿入（最後の結論にだけチャット欄を埋め込み）
        const wrap = document.createElement("div");
        wrap.innerHTML = renderConclusion(m.content, ext, m.id === lastConclId);
        // renderConclusion は summary-card と (最新なら) chat-card の 2 要素を返すので両方追加
        while (wrap.firstElementChild) chat.appendChild(wrap.firstElementChild);
        continue;
      }
      const div = document.createElement("div");
      if (m.isSystemNote) {
        div.className = "msg system";
        div.innerHTML = `
          <div class="dot" style="background:#9aa0b8"><span class="icon" style="color:white;">campaign</span></div>
          <div>
            <div class="who">司会（システム）</div>
            <div class="body">${escapeHtml(m.content)}</div>
          </div>`;
      } else {
        const s = speakerOf(m.speaker);
        div.className = "msg";
        div.innerHTML = `
          <div class="dot" style="background:${s.color}">${s.short}</div>
          <div>
            <div class="who">${escapeHtml(m.speaker)} <span class="meta">R${m.roundNum} · ${m.modelUsed || m.provider}</span></div>
            <div class="body">${escapeHtml(m.content)}</div>
          </div>`;
      }
      chat.appendChild(div);
    }
  }
  // thinking placeholder (auto 中も次の speaker が出るまで待ち状態)
  if (isAuto) {
    const next = SPEAKERS[speeches.length % SPEAKERS.length];
    const div = document.createElement("div");
    div.className = "msg thinking";
    div.innerHTML = `
      <div class="dot" style="background:${next.color}">${next.short}</div>
      <div>
        <div class="who">${next.name}</div>
        <div class="body"><div class="spinner"></div>考え中<span class="elapsed" id="thinkingElapsed"></span></div>
      </div>`;
    chat.appendChild(div);
    updateThinkingElapsed();
  }

  // 結論カードはチャット内に時系列でインライン表示するので、独立カードは未使用
  $("conclusionWrap").innerHTML = "";
  // 結論カードの直下のチャットスレッドを描画
  renderChatThread();
  // 自動スクロールは refreshSession 側で「下端付近にいた && 新着あり」時のみ実行
}

function renderChatThread() {
  const thread = document.getElementById("chatThread");
  if (!thread) return;  // 結論未生成時は chatCard 自体が存在しない
  // 最新の結論より後に行われたチャットだけ表示する。
  // 前ラウンドの結論直下で行ったチャットは、そのラウンドで完結したものとして畳む。
  const conclMsgs = state.messages.filter((m) => m.isConclusion);
  const lastConcl = conclMsgs[conclMsgs.length - 1];
  const lastConclTime = lastConcl ? new Date(lastConcl.createdAt).getTime() : 0;
  const chats = state.messages.filter((m) => m.isChat && new Date(m.createdAt).getTime() > lastConclTime);
  thread.innerHTML = "";
  for (const c of chats) {
    const div = document.createElement("div");
    div.className = "chat-msg " + (c.provider === "user" ? "user" : "assistant");
    div.innerHTML = `<div class="who">${escapeHtml(c.speaker)}</div><div class="body">${escapeHtml(c.content)}</div>`;
    thread.appendChild(div);
  }
  // 「次のラウンドへ」ボタンの可否 (チャットが1往復以上ある時のみ)
  const startR2 = document.getElementById("chatStartR2Btn");
  if (startR2) startR2.disabled = state.busy || chats.length === 0;
  // チャットスレッド内自動スクロール（チャットエリア自体の下端へ）
  thread.scrollTop = thread.scrollHeight;
}

async function sendChat() {
  if (state.busy || !state.sessionId) return;
  const input = document.getElementById("chatInput");
  const msg = (input?.value || "").trim();
  if (!msg) return;
  if (input) input.value = "";
  errSession("");
  state.busy = true;
  document.getElementById("chatSendBtn").disabled = true;
  // 楽観追加: id=null は仮レコードの目印
  const optimistic = { id: null, speaker: "あなた", provider: "user", content: msg, isChat: true, createdAt: new Date().toISOString() };
  state.messages.push(optimistic);
  renderChatThread();
  try {
    const { user, assistant } = await api("POST", `/api/kaigi/sessions/${state.sessionId}/chat`, { message: msg });
    // 楽観追加を削除して、サーバーから返ってきた正規レコードに置換
    state.messages = state.messages.filter((m) => m !== optimistic);
    state.messages.push({ ...user, isChat: true });
    state.messages.push({ ...assistant, isChat: true });
    renderChatThread();
  } catch (e) {
    state.messages = state.messages.filter((m) => m !== optimistic);
    errSession("チャット失敗: " + e.message);
    renderChatThread();
  } finally {
    state.busy = false;
    const sb = document.getElementById("chatSendBtn");
    if (sb) sb.disabled = false;
    renderChatThread();  // busy=false になった後にもう一度描画して startR2 ボタンの disabled を再評価
  }
}
window.sendChat = sendChat;

async function startFromChat() {
  if (state.busy || !state.sessionId) return;
  if (!confirm("このチャットから次の議題を自動生成して次のラウンドを始めますか？")) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/start-from-chat`, { rounds: 3 });
    await refreshSession();
  } catch (e) {
    errSession("次の議題生成失敗: " + e.message);
  } finally {
    state.busy = false;
  }
}
window.startFromChat = startFromChat;

// 会議スタート（3R + 自動結論）
async function startKaigi() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    const r = await api("POST", `/api/kaigi/sessions/${state.sessionId}/auto`, { rounds: 3 });
    if (r.note) errSession(r.note);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.startKaigi = startKaigi;

// 延長: 議題そのまま +3R
async function extendSame() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/extend`, { rounds: 3 });
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.extendSame = extendSame;

// 議題編集モード開始（再検討 / 次の議題 共通）— 下部フッター内の textarea を使う
function openEditExtend() {
  if (!state.session) return;
  state.editing = true;
  state.editMode = "redo";
  $("topicEditInline").value = state.session.topic;
  $("topicEditInline").setAttribute("placeholder", "議題を編集してください");
  $("editLabel").textContent = "議題を編集して再検討";
  document.body.classList.add("editing");
  renderSession();
  setTimeout(() => {
    $("topicEditInline").focus();
    $("topicEditInline").scrollIntoView({ behavior: "smooth", block: "center" });
  }, 50);
}
window.openEditExtend = openEditExtend;

function openNextTopic() {
  if (!state.session) return;
  state.editing = true;
  state.editMode = "next";
  $("topicEditInline").value = "";
  $("topicEditInline").setAttribute("placeholder", "例: それを踏まえて、具体的に何から始めるべきか？");
  $("editLabel").textContent = "次の議題を入力";
  document.body.classList.add("editing");
  renderSession();
  setTimeout(() => {
    $("topicEditInline").focus();
    $("topicEditInline").scrollIntoView({ behavior: "smooth", block: "center" });
  }, 50);
}
window.openNextTopic = openNextTopic;

function cancelEdit() {
  state.editing = false;
  state.editMode = null;
  document.body.classList.remove("editing");
  renderSession();
}
window.cancelEdit = cancelEdit;

async function confirmEdit() {
  if (state.busy || !state.sessionId) return;
  const newTopic = $("topicEditInline").value.trim();
  if (!newTopic) { errSession("議題を入れてください"); return; }
  errSession("");
  state.busy = true;
  state.editing = false;
  const mode = state.editMode;
  state.editMode = null;
  document.body.classList.remove("editing");
  renderSession();
  try {
    const endpoint = mode === "next" ? "next-topic" : "extend";
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/${endpoint}`, { rounds: 3, newTopic });
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.confirmEdit = confirmEdit;

// 途中停止からの再開（残りラウンドを推測して auto を再開）
async function resumeAuto() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    // 残りラウンド = 3 - 完了済みラウンド（最小1）
    const speakerCnt = (state.session.speakers || SPEAKERS).length;
    const speechCnt = state.messages.filter((m) => !m.isConclusion && !m.isSystemNote).length;
    const doneRounds = Math.floor(speechCnt / speakerCnt);
    const remaining = Math.max(1, 3 - doneRounds);
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/auto`, { rounds: remaining });
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.resumeAuto = resumeAuto;

// 途中で強制的に結論生成（残りラウンドを諦めて、今ある発言で結論を出す）
async function doForceConclude() {
  if (state.busy || !state.sessionId) return;
  errSession("");
  state.busy = true;
  renderSession();
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/conclude`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
  }
}
window.doForceConclude = doForceConclude;

async function stopAuto() {
  if (!state.sessionId) return;
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/auto/stop`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  }
}
window.stopAuto = stopAuto;

async function resetSession() {
  if (state.busy || !state.sessionId) return;
  if (!confirm("このセッションの履歴を全部消して、同じお題で最初からやり直しますか？")) return;
  errSession("");
  state.busy = true;
  $("resetBtn").disabled = true;
  try {
    await api("POST", `/api/kaigi/sessions/${state.sessionId}/reset`);
    await refreshSession();
  } catch (e) {
    errSession(e.message);
  } finally {
    state.busy = false;
    $("resetBtn").disabled = false;
  }
}
window.resetSession = resetSession;

async function deleteSession() {
  if (!state.sessionId) return;
  if (!confirm("この会議を削除しますか？")) return;
  try {
    await api("DELETE", `/api/kaigi/sessions/${state.sessionId}`);
    showList();
  } catch (e) {
    errSession(e.message);
  }
}
window.deleteSession = deleteSession;

// ─── ポーリング（自動進行中の更新取得） ───
function ensurePoll() {
  if (state.pollTimer) return;
  state.pollTimer = setInterval(refreshSession, 5000);
}
function stopPoll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

// thinking 経過秒数の表示（1秒ごとに更新）
let thinkingTimer = null;
let thinkingStartedAt = null;
let lastMsgCount = 0;
function updateThinkingElapsed() {
  const el = $("thinkingElapsed");
  if (!el || !thinkingStartedAt) return;
  const sec = Math.floor((Date.now() - thinkingStartedAt) / 1000);
  const min = Math.floor(sec / 60);
  el.textContent = ` (${min ? min + "分" : ""}${sec % 60}秒経過)`;
  // 60秒超えても進まなければ停滞警告
  if (sec > 60) {
    el.textContent += " — 詰まってる可能性あり";
    el.style.color = "var(--err)";
  }
}
function ensureThinkingTimer() {
  if (!thinkingTimer) thinkingTimer = setInterval(updateThinkingElapsed, 1000);
}
function resetThinkingTimer() {
  thinkingStartedAt = Date.now();
  ensureThinkingTimer();
}
function stopThinkingTimer() {
  if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
  thinkingStartedAt = null;
}

// ─── API 呼び出し（Firebase ID token 付き） ───
let authToken = null;
let firebaseUser = null;
async function ensureToken() {
  if (firebaseUser) authToken = await firebaseUser.getIdToken();
  if (!authToken) throw new Error("ログインが切れました。トップへ戻ってログインし直してください。");
}
async function api(method, path, body) {
  await ensureToken();
  const res = await fetch(window.API_BASE + path, {
    method,
    headers: {
      authorization: "Bearer " + authToken,
      ...(body ? { "content-type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

// ─── エラータップでコピー ───
function bindErrCopy(id) {
  const el = $(id);
  el.addEventListener("click", () => {
    const t = el.textContent;
    if (!t) return;
    navigator.clipboard?.writeText(t).then(() => {
      el.classList.add("copied");
      setTimeout(() => el.classList.remove("copied"), 1500);
    });
  });
}
bindErrCopy("listErr");
bindErrCopy("sessionErr");

renderSpeakersPreview();

// ─── 認証 → 一覧ロード ───
(async () => {
  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    cfg.authDomain = location.hostname;
    const auth = getAuth(initializeApp(cfg));
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
      firebaseUser = user;
      authToken = await user.getIdToken();
      setInterval(async () => { authToken = await user.getIdToken(true); }, 30 * 60 * 1000);
      loadSessionList();
    });
  } catch (e) {
    errList("認証初期化エラー: " + e.message);
  }
})();
</script>
