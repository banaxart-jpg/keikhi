<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="手配リスト">
<link rel="apple-touch-icon" href="/kaimono/icon.png">
<title>手配リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #2a8c3a; --accent2: #3aaa4a;   /* 食料品的な緑 */
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--bg) 86%);
  --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 110px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

/* 上部 (タイトル + タブ) を sticky にしてスクロール中も常時表示 */
.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

/* 現場タブ (横スクロール) */
.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: inherit; transition: all 200ms ease; position: relative; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(42,140,58,0.35), -3px -3px 10px var(--sl); }
.tab .count { font-size: 10px; font-weight: 800; margin-left: 6px; opacity: 0.7; }

/* リスト */
.list { padding: 0 16px 30px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 60px 0; }

/* ── アイテムカード: 默認は最小限の 1 行。タップで詳細展開。 ── */
.item-card { background: var(--bg); border-radius: 16px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); transition: opacity 200ms ease; overflow: hidden; }
.item-card.checked { opacity: 0.55; }
.item-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.item-name { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; word-break: break-word; color: var(--text); }
.item-card.checked .item-name { text-decoration: line-through; color: var(--text2); }
.item-name .qty { color: var(--text2); font-weight: 600; margin-left: 6px; font-size: 12px; }
.chev { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--text3); font-family: 'Material Symbols Outlined'; font-size: 20px; flex-shrink: 0; transition: transform 200ms ease; }
.item-card.open .chev { transform: rotate(180deg); color: var(--text2); }

.check { width: 28px; height: 28px; border-radius: 14px; border: none; cursor: pointer; background: var(--bg); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 18px; flex-shrink: 0; font-family: 'Material Symbols Outlined'; transition: all 200ms ease; }
.item-card.checked .check { background: var(--accent); color: white; box-shadow: 4px 4px 10px rgba(42,140,58,0.4); }

/* 展開: メタ情報 + メモ + 画像 + 編集/削除 */
.item-detail {
  border-top: 1px solid rgba(168,172,192,0.18);
  padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px;
  animation: slide-open 200ms ease-out; overflow: hidden;
}
@keyframes slide-open {
  from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; }
  to   { opacity: 1; max-height: 700px; padding-top: 10px; padding-bottom: 14px; }
}
.meta-line { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.meta-line .by { display: inline-flex; align-items: center; gap: 4px; }
.meta-line .by .dot { width: 7px; height: 7px; border-radius: 50%; }
.task-tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; background: var(--bg2); color: var(--text2); box-shadow: inset 1.5px 1.5px 3px var(--sd), inset -1px -1px 2px var(--sl); }
.detail-note { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; padding: 8px 10px; border-radius: 8px; background: var(--bg2); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl); }
.detail-img { max-width: 100%; max-height: 240px; border-radius: 10px; object-fit: contain; align-self: center; cursor: zoom-in; }
.detail-textarea { width: 100%; padding: 10px 12px; border: none; border-radius: 10px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg2); box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); outline: none; min-height: 70px; resize: vertical; box-sizing: border-box; }
.detail-filepick {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px;
  background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl);
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text2); justify-content: center;
}
.detail-filepick input { display: none; }
.detail-actions { display: flex; gap: 8px; }
.detail-actions button {
  flex: 1; padding: 9px; border: none; border-radius: 10px; font-weight: 700; font-size: 13px;
  cursor: pointer; font-family: inherit;
  background: var(--bg); color: var(--text2);
  box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl);
}
.detail-actions button.primary { background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; box-shadow: 4px 4px 10px rgba(42,140,58,0.3); }
.detail-actions button.danger { color: var(--danger); }
.detail-actions button:disabled { opacity: 0.5; cursor: wait; }

/* 一括クリア */
.clear-row { display: flex; justify-content: flex-end; padding: 4px 18px 14px; }
.clear-btn { font-size: 11px; font-weight: 700; color: var(--text3); background: none; border: none; cursor: pointer; padding: 4px 10px; font-family: inherit; }
.clear-btn:hover { color: var(--danger); }

/* FAB: 常時右下に出てる + ボタン。タップで入力モーダル開く。 */
.fab {
  position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom));
  width: 58px; height: 58px; border-radius: 29px;
  background: linear-gradient(145deg, var(--accent2), var(--accent));
  color: white; font-size: 30px; font-weight: 300; line-height: 1;
  border: none; cursor: pointer; padding: 0;
  box-shadow: 6px 6px 18px rgba(42,140,58,0.45), -3px -3px 10px var(--sl);
  z-index: 30;
  transition: transform 200ms ease;
  display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(0.93); }
.fab.open { transform: rotate(45deg); }  /* + → × 回転 */
.fab.open:active { transform: rotate(45deg) scale(0.93); }

/* 入力フォーム (BottomSheet の slot 内) */
.input-form { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.input-extra { display: flex; flex-direction: column; gap: 10px; animation: slide-open 200ms ease-out; }
.input-row { display: flex; gap: 8px; }
.input-row input {
  padding: 12px 14px; border: none; border-radius: 22px; font-size: 14px;
  font-family: inherit; color: var(--text); background: var(--bg);
  box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl); outline: none;
}
.input-row input.name { flex: 1; min-width: 0; }
.input-row input.qty { width: 56px; text-align: center; }
.input-row input.unit, .input-row select.unit { width: 70px; text-align: center; font-size: 13px; }
.input-row select.unit {
  padding: 12px 8px; border: none; border-radius: 22px; font-size: 13px;
  font-family: inherit; color: var(--text); background: var(--bg);
  box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl);
  outline: none; appearance: none; -webkit-appearance: none;
  text-align-last: center; cursor: pointer;
}
.input-row input::placeholder { color: var(--text3); }
.cat-row { display: flex; gap: 6px; align-items: center; padding-left: 4px; }
.cat-pill { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; background: var(--bg); box-shadow: 2px 2px 5px var(--sd), -2px -2px 5px var(--sl); color: var(--text2); font-family: inherit; }
/* タスク select: 任意で「現場ごとのアクティブタスク」に紐付け可能 */
.task-sel { flex: 1; min-width: 0; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; background: var(--bg); box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl); color: var(--text2); font-family: inherit; appearance: none; -webkit-appearance: none; text-align-last: center; }
.cat-pill.on.zairyo { background: #fef0c8; color: #8b6914; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.08); }
.cat-pill.on.kogu { background: #ffe0e0; color: #8b3030; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.08); }
.add {
  margin-left: auto; padding: 10px 22px; height: 40px; border-radius: 22px; border: none;
  cursor: pointer; background: linear-gradient(145deg, var(--accent2), var(--accent));
  color: white; font-size: 14px; font-weight: 800;
  box-shadow: 5px 5px 14px rgba(42,140,58,0.4), -2px -2px 8px var(--sl);
  flex-shrink: 0; transition: transform 200ms ease; font-family: inherit;
}
.add:active { transform: scale(0.96); }
.add:disabled { opacity: 0.5; }

/* アイテム表示の category タグ */
.tag-pill { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.04em; margin-right: 6px; vertical-align: 1px; }
.tag-pill.zairyo { background: #fef0c8; color: #8b6914; }
.tag-pill.kogu { background: #ffe0e0; color: #8b3030; }

/* アーカイブ (BottomSheet の slot 内) */
.arch-subtitle { font-size: 11px; color: var(--text3); font-weight: 600; margin: 0 4px 14px; }
.arch-day { margin-bottom: 18px; }
.arch-day-head { font-size: 12px; font-weight: 800; color: var(--text2); padding: 8px 12px; background: var(--bg2); border-radius: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; }
/* アーカイブの 1 行: collapsed = 2 色ドット + 品名 + 現場 + 時刻のみ。
   タップで展開して「誰が何時に追加 / 完了」+ 復元ボタン。 */
.arch-row { padding: 9px 12px; border-radius: 10px; transition: background 200ms ease; }
.arch-row:hover { background: var(--bg2); }
.arch-row.open { background: var(--bg2); }
.arch-row-top { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.arch-dots { display: inline-flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.arch-dots .dot { width: 8px; height: 8px; border-radius: 50%; display: block; }
.arch-row .body { flex: 1; min-width: 0; font-size: 13px; }
.arch-row .body b { font-weight: 700; }
.arch-row .body .qty { color: var(--text2); font-weight: 600; margin-left: 6px; font-size: 12px; }
.arch-row .body .meta { font-size: 10px; color: var(--text3); margin-top: 2px; }
.arch-row .chev { color: var(--text3); font-family: 'Material Symbols Outlined'; font-size: 18px; transition: transform 200ms ease; flex-shrink: 0; }
.arch-row.open .chev { transform: rotate(180deg); }
.arch-detail {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(168,172,192,0.18);
  display: flex; flex-direction: column; gap: 8px;
  animation: slide-open 200ms ease-out;
}
.arch-detail .who-line { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.arch-detail .who-line .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.arch-detail .restore-btn { align-self: flex-end; padding: 7px 14px; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--accent); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); }
.arch-detail .restore-btn:active { box-shadow: inset 2px 2px 6px var(--sd); }
.arch-empty { text-align: center; color: var(--text3); font-size: 12px; padding: 40px 0; }

/* seed ボタン (owner だけ表示) */
.seed-row { padding: 14px 18px 80px; text-align: center; }
.seed-btn { padding: 8px 16px; border-radius: 14px; font-size: 11px; font-weight: 700; color: var(--text3); background: none; border: 1px dashed var(--text3); cursor: pointer; font-family: inherit; }
.seed-btn:hover { color: var(--accent); border-color: var(--accent); }
.seed-btn:disabled { opacity: 0.4; cursor: default; }

.err { color: var(--danger); font-size: 11px; padding: 0 18px; margin-top: 6px; font-family: ui-monospace, Menlo, monospace; }
.loading { text-align: center; color: var(--text3); padding: 60px 0; font-size: 13px; font-weight: 700; }
.realtime-dot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); margin-right: 6px; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted, onBeforeUnmount, watch } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, setDoc, updateDoc,
  onSnapshot, query, orderBy, serverTimestamp, where, writeBatch,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";
import { BottomSheet } from "/bottom-sheet.js";
// 現場は keihi2 と同じソース (/api/sites = Cloud SQL の sites テーブル) から取る。
// 並び順は「最近そのタブで動きがあった順」(items の createdAt/checkedAt の max)。
// 初回 fetch までは空配列 → タブも出ず、ロード中表示のみ。
const SHOPPING = "shopping_items";

const TEMPLATE = `
<div>
  <div class="header-fix">
    <div class="top">
      <span class="title"><span class="icon" style="vertical-align:-0.18em;">inventory_2</span> 手配リスト</span>
      <div style="display:flex; gap:6px;">
        <button class="pill" @click="showArchive = true" title="アーカイブ"><span class="icon" style="vertical-align:-0.18em;">archive</span></button>
        <button class="pill" @click="back">← 戻る</button>
      </div>
    </div>

    <div class="tabs">
      <button
        v-for="s in sortedSites" :key="s"
        class="tab" :class="{ on: activeSite === s }"
        @click="activeSite = s"
      >
        {{ s }}<span class="count" v-if="countBySite[s]">{{ countBySite[s] }}</span>
      </button>
    </div>
  </div>

  <div v-if="!ready" class="loading"><span class="realtime-dot"></span>接続中…</div>

  <template v-else>
    <div class="list">
      <div v-if="sortedSites.length === 0" class="empty">現場が登録されてません。経費2 で追加してください。</div>
      <div v-else-if="filteredItems.length === 0" class="empty">「{{ activeSite }}」に追加するものはまだ無し</div>
      <div v-for="item in filteredItems" :key="item.id" class="item-card" :class="{ checked: item.checked, open: expandedId === item.id }">
        <!-- collapsed row: 最小限の情報だけ -->
        <div class="item-row" @click="toggleDetail(item)">
          <button class="check" @click.stop="toggle(item)" :style="item.checked ? { background: colorForEmail(item.checkedBy), color: 'white', boxShadow: '3px 3px 8px ' + colorForEmail(item.checkedBy) + '55' } : null">{{ item.checked ? 'check' : '' }}</button>
          <div class="item-name">
            {{ displayName(item) }}<span v-if="item.qty" class="qty">× {{ item.qty }} {{ item.unit || '' }}</span>
          </div>
          <span class="chev">expand_more</span>
        </div>

        <!-- 展開: メタ情報 + 詳細 + アクション -->
        <div v-if="expandedId === item.id" class="item-detail">
          <!-- メタ: カテゴリ + 追加者 + 完了者 -->
          <div class="meta-line">
            <span v-if="item.category" class="tag-pill" :class="catClass(item.category)">{{ item.category }}</span>
            <span v-if="taskTitle(item.taskId)" class="task-tag">📋 {{ taskTitle(item.taskId) }}</span>
            <span class="by"><span class="dot" :style="{ background: colorForEmail(item.addedBy) }"></span>{{ displayNameOf(item.addedBy) }}</span>
            <span v-if="item.createdAt">が {{ formatTimeShort(item.createdAt) }} に追加</span>
            <template v-if="item.checked">
              <span>·</span>
              <span class="by"><span class="dot" :style="{ background: colorForEmail(item.checkedBy) }"></span>{{ displayNameOf(item.checkedBy) }}</span>
              <span v-if="item.checkedAt">が {{ formatTimeShort(item.checkedAt) }} に済み</span>
            </template>
          </div>

          <!-- 編集モード -->
          <template v-if="editingDetailId === item.id">
            <textarea class="detail-textarea" v-model="editNote" placeholder="説明・メモ (型番・サイズ・備考など)"></textarea>
            <label class="detail-filepick">
              <input type="file" accept="image/*" @change="onFilePick">
              <span v-if="!editFile"><span class="icon" style="vertical-align:-0.18em;">photo_camera</span> 画像を選ぶ</span>
              <span v-else>{{ editFile.name }}</span>
            </label>
            <img v-if="editPreview" :src="editPreview" alt="preview" class="detail-img">
            <div class="detail-actions">
              <button @click="cancelDetailEdit" :disabled="savingDetail">キャンセル</button>
              <button class="primary" @click="saveDetail(item)" :disabled="savingDetail">{{ savingDetail ? "保存中…" : "保存" }}</button>
            </div>
          </template>

          <!-- 表示モード -->
          <template v-else>
            <img v-if="item.imageUrl" :src="item.imageUrl" alt="" @click="openImage(item.imageUrl)" class="detail-img">
            <div v-if="item.note" class="detail-note">{{ item.note }}</div>
            <div class="detail-actions">
              <button @click="startDetailEdit(item)">編集</button>
              <button class="danger" @click="del(item)">削除</button>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div v-if="hasChecked" class="clear-row">
      <button class="clear-btn" @click="clearChecked">✓ 済みを削除 ({{ checkedCount }})</button>
    </div>

    <!-- owner だけ表示: 駒込の材料 15件を seed (1回限り) -->
    <div class="seed-row" v-if="isOwner && canSeedKomagome">
      <button class="seed-btn" @click="seedKomagome" :disabled="seeding">
        <span v-if="seeding">投入中…</span>
        <span v-else><span class="icon" style="vertical-align:-0.18em;">spa</span> 駒込: 材料 15件を seed (1回限り)</span>
      </button>
    </div>
  </template>

  <div class="err" v-if="err">{{ err }}</div>

  <!-- FAB: 常時表示、タップで入力モーダル開閉 -->
  <button class="fab" :class="{ open: showInput }" @click="showInput = !showInput" :disabled="!ready || !activeSite">+</button>

  <!-- 入力モーダル: 共通 BottomSheet (drag-to-close + 上ドラッグで詳細展開) -->
  <bottom-sheet v-model="showInput" expandable v-model:expanded="inputExpanded">
    <form @submit.prevent="add" class="input-form">
      <div class="input-row">
        <input class="name" v-model="newName" :placeholder="inputPlaceholder" :disabled="adding || !activeSite" autocomplete="off" ref="nameInput">
        <input class="qty" v-model="newQty" type="number" min="1" placeholder="数" :disabled="adding || !activeSite">
        <select class="unit" v-model="newUnit" :disabled="adding || !activeSite">
          <option>個</option>
          <option>箱</option>
          <option>セット</option>
          <option>m</option>
          <option>平米</option>
          <option>束</option>
          <option>本</option>
          <option>枚</option>
          <option>数量</option>
        </select>
      </div>
      <!-- 上ドラッグで展開: メモ + 画像 (任意) -->
      <div v-if="inputExpanded" class="input-extra">
        <textarea class="detail-textarea" v-model="newNote" placeholder="説明・メモ (型番・サイズ・備考など)" :disabled="adding"></textarea>
        <label class="detail-filepick">
          <input type="file" accept="image/*" @change="onNewFilePick" :disabled="adding">
          <span v-if="!newFile"><span class="icon" style="vertical-align:-0.18em;">photo_camera</span> 画像を選ぶ</span>
          <span v-else>{{ newFile.name }}</span>
        </label>
        <img v-if="newPreview" :src="newPreview" alt="preview" class="detail-img">
      </div>
      <div class="cat-row">
        <button type="button" class="cat-pill zairyo" :class="{ on: newCategory === '材料' }" @click="newCategory = newCategory === '材料' ? null : '材料'">材料</button>
        <button type="button" class="cat-pill kogu" :class="{ on: newCategory === '工具' }" @click="newCategory = newCategory === '工具' ? null : '工具'">工具</button>
        <select v-if="tasksForCurrentSite.length" class="task-sel" v-model="newTaskId" :disabled="adding">
          <option value="">タスクなし</option>
          <option v-for="t in tasksForCurrentSite" :key="t.id" :value="t.id">{{ t.title }}</option>
        </select>
        <button class="add" type="submit" :disabled="!newName.trim() || adding || !activeSite">{{ adding ? "追加中…" : "+ 追加" }}</button>
      </div>
    </form>
  </bottom-sheet>

  <!-- アーカイブモーダル: 日付グループ表示 (共通 BottomSheet) -->
  <bottom-sheet v-model="showArchive" title="アーカイブ">
    <div class="arch-subtitle">(済み → 1時間後にここに)</div>
    <div v-if="archivedByDay.length === 0" class="arch-empty">アーカイブされたものはまだ無し</div>
    <div v-for="[day, list] in archivedByDay" :key="day" class="arch-day">
      <div class="arch-day-head"><span>{{ day }}</span><span>{{ list.length }} 件</span></div>
      <div v-for="item in list" :key="item.id" class="arch-row" :class="{ open: archExpandedId === item.id }">
        <div class="arch-row-top" @click="archExpandedId = archExpandedId === item.id ? null : item.id">
          <span class="arch-dots">
            <span class="dot" :style="{ background: colorForEmail(item.addedBy) }" :title="'追加: ' + displayNameOf(item.addedBy)"></span>
            <span class="dot" :style="{ background: colorForEmail(item.checkedBy) }" :title="'完了: ' + displayNameOf(item.checkedBy)"></span>
          </span>
          <div class="body">
            <div><b>{{ displayName(item) }}</b><span v-if="item.qty" class="qty">× {{ item.qty }} {{ item.unit || '' }}</span></div>
            <div class="meta">{{ item.site }} · {{ formatTimeShort(item.checkedAt) }}</div>
          </div>
          <span class="chev">expand_more</span>
        </div>
        <div v-if="archExpandedId === item.id" class="arch-detail">
          <div class="who-line">
            <span class="dot" :style="{ background: colorForEmail(item.addedBy) }"></span>
            {{ displayNameOf(item.addedBy) }} が {{ formatTimeShort(item.createdAt) }} に追加
          </div>
          <div class="who-line">
            <span class="dot" :style="{ background: colorForEmail(item.checkedBy) }"></span>
            {{ displayNameOf(item.checkedBy) }} が {{ formatTimeShort(item.checkedAt) }} に済み
          </div>
          <button class="restore-btn" @click="restore(item)">未済みに戻す</button>
        </div>
      </div>
    </div>
  </bottom-sheet>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const sites = ref([]);                  // 表示順 (activity desc)
    const activeSite = ref(null);
    const items = ref([]);
    const ready = ref(false);
    const err = ref("");
    const newName = ref("");
    const newQty = ref("1");           // デフォルト 1
    const newUnit = ref("個");         // デフォルト 個
    const newCategory = ref(null);   // "材料" | "工具" | null
    const newTaskId = ref("");
    const tasks = ref([]);           // /tasks 全件 (社内 ALLOWED_EMAILS のみ購読成功)
    // URL ?site=... で初期タブ指定 (task アプリ等からの遷移)
    const urlSite = new URLSearchParams(location.search).get("site") || "";
    const adding = ref(false);
    const seeding = ref(false);
    const showInput = ref(false);   // FAB トグル: 入力モーダルの開閉
    const inputExpanded = ref(false);  // 入力シートを上に引っ張って詳細展開した状態
    const newNote = ref("");
    const newFile = ref(null);
    const newPreview = ref("");
    const expandedId = ref(null);   // 詳細展開中の item id (一度に1つ)
    const editingDetailId = ref(null); // 編集モード中の item id
    const editNote = ref("");
    const editFile = ref(null);
    const editPreview = ref("");     // 画像プレビュー (dataURL or existing imageUrl)
    const savingDetail = ref(false);
    const showArchive = ref(false);   // アーカイブモーダル開閉
    const archExpandedId = ref(null); // アーカイブで展開中の item id
    const OWNER_EMAILS = new Set(["info@banax.tokyo", "konishi0221@gmail.com"]);
    const isOwner = computed(() => OWNER_EMAILS.has((user.value?.email || "").toLowerCase()));
    // 駒込の seed 済みフラグ: 同じ seedTag のアイテムが1件でもあれば「投入済」扱い
    const canSeedKomagome = computed(() => !items.value.some((i) => i.seedTag === "komagome_v1"));
    let db = null;
    let fbApp = null;   // Storage で使うので setup スコープに保持
    const user = ref(null);    // ref にして Vue 側で reactive に
    let unsubscribe = null;
    let unsubscribeTasks = null;

    // 各サイトの最終アクティビティ時刻 (createdAt or checkedAt の max)。
    // 値が無いサイトは 0 → アルファベット順で末尾。
    function activityScore(siteName) {
      let mx = 0;
      for (const it of items.value) {
        if (it.site !== siteName) continue;
        const c = it.createdAt?.toMillis?.() || 0;
        const k = it.checkedAt?.toMillis?.() || 0;
        const m = Math.max(c, k);
        if (m > mx) mx = m;
      }
      return mx;
    }
    // サイト並び替え: activity desc → 元の DB 順 (= keihi2 の表示順 維持)
    const sortedSites = computed(() => {
      const idx = new Map(sites.value.map((s, i) => [s, i]));
      return sites.value.slice().sort((a, b) => {
        const ra = activityScore(a), rb = activityScore(b);
        if (ra !== rb) return rb - ra;
        return idx.get(a) - idx.get(b);
      });
    });

    // チェックして 1 時間経過したらアーカイブ扱い (= 一覧から消す)。
    // cron/Cloud Functions 使わず、誰かが画面を見たタイミングで判定。
    // `now` を 30 秒ごとに更新して computed が反応 → 開いたままでも自動で消える。
    const ARCHIVE_AFTER_MS = 60 * 60 * 1000;
    const now = ref(Date.now());
    let nowTimer = null;
    function isArchived(item) {
      if (!item.checked) return false;
      const t = item.checkedAt?.toMillis?.() || 0;
      if (!t) return false;
      return (now.value - t) > ARCHIVE_AFTER_MS;
    }

    const filteredItems = computed(() =>
      items.value
        .filter((i) => i.site === activeSite.value && !isArchived(i))
        // 未チェック先、済みを下に。同じ状態内は createdAt desc (新しい順)。
        .sort((a, b) => {
          if (a.checked !== b.checked) return a.checked ? 1 : -1;
          const ta = a.createdAt?.toMillis?.() || 0;
          const tb = b.createdAt?.toMillis?.() || 0;
          return tb - ta;
        })
    );

    const countBySite = computed(() => {
      const m = {};
      for (const s of sites.value) m[s] = 0;
      for (const it of items.value) {
        if (it.checked) continue;
        if (isArchived(it)) continue;
        // master list に無い site (= keihi2 で削除済み等) もタブには出さないが、
        // items は残ってる可能性があるので両方ケアする (孤児 items は計上しない)
        if (it.site in m) m[it.site]++;
      }
      return m;
    });

    const inputPlaceholder = computed(() =>
      activeSite.value ? "「" + activeSite.value + "」に追加…" : "現場なし"
    );
    // hasChecked / checkedCount は「まだアーカイブされてない済み」のみ対象
    const hasChecked = computed(() =>
      items.value.some((i) => i.site === activeSite.value && i.checked && !isArchived(i))
    );
    const checkedCount = computed(() =>
      items.value.filter((i) => i.site === activeSite.value && i.checked && !isArchived(i)).length
    );

    // アーカイブ一覧: 全現場・全 archived item を日付 (Asia/Tokyo) でグルーピング
    const archivedByDay = computed(() => {
      const groups = new Map();
      for (const it of items.value) {
        if (!isArchived(it)) continue;
        const d = it.checkedAt?.toDate?.();
        if (!d) continue;
        const key = d.toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(it);
      }
      // 各日内: checkedAt desc
      for (const arr of groups.values()) {
        arr.sort((a, b) => (b.checkedAt?.toMillis?.() || 0) - (a.checkedAt?.toMillis?.() || 0));
      }
      // 日付 desc
      return [...groups.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1));
    });

    // 旧 docs (text フィールドのみ) と新 docs (name/qty/unit/category) 両対応
    function displayName(item) { return item.name || item.text || ""; }
    function catClass(c) { return c === "材料" ? "zairyo" : c === "工具" ? "kogu" : ""; }

    // email → 一意な色 (ハッシュベース)。誰がチェック/追加したかを色で示す。
    const USER_COLORS = ["#dc2626","#2563eb","#16a34a","#d97706","#7c3aed","#db2777","#0891b2","#84cc16","#f59e0b","#6366f1"];
    function colorForEmail(email) {
      const s = (email || "").toLowerCase();
      if (!s) return "#999";
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return USER_COLORS[Math.abs(h) % USER_COLORS.length];
    }
    function displayNameOf(email) {
      return (email || "").split("@")[0] || "?";
    }
    // タスク関連: 現在の現場 + アクティブ状態のものだけ select に並べる
    const tasksForCurrentSite = computed(() =>
      tasks.value.filter((t) => (t.site || "") === activeSite.value && t.status === "active")
    );
    function taskTitle(taskId) {
      if (!taskId) return "";
      return tasks.value.find((t) => t.id === taskId)?.title || "";
    }
    function formatTimeShort(ts) {
      const d = ts?.toDate?.();
      if (!d) return "";
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      return sameDay
        ? d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
        : d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function formatMeta(item) {
      const who = (item.addedBy || "").split("@")[0] || "";
      if (!item.createdAt?.toDate) return who;
      const d = item.createdAt.toDate();
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const t = sameDay
        ? d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
        : d.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
      return [who, t].filter(Boolean).join(" · ");
    }

    async function add() {
      if (!db || !user.value) return;
      const name = newName.value.trim();
      if (!name || adding.value) return;
      adding.value = true;
      try {
        const qty = Number(newQty.value);
        const note = newNote.value.trim() || null;
        // 1) id を先に生成 → setDoc(merge:true) で書き込み (addDoc だと SDK が
        //   暗黙的に「create only」前提を付けるため、ネットワーク再送で既存 doc に
        //   当たると "Document already exists" を吐く。setDoc + merge なら冪等)
        const docRef = doc(collection(db, SHOPPING));
        await setDoc(docRef, {
          name,
          qty: qty > 0 ? qty : null,
          unit: newUnit.value.trim() || null,
          category: newCategory.value || null,
          site: activeSite.value,
          checked: false,
          createdAt: serverTimestamp(),
          addedBy: (user.value.email || "").toLowerCase(),
          note,
          taskId: newTaskId.value || null,
        }, { merge: true });
        // 2) 画像があれば Storage にアップして imageUrl を update
        if (newFile.value) {
          const storage = getStorage(fbApp, "gs://static-epigram-496002-v8.firebasestorage.app");
          const safe = newFile.value.name.replace(/[^\w.\-]/g, "_");
          const path = `kaimono/${docRef.id}/${Date.now()}_${safe}`;
          const r = storageRef(storage, path);
          await uploadBytes(r, newFile.value);
          const imageUrl = await getDownloadURL(r);
          await updateDoc(docRef, { imageUrl });
        }
        // 3) フォーム reset (category は保持 = 連続入力で楽、taskId も保持)
        newName.value = "";
        newQty.value = "1";
        newUnit.value = "個";
        newNote.value = "";
        newFile.value = null;
        newPreview.value = "";
        inputExpanded.value = false;
      } catch (e) {
        err.value = "追加失敗: " + (e.message || e);
      } finally {
        adding.value = false;
      }
    }
    function onNewFilePick(e) {
      const f = e.target.files?.[0];
      if (!f) return;
      newFile.value = f;
      const reader = new FileReader();
      reader.onload = () => { newPreview.value = reader.result; };
      reader.readAsDataURL(f);
    }
    // 入力モーダルが閉じた時、展開状態と画像/メモ草稿は捨てる (name/qty/category は保持)
    watch(showInput, (v) => {
      if (!v) {
        inputExpanded.value = false;
        newNote.value = "";
        newFile.value = null;
        newPreview.value = "";
      }
    });

    async function toggle(item) {
      try {
        await updateDoc(doc(db, SHOPPING, item.id), {
          checked: !item.checked,
          checkedAt: !item.checked ? serverTimestamp() : null,
          checkedBy: !item.checked ? (user.value.email || "").toLowerCase() : null,
        });
      } catch (e) { err.value = e.message; }
    }

    async function del(item) {
      const label = displayName(item) + (item.qty ? ` × ${item.qty} ${item.unit || ""}` : "");
      if (!confirm(`「${label}」を削除しますか?`)) return;
      try { await deleteDoc(doc(db, SHOPPING, item.id)); }
      catch (e) { err.value = e.message; }
    }

    // アーカイブから戻す: checked / checkedAt / checkedBy をクリア → 未済として復活
    async function restore(item) {
      const label = displayName(item) + (item.qty ? ` × ${item.qty} ${item.unit || ""}` : "");
      if (!confirm(`「${label}」を未済みリストに戻しますか?`)) return;
      try {
        await updateDoc(doc(db, SHOPPING, item.id), {
          checked: false,
          checkedAt: null,
          checkedBy: null,
        });
        archExpandedId.value = null;
      } catch (e) { err.value = e.message; }
    }

    async function clearChecked() {
      const targets = items.value.filter((i) => i.site === activeSite.value && i.checked);
      if (!targets.length) return;
      if (!confirm(`「${activeSite.value}」の済み ${targets.length} 件を削除しますか?`)) return;
      try {
        const batch = writeBatch(db);
        for (const t of targets) batch.delete(doc(db, SHOPPING, t.id));
        await batch.commit();
      } catch (e) { err.value = e.message; }
    }

    function back() { location.href = "/"; }

    // ── 詳細パネル (画像 + 説明) ────────────────────────────
    function toggleDetail(item) {
      expandedId.value = expandedId.value === item.id ? null : item.id;
      // 詳細閉じたら編集モードもキャンセル
      if (expandedId.value !== item.id) cancelDetailEdit();
    }
    function startDetailEdit(item) {
      editingDetailId.value = item.id;
      editNote.value = item.note || "";
      editFile.value = null;
      editPreview.value = item.imageUrl || "";
    }
    function cancelDetailEdit() {
      editingDetailId.value = null;
      editFile.value = null;
      editPreview.value = "";
      editNote.value = "";
    }
    function onFilePick(e) {
      const f = e.target.files?.[0];
      if (!f) return;
      editFile.value = f;
      const reader = new FileReader();
      reader.onload = () => { editPreview.value = reader.result; };
      reader.readAsDataURL(f);
    }
    async function saveDetail(item) {
      if (savingDetail.value) return;
      savingDetail.value = true;
      try {
        const updates = { note: editNote.value.trim() || null };
        if (editFile.value) {
          // Firebase Storage に kaimono/<itemId>/<ts>_<filename> でアップ
          // バケットを明示。init.json の storageBucket が古い形式の可能性に備える。
          const storage = getStorage(fbApp, "gs://static-epigram-496002-v8.firebasestorage.app");
          const safe = editFile.value.name.replace(/[^\w.\-]/g, "_");
          const path = `kaimono/${item.id}/${Date.now()}_${safe}`;
          const r = storageRef(storage, path);
          await uploadBytes(r, editFile.value);
          updates.imageUrl = await getDownloadURL(r);
        }
        await updateDoc(doc(db, SHOPPING, item.id), updates);
        cancelDetailEdit();
      } catch (e) {
        err.value = "詳細保存失敗: " + (e.message || e);
      } finally {
        savingDetail.value = false;
      }
    }
    function hasDetail(item) {
      return !!(item.note || item.imageUrl);
    }
    function openImage(url) { window.open(url, "_blank"); }

    // 駒込の材料 15件を1回限り seed (owner 専用)。
    // 同じ seedTag のドキュメントが1件でもあれば再実行不可。
    const KOMAGOME_SEED = [
      { name: "90間柱3m",      qty: 2,  unit: "本" },
      { name: "ハケ",          qty: null, unit: null },
      { name: "脚立3尺",       qty: 2,  unit: "本" },
      { name: "ボードビス",    qty: null, unit: null },
      { name: "垂木",          qty: 1,  unit: "本" },
      { name: "タッチアップ塗料", qty: null, unit: null },
      { name: "換気口",        qty: 2,  unit: "枚" },
      { name: "タコ脚タップ",  qty: 1,  unit: "個" },
      { name: "床モール1m 白", qty: 3,  unit: "本" },
      { name: "両面テープ",    qty: 2,  unit: "個" },
      { name: "延長コード2.5m", qty: 1, unit: "本" },
      { name: "床モール1m",    qty: 3,  unit: "本" },
      { name: "ボード12.5",    qty: 12, unit: null },
      { name: "65スタッド2500", qty: 13, unit: "本" },
      { name: "65ランナー4m",  qty: 4,  unit: "本" },
    ];

    async function seedKomagome() {
      if (!isOwner.value || !canSeedKomagome.value || seeding.value) return;
      if (!confirm("駒込に材料 15件を投入します。1回限りの操作です。続けますか?")) return;
      seeding.value = true;
      try {
        // 1) サイト「駒込」を Cloud SQL に確保 (既存ならサーバ側で UNIQUE 制約により無視 or 409)
        try {
          const token = await user.value.getIdToken();
          await fetch((window.API_BASE || "") + "/api/sites", {
            method: "POST",
            headers: { authorization: "Bearer " + token, "content-type": "application/json" },
            body: JSON.stringify({ name: "駒込" }),
          });
          // 失敗してもサイトはすでに存在してる可能性。サイト一覧再取得
          const r = await fetch((window.API_BASE || "") + "/api/sites", {
            headers: { authorization: "Bearer " + token },
          });
          if (r.ok) {
            const rows = await r.json();
            sites.value = (Array.isArray(rows) ? rows : []).map((x) => x.name).filter(Boolean);
          }
        } catch (_) {}
        // 2) Firestore へ 15件を batch write
        const batch = writeBatch(db);
        const col = collection(db, SHOPPING);
        const addedBy = (user.value.email || "").toLowerCase();
        for (const it of KOMAGOME_SEED) {
          const ref = doc(col); // auto id
          // merge:true で再送時の "already exists" を回避
          batch.set(ref, {
            name: it.name,
            qty: it.qty,
            unit: it.unit,
            category: "材料",
            site: "駒込",
            checked: false,
            createdAt: serverTimestamp(),
            addedBy,
            seedTag: "komagome_v1",
          }, { merge: true });
        }
        await batch.commit();
        activeSite.value = "駒込";
      } catch (e) {
        err.value = "seed 失敗: " + (e.message || e);
      } finally {
        seeding.value = false;
      }
    }

    // now を 30 秒ごとに更新して、開きっぱなしでも 1 時間アーカイブが効くように
    nowTimer = setInterval(() => { now.value = Date.now(); }, 30_000);

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        fbApp = initializeApp(cfg);
        const auth = getAuth(fbApp);
        await setPersistence(auth, browserLocalPersistence);
        // 手配リストは techstudy と同じく「サインインしてれば誰でも」開放。
        // gateInternal は呼ばない (社外 Google ユーザーも入れる)
        db = getFirestore(fbApp);
        onAuthStateChanged(auth, async (u) => {
          if (!u) {
            location.href = "/?next=" + encodeURIComponent(location.pathname);
            return;
          }
          user.value = u;
          // 1) /api/sites (Cloud SQL) から現場一覧。keihi2 と同じソース。
          try {
            const token = await u.getIdToken();
            const res = await fetch((window.API_BASE || "") + "/api/sites", {
              headers: { authorization: "Bearer " + token },
            });
            if (res.ok) {
              const rows = await res.json();
              // /api/sites は [{ id, name, ... }] を返す
              sites.value = (Array.isArray(rows) ? rows : []).map((r) => r.name).filter(Boolean);
            }
          } catch (e) { /* タブ取得失敗は致命じゃない、Firestore は購読続行 */ }
          // 2) Firestore リアルタイム購読 (shopping_items)
          const q = query(collection(db, SHOPPING), orderBy("createdAt", "desc"));
          unsubscribe = onSnapshot(q, (snap) => {
            items.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            // 初回購読完了時、まだ activeSite 未選択なら URL ?site= を優先、
            // 無ければ最もアクティブな site を選ぶ
            if (!activeSite.value) {
              if (urlSite && sites.value.includes(urlSite)) {
                activeSite.value = urlSite;
              } else if (sortedSites.value.length) {
                activeSite.value = sortedSites.value[0];
              }
            }
            ready.value = true;
          }, (e) => {
            err.value = "購読失敗: " + e.message;
            ready.value = true;
          });
          // 3) tasks (社内 ALLOWED_EMAILS だけ通る。社外ユーザーはエラーで OK)。
          //    現場ごとの「関連タスク」select を構築するために購読。
          try {
            unsubscribeTasks = onSnapshot(collection(db, "tasks"), (snap) => {
              tasks.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            }, (_e) => { tasks.value = []; });
          } catch (_) { tasks.value = []; }
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        ready.value = true;
      }
    });

    onBeforeUnmount(() => {
      if (unsubscribe) unsubscribe();
      if (unsubscribeTasks) unsubscribeTasks();
      if (nowTimer) clearInterval(nowTimer);
    });

    return {
      sites, sortedSites, activeSite, items, ready, err,
      newName, newQty, newUnit, newCategory, newTaskId, tasks, tasksForCurrentSite, taskTitle,
      adding, seeding, showInput,
      inputExpanded, newNote, newFile, newPreview, onNewFilePick,
      expandedId, editingDetailId, editNote, editFile, editPreview, savingDetail,
      showArchive, archExpandedId, archivedByDay, restore,
      isOwner, canSeedKomagome,
      filteredItems, countBySite, hasChecked, checkedCount, inputPlaceholder,
      formatMeta, displayName, catClass, hasDetail,
      colorForEmail, displayNameOf, formatTimeShort,
      add, toggle, del, clearChecked, back, seedKomagome,
      toggleDetail, startDetailEdit, cancelDetailEdit, onFilePick, saveDetail, openImage,
    };
  },
};

createApp(App).component("bottom-sheet", BottomSheet).mount("#app");
</script>
