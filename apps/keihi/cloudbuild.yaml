substitutions:
  _APP: keihi
  _REGION: asia-northeast1
  _SERVICE: keihi-api
  _REPO: keikhi
  _SA: keihi-run
  _DB_INSTANCE: keikhi-db
  _DB_NAME: keihi
  _BUCKET_SUFFIX: keihi-receipts

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - ./apps/${_APP}/server

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=keihi-db-password:latest
      - --set-env-vars=DB_USER=keihi,DB_NAME=${_DB_NAME},DB_INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_DB_INSTANCE},RECEIPTS_BUCKET=$PROJECT_ID-${_BUCKET_SUFFIX}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
