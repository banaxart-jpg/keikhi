substitutions:
  _APP: keihi
  _REGION: asia-northeast1
  _SERVICE: keihi-api
  _REPO: keikhi
  _SA: keihi-run
  _DB_INSTANCE: keikhi-db
  _DB_NAME: keihi
  _BUCKET_SUFFIX: keihi-receipts
  # Who may invoke the Cloud Run API from the browser (org policy blocks
  # allUsers/allAuthenticatedUsers, so a specific principal is required).
  _INVOKER: user:info@banax.tokyo
  # Comma-separated emails allowed to use /api/* (Firebase ID token gate)。
  # techstudy (/api/kotonoha/*) は別途 isKotonoha バイパスで全認証ユーザーに開放。
  # それ以外 (経費 / 請求書 / kaigi 等) は社内 3 アカウントだけ。
  _ALLOWED_EMAILS: info@banax.tokyo,konishi0221@gmail.com,banaxart@gmail.com
  # Firebase Hosting site id for the keihi frontend (must be globally unique).
  _HOSTING_SITE: keihi-496002
  # Firebase Cloud Messaging Web Push 用 VAPID 公開鍵 (Console > Project Settings
  # > Cloud Messaging > Web Push certificates で生成 → ここに貼る)。
  # 空のままだと Push 登録はスキップ (アプリは動く)。
  _FCM_VAPID_KEY: ""

steps:
  # Kaniko: レイヤキャッシュで差分のみビルド（package.json 不変なら
  # npm install を丸ごとスキップ）。push も兼ねるので別 push ステップ不要。
  - id: build
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - --context=dir://apps/${_APP}/server
      - --cache=true
      - --cache-ttl=336h
      - --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}-cache
      - --snapshot-mode=redo
      - --use-new-run

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=keihi-db-password:latest,OPENAI_API_KEY=openai-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,INTERNAL_TICK_SECRET=kaigi-tick-secret:latest
      # ALLOWED_EMAILS は値にコンマを含むので、`^||^` で env vars 同士の
      # 区切り文字を `||` に切り替えて値内のコンマを誤分解させない。
      - --set-env-vars=^||^DB_USER=keihi||DB_NAME=${_DB_NAME}||DB_INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}||RECEIPTS_BUCKET=$PROJECT_ID-${_BUCKET_SUFFIX}||FIREBASE_PROJECT_ID=$PROJECT_ID||ALLOWED_EMAILS=${_ALLOWED_EMAILS}||SHEET_ID=1RpRkwHVVhZnciafSGhxiTKaKpLkGhAwZLP8PPb3iE7E||INVOICE_SHEET_ID=13PQD0RZwkqsSHnE7Y9iXe86C3tMZKULt0DzRYN5vWUc||DRIVE_FOLDER_ID=1IJVYyAQCWiOvwGywGlJbWM_7xx9zbz-L||APP_VERSION=$SHORT_SHA||BUILD_ID=$BUILD_ID
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

  - id: prep-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # ブラウザは Cloud Run を直叩き（org policy が Hosting SA を弾くため
        # rewrite 経由は使えない）。public 化＋Express側 verifyIdToken で保護。
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member=allUsers \
          --role=roles/run.invoker --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member=${_INVOKER} \
          --role=roles/run.invoker --quiet
        RUN_URL=$$(gcloud run services describe ${_SERVICE} \
          --region=${_REGION} --format='value(status.url)')
        cat > apps/config.js <<CONFIG_EOF
        window.API_BASE = '$$RUN_URL';
        window.FCM_VAPID_KEY = '${_FCM_VAPID_KEY}';
        window.APP_VERSION = '$SHORT_SHA';
        // 全ページ共通: 右下に小さくバージョン (commit hash) を表示。
        // スクリーンショットを Claude に送ったとき「どの deploy か」即判別できる。
        document.addEventListener('DOMContentLoaded', function () {
          var d = document.createElement('div');
          d.textContent = 'v.' + (window.APP_VERSION || 'dev');
          d.style.cssText = 'position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);left:6px;font:8px ui-monospace,Menlo,monospace;color:rgba(0,0,0,0.22);z-index:99999;pointer-events:none;letter-spacing:0;';
          document.body.appendChild(d);
        });
        CONFIG_EOF
        echo "API_BASE = $$RUN_URL (direct Cloud Run call)"
        # kaigi 自動進行（Cloud Tasks → 自身の /api/internal/kaigi/tick へ）に
        # 必要な SELF URL と queue 情報を Cloud Run の env として後注入する。
        gcloud run services update ${_SERVICE} \
          --region=${_REGION} \
          --update-env-vars=SERVICE_URL=$$RUN_URL,KAIGI_TASKS_QUEUE=kaigi-tick,KAIGI_TASKS_LOCATION=${_REGION} \
          --quiet

  - id: ensure-hosting-site
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        TOKEN=$$(gcloud auth print-access-token)
        curl -s -X POST \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites?siteId=${_HOSTING_SITE}" \
          -d '{}' || true
        echo "hosting site ensured: ${_HOSTING_SITE}"

  - id: svg-to-png
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # apple-touch-icon は iOS が PNG しか確実に認識しないので、SVG から
        # 各アプリの PNG (180x180) を生成して同じディレクトリに置く。
        npm install --prefix /tmp sharp --silent --no-audit --no-fund
        node -e "
          const sharp = require('/tmp/node_modules/sharp');
          const svgs = ['apps/icon.svg','apps/keihi/icon.svg','apps/keihi2/icon.svg','apps/seikyu/icon.svg','apps/kaimono/icon.svg'];
          (async () => {
            for (const svg of svgs) {
              const png = svg.replace(/\.svg$/, '.png');
              await sharp(svg, { density: 300 }).resize(180, 180).png().toFile(png);
              console.log('converted', svg, '->', png);
            }
          })();
        "

  - id: deploy-hosting
    name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm install -g firebase-tools@13 --silent --no-audit --no-fund
        # hosting + firestore rules は必須。Storage は未有効化の可能性ある (project で
        # Storage 作ってないと storage.rules deploy が失敗して全 deploy が巻き戻る)
        # ので別ステップにして失敗を許容する。
        firebase deploy --only hosting,firestore:rules \
          --project=$PROJECT_ID \
          --config=firebase.json \
          --non-interactive
        firebase deploy --only storage \
          --project=$PROJECT_ID \
          --config=firebase.json \
          --non-interactive || echo "[deploy] storage skipped (Console で Storage 有効化が必要)"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
# images: は不要（Kaniko が --destination で直接 push 済み）。
