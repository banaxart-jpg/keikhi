substitutions:
  _APP: keihi
  _REGION: asia-northeast1
  _SERVICE: keihi-api
  _REPO: keikhi
  _SA: keihi-run
  _DB_INSTANCE: keikhi-db
  _DB_NAME: keihi
  _BUCKET_SUFFIX: keihi-receipts
  # Who may invoke the Cloud Run API from the browser (org policy blocks
  # allUsers/allAuthenticatedUsers, so a specific principal is required).
  _INVOKER: user:info@banax.tokyo
  # Comma-separated emails allowed to use /api/* (Firebase ID token gate).
  # Empty = any authenticated user of this Firebase project.
  _ALLOWED_EMAILS: info@banax.tokyo
  # Firebase Hosting site id for the keihi frontend (must be globally unique).
  _HOSTING_SITE: keihi-496002

steps:
  # Kaniko: レイヤキャッシュで差分のみビルド（package.json 不変なら
  # npm install を丸ごとスキップ）。push も兼ねるので別 push ステップ不要。
  - id: build
    name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:latest
      - --context=dir://apps/${_APP}/server
      - --cache=true
      - --cache-ttl=336h
      - --cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}-cache
      - --snapshot-mode=redo
      - --use-new-run

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_APP}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=${_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_DB_INSTANCE}
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=keihi-db-password:latest
      - --set-env-vars=DB_USER=keihi,DB_NAME=${_DB_NAME},DB_INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_DB_INSTANCE},RECEIPTS_BUCKET=$PROJECT_ID-${_BUCKET_SUFFIX},FIREBASE_PROJECT_ID=$PROJECT_ID,ALLOWED_EMAILS=${_ALLOWED_EMAILS}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

  - id: prep-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # info@banax.tokyo can still hit Cloud Run directly (debug/curl).
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} \
          --member=${_INVOKER} \
          --role=roles/run.invoker --quiet
        # Frontend talks to the API same-origin via the Hosting rewrite.
        echo "window.API_BASE='';" > apps/${_APP}/web/config.js
        echo "API_BASE = (same-origin via Hosting rewrite)"

  - id: ensure-hosting-site
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        TOKEN=$$(gcloud auth print-access-token)
        curl -s -X POST \
          -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" \
          "https://firebasehosting.googleapis.com/v1beta1/projects/$PROJECT_ID/sites?siteId=${_HOSTING_SITE}" \
          -d '{}' || true
        echo "hosting site ensured: ${_HOSTING_SITE}"

  # firebase-tools 同梱イメージ。毎回の npm install -g (40〜60s) を排除。
  # Hosting デプロイで run rewrite を適用すると、ここで初めて Firebase
  # Hosting のサービスエージェントが自動生成される（順序が重要）。
  - id: deploy-hosting
    name: andreysenov/firebase-tools:latest
    entrypoint: firebase
    args:
      - deploy
      - --only=hosting
      - --project=$PROJECT_ID
      - --config=apps/${_APP}/firebase.json
      - --non-interactive

  # Hosting デプロイ後（＝Hosting SA が存在する状態）で invoker を付与。
  # /api/** rewrite が Cloud Run を呼べるようにする。伝播待ちでリトライ。
  - id: grant-hosting-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        HOSTING_SA="service-$PROJECT_NUMBER@gcp-sa-firebasehosting.iam.gserviceaccount.com"
        ok=""
        for i in 1 2 3 4 5 6; do
          if gcloud run services add-iam-policy-binding ${_SERVICE} \
               --region=${_REGION} \
               --member="serviceAccount:$$HOSTING_SA" \
               --role=roles/run.invoker --quiet 2>/dev/null; then ok=1; break; fi
          echo "Hosting SA not propagated yet, retry $$i ..."; sleep 10
        done
        if [ -n "$$ok" ]; then
          echo "OK: Hosting SA granted run.invoker on ${_SERVICE}"
        else
          echo "WARN: not applied yet — 次回ビルドで収束（初回のみ起こりうる）"
        fi

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
# images: は不要（Kaniko が --destination で直接 push 済み）。
