<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経理">
<link rel="apple-touch-icon" href="/keiri/icon.svg">
<title>経理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  /* アクセント: くすませた紫系 (元 #4338ca / #6366f1) */
  --accent: #7a6e96; --accent2: #9b8dbb;
  /* 収入(in)/支出(out): セージグリーン / テラコッタ (原色から落として目に優しく) */
  --in: #7c9d75; --out: #b5766a;
  /* 注意系も控えめなサンド色 */
  --warn: #b89366;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.icon.spin { animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 10px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.pill .icon { font-size: 14px; }

/* 年ナビ + 年間トータル */
.year-bar { display: flex; align-items: center; padding: 0 18px 8px; gap: 8px; }
.year-bar .nav { width: 32px; height: 32px; border-radius: 16px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); font-size: 16px; color: var(--text2); cursor: pointer; font-family: inherit; flex-shrink: 0; }
.year-bar .nav:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.year-bar .lbl { font-size: 17px; font-weight: 800; flex: 1; text-align: center; letter-spacing: 0.02em; }

.year-total { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 14px 10px; }
.year-cell { background: var(--bg); border-radius: 12px; padding: 8px 10px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); display: flex; flex-direction: column; gap: 1px; }
.year-cell .lbl { font-size: 9px; font-weight: 800; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; }
.year-cell .val { font-size: 14px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; letter-spacing: -0.02em; }
.year-cell.in .val { color: var(--in); }
.year-cell.out .val { color: var(--out); }
.year-cell.profit-plus .val { color: var(--in); }
.year-cell.profit-minus .val { color: var(--out); }

/* タブ切替 (月間 / 現場別) */
.tabs { display: flex; padding: 0 14px; gap: 6px; }
.tabs > button { flex: 1; padding: 10px 14px; border-radius: 14px; border: none; background: var(--bg); color: var(--text2); font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); transition: all 150ms ease; }
.tabs > button.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 5px 5px 14px rgba(122,110,150,0.32); }

.wrap { padding: 14px 14px 30px; display: flex; flex-direction: column; gap: 10px; }

/* 月次推移トレンドチャート (年間タブの上、12ヶ月) */
.trend-card { background: var(--bg); border-radius: 16px; padding: 12px 14px 14px; box-shadow: 5px 5px 14px var(--sd), -3px -3px 10px var(--sl); position: relative; }
.trend-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.trend-legend { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text2); font-weight: 700; }
.lg-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-left: 6px; }
.lg-dot.in { background: var(--in); } .lg-dot.out { background: var(--out); } .lg-dot.profit { background: var(--accent); border-radius: 50%; }
.trend-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 90px; align-items: flex-end; position: relative; padding-bottom: 16px; border-bottom: 1px solid rgba(168,172,192,0.25); }
.trend-col { display: flex; flex-direction: column; align-items: center; gap: 0; cursor: pointer; height: 100%; justify-content: flex-end; position: relative; transition: transform 120ms ease; }
.trend-col:active { transform: scale(0.94); }
.trend-col.on .trend-lbl { color: var(--accent); font-weight: 900; }
.trend-bars { display: flex; align-items: flex-end; gap: 2px; height: 100%; width: 100%; justify-content: center; padding-top: 4px; }
.tb { width: 100%; max-width: 8px; min-height: 1px; border-radius: 2px 2px 0 0; transition: opacity 200ms ease; }
.tb.in { background: linear-gradient(180deg, color-mix(in srgb, var(--in) 80%, white), var(--in)); }
.tb.out { background: linear-gradient(180deg, color-mix(in srgb, var(--out) 80%, white), var(--out)); }
.trend-col.on .tb { box-shadow: 0 0 0 1.5px var(--accent); }
.trend-lbl { position: absolute; bottom: 0; font-size: 9px; font-weight: 700; color: var(--text2); font-family: ui-monospace, Menlo, monospace; }
.trend-line { position: absolute; top: 32px; left: 14px; right: 14px; height: 64px; pointer-events: none; }

/* ドーナツチャート (月詳細の支出内訳) */
.donut-card { display: flex; justify-content: center; padding: 4px 0 8px; }
.donut-wrap { width: 160px; height: 160px; position: relative; }
.donut-svg { width: 100%; height: 100%; filter: drop-shadow(2px 2px 6px var(--sd)); }
.donut-seg { transition: stroke-dasharray 400ms cubic-bezier(.4,.0,.2,1); }
.cat-row { gap: 8px; }
.cat-color { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.cat-row.zero .cat-color { opacity: 0.3; }

/* 現場別の横棒可視化 */
.site-bars { display: flex; flex-direction: column; gap: 2px; height: 9px; }
.site-bar { height: 4px; border-radius: 2px; min-width: 2px; }
.site-bar.in { background: linear-gradient(90deg, var(--in), color-mix(in srgb, var(--in) 60%, white)); }
.site-bar.out { background: linear-gradient(90deg, var(--out), color-mix(in srgb, var(--out) 60%, white)); }
.loading { text-align: center; color: var(--text2); font-size: 13px; padding: 60px 0; }
.err { padding: 12px 14px; border-radius: 14px; background: #fde0e0; color: #8a2727; font-size: 12px; font-weight: 600; }

/* 月行 / 現場行 (collapsed + expanded) */
.row { background: var(--bg); border-radius: 14px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); overflow: hidden; transition: transform 100ms ease; }
.row-head { display: flex; align-items: center; gap: 8px; padding: 11px 12px; cursor: pointer; }
.row-head .chev { font-family: 'Material Symbols Outlined'; font-size: 18px; color: var(--text3); transition: transform 150ms ease; flex-shrink: 0; }
.row.open .row-head .chev { transform: rotate(90deg); color: var(--accent); }
.row-name { flex: 1; font-size: 14px; font-weight: 800; color: var(--text); word-break: break-word; min-width: 0; }
.row-kpi { display: flex; gap: 8px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.row-kpi .k { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.row-kpi .k-lbl { font-size: 8px; color: var(--text3); letter-spacing: 0.04em; }
.row-kpi .k-val { font-family: ui-monospace, Menlo, monospace; font-weight: 800; }
.row-kpi .k.in .k-val { color: var(--in); }
.row-kpi .k.out .k-val { color: var(--out); }
.row-kpi .k.profit .k-val.plus { color: var(--in); }
.row-kpi .k.profit .k-val.minus { color: var(--out); }
.row.empty { opacity: 0.5; }

/* 月詳細 (expanded) */
.row-body { padding: 0 12px 14px; display: none; flex-direction: column; gap: 12px; border-top: 1px solid rgba(168,172,192,0.18); padding-top: 12px; }
.row.open .row-body { display: flex; }

.kpi-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.kpi3-cell { background: var(--bg2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl); }
.kpi3-cell .lbl { font-size: 9px; font-weight: 800; color: var(--text2); letter-spacing: 0.06em; }
.kpi3-cell .val { font-size: 13px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; }
.kpi3-cell.in .val { color: var(--in); }
.kpi3-cell.out .val { color: var(--out); }
.kpi3-cell.profit-plus .val { color: var(--in); }
.kpi3-cell.profit-minus .val { color: var(--out); }

.rev-split, .cat-list { display: flex; flex-direction: column; gap: 4px; }
.split-h { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.04em; padding: 4px 2px 0; }
.rev-line { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 12px; background: var(--bg2); border-radius: 10px; font-size: 12px; font-weight: 700; box-shadow: inset 2px 2px 5px var(--sd), inset -1px -1px 4px var(--sl); }
.rev-line .l { color: var(--text2); }
.rev-line .v { font-family: ui-monospace, Menlo, monospace; font-weight: 800; color: var(--in); }

.cat-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--bg2); border-radius: 10px; box-shadow: inset 2px 2px 5px var(--sd), inset -1px -1px 4px var(--sl); cursor: pointer; transition: transform 100ms ease; font-size: 12px; }
.cat-row:active { transform: scale(0.98); }
.cat-row.zero { opacity: 0.4; cursor: default; }
.cat-row.unknown { box-shadow: inset 2px 2px 5px var(--sd), inset -1px -1px 4px var(--sl), 0 0 0 1.5px rgba(184,147,102,0.5); }
.cat-row.unknown .cat-name { color: var(--warn); }
.cat-name { font-weight: 700; color: var(--text); min-width: 0; flex: 1; word-break: break-word; }
.cat-name .icon { font-size: 14px; vertical-align: -2px; color: var(--text3); margin-right: 3px; }
.cat-count { font-size: 10px; color: var(--text3); font-weight: 700; flex-shrink: 0; }
.cat-amount { font-family: ui-monospace, Menlo, monospace; font-weight: 800; flex-shrink: 0; min-width: 90px; text-align: right; }
.cat-amount.in { color: var(--in); }
.cat-amount.out { color: var(--out); }

/* ドリルダウン */
.modal { position: fixed; inset: 0; background: rgba(180,184,205,0); display: flex; align-items: flex-end; visibility: hidden; opacity: 0; z-index: 60; transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 200ms; }
.modal.open { background: rgba(180,184,205,0.5); visibility: visible; opacity: 1; transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 0s; }
.sheet { background: var(--bg); border-radius: 24px 24px 0 0; box-shadow: -2px -10px 30px rgba(148,152,176,0.4); width: 100%; max-width: 600px; margin: 0 auto; max-height: 88vh; padding: 6px 16px calc(28px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 220ms cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; }
.modal.open .sheet { transform: translateY(0); }
.handle { width: 46px; height: 5px; border-radius: 3px; background: rgba(168,172,192,0.45); margin: 10px auto 8px; cursor: pointer; }
.sheet-h { font-size: 14px; font-weight: 800; padding: 0 4px 10px; color: var(--text); display: flex; justify-content: space-between; align-items: baseline; }
.sheet-h .count { font-size: 11px; color: var(--text2); font-weight: 700; }
.sheet-list { overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-bottom: 8px; }
.empty-msg { text-align: center; color: var(--text3); font-size: 12px; font-weight: 700; padding: 30px; }
.tx-row { background: var(--bg); border-radius: 12px; padding: 9px 12px; box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); display: flex; gap: 10px; align-items: center; cursor: pointer; transition: transform 100ms ease; }
.tx-row:active { transform: scale(0.98); }
.tx-row .edit-icon { font-size: 14px; color: var(--text3); flex-shrink: 0; font-variation-settings: 'FILL' 0, 'wght' 500; }

/* 編集フォーム */
.edit-form { display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
.ef-line { display: flex; align-items: center; gap: 10px; }
.ef-lbl { font-size: 11px; font-weight: 800; color: var(--text2); width: 56px; flex-shrink: 0; letter-spacing: 0.04em; }
.ef-line input, .ef-line select { flex: 1; padding: 10px 12px; border: none; border-radius: 12px; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: inset 3px 3px 7px var(--sd), inset -2px -2px 6px var(--sl); outline: none; min-width: 0; }
.ef-line input:focus, .ef-line select:focus { box-shadow: inset 3px 3px 7px var(--sd), inset -2px -2px 6px var(--sl), 0 0 0 2px var(--accent2); }
.ef-static { flex: 1; font-size: 13px; color: var(--text); font-family: ui-monospace, Menlo, monospace; font-weight: 700; padding: 10px 4px; }
.ef-actions { display: flex; gap: 8px; margin-top: 10px; }
.ef-actions button { flex: 1; padding: 12px; border-radius: 14px; border: none; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); color: var(--text2); }
.ef-actions button.primary { background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; box-shadow: 5px 5px 14px rgba(122,110,150,0.32); }
.ef-actions button:active:not(:disabled) { transform: scale(0.97); }
.ef-actions button:disabled { opacity: 0.55; }
.tx-date { font-size: 10px; color: var(--text2); font-weight: 700; font-family: ui-monospace, Menlo, monospace; flex-shrink: 0; min-width: 38px; }
.tx-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tx-name { font-size: 12px; font-weight: 700; color: var(--text); word-break: break-word; }
.tx-meta { font-size: 9px; color: var(--text3); font-weight: 600; }
.tx-amount { font-size: 12px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; flex-shrink: 0; }
.tx-amount.in { color: var(--in); }
.tx-amount.out { color: var(--out); }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// 会計カテゴリのアイコン (Material Symbols)
const CAT_ICONS = {
  "給料": "payments", "家賃": "home_work", "車両費": "directions_car", "保険料": "health_and_safety",
  "ネット系": "language", "接待交際費": "restaurant", "材料費": "construction",
  "外注費": "engineering", "雑費": "category", "未分類": "help",
};
// ドーナツ/凡例用のカテゴリカラー (10色、目に優しいアースカラーで統一)
const CAT_COLORS = {
  "給料":     "#6b7a8a",   // スレートブルー
  "家賃":     "#8aa6a8",   // ダスティティール
  "車両費":   "#8d9a82",   // セージグレー
  "保険料":   "#7c9d75",   // セージグリーン
  "ネット系": "#a8a87a",   // オリーブ
  "接待交際費": "#c4a574", // ウォームサンド
  "材料費":   "#b08968",   // ライトクレイ
  "外注費":   "#b5766a",   // テラコッタ
  "雑費":     "#9b7591",   // ミューテッドプラム
  "未分類":   "#a8a29e",   // ウォームグレー
};

const TEMPLATE = `
<div>
  <div class="header-fix">
    <div class="top">
      <span class="title"><span class="icon">analytics</span> 経理</span>
      <div style="display:flex; gap:6px;">
        <button class="pill" :disabled="loading" @click="refresh"><span class="icon" :class="{ spin: loading }">{{ loading ? 'progress_activity' : 'refresh' }}</span></button>
        <a class="pill" href="/" style="text-decoration:none;">← 戻る</a>
      </div>
    </div>
    <div class="year-bar">
      <button class="nav" @click="shiftYear(-1)">‹</button>
      <div class="lbl">{{ year }}年</div>
      <button class="nav" @click="shiftYear(1)">›</button>
    </div>
    <div v-if="data" class="year-total">
      <div class="year-cell in">
        <div class="lbl">年売上</div>
        <div class="val">¥{{ formatYen(data.yearTotal.revenue) }}</div>
      </div>
      <div class="year-cell out">
        <div class="lbl">年支出</div>
        <div class="val">¥{{ formatYen(data.yearTotal.expense) }}</div>
      </div>
      <div class="year-cell" :class="data.yearTotal.profit >= 0 ? 'profit-plus' : 'profit-minus'">
        <div class="lbl">年利益</div>
        <div class="val">{{ data.yearTotal.profit >= 0 ? '' : '-' }}¥{{ formatYen(Math.abs(data.yearTotal.profit)) }}</div>
      </div>
    </div>
    <div class="tabs">
      <button :class="{ on: tab === 'month' }" @click="tab = 'month'">月間</button>
      <button :class="{ on: tab === 'site' }" @click="tab = 'site'">現場別</button>
    </div>
  </div>

  <div v-if="err" class="wrap"><div class="err">{{ err }}</div></div>
  <div v-if="loading" class="loading">集計中…</div>

  <div v-if="data && !loading" class="wrap">
    <!-- ───── 月間タブ ───── -->
    <template v-if="tab === 'month'">
      <!-- 月次推移チャート (12ヶ月の売上/支出バー + 利益ライン) -->
      <div class="trend-card">
        <div class="trend-h"><span>月次推移</span><span class="trend-legend"><span class="lg-dot in"></span>売上<span class="lg-dot out"></span>支出<span class="lg-dot profit"></span>利益</span></div>
        <div class="trend-grid">
          <div v-for="(t, i) in data.months" :key="t.month" class="trend-col" @click="toggleMonth(t.month)" :class="{ on: openMonth === t.month }">
            <div class="trend-bars">
              <div class="tb in" :style="{ height: trendBarH(t.revenue) + '%' }"></div>
              <div class="tb out" :style="{ height: trendBarH(t.expense) + '%' }"></div>
            </div>
            <div class="trend-lbl">{{ i + 1 }}</div>
          </div>
        </div>
        <!-- 利益ライン (SVG オーバーレイ) -->
        <svg class="trend-line" viewBox="0 0 240 100" preserveAspectRatio="none">
          <polyline :points="profitLinePoints" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" />
          <circle v-for="(p, i) in profitLinePoints.split(' ').filter(Boolean)" :key="i"
                  :cx="p.split(',')[0]" :cy="p.split(',')[1]" r="1.6" fill="var(--accent)" />
        </svg>
      </div>

      <div v-for="m in data.months" :key="m.month" class="row"
           :class="{ open: openMonth === m.month, empty: m.count === 0 }">
        <div class="row-head" @click="toggleMonth(m.month)">
          <span class="chev">chevron_right</span>
          <span class="row-name">{{ monthLabel(m.month) }}</span>
          <div class="row-kpi" v-if="m.count">
            <div class="k in"><span class="k-lbl">売</span><span class="k-val">¥{{ formatYenShort(m.revenue) }}</span></div>
            <div class="k out"><span class="k-lbl">支</span><span class="k-val">¥{{ formatYenShort(m.expense) }}</span></div>
            <div class="k profit"><span class="k-lbl">利</span><span class="k-val" :class="m.profit >= 0 ? 'plus' : 'minus'">{{ m.profit >= 0 ? '' : '-' }}¥{{ formatYenShort(Math.abs(m.profit)) }}</span></div>
          </div>
          <span v-else style="font-size:11px;color:var(--text3);font-weight:700;">データなし</span>
        </div>
        <div class="row-body">
          <div class="kpi-grid3">
            <div class="kpi3-cell in"><div class="lbl">売上</div><div class="val">¥{{ formatYen(m.revenue) }}</div></div>
            <div class="kpi3-cell out"><div class="lbl">支出</div><div class="val">¥{{ formatYen(m.expense) }}</div></div>
            <div class="kpi3-cell" :class="m.profit >= 0 ? 'profit-plus' : 'profit-minus'"><div class="lbl">利益</div><div class="val">{{ m.profit >= 0 ? '' : '-' }}¥{{ formatYen(Math.abs(m.profit)) }}</div></div>
          </div>
          <div class="rev-split">
            <div class="split-h">売上の内訳</div>
            <div class="rev-line"><span class="l">現場（工事）</span><span class="v">¥{{ formatYen(m.revenueConstruction) }}</span></div>
            <div class="rev-line"><span class="l">満竹華庵</span><span class="v">¥{{ formatYen(m.revenueRyokan) }}</span></div>
            <div v-if="otherRev(m) > 0" class="rev-line"><span class="l">その他</span><span class="v">¥{{ formatYen(otherRev(m)) }}</span></div>
          </div>
          <!-- 支出ドーナツチャート (SVG、月詳細時のみ) -->
          <div v-if="m.expense > 0" class="donut-card">
            <div class="donut-wrap">
              <svg viewBox="0 0 100 100" class="donut-svg">
                <circle cx="50" cy="50" r="38" fill="none" stroke="var(--bg2)" stroke-width="14" />
                <circle v-for="seg in donutSegments(m)" :key="seg.cat"
                  cx="50" cy="50" r="38" fill="none" :stroke="seg.color" stroke-width="14"
                  :stroke-dasharray="seg.dash" :stroke-dashoffset="seg.offset"
                  stroke-linecap="butt" transform="rotate(-90 50 50)" class="donut-seg" />
                <text x="50" y="47" text-anchor="middle" font-size="6" font-weight="700" fill="var(--text2)">支出</text>
                <text x="50" y="58" text-anchor="middle" font-size="9" font-weight="800" fill="var(--text)" font-family="ui-monospace, Menlo, monospace">¥{{ formatYenShort(m.expense) }}</text>
              </svg>
            </div>
          </div>
          <div class="cat-list">
            <div class="split-h">支出の内訳</div>
            <div v-for="c in data.accountingCategories" :key="c" class="cat-row"
                 :class="{ zero: m.categories[c].count === 0, unknown: c === '未分類' && m.categories[c].count > 0 }"
                 @click="m.categories[c].count > 0 && drillCategory(m.month, c)">
              <span class="cat-color" :style="{ background: catColor(c) }"></span>
              <span class="cat-name"><span class="icon">{{ icon(c) }}</span>{{ c }}</span>
              <span class="cat-count" v-if="m.categories[c].count">{{ m.categories[c].count }}件</span>
              <span class="cat-amount out">¥{{ formatYen(m.categories[c].amount) }}</span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ───── 現場別タブ ───── -->
    <template v-else>
      <div v-if="data.sites.length === 0" style="text-align:center;color:var(--text3);font-size:13px;padding:40px;">{{ year }}年の取引がありません</div>
      <div v-for="s in data.sites" :key="s.site" class="row" :class="{ open: openSite === s.site }">
        <div class="row-head" @click="toggleSite(s.site)">
          <span class="chev">chevron_right</span>
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:5px;">
            <span class="row-name">{{ s.site }}</span>
            <!-- 売上 vs 支出 の横棒可視化 -->
            <div class="site-bars">
              <div class="site-bar in" :style="{ width: siteBarWidth(s.revenue) + '%' }" :title="'売上 ¥' + formatYen(s.revenue)"></div>
              <div class="site-bar out" :style="{ width: siteBarWidth(s.expense) + '%' }" :title="'支出 ¥' + formatYen(s.expense)"></div>
            </div>
          </div>
          <div class="row-kpi">
            <div class="k in"><span class="k-lbl">売</span><span class="k-val">¥{{ formatYenShort(s.revenue) }}</span></div>
            <div class="k out"><span class="k-lbl">支</span><span class="k-val">¥{{ formatYenShort(s.expense) }}</span></div>
          </div>
        </div>
        <div class="row-body">
          <div class="kpi-grid3">
            <div class="kpi3-cell in"><div class="lbl">売上</div><div class="val">¥{{ formatYen(s.revenue) }}</div></div>
            <div class="kpi3-cell out"><div class="lbl">支出</div><div class="val">¥{{ formatYen(s.expense) }}</div></div>
            <div class="kpi3-cell" :class="s.profit >= 0 ? 'profit-plus' : 'profit-minus'"><div class="lbl">利益</div><div class="val">{{ s.profit >= 0 ? '' : '-' }}¥{{ formatYen(Math.abs(s.profit)) }}</div></div>
          </div>
          <div class="cat-list">
            <div class="split-h">内訳</div>
            <div v-for="c in data.siteCategories" :key="c" class="cat-row"
                 :class="{ zero: s.categories[c].count === 0 }"
                 @click="s.categories[c].count > 0 && drillSiteCategory(s.site, c)">
              <span class="cat-name">{{ c }}</span>
              <span class="cat-count" v-if="s.categories[c].count">{{ s.categories[c].count }}件</span>
              <span class="cat-amount" :class="c === '売上' ? 'in' : 'out'">¥{{ formatYen(s.categories[c].amount) }}</span>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ドリルダウン -->
  <div class="modal" :class="{ open: drillOpen }" @click="drillOpen = false">
    <div class="sheet" @click.stop>
      <div class="handle" @click="drillOpen = false"></div>
      <div class="sheet-h">
        <span>{{ drillTitle }}</span>
        <span class="count">{{ drillRows.length }}件</span>
      </div>
      <div class="sheet-list">
        <div v-if="drillLoading" class="loading">読み込み中…</div>
        <div v-else-if="!drillRows.length" class="empty-msg">該当なし</div>
        <div v-for="(r, i) in drillRows" :key="i" class="tx-row" @click="openEdit(r)">
          <span class="tx-date">{{ r.date.slice(5) }}</span>
          <div class="tx-body">
            <div class="tx-name">{{ r.counterparty || '(対象なし)' }}</div>
            <div class="tx-meta">{{ r.category }} · {{ r.subcategory || '未分類' }}<span v-if="r.site"> · {{ r.site }}</span><span v-if="r.source"> · {{ r.source }}</span></div>
          </div>
          <div class="tx-amount" :class="r.type === '収入' ? 'in' : 'out'">
            {{ r.type === '収入' ? '+' : '-' }}¥{{ formatYen(r.amount) }}
          </div>
          <span class="icon edit-icon">edit</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="modal" :class="{ open: editOpen }" @click="editOpen = false">
    <div class="sheet" @click.stop>
      <div class="handle" @click="editOpen = false"></div>
      <div class="sheet-h"><span>取引を編集</span></div>
      <div v-if="editRow" class="edit-form">
        <div class="ef-line"><span class="ef-lbl">日付</span><span class="ef-static">{{ editRow.date }}</span></div>
        <div class="ef-line"><span class="ef-lbl">対象</span><input type="text" v-model="editForm.counterparty" placeholder="店舗 / 振込先"></div>
        <div class="ef-line"><span class="ef-lbl">金額</span><input type="number" inputmode="numeric" v-model.number="editForm.amount"></div>
        <div class="ef-line"><span class="ef-lbl">大分類</span>
          <select v-model="editForm.category">
            <option v-for="c in BIG_CATEGORIES" :key="c" :value="c">{{ c }}</option>
          </select>
        </div>
        <div class="ef-line"><span class="ef-lbl">小分類</span>
          <input type="text" v-model="editForm.subcategory" list="subcatList" placeholder="材料費 / 外注費 / 給料 等">
          <datalist id="subcatList">
            <option v-for="s in SUB_CATEGORIES" :key="s" :value="s"></option>
          </datalist>
        </div>
        <div class="ef-line"><span class="ef-lbl">現場</span>
          <input type="text" v-model="editForm.site" list="siteList" placeholder="鳥研シート / 武蔵新城 等 (空でも可)">
          <datalist id="siteList">
            <option v-for="s in knownSites" :key="s" :value="s"></option>
          </datalist>
        </div>
        <div class="ef-line"><span class="ef-lbl">メモ</span><input type="text" v-model="editForm.memo" placeholder="任意"></div>
        <div class="ef-actions">
          <button @click="editOpen = false">キャンセル</button>
          <button class="primary" :disabled="saving" @click="saveEdit">{{ saving ? '保存中…' : '保存' }}</button>
        </div>
        <div v-if="editErr" class="err" style="margin-top:8px;">{{ editErr }}</div>
      </div>
    </div>
  </div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const year = ref(new Date().getFullYear());
    const tab = ref("month");
    const data = ref(null);
    const loading = ref(false);
    const err = ref("");
    const user = ref(null);
    const openMonth = ref(null);
    const openSite = ref(null);
    const drillOpen = ref(false);
    const drillLoading = ref(false);
    const drillRows = ref([]);
    const drillTitle = ref("");
    // 編集モーダル
    const editOpen = ref(false);
    const editRow = ref(null);
    const editForm = ref({ counterparty: "", amount: 0, category: "", subcategory: "", site: "", memo: "" });
    const saving = ref(false);
    const editErr = ref("");
    const BIG_CATEGORIES = ["工事", "旅館", "固定費", "光熱費", "経費", "その他", "未分類"];
    const SUB_CATEGORIES = ["材料費", "外注費", "給料", "家賃", "車両費", "保険", "通信費", "web", "接待交際費", "雑費", "未分類"];
    const knownSites = computed(() => {
      if (!data.value) return [];
      return data.value.sites.map((s) => s.site).filter((s) => s && !/^\d{4}-\d{2} 共通$/.test(s));
    });

    function formatYen(n) { return Math.round(Number(n) || 0).toLocaleString("ja-JP"); }
    function formatYenShort(n) {
      const v = Math.round(Number(n) || 0);
      if (v >= 10000000) return (v / 10000000).toFixed(1) + "千万";
      if (v >= 10000) return (v / 10000).toFixed(0) + "万";
      return v.toLocaleString("ja-JP");
    }
    function monthLabel(ym) { return `${parseInt(ym.slice(5, 7), 10)}月`; }
    function icon(c) { return CAT_ICONS[c] || "category"; }
    function otherRev(m) { return Math.max(0, m.revenue - m.revenueConstruction - m.revenueRyokan); }
    function catColor(c) { return CAT_COLORS[c] || "#9ca3af"; }

    // 12ヶ月トレンドバーの高さ (各月の rev/exp を、年内最大値で正規化)
    const trendMax = computed(() => {
      if (!data.value) return 1;
      let mx = 1;
      for (const m of data.value.months) {
        if (m.revenue > mx) mx = m.revenue;
        if (m.expense > mx) mx = m.expense;
      }
      return mx;
    });
    function trendBarH(v) {
      return Math.max(1, (Number(v) || 0) / trendMax.value * 100);
    }

    // 利益ライン用の polyline points (12点、SVG viewBox 240x100)
    const profitLinePoints = computed(() => {
      if (!data.value) return "";
      const months = data.value.months;
      // y軸: profit 0 がチャート底 + 線範囲 0..max → 線範囲を 80..10 にマップ
      let mx = 1;
      for (const m of months) { if (Math.abs(m.profit) > mx) mx = Math.abs(m.profit); }
      const cellW = 240 / 12;
      return months.map((m, i) => {
        const x = (i + 0.5) * cellW;
        const y = 50 - (m.profit / mx) * 35;   // +profit は上, -profit は下
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
    });

    // 月詳細のドーナツチャート用 segment 生成
    // 各セグメントは circumference 全周 = 2π*38 ≈ 238.76 の上で 「seg長 余白」で stroke-dasharray
    // 全周を 0% から順に埋めるので offset = -(これまでの合計%) * circumference / 100
    function donutSegments(m) {
      const circ = 2 * Math.PI * 38;   // r=38 の円周
      const total = m.expense || 0;
      if (!total) return [];
      const segs = [];
      let acc = 0;
      for (const cat of (data.value?.accountingCategories || [])) {
        const amt = m.categories[cat]?.amount || 0;
        if (amt <= 0) continue;
        const pct = amt / total;
        const len = circ * pct;
        segs.push({
          cat,
          color: catColor(cat),
          dash: `${len.toFixed(2)} ${(circ - len).toFixed(2)}`,
          offset: (-acc * circ).toFixed(2),
        });
        acc += pct;
      }
      return segs;
    }

    // 現場別バーの幅 (全現場の rev+exp 最大値で正規化)
    const siteMax = computed(() => {
      if (!data.value) return 1;
      let mx = 1;
      for (const s of data.value.sites) {
        if (s.revenue > mx) mx = s.revenue;
        if (s.expense > mx) mx = s.expense;
      }
      return mx;
    });
    function siteBarWidth(v) {
      return Math.max(0, Math.min(100, (Number(v) || 0) / siteMax.value * 100));
    }
    function shiftYear(d) { year.value += d; fetchYear(); }
    function toggleMonth(m) { openMonth.value = openMonth.value === m ? null : m; }
    function toggleSite(s) { openSite.value = openSite.value === s ? null : s; }

    async function fetchYear(force = false) {
      if (!user.value) return;
      loading.value = true; err.value = "";
      try {
        const token = await user.value.getIdToken();
        const url = (window.API_BASE || "") + `/api/keiri/year?year=${year.value}${force ? "&force=1" : ""}`;
        const res = await fetch(url, { headers: { authorization: "Bearer " + token } });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        data.value = j;
      } catch (e) {
        err.value = "取得失敗: " + (e.message || e);
      } finally { loading.value = false; }
    }
    function refresh() { fetchYear(true); }

    async function fetchDrill(qs, title) {
      drillLoading.value = true; drillRows.value = []; drillTitle.value = title; drillOpen.value = true;
      try {
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + `/api/keiri/transactions?${qs}`, {
          headers: { authorization: "Bearer " + token },
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        drillRows.value = j.rows || [];
      } catch (e) {
        err.value = "明細取得失敗: " + (e.message || e);
        drillOpen.value = false;
      } finally { drillLoading.value = false; }
    }
    function drillCategory(ym, accountingCategory) {
      fetchDrill(`month=${ym}&accountingCategory=${encodeURIComponent(accountingCategory)}&type=支出`,
        `${monthLabel(ym)} · ${accountingCategory}`);
    }
    function drillSiteCategory(site, category) {
      const qs = `year=${year.value}&site=${encodeURIComponent(site)}` +
        (category === "売上" ? "&type=収入" :
         category === "外注費" ? "&subcategory=外注費&type=支出" :
         category === "材料費" ? "&subcategory=材料&type=支出" :
         category === "車両費" ? "&subcategory=車両費&type=支出" :
         "&type=支出");
      fetchDrill(qs, `${site} · ${category}`);
    }

    // 取引行タップで編集モーダル表示。refId 必須 (無いと取引タブから特定できない)
    function openEdit(r) {
      if (!r.refId) {
        editErr.value = "この行は refId が無いため編集できません (古いデータ)";
        return;
      }
      editRow.value = { ...r };
      editForm.value = {
        counterparty: r.counterparty || "",
        amount: r.amount || 0,
        category: r.category || "",
        subcategory: r.subcategory || "",
        site: r.site || "",
        memo: r.memo || "",
      };
      editErr.value = "";
      editOpen.value = true;
    }
    async function saveEdit() {
      if (!editRow.value || saving.value) return;
      saving.value = true;
      editErr.value = "";
      try {
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + "/api/tx/update", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({
            refId: editRow.value.refId,
            source: editRow.value.source,
            fields: { ...editForm.value },
          }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        editOpen.value = false;
        // ドリルダウン中なら再取得して即反映
        if (drillOpen.value) {
          // 編集した行のフィールドを直接書き換え (再 fetch せずに表示更新)
          const i = drillRows.value.findIndex((r) => r.refId === editRow.value.refId && r.source === editRow.value.source);
          if (i >= 0) drillRows.value[i] = { ...drillRows.value[i], ...editForm.value };
        }
        // 年データもキャッシュ無効 → 次の操作で再取得
        await fetchYear(true);
      } catch (e) {
        editErr.value = "保存失敗: " + (e.message || e);
      } finally {
        saving.value = false;
      }
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, async (u) => {
          if (!u) { location.href = "/?next=" + encodeURIComponent(location.pathname); return; }
          user.value = u;
          await fetchYear();
        });
      } catch (e) { err.value = "初期化失敗: " + (e.message || e); }
    });

    return {
      year, tab, data, loading, err, openMonth, openSite,
      drillOpen, drillLoading, drillRows, drillTitle,
      editOpen, editRow, editForm, saving, editErr,
      BIG_CATEGORIES, SUB_CATEGORIES, knownSites,
      profitLinePoints,
      formatYen, formatYenShort, monthLabel, icon, otherRev, catColor,
      trendBarH, donutSegments, siteBarWidth,
      shiftYear, toggleMonth, toggleSite, refresh,
      drillCategory, drillSiteCategory, openEdit, saveEdit,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
