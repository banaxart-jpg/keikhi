<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ラウンドタイマー">
<link rel="apple-touch-icon" href="/icon.png">
<title>ラウンドタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --round: #b91c1c; --rest: #15803d; --ready: #b45309; --done: #1e3a5f;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }

#app { height: 100dvh; display: flex; flex-direction: column; }

/* ───── 待機画面 (ニューモーフィック) ───── */
.setup { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin; padding: 20px; }
.setup .ttl { font-size: 22px; font-weight: 800; }
.setup .sub { font-size: 12px; color: var(--text2); font-weight: 600; }
.rounds-pick { display: flex; align-items: center; gap: 22px; }
.step-btn { width: 64px; height: 64px; border-radius: 32px; border: none; background: var(--bg); color: var(--text); font-size: 30px; font-weight: 800; font-family: inherit; cursor: pointer; box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); }
.step-btn:active { box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl); transform: scale(0.95); }
.step-btn:disabled { opacity: 0.35; }
.rounds-n { font-size: 15vmin; font-weight: 900; line-height: 1; min-width: 22vmin; text-align: center; }
.rounds-lbl { font-size: 13px; font-weight: 800; color: var(--text2); letter-spacing: 0.15em; }
.start-btn { padding: 18px 60px; border-radius: 40px; border: none; background: linear-gradient(145deg, #dc2626, var(--round)); color: #fff; font-size: 20px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 8px 8px 18px rgba(185,28,28,0.35), -5px -5px 12px var(--sl); letter-spacing: 0.1em; }
.start-btn:active { transform: scale(0.96); }
.back-pill { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 14px; padding: 8px 15px; border-radius: 24px; font-size: 12px; font-weight: 700; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); text-decoration: none; z-index: 5; }

/* ───── 実行画面 (フェーズ色で全塗り・遠目で見える) ───── */
.run { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vmin; color: #fff; transition: background 0.3s; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
.run.ready { background: var(--ready); }
.run.round { background: var(--round); }
.run.rest  { background: var(--rest); }
.run.done  { background: var(--done); }
.run.paused { filter: saturate(0.25) brightness(0.75); }
.phase-lbl { font-size: 7vmin; font-weight: 900; letter-spacing: 0.2em; opacity: 0.9; }
.round-lbl { font-size: 9vmin; font-weight: 900; letter-spacing: 0.06em; }
.big-time { font-size: 38vmin; font-weight: 900; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.prog { width: min(72vw, 900px); height: 1.6vmin; border-radius: 1vmin; background: rgba(255,255,255,0.25); overflow: hidden; margin-top: 1vmin; }
.prog > div { height: 100%; background: #fff; border-radius: 1vmin; }
.run-ctl { display: flex; gap: 18px; margin-top: 2.5vmin; }
.ctl-btn { padding: 12px 34px; border-radius: 32px; border: 2px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; letter-spacing: 0.08em; }
.ctl-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.96); }
.pause-hint { font-size: 11px; opacity: 0.55; font-weight: 600; margin-top: 0.5vmin; }

/* 横向きは情報を1行に寄せて時間を最大化 */
@media (orientation: landscape) {
  .phase-head { display: flex; align-items: baseline; gap: 4vmin; }
  .big-time { font-size: 46vmin; }
}
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted, onBeforeUnmount } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";

// タイマー設定 (URL パラメータで上書き可: /kicktimer/?round=120&rest=30&ready=5)
const qp = new URLSearchParams(location.search);
const ROUND_SEC = Math.max(1, Number(qp.get("round")) || 180); // 3分
const REST_SEC  = Math.max(1, Number(qp.get("rest"))  || 60);  // 1分
const READY_SEC = Math.max(0, Number(qp.get("ready")) || 10);  // 開始前カウント

const TEMPLATE = `
<div style="display:flex; flex-direction:column; height:100%;">
  <!-- ───── 待機: ラウンド数を選んで開始 ───── -->
  <div v-if="phase === 'idle'" class="setup">
    <a class="back-pill" href="/"><span class="icon">arrow_back</span> 戻る</a>
    <div class="ttl"><span class="icon">sports_mma</span> ラウンドタイマー</div>
    <div class="sub">{{ fmt(roundSec) }} ラウンド + {{ fmt(restSec) }} 休憩</div>
    <div class="rounds-pick">
      <button class="step-btn" type="button" :disabled="rounds <= 1" @click="setRounds(rounds - 1)">−</button>
      <div class="rounds-n">{{ rounds }}</div>
      <button class="step-btn" type="button" :disabled="rounds >= 20" @click="setRounds(rounds + 1)">＋</button>
    </div>
    <div class="rounds-lbl">ラウンド</div>
    <button class="start-btn" type="button" @click="start">開始</button>
  </div>

  <!-- ───── 実行中 ───── -->
  <div v-else class="run" :class="[phase, { paused }]" @click="togglePause">
    <div class="phase-head">
      <div class="phase-lbl">{{ phaseLabel }}</div>
      <div v-if="phase !== 'done'" class="round-lbl">R {{ curRound }}<span style="opacity:0.6;">/{{ rounds }}</span></div>
    </div>
    <div class="big-time">{{ fmt(remainSec) }}</div>
    <div v-if="phase !== 'done'" class="prog"><div :style="{ width: progPct + '%' }"></div></div>
    <div class="run-ctl">
      <button v-if="phase !== 'done'" class="ctl-btn" type="button" @click.stop="togglePause">{{ paused ? "再開" : "一時停止" }}</button>
      <button class="ctl-btn" type="button" @click.stop="reset">{{ phase === "done" ? "もう一回" : "終了" }}</button>
    </div>
    <div v-if="phase !== 'done'" class="pause-hint">画面タップでも一時停止 / 再開</div>
  </div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const rounds = ref((() => {
      const n = Number(localStorage.getItem("kicktimer_rounds"));
      return n >= 1 && n <= 20 ? n : 5;
    })());
    function setRounds(n) {
      rounds.value = Math.min(20, Math.max(1, n));
      try { localStorage.setItem("kicktimer_rounds", String(rounds.value)); } catch (_) {}
    }

    // phase: idle | ready | round | rest | done
    const phase = ref("idle");
    const curRound = ref(1);
    const remainMs = ref(0);
    const paused = ref(false);
    let phaseEndsAt = 0;   // Date.now() 基準 (setInterval のドリフト対策)
    let phaseTotalMs = 0;
    let timer = null;
    let warned = false;    // 残り10秒警告を1回だけ

    const roundSec = ROUND_SEC, restSec = REST_SEC;
    const remainSec = computed(() => Math.ceil(remainMs.value / 1000));
    const progPct = computed(() => (phaseTotalMs > 0 ? (remainMs.value / phaseTotalMs) * 100 : 0));
    const phaseLabel = computed(() => ({
      ready: "READY", round: "ラウンド", rest: "休憩", done: "終了",
    }[phase.value] || ""));

    function fmt(s) {
      const m = Math.floor(s / 60), r = s % 60;
      return m + ":" + String(r).padStart(2, "0");
    }

    // ── サウンド (WebAudio 合成、音源ファイル不要) ──
    let ac = null;
    function ensureAudio() {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === "suspended") ac.resume();
      } catch (_) {}
    }
    function tone(freq, dur, delay, type, vol) {
      if (!ac) return;
      try {
        const t = ac.currentTime + (delay || 0);
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type || "sine"; o.frequency.value = freq;
        g.gain.setValueAtTime(vol || 0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + dur + 0.05);
      } catch (_) {}
    }
    const soundRoundStart = () => { tone(660, 1.4, 0, "triangle", 0.7); tone(1320, 1.1, 0, "sine", 0.25); };           // ゴング1発
    const soundRoundEnd   = () => { [0, 0.28, 0.56].forEach((d) => tone(880, 0.2, d, "square", 0.4)); };               // カンカンカン
    const soundWarn       = () => { [0, 0.16].forEach((d) => tone(1700, 0.08, d, "square", 0.5)); };                   // 残り10秒 拍子木
    const soundDone       = () => { [0, 0.5, 1.0].forEach((d) => tone(660, 1.2, d, "triangle", 0.6)); };               // 終了ゴング3発

    // ── 画面オフ防止 (Wake Lock)。バックグラウンド復帰時に再取得 ──
    let wakeLock = null;
    async function acquireWakeLock() {
      try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (_) {}
    }
    function releaseWakeLock() {
      try { wakeLock?.release(); } catch (_) {}
      wakeLock = null;
    }
    function onVisible() {
      if (document.visibilityState === "visible" && phase.value !== "idle" && phase.value !== "done") acquireWakeLock();
    }

    // ── フェーズ遷移 ──
    function enterPhase(p, sec) {
      phase.value = p;
      phaseTotalMs = sec * 1000;
      phaseEndsAt = Date.now() + phaseTotalMs;
      remainMs.value = phaseTotalMs;
      warned = false;
    }
    function nextPhase() {
      if (phase.value === "ready") {
        soundRoundStart();
        enterPhase("round", ROUND_SEC);
      } else if (phase.value === "round") {
        if (curRound.value >= rounds.value) {
          finish();
        } else {
          soundRoundEnd();
          enterPhase("rest", REST_SEC);
        }
      } else if (phase.value === "rest") {
        curRound.value++;
        soundRoundStart();
        enterPhase("round", ROUND_SEC);
      }
    }
    function finish() {
      soundDone();
      phase.value = "done";
      remainMs.value = 0;
      stopTicker();
      releaseWakeLock();
    }

    function tick() {
      if (paused.value) return;
      const left = phaseEndsAt - Date.now();
      remainMs.value = Math.max(0, left);
      // 残り10秒警告 (ラウンド/休憩とも)
      if (!warned && left <= 10000 && phaseTotalMs > 15000 && (phase.value === "round" || phase.value === "rest")) {
        warned = true;
        soundWarn();
      }
      if (left <= 0) nextPhase();
    }
    function startTicker() { stopTicker(); timer = setInterval(tick, 150); }
    function stopTicker() { clearInterval(timer); timer = null; }

    // ── 操作 ──
    function start() {
      ensureAudio();          // iOS はユーザー操作内で AudioContext を起こす必要がある
      acquireWakeLock();
      curRound.value = 1;
      paused.value = false;
      if (READY_SEC > 0) {
        enterPhase("ready", READY_SEC);
      } else {
        soundRoundStart();
        enterPhase("round", ROUND_SEC);
      }
      startTicker();
    }
    function togglePause() {
      if (phase.value === "idle" || phase.value === "done") return;
      ensureAudio();
      if (!paused.value) {
        paused.value = true;
        remainMs.value = Math.max(0, phaseEndsAt - Date.now());
      } else {
        phaseEndsAt = Date.now() + remainMs.value; // 残りから再開
        paused.value = false;
      }
    }
    function reset() {
      stopTicker();
      releaseWakeLock();
      phase.value = "idle";
      curRound.value = 1;
      paused.value = false;
    }

    onMounted(() => { document.addEventListener("visibilitychange", onVisible); });
    onBeforeUnmount(() => {
      stopTicker();
      releaseWakeLock();
      document.removeEventListener("visibilitychange", onVisible);
    });

    return {
      rounds, setRounds, phase, curRound, remainSec, paused, progPct, phaseLabel,
      roundSec, restSec, fmt, start, togglePause, reset,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
