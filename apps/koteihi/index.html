<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="固定費">
<link rel="apple-touch-icon" href="/koteihi/icon.svg">
<title>固定費</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #3949ab; --accent2: #5c6bc0;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--bg) 86%);
  --danger: #b04040;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

/* sticky header */
.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 12px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

/* 月切替 + 送信状態 */
.month-bar { display: flex; align-items: center; padding: 4px 18px 14px; gap: 10px; }
.month-bar .nav { width: 36px; height: 36px; border-radius: 18px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); font-size: 18px; color: var(--text2); cursor: pointer; font-family: inherit; flex-shrink: 0; }
.month-bar .nav:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.month-bar .label { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; flex: 1; text-align: center; }
.sent-badge { font-size: 10px; font-weight: 700; color: var(--accent); padding: 4px 9px; border-radius: 10px; background: var(--accent-soft); margin-left: 6px; flex-shrink: 0; letter-spacing: 0.04em; }
.sent-badge .icon { font-size: 12px; }

/* リスト */
.list { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 8px; }
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 60px 0; line-height: 1.7; }
.item { background: var(--bg); border-radius: 16px; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); transition: opacity 200ms ease; overflow: hidden; }
.item.off { opacity: 0.4; }
.item .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.check { width: 26px; height: 26px; border-radius: 13px; border: none; cursor: pointer; background: var(--bg); box-shadow: inset 3px 3px 6px var(--sd), inset -2px -2px 5px var(--sl); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 16px; flex-shrink: 0; font-family: 'Material Symbols Outlined'; }
.item.on .check { background: var(--accent); color: white; box-shadow: 4px 4px 10px rgba(57,73,171,0.35); }
.item-body { flex: 1; min-width: 0; }
.item-name { font-size: 14px; font-weight: 700; color: var(--text); word-break: break-word; }
.item-sub { font-size: 11px; color: var(--text3); font-weight: 600; margin-top: 2px; letter-spacing: 0.02em; }
.amount-input { width: 110px; padding: 8px 10px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; text-align: right; color: var(--text); background: var(--bg); box-shadow: inset 3px 3px 7px var(--sd), inset -2px -2px 6px var(--sl); outline: none; font-family: inherit; flex-shrink: 0; -moz-appearance: textfield; }
.amount-input::-webkit-outer-spin-button, .amount-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.amount-input:focus { box-shadow: inset 3px 3px 7px var(--sd), inset -2px -2px 6px var(--sl), 0 0 0 2px var(--accent2); }
.amount-pref { font-size: 11px; color: var(--text3); margin-right: -4px; }

/* 展開部分 (タップで開く) */
.detail { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
.detail .meta { color: var(--text2); font-weight: 600; line-height: 1.7; padding: 0 4px; }
.detail .meta b { color: var(--text); font-weight: 700; }
.detail-actions { display: flex; gap: 8px; padding-top: 4px; }
.detail-actions button { padding: 8px 14px; border-radius: 12px; border: none; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); color: var(--text2); }
.detail-actions button.danger { color: var(--danger); }
.detail-actions button.primary { color: var(--accent); }
.detail-actions button:active { box-shadow: inset 2px 2px 6px var(--sd); transform: scale(0.97); }

/* 月合計表示 (左: 固定費総額、右: 送信予定) — sticky ヘッダー内なので余白少なめ */
.total-bar { padding: 8px 18px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; font-size: 12px; color: var(--text2); font-weight: 700; border-top: 1px solid rgba(168,172,192,0.18); margin-top: 4px; }
.total-col { display: flex; flex-direction: column; gap: 4px; }
.total-col.right { text-align: right; }
.total-lbl { font-size: 10px; letter-spacing: 0.04em; color: var(--text2); }
.total-bar .total { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: 0.02em; }
.total-bar .total.send { color: var(--accent); }

/* 「送信しない」設定アイテムの見た目 */
.item.skip .item-name { color: var(--text2); }
.skip-badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-weight: 800; color: var(--text2); background: var(--bg2); letter-spacing: 0.05em; vertical-align: 2px; }
.skip-icon { color: var(--text3); font-size: 14px; }

/* FAB (+ 追加) — 画面右下に固定 */
.fab { position: fixed; right: 22px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 27px; background: var(--bg); color: var(--accent); font-size: 28px; line-height: 1; border: none; cursor: pointer; padding: 0; box-shadow: 5px 5px 14px var(--sd), -4px -4px 10px var(--sl); z-index: 30; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.fab:active { box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.95); }
.fab .icon { font-size: 26px; font-variation-settings: 'FILL' 1, 'wght' 600; }

/* 送信ボタン (ヘッダー内、total-bar の下) */
.send-btn-top { margin: 0 18px 14px; padding: 12px 16px; border-radius: 16px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 5px 5px 12px rgba(57,73,171,0.32), -3px -3px 8px var(--sl); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 36px); }
.send-btn-top:disabled { opacity: 0.5; box-shadow: 3px 3px 8px var(--sd); }
.send-btn-top:active:not(:disabled) { transform: scale(0.98); }
.send-btn-top .icon { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 600; }

/* フォーム (bottom-sheet 内) */
.form { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 6px; }
.form label { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: 0.04em; padding-left: 4px; }
.form input, .form select { padding: 12px 14px; border: none; border-radius: 14px; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl); outline: none; }
.form input:focus, .form select:focus { box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl), 0 0 0 2px var(--accent2); }
.form .row { display: flex; gap: 8px; }
.form .row > * { flex: 1; min-width: 0; }
.form-actions { display: flex; gap: 8px; margin-top: 12px; }
.form-actions button { flex: 1; padding: 14px; border-radius: 16px; border: none; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); color: var(--text); }
.form-actions button.primary { background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; box-shadow: 5px 5px 14px rgba(57,73,171,0.35); }
.form-actions button:active { transform: scale(0.97); }

/* エラー / ステータス */
.err { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fde0e0; color: #8a2727; font-size: 12px; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: white; padding: 12px 18px; border-radius: 22px; font-size: 13px; font-weight: 700; z-index: 100; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
.loading { text-align: center; color: var(--text2); font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>

      </div>
      <label>支払方法</label>
      <input type="text" v-model="form.paymentMethod" list="paymentList" placeholder="振込 / 口座振替 など" autocomplete="off">
      <datalist id="paymentList">
        <option v-for="p in paymentMethods" :key="p" :value="p"></option>
      </datalist>
      <div class="form-actions">
        <button @click="formOpen = false">キャンセル</button>
        <button class="primary" @click="saveForm" :disabled="!form.subcategory">{{ editingId ? '更新' : '追加' }}</button>
      </div>
    </div>
  </bottom-sheet>

  <div v-if="toast" class="toast">{{ toast }}</div>
</div>
`;

const App = {
  template: TEMPLATE,
  components: { BottomSheet },
  setup() {
    const cur = ref(new Date());
    const items = ref([]);              // master items from Firestore
    const amounts = ref({});            // { itemId: current month's amount (editable) }
    const active = ref({});             // { itemId: bool } - whether to include in send
    const expanded = ref(null);         // currently expanded item id
    const ready = ref(false);
    const err = ref("");
    const sending = ref(false);
    const toast = ref("");
    const sentRecord = ref(null);       // 当月の送信履歴 (あれば送信済バッジ)
    const formOpen = ref(false);
    const editingId = ref(null);
    const form = ref({ subcategory: "給料", counterparty: "", amount: 0, dayOfMonth: 25, paymentMethod: "振込" });
    let db = null;
    const user = ref(null);
    let unsubItems = null;

    const subcategories = SUBCATEGORIES;
    const paymentMethods = PAYMENT_METHODS;

    const yyyymm = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    });
    const monthLabel = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
    });
    // 「送信予定」件数 = 今月チェック入ってるアイテムの数 (= active)
    const activeCount = computed(() => items.value.filter((i) => active.value[i.id]).length);
    // 「固定費総額」= 全アイテムの amount 合計 (送信オフのもアプリ上では総額に含める)
    // ※ amounts は当月分の編集値、未編集ならマスタの amount にフォールバック
    const totalAmount = computed(() => {
      let s = 0;
      for (const it of items.value) {
        const m = amounts.value[it.id];
        s += (m == null || m === "") ? (Number(it.amount) || 0) : (Number(m) || 0);
      }
      return s;
    });
    // 「送信予定」金額 = チェック入ってるアイテムだけの合計 (実際に取引タブに送る額)
    const sendingAmount = computed(() => {
      let s = 0;
      for (const it of items.value) {
        if (!active.value[it.id]) continue;
        s += Number(amounts.value[it.id]) || 0;
      }
      return s;
    });

    function formatYen(n) { return Math.round(Number(n) || 0).toLocaleString("ja-JP"); }
    function isoDate(dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function back() { location.href = "/"; }

    function shiftMonth(delta) {
      const d = new Date(cur.value);
      d.setMonth(d.getMonth() + delta);
      cur.value = d;
      loadSentRecord();
      // 月変わったらデフォルト金額に reset
      resetAmounts();
    }

    function resetAmounts() {
      const nextAmounts = {};
      const nextActive = {};
      for (const it of items.value) {
        nextAmounts[it.id] = String(it.amount || 0);
        // skipSend なアイテムはデフォルトで「送信しない」(チェック外し) で起動
        nextActive[it.id] = !it.skipSend;
      }
      amounts.value = nextAmounts;
      active.value = nextActive;
    }

    function toggleActive(id) {
      active.value[id] = !active.value[id];
    }

    // 「送信しない」フラグを Firestore マスタに保存。次月以降もこの設定が引き継がれる。
    async function toggleSkipSend(item) {
      const next = !item.skipSend;
      try {
        await updateDoc(doc(db, ITEMS_COL, item.id), {
          skipSend: next,
          updatedAt: serverTimestamp(),
          updatedBy: (user.value?.email || "").toLowerCase(),
        });
        // 当月の active 表示も即座に同期
        active.value[item.id] = !next;
      } catch (e) {
        err.value = "更新失敗: " + (e.message || e);
      }
    }
    function toggleExpand(id) {
      expanded.value = expanded.value === id ? null : id;
    }

    function openAdd() {
      editingId.value = null;
      form.value = { subcategory: "給料", counterparty: "", amount: 0, dayOfMonth: 25, paymentMethod: "振込" };
      formOpen.value = true;
    }
    function openEdit(item) {
      editingId.value = item.id;
      form.value = {
        subcategory: item.subcategory || "給料",
        counterparty: item.counterparty || "",
        amount: item.amount || 0,
        dayOfMonth: item.dayOfMonth || 25,
        paymentMethod: item.paymentMethod || "振込",
      };
      formOpen.value = true;
      expanded.value = null;
    }

    async function saveForm() {
      if (!form.value.subcategory) return;
      const payload = {
        subcategory: String(form.value.subcategory),
        counterparty: String(form.value.counterparty || "").trim(),
        amount: Number(form.value.amount) || 0,
        dayOfMonth: Math.max(1, Math.min(28, Number(form.value.dayOfMonth) || 25)),
        paymentMethod: String(form.value.paymentMethod || "振込"),
        updatedAt: serverTimestamp(),
        updatedBy: (user.value?.email || "").toLowerCase(),
      };
      try {
        if (editingId.value) {
          await updateDoc(doc(db, ITEMS_COL, editingId.value), payload);
        } else {
          await addDoc(collection(db, ITEMS_COL), {
            ...payload,
            createdAt: serverTimestamp(),
            order: items.value.length,
          });
        }
        formOpen.value = false;
      } catch (e) {
        err.value = "保存失敗: " + (e.message || e);
      }
    }

    async function del(item) {
      if (!confirm(`「${item.subcategory}${item.counterparty ? ' ' + item.counterparty : ''}」を削除しますか? マスタから消えます (送信済の取引は残ります)`)) return;
      try {
        await deleteDoc(doc(db, ITEMS_COL, item.id));
        expanded.value = null;
      } catch (e) { err.value = "削除失敗: " + e.message; }
    }

    async function loadSentRecord() {
      try {
        const snap = await getDoc(doc(db, SENT_COL, yyyymm.value));
        sentRecord.value = snap.exists() ? snap.data() : null;
      } catch (e) { /* silent */ }
    }

    async function confirmSend() {
      const targets = items.value.filter((i) => active.value[i.id]);
      if (!targets.length) return;
      const send = sendingAmount.value;
      const skipped = items.value.length - targets.length;
      const skipNote = skipped > 0 ? `（${skipped}件は「送信しない」設定で除外）` : "";
      const msg = sentRecord.value
        ? `${yyyymm.value} は既に送信済です（${sentRecord.value.itemCount || '?'}件 / ¥${formatYen(sentRecord.value.totalAmount || 0)}）。\n\n再送信すると「取引」タブに同じ内容が追加されます。続けますか？`
        : `${monthLabel.value} の固定費 ${targets.length}件 (¥${formatYen(send)}) を「取引」タブに送信します${skipNote}。よろしいですか？`;
      if (!confirm(msg)) return;
      await sendNow(targets);
    }

    async function sendNow(targets) {
      if (sending.value) return;
      sending.value = true;
      err.value = "";
      try {
        const token = await user.value.getIdToken();
        const d = cur.value;
        let ok = 0;
        let failed = 0;
        const sentItems = [];
        for (const it of targets) {
          const amount = Number(amounts.value[it.id]) || 0;
          if (amount <= 0) continue;
          const day = Math.min(it.dayOfMonth || 25, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
          const txDate = isoDate(new Date(d.getFullYear(), d.getMonth(), day));
          const refId = `koteihi:${yyyymm.value}:${it.id}:${Date.now()}`;
          const body = {
            date: txDate,
            type: "支出",
            category: "固定費",
            subcategory: it.subcategory,
            amount,
            counterparty: it.counterparty || "",
            site: "",
            status: "確定",
            paymentMethod: it.paymentMethod || "振込",
            memo: "",
            photoCell: "",
            source: "固定費",
            refId,
          };
          const res = await fetch((window.API_BASE || "") + "/api/tx/append", {
            method: "POST",
            headers: { authorization: "Bearer " + token, "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          if (res.ok) { ok++; sentItems.push({ itemId: it.id, amount }); }
          else { failed++; }
        }
        // 送信履歴を記録
        await setDoc(doc(db, SENT_COL, yyyymm.value), {
          month: yyyymm.value,
          sentAt: serverTimestamp(),
          sentBy: (user.value?.email || "").toLowerCase(),
          itemCount: ok,
          totalAmount: sentItems.reduce((s, x) => s + x.amount, 0),
          items: sentItems,
        }, { merge: false });  // 上書き (最新の送信内容で記録)
        await loadSentRecord();
        toast.value = failed
          ? `送信完了: 成功 ${ok} / 失敗 ${failed}`
          : `${ok}件を「取引」タブに送信しました`;
        setTimeout(() => { toast.value = ""; }, 3000);
      } catch (e) {
        err.value = "送信失敗: " + (e.message || e);
      } finally {
        sending.value = false;
      }
    }

    // 初回ロード時: meta が無ければ SEED_KOTEIHI を一括投入。
    // meta フラグを使うので、削除後に再オープンしても再投入されない。
    async function seedIfNeeded() {
      try {
        const metaRef = doc(db, META_DOC);
        const metaSnap = await getDoc(metaRef);
        if (metaSnap.exists()) return; // 既に投入済 → 何もしない
        const batch = writeBatch(db);
        const col = collection(db, ITEMS_COL);
        const addedBy = (user.value?.email || "").toLowerCase();
        SEED_KOTEIHI.forEach((it, idx) => {
          const ref = doc(col);
          batch.set(ref, {
            ...it,
            order: idx,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            updatedBy: addedBy,
            seedTag: "v1",
          });
        });
        batch.set(metaRef, { seededAt: serverTimestamp(), seededBy: addedBy, count: SEED_KOTEIHI.length });
        await batch.commit();
        console.log(`[koteihi] seeded ${SEED_KOTEIHI.length} master items`);
      } catch (e) { console.warn(`[koteihi] seed failed: ${e.message}`); }
    }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        await setPersistence(auth, browserLocalPersistence);
        db = getFirestore(app);
        onAuthStateChanged(auth, async (u) => {
          if (!u) {
            location.href = "/?next=" + encodeURIComponent(location.pathname);
            return;
          }
          user.value = u;
          await seedIfNeeded();    // 初回ユーザー操作前に seed
          const q = query(collection(db, ITEMS_COL), orderBy("order", "asc"));
          unsubItems = onSnapshot(q, (snap) => {
            items.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            resetAmounts();
            ready.value = true;
          }, (e) => { err.value = "購読失敗: " + e.message; ready.value = true; });
          loadSentRecord();
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        ready.value = true;
      }
    });

    onBeforeUnmount(() => { if (unsubItems) unsubItems(); });

    return {
      cur, items, amounts, active, expanded, ready, err, sending, toast, sentRecord, formOpen, editingId, form,
      subcategories, paymentMethods,
      yyyymm, monthLabel, activeCount, totalAmount, sendingAmount,
      formatYen, back, shiftMonth, toggleActive, toggleExpand, toggleSkipSend, openAdd, openEdit, saveForm, del, confirmSend,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
