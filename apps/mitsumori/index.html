<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="見積">
<link rel="apple-touch-icon" href="/icon.png">
<title>見積</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #0d9488;
  --k-mat: #2563eb; --k-te: #2a8c3a; --k-gai: #d97706; --k-kei: #7c3aed;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; gap: 8px; }
.pill { padding: 8px 14px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; text-decoration: none; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.pill.primary { background: var(--accent); color: #fff; }
.pill:disabled { opacity: 0.5; }
.wrap { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
.title { font-size: 22px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin: 2px 0 14px; }

.est-card { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 15px; border-radius: 16px; background: var(--bg); box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); margin-bottom: 10px; cursor: pointer; }
.est-card:active { transform: scale(0.99); }
.est-cust { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.est-meta { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 3px; }
.est-total { font-size: 17px; font-weight: 900; color: var(--accent); }
.list-empty { text-align: center; color: var(--text2); font-weight: 600; font-size: 13px; padding: 40px 20px; }

.field-label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--text2); margin: 14px 2px 6px; }
input.inp, textarea.inp { width: 100%; padding: 11px 13px; border-radius: 12px; border: none; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); outline: none; }
textarea.inp { min-height: 66px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 項目カード (2段) */
.item-card { padding: 10px 11px; border-radius: 13px; background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); margin-bottom: 8px; }
.item-card input, .item-card select { border: none; font-size: 13px; font-family: inherit; color: var(--text); background: var(--bg2); box-shadow: inset 2px 2px 5px var(--sd); outline: none; border-radius: 9px; padding: 8px; }
.item-card .nm { width: 100%; font-weight: 700; margin-bottom: 7px; }
.item-l2 { display: flex; align-items: center; gap: 6px; }
.item-l2 select { flex: 0 0 66px; font-weight: 700; }
.item-l2 .qty { flex: 0 0 46px; text-align: right; }
.item-l2 .unit { flex: 0 0 44px; }
.item-l2 .price { flex: 1; min-width: 0; text-align: right; }
.item-l2 .amt { flex: 0 0 auto; font-size: 13px; font-weight: 800; white-space: nowrap; margin-left: 2px; }
.item-l2 .rm { flex: 0 0 auto; background: none; border: none; color: #b04040; cursor: pointer; padding: 0 2px; }
.item-l2 .rm .icon { font-size: 18px; vertical-align: 0; }
.add-item, .ai-btn { width: 100%; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: 4px; }
.add-item { border: 1px dashed var(--accent); background: transparent; color: var(--accent); }
.ai-btn { border: none; background: linear-gradient(120deg,#7c3aed,#2563eb); color: #fff; margin-top: 8px; box-shadow: 4px 4px 10px var(--sd); }
.ai-btn:active { transform: scale(0.98); }

.summary { margin-top: 18px; padding: 16px 18px; border-radius: 16px; background: var(--bg); box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); }
.srow { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 14px; }
.srow .lbl { color: var(--text2); font-weight: 700; }
.srow .val { font-weight: 800; font-variant-numeric: tabular-nums; }
.srow.total { border-top: 1px solid rgba(154,160,184,0.3); margin-top: 6px; padding-top: 12px; }
.srow.total .val { font-size: 24px; font-weight: 900; color: var(--accent); }
.srow .tax-in { width: 48px; padding: 4px 6px; border-radius: 8px; border: none; background: var(--bg2); box-shadow: inset 2px 2px 5px var(--sd); text-align: right; font-family: inherit; font-weight: 800; color: var(--text); }
.kbreak { font-size: 11px; color: var(--text2); font-weight: 700; padding: 4px 0 2px; display: flex; gap: 10px; flex-wrap: wrap; }
.kbreak b { font-weight: 800; }

.actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.actions .pill { flex: 1; text-align: center; padding: 12px; font-size: 13px; min-width: 90px; }
.danger { color: #b04040; }

/* シート */
.modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(180,184,205,0); visibility: hidden; opacity: 0; transition: background .2s, opacity .2s, visibility 0s linear .2s; }
.modal.open { background: rgba(180,184,205,0.42); visibility: visible; opacity: 1; transition: background .2s, opacity .2s; }
.sheet { background: var(--bg); border-radius: 28px 28px 0 0; width: 100%; max-width: 720px; max-height: 84vh; overflow-y: auto; padding: 6px 18px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .2s cubic-bezier(.2,.8,.2,1); box-shadow: -2px -10px 30px rgba(148,152,176,0.35); }
.modal.open .sheet { transform: translateY(0); }
.grab { padding: 12px 18px 8px; margin: 0 -18px 4px; touch-action: none; user-select: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.grab .handle { width: 46px; height: 5px; border-radius: 3px; background: rgba(168,172,192,0.45); margin: 0 auto 10px; }
.psearch { width: 100%; padding: 11px 14px; border-radius: 12px; border: none; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg2); box-shadow: inset 2px 2px 6px var(--sd); outline: none; }
.p-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 12px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); }
.p-item:active { transform: scale(0.98); }
.p-item .pn { font-size: 14px; font-weight: 700; }
.p-item .pp { font-size: 11px; color: var(--text2); font-weight: 700; }
.p-item .add-ic { color: var(--accent); }
.p-item.added { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.p-sect { font-size: 11px; font-weight: 800; color: var(--text2); letter-spacing: 0.08em; margin: 12px 2px 8px; }
.sheet h3 { font-size: 16px; font-weight: 800; margin: 4px 2px 8px; }

/* 見積書プレビュー */
#previewScreen { display: none; }
.pv-bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 12px; gap: 8px; }
.printable { background: #fff; color: #1a1a2e; max-width: 720px; margin: 0 auto 30px; padding: 26px 22px; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); font-size: 13px; }
.doc-title { text-align: center; font-size: 22px; font-weight: 900; letter-spacing: 0.4em; padding-bottom: 4px; }
.doc-sub { text-align: right; font-size: 11px; color: #555; }
.doc-to { font-size: 18px; font-weight: 800; border-bottom: 2px solid #1a1a2e; display: inline-block; padding: 12px 20px 4px 2px; margin: 8px 0 4px; }
.doc-money { margin: 12px 0; padding: 10px 14px; background: #f2f4fb; border-radius: 6px; display: flex; justify-content: space-between; align-items: baseline; }
.doc-money .l { font-weight: 800; font-size: 14px; }
.doc-money .v { font-weight: 900; font-size: 24px; }
table.pv { width: 100%; border-collapse: collapse; margin-top: 8px; }
table.pv th { background: #eef1f8; font-size: 11px; font-weight: 800; padding: 7px 6px; border: 1px solid #cdd3e2; }
table.pv td { font-size: 12px; padding: 7px 6px; border: 1px solid #dfe3ee; }
table.pv td.r { text-align: right; font-variant-numeric: tabular-nums; }
table.pv td.c { text-align: center; }
.pv-tot { margin-top: 10px; margin-left: auto; width: 62%; }
.pv-tot .r2 { display: flex; justify-content: space-between; padding: 5px 8px; font-size: 13px; }
.pv-tot .r2.g { border-top: 2px solid #1a1a2e; margin-top: 3px; padding-top: 8px; font-weight: 900; font-size: 16px; }
.doc-note { margin-top: 14px; font-size: 11px; color: #444; white-space: pre-wrap; }
.doc-from { margin-top: 18px; text-align: right; font-size: 12px; line-height: 1.7; color: #222; }
.doc-from .co { font-weight: 800; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 500; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.toast.err { background: #b04040; }
#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }

@media print {
  @page { margin: 12mm; }
  body { background: #fff; padding: 0; }
  body * { visibility: hidden; }
  .printable, .printable * { visibility: visible; }
  .printable { position: absolute; left: 0; top: 0; width: 100%; max-width: none; margin: 0; box-shadow: none; border-radius: 0; padding: 0; }
  .no-print { display: none !important; }
}
</style>
</head>
<body>
<div id="signinOverlay">
  <div style="font-size:24px;font-weight:800;">見積</div>
  <a class="pill" href="/" style="text-decoration:none;">トップに戻る</a>
  <div id="signinErr" style="font-size:11px;color:#b04040;font-family:monospace;"></div>
</div>

<div id="app" style="display:none;">
  <div id="listScreen">
    <div class="bar">
      <a class="pill" href="/"><span class="icon">arrow_back</span> 戻る</a>
      <span style="font-size:11px;letter-spacing:0.2em;color:var(--text3);font-weight:700;">MITSUMORI</span>
      <button class="pill primary" id="newBtn" type="button"><span class="icon">add</span> 新規</button>
    </div>
    <div class="wrap">
      <div class="title">見積</div>
      <div class="subtitle">項目をタップで選ぶだけ。合計・消費税は自動。</div>
      <div id="list"></div>
    </div>
  </div>

  <div id="editScreen" style="display:none;">
    <div class="bar">
      <button class="pill" id="backBtn" type="button"><span class="icon">arrow_back</span> 一覧</button>
      <span style="font-size:11px;letter-spacing:0.16em;color:var(--text3);font-weight:800;">見積</span>
      <button class="pill danger" id="deleteBtn" type="button"><span class="icon">delete</span></button>
    </div>
    <div class="wrap" id="editBody"></div>
  </div>

  <div id="previewScreen">
    <div class="pv-bar no-print">
      <button class="pill" id="pvBack" type="button"><span class="icon">arrow_back</span> 戻る</button>
      <button class="pill" id="pvCompany" type="button"><span class="icon">store</span> 自社情報</button>
      <button class="pill primary" id="pvPrint" type="button"><span class="icon">picture_as_pdf</span> PDF / 印刷</button>
    </div>
    <div id="pvBody"></div>
  </div>
</div>

<!-- 項目ピッカー -->
<div class="modal" id="pModal">
  <div class="sheet" id="pSheet">
    <div class="grab" id="pGrab"><div class="handle"></div>
      <input class="psearch" id="pSearch" placeholder="項目を検索 / 追加" autocomplete="off"></div>
    <div id="pList"></div>
  </div>
</div>
<!-- AI 下書き -->
<div class="modal" id="aiModal">
  <div class="sheet" id="aiSheet" style="max-height:auto;">
    <div class="grab" id="aiGrab"><div class="handle"></div></div>
    <h3>AIで項目を下書き</h3>
    <div style="font-size:12px;color:var(--text2);font-weight:600;margin:0 2px 8px;">工事内容をざっくり書くと、項目を下書きします（あとで直せます）</div>
    <textarea class="inp" id="aiDesc" placeholder="例：15坪の居抜きラーメン店。厨房を全面やり替え、客席の床と壁も新しく。トイレ改装、外装サインも。"></textarea>
    <div class="actions"><button class="pill primary" id="aiGo" type="button"><span class="icon">auto_awesome</span> 下書きする</button></div>
  </div>
</div>
<!-- 自社情報 -->
<div class="modal" id="coModal">
  <div class="sheet" id="coSheet" style="max-height:auto;">
    <div class="grab" id="coGrab"><div class="handle"></div></div>
    <h3>自社情報（見積書に載る）</h3>
    <div class="field-label">会社名 / 屋号</div><input class="inp" id="coName" placeholder="例：株式会社BANAX">
    <div class="field-label">電話 / 連絡先</div><input class="inp" id="coTel" placeholder="例：03-1234-5678">
    <div class="field-label">住所・登録番号など</div><input class="inp" id="coNote" placeholder="例：東京都〇〇  登録番号 T1234...">
    <div class="actions"><button class="pill primary" id="coSave" type="button">保存</button></div>
  </div>
</div>

<datalist id="unitList"><option value="式"><option value="㎡"><option value="m"><option value="個"><option value="台"><option value="ヶ所"><option value="人工"><option value="本"><option value="枚"></datalist>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script type="module">
import { initAuthBoot, api } from "/api-auth.js";
const $ = (id) => document.getElementById(id);
const PRESET = ["墨出し","厨房ブロック","厨房防水","水道配管","グリストラップ取り付け","土間打ち","土間仕上げ","グレーチング作成","カウンター作成","間仕切り作成","ダクト作成","シロッコファン取り付け","フード作成","厨房天井作成","厨房さがり壁","外周ふかし壁","電気コンセント配線","電気照明配線","分電盤作成","エアコン","厨房タイル貼り","便器取り付け","手洗い器取り付け","厨房器具取り付け","スイングドア取り付け","客席床上げ","客席床仕上げ","壁左官仕上げ","外部左官仕上げ","オーニング取り付け","サイン取り付け","サインシート貼り","入り口建具作成","テイクアウト窓作成","厨房内塗装","木部塗装","外部照明","電線管取り付け","左官クリア塗装","トイレ換気扇","トイレドア","収納作成"];
const KINDS = ["", "材料", "手間", "外注", "経費"];

let estimates = [], priceMemory = {}, cur = null;
let _tt = null;
function toast(m, e = false) { const t = $("toast"); t.textContent = m; t.classList.toggle("err", !!e); t.style.display = "block"; clearTimeout(_tt); _tt = setTimeout(() => t.style.display = "none", e ? 4500 : 1400); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function attr(s) { return String(s ?? "").replace(/"/g, "&quot;"); }
const yen = (n) => "¥" + Math.round(Number(n) || 0).toLocaleString();
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
function estSub(e) { return (e.items || []).reduce((s, it) => s + num(it.qty) * num(it.price), 0); }
function estTotal(e) { return Math.round(estSub(e) * (1 + (num(e.taxRate) || 10) / 100)); }

async function load() {
  try { estimates = await api("GET", "/api/mitsumori"); }
  catch (e) { toast("読み込み失敗: " + e.message, true); estimates = []; }
  priceMemory = {};
  estimates.forEach(e => (e.items || []).forEach(it => { if (it.name && it.price && priceMemory[it.name] == null) priceMemory[it.name] = num(it.price); }));
  renderList();
}
function show(scr) { for (const s of ["listScreen", "editScreen", "previewScreen"]) $(s).style.display = s === scr ? (s === "previewScreen" ? "block" : "") : "none"; }
function renderList() {
  cur = null; show("listScreen");
  if (!estimates.length) { $("list").innerHTML = `<div class="list-empty">まだ見積はありません。<br>右上の「新規」から。</div>`; return; }
  $("list").innerHTML = estimates.map(e => `<div class="est-card" data-id="${e.id}">
      <div style="min-width:0;"><div class="est-cust">${esc(e.customer || "(顧客名なし)")}</div>
      <div class="est-meta">${[e.site, (e.items || []).length + "項目", e.issuedOn].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="est-total">${yen(estTotal(e))}</div></div>`).join("");
  document.querySelectorAll(".est-card").forEach(c => c.addEventListener("click", () => openEdit(c.dataset.id)));
}

function blank() { return { id: null, customer: "", site: "", issuedOn: new Date().toISOString().slice(0, 10), taxRate: 10, items: [], memo: "" }; }
function newEst() { cur = blank(); showEdit(); }
function openEdit(id) { const e = estimates.find(x => x.id === id); if (!e) return; cur = { id: e.id, customer: e.customer || "", site: e.site || "", issuedOn: e.issuedOn || "", taxRate: num(e.taxRate) || 10, memo: e.memo || "", items: Array.isArray(e.items) ? JSON.parse(JSON.stringify(e.items)) : [] }; showEdit(); }
function showEdit() { show("editScreen"); renderEdit(); }

function renderEdit() {
  $("deleteBtn").style.display = cur.id ? "" : "none";
  $("editBody").innerHTML = `
    <div class="two">
      <div><div class="field-label">顧客名</div><input class="inp" id="fCust" placeholder="例：〇〇食堂 様" value="${attr(cur.customer)}"></div>
      <div><div class="field-label">現場 / 物件</div><input class="inp" id="fSite" placeholder="例：新宿店" value="${attr(cur.site)}"></div>
    </div>
    <div class="field-label">発行日</div><input class="inp" id="fDate" type="date" value="${attr(cur.issuedOn)}">
    <div class="field-label" style="margin-top:18px;">項目</div>
    <div id="itemsBox"></div>
    <button class="add-item" id="addItemBtn" type="button"><span class="icon">add</span> 項目を追加</button>
    <button class="ai-btn" id="aiBtn" type="button"><span class="icon">auto_awesome</span> AIで項目を下書き</button>
    <div class="summary">
      <div class="srow"><span class="lbl">小計</span><span class="val" id="sSub"></span></div>
      <div class="kbreak" id="sBreak"></div>
      <div class="srow"><span class="lbl">消費税（<input class="tax-in" id="fTax" type="number" value="${cur.taxRate}">%）</span><span class="val" id="sTax"></span></div>
      <div class="srow total"><span class="lbl">合計</span><span class="val" id="sTot"></span></div>
    </div>
    <div class="field-label">備考</div><textarea class="inp" id="fMemo" placeholder="有効期限・支払条件など">${esc(cur.memo)}</textarea>
    <div class="actions">
      <button class="pill" id="pvBtn" type="button"><span class="icon">description</span> プレビュー</button>
      ${cur.id ? `<button class="pill" id="dupBtn" type="button"><span class="icon">content_copy</span> 複製</button>` : ""}
      ${cur.id ? `<button class="pill" id="genkaBtn" type="button"><span class="icon">savings</span> 原価計算へ</button>` : ""}
    </div>
    <div class="actions"><button class="pill primary" id="saveBtn" type="button" style="flex:1;"><span class="icon">save</span> ${cur.id ? "保存" : "登録"}</button></div>
  `;
  $("fCust").addEventListener("input", e => cur.customer = e.target.value);
  $("fSite").addEventListener("input", e => cur.site = e.target.value);
  $("fDate").addEventListener("input", e => cur.issuedOn = e.target.value);
  $("fMemo").addEventListener("input", e => cur.memo = e.target.value);
  $("fTax").addEventListener("input", e => { cur.taxRate = num(e.target.value); updateTotals(); });
  $("addItemBtn").addEventListener("click", openPicker);
  $("aiBtn").addEventListener("click", () => $("aiModal").classList.add("open"));
  $("saveBtn").addEventListener("click", save);
  $("pvBtn").addEventListener("click", () => { if (!cur.id) { toast("先に保存してね"); } showPreview(); });
  $("dupBtn")?.addEventListener("click", duplicate);
  $("genkaBtn")?.addEventListener("click", toGenka);
  renderItems();
}
function renderItems() {
  $("itemsBox").innerHTML = cur.items.map((it, i) => `
    <div class="item-card" data-i="${i}">
      <input class="nm" value="${attr(it.name)}" placeholder="品名">
      <div class="item-l2">
        <select class="kind">${KINDS.map(k => `<option value="${k}" ${it.kind === k ? "selected" : ""}>${k || "区分"}</option>`).join("")}</select>
        <input class="qty" type="number" inputmode="decimal" value="${attr(it.qty)}">
        <input class="unit" list="unitList" value="${attr(it.unit)}">
        <input class="price" type="number" inputmode="numeric" value="${attr(it.price)}" placeholder="単価">
        <span class="amt" id="amt${i}"></span>
        <button class="rm" type="button"><span class="icon">close</span></button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".item-card").forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelector(".nm").addEventListener("input", e => cur.items[i].name = e.target.value);
    row.querySelector(".kind").addEventListener("change", e => { cur.items[i].kind = e.target.value; updateTotals(); });
    row.querySelector(".qty").addEventListener("input", e => { cur.items[i].qty = e.target.value; updateTotals(); });
    row.querySelector(".unit").addEventListener("input", e => cur.items[i].unit = e.target.value);
    row.querySelector(".price").addEventListener("input", e => { cur.items[i].price = e.target.value; updateTotals(); });
    row.querySelector(".rm").addEventListener("click", () => { cur.items.splice(i, 1); renderItems(); });
  });
  updateTotals();
}
function kindSums() { const s = {}; cur.items.forEach(it => { if (it.kind) s[it.kind] = (s[it.kind] || 0) + num(it.qty) * num(it.price); }); return s; }
function updateTotals() {
  let sub = 0; cur.items.forEach((it, i) => { const a = num(it.qty) * num(it.price); sub += a; const el = $("amt" + i); if (el) el.textContent = yen(a); });
  const tax = Math.round(sub * (num(cur.taxRate) / 100));
  $("sSub").textContent = yen(sub); $("sTax").textContent = yen(tax); $("sTot").textContent = yen(sub + tax);
  const ks = kindSums(), cols = { "材料": "--k-mat", "手間": "--k-te", "外注": "--k-gai", "経費": "--k-kei" };
  const b = $("sBreak"); if (b) b.innerHTML = Object.keys(ks).length ? Object.entries(ks).map(([k, v]) => `<span style="color:var(${cols[k]})">${k} <b>${yen(v)}</b></span>`).join("") : "";
}

// 項目ピッカー
let pSearch = "";
function openPicker() { pSearch = ""; $("pSearch").value = ""; renderPicker(); $("pModal").classList.add("open"); }
function renderPicker() {
  const q = pSearch.trim(), has = (n) => cur.items.some(it => it.name === n), list = PRESET.filter(n => !q || n.includes(q));
  let html = "";
  if (q && !PRESET.includes(q)) html += `<div class="p-item" data-custom="1"><span class="pn">＋「${esc(q)}」を追加</span><span class="icon add-ic">add_circle</span></div>`;
  html += `<div class="p-sect">よく使う項目（タップで追加）</div>` + list.map(n => {
    const mem = priceMemory[n];
    return `<div class="p-item ${has(n) ? "added" : ""}" data-n="${attr(n)}"><span class="pn">${esc(n)}${mem != null ? ` <span class="pp">前回 ${yen(mem)}</span>` : ""}</span><span class="icon add-ic">${has(n) ? "check_circle" : "add_circle"}</span></div>`;
  }).join("");
  $("pList").innerHTML = html;
  $("pList").querySelector('[data-custom]')?.addEventListener("click", () => { addItem(q); pSearch = ""; $("pSearch").value = ""; renderPicker(); });
  $("pList").querySelectorAll("[data-n]").forEach(el => el.addEventListener("click", () => { addItem(el.dataset.n); renderPicker(); }));
}
function addItem(name, kind = "", qty = 1, unit = "式") { cur.items.push({ name, qty, unit, price: priceMemory[name] != null ? priceMemory[name] : "", kind }); renderItems(); toast(`「${name}」を追加`); }

// AI 下書き
$("aiGo").addEventListener("click", async () => {
  const desc = $("aiDesc").value.trim(); if (!desc) { toast("工事内容を書いてね"); return; }
  const btn = $("aiGo"); btn.disabled = true; btn.innerHTML = '<span class="icon">hourglass_top</span> 下書き中…';
  try {
    const { items } = await api("POST", "/api/mitsumori/draft", { desc });
    (items || []).forEach(it => cur.items.push({ name: it.name, qty: num(it.qty) || 1, unit: it.unit || "式", price: priceMemory[it.name] != null ? priceMemory[it.name] : "", kind: it.kind || "" }));
    $("aiModal").classList.remove("open"); renderItems();
    toast(`${(items || []).length} 項目を下書きしました`);
  } catch (e) { toast("下書き失敗: " + e.message, true); }
  btn.disabled = false; btn.innerHTML = '<span class="icon">auto_awesome</span> 下書きする';
});

// 複製
function duplicate() { cur = { ...cur, id: null, customer: (cur.customer || "") + "（複製）", items: JSON.parse(JSON.stringify(cur.items)) }; showEdit(); toast("複製しました（保存で新規登録）"); }
// 原価計算へ
async function toGenka() {
  const total = Math.round(estSub(cur) * (1 + num(cur.taxRate) / 100));
  try { await api("POST", "/api/genka", { site: cur.site || cur.customer || "見積", quote: total / 10000, vendors: [] }); toast(`原価計算に見積金額 ${yen(total)} を送りました`); }
  catch (e) { toast("送信失敗: " + e.message, true); }
}

async function save() {
  const btn = $("saveBtn"); btn.disabled = true;
  const items = cur.items.map(it => ({ name: (it.name || "").trim(), qty: num(it.qty), unit: it.unit || "式", price: num(it.price), kind: it.kind || "" })).filter(it => it.name);
  const payload = { customer: cur.customer, site: cur.site, issuedOn: cur.issuedOn || null, taxRate: num(cur.taxRate) || 10, items, memo: cur.memo };
  try {
    if (!cur.id) { const s = await api("POST", "/api/mitsumori", payload); cur.id = s.id; } else await api("PUT", `/api/mitsumori/${cur.id}`, payload);
    toast("保存しました"); await load();
  } catch (e) { toast("保存失敗: " + e.message, true); btn.disabled = false; }
}
async function del() { if (!cur?.id || !confirm("この見積を削除しますか？")) return; try { await api("DELETE", `/api/mitsumori/${cur.id}`); toast("削除しました"); await load(); } catch (e) { toast("削除失敗: " + e.message, true); } }

// ── 見積書プレビュー ──
function company() { try { return JSON.parse(localStorage.getItem("mit_company") || "{}"); } catch { return {}; } }
function showPreview() {
  const sub = estSub(cur), tax = Math.round(sub * num(cur.taxRate) / 100), tot = sub + tax, co = company();
  $("pvBody").innerHTML = `
    <div class="printable">
      <div class="doc-title">御 見 積 書</div>
      <div class="doc-sub">発行日 ${esc(cur.issuedOn || "")}</div>
      <div><span class="doc-to">${esc(cur.customer || "")} 御中</span></div>
      ${cur.site ? `<div style="font-size:12px;color:#555;margin:4px 2px;">物件：${esc(cur.site)}</div>` : ""}
      <div class="doc-money"><span class="l">御見積金額（税込）</span><span class="v">${yen(tot)}</span></div>
      <table class="pv"><thead><tr><th>品名</th><th style="width:12%">数量</th><th style="width:12%">単位</th><th style="width:20%">単価</th><th style="width:22%">金額</th></tr></thead>
      <tbody>${cur.items.filter(it => (it.name || "").trim()).map(it => `<tr><td>${esc(it.name)}</td><td class="c">${esc(String(it.qty ?? ""))}</td><td class="c">${esc(it.unit || "")}</td><td class="r">${it.price ? yen(it.price) : ""}</td><td class="r">${yen(num(it.qty) * num(it.price))}</td></tr>`).join("")}</tbody></table>
      <div class="pv-tot">
        <div class="r2"><span>小計</span><span>${yen(sub)}</span></div>
        <div class="r2"><span>消費税（${num(cur.taxRate)}%）</span><span>${yen(tax)}</span></div>
        <div class="r2 g"><span>合計</span><span>${yen(tot)}</span></div>
      </div>
      ${cur.memo ? `<div class="doc-note">備考：${esc(cur.memo)}</div>` : ""}
      <div class="doc-from"><span class="co">${esc(co.name || "（自社情報を設定してください）")}</span>${co.tel ? `<br>${esc(co.tel)}` : ""}${co.note ? `<br>${esc(co.note)}` : ""}</div>
    </div>`;
  show("previewScreen");
}
$("pvBack").addEventListener("click", showEdit);
$("pvPrint").addEventListener("click", () => window.print());
$("pvCompany").addEventListener("click", () => { const c = company(); $("coName").value = c.name || ""; $("coTel").value = c.tel || ""; $("coNote").value = c.note || ""; $("coModal").classList.add("open"); });
$("coSave").addEventListener("click", () => { localStorage.setItem("mit_company", JSON.stringify({ name: $("coName").value, tel: $("coTel").value, note: $("coNote").value })); $("coModal").classList.remove("open"); if ($("previewScreen").style.display === "block") showPreview(); toast("自社情報を保存"); });

// モーダル閉じる（背景タップ + ハンドルドラッグ）
["pModal", "aiModal", "coModal"].forEach(id => {
  $(id).addEventListener("click", e => { if (e.target === $(id)) $(id).classList.remove("open"); });
});
(() => {
  const grab = $("pGrab"), sheet = $("pSheet"); let sy = null, dy = 0;
  grab.addEventListener("pointerdown", e => { if (e.target.id === "pSearch") return; sy = e.clientY; dy = 0; sheet.style.transition = "none"; });
  grab.addEventListener("pointermove", e => { if (sy === null) return; dy = e.clientY - sy; if (dy > 0) sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (sy === null) return; sy = null; sheet.style.transition = ""; if (dy > 90) $("pModal").classList.remove("open"); sheet.style.transform = ""; dy = 0; };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
})();

$("newBtn").addEventListener("click", newEst);
$("backBtn").addEventListener("click", renderList);
$("deleteBtn").addEventListener("click", del);

initAuthBoot({ returnPath: "/mitsumori/", onReady: async () => { $("app").style.display = ""; $("list").innerHTML = '<div class="list-empty">読み込み中…</div>'; await load(); } });
</script>
</body>
</html>
