<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radix">
<link rel="apple-touch-icon" href="/icon.png">
<title>Radix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --ink: #14121f; --ink2: #1c1930; --card: #f2e9d4; --card2: #e8dcc0;
  --text: #efe8d6; --muted: #a49c86; --gold: #d8b45a; --gold2: #b8923a;
  --g: #6aa0d8; --r: #d8975a; --h: #b07ad8; --i: #cf7a45;  /* ゲルマン / ロマンス / ギリシャ / インド・イラン */
}
body { font-family: 'Outfit', -apple-system, sans-serif; color: var(--text); min-height: 100vh;
  background:
    radial-gradient(120% 80% at 50% -10%, #26223f 0%, #16142400 60%),
    radial-gradient(100% 60% at 50% 110%, #241d33 0%, #16142400 55%),
    #14121f;
  padding-bottom: 50px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; vertical-align: -0.18em; }
.serif { font-family: 'EB Garamond', serif; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; }
.back { padding: 8px 14px; border-radius: 22px; font-size: 12px; font-weight: 700; border: none;
  color: var(--muted); background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(216,180,90,0.2);
  text-decoration: none; }
.wrap { max-width: 640px; margin: 0 auto; padding: 8px 18px 40px; }

.brand { text-align: center; margin: 18px 0 4px; }
.brand .logo { font-family: 'EB Garamond', serif; font-weight: 600; font-size: 40px; letter-spacing: 0.14em;
  color: var(--gold); text-shadow: 0 2px 20px rgba(216,180,90,0.25); }
.brand .logo .dot { color: var(--r); }
.brand .tag { font-size: 11px; letter-spacing: 0.32em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

.hint { text-align: center; font-size: 12px; color: var(--muted); margin: 14px 0 10px; }
.hint .hl { color: var(--gold); font-weight: 700; }

/* 意味チップ */
.concepts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 2px; margin-bottom: 6px; }
.concepts::-webkit-scrollbar { display: none; }
.cchip { flex: 0 0 auto; padding: 9px 16px; border-radius: 22px; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; font-family: inherit; color: var(--text);
  background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.cchip.on { color: #1a1420; background: var(--gold); box-shadow: 0 4px 16px rgba(216,180,90,0.35); }
.cchip .en { font-size: 11px; opacity: 0.6; margin-left: 5px; }

/* 祖先カード */
.ancestor { margin: 16px 0 14px; padding: 16px 18px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(216,180,90,0.10), rgba(216,180,90,0.02));
  box-shadow: inset 0 0 0 1px rgba(216,180,90,0.28); position: relative; }
.ancestor .lbl { font-size: 10px; letter-spacing: 0.28em; color: var(--gold2); text-transform: uppercase; font-weight: 700; }
.ancestor .root { font-family: 'EB Garamond', serif; font-style: italic; font-size: 32px; font-weight: 600;
  color: var(--gold); margin: 4px 0 2px; }
.ancestor .gloss { font-size: 13px; color: var(--muted); }

/* 言語カード */
.langs { display: flex; flex-direction: column; gap: 9px; }
.lang { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 14px;
  background: var(--card); color: #2a2418; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  position: relative; overflow: hidden; }
.lang::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--famc); }
.lang .flag { font-size: 26px; line-height: 1; }
.lang .mid { flex: 1; min-width: 0; }
.lang .word { font-family: 'EB Garamond', serif; font-size: 27px; font-weight: 600; line-height: 1.05; }
.lang .word .hl { color: var(--gold2); text-shadow: 0 0 1px rgba(184,146,58,0.4); }
.lang .roman { font-family: 'EB Garamond', serif; font-style: italic; font-size: 15px; color: #6a6250; }
.lang .meta { font-size: 10px; color: #8a8168; font-weight: 700; letter-spacing: 0.06em; margin-top: 3px; }
.lang .ipa { font-size: 12px; color: #7a7360; }
.lang .word { cursor: pointer; }
.lang .rcol { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.lang .fam { font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: #fff; background: var(--famc); padding: 3px 8px; border-radius: 10px; }
.lang .say { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
  background: #2a2418; color: var(--gold); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.lang .say:active { transform: scale(0.9); }
.lang .say.speaking { background: var(--gold); color: #1a1420; }
.lang .say .icon { font-size: 19px; vertical-align: 0; }

.note { margin-top: 14px; padding: 13px 16px; border-radius: 14px; font-size: 13px; line-height: 1.7;
  background: rgba(176,122,216,0.08); box-shadow: inset 0 0 0 1px rgba(176,122,216,0.25); color: #d8cfe4; }
.note b { color: #e6d8f4; }
.note .h { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--h); font-weight: 800; display: block; margin-bottom: 5px; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; justify-content: center; margin-top: 22px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .d { width: 9px; height: 9px; border-radius: 3px; }

/* モード切替 */
.modetabs { display: flex; gap: 6px; justify-content: center; margin: 10px 0 12px; }
.mtab { padding: 8px 22px; border-radius: 20px; font-size: 13px; font-weight: 800; font-family: inherit;
  border: none; cursor: pointer; color: var(--muted); background: rgba(255,255,255,0.05);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.mtab.on { color: #1a1420; background: var(--gold); }

/* 家系図 */
#treeView { overflow-x: auto; scrollbar-width: none; }
#treeView::-webkit-scrollbar { display: none; }
.tree { padding: 6px 2px 4px; min-width: 260px; }
.tnode.root { display: inline-block; font-family: 'EB Garamond', serif; font-style: italic; font-size: 26px;
  color: var(--gold); padding: 7px 15px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(216,180,90,0.35); }
.tnode.root .tsub { font-family: 'Outfit', sans-serif; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; margin-left: 6px; }
.tbranch { margin: 6px 0 0 20px; border-left: 2px solid rgba(216,180,90,0.3); }
.tfam { position: relative; margin: 12px 0; padding-left: 18px; }
.tfam::before { content: ""; position: absolute; left: 0; top: 15px; width: 16px; height: 2px; background: rgba(216,180,90,0.3); }
.tfam .fam2 { display: inline-block; font-weight: 800; font-size: 12px; letter-spacing: 0.06em;
  color: var(--c); padding: 5px 13px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--c); }
.tleaves { margin: 4px 0 0 16px; border-left: 2px solid var(--c); }
.tleaf { position: relative; margin: 7px 0; padding: 9px 13px 9px 16px; display: flex; align-items: baseline; gap: 9px;
  background: var(--card); color: #2a2418; border-radius: 10px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.28); }
.tleaf::before { content: ""; position: absolute; left: -2px; top: 50%; width: 14px; height: 2px; background: var(--c); }
.tleaf:active { transform: scale(0.98); }
.tleaf .lflag { font-size: 19px; }
.tleaf .lword { font-family: 'EB Garamond', serif; font-size: 21px; font-weight: 600; }
.tleaf .lroman { font-family: 'EB Garamond', serif; font-style: italic; font-size: 13px; color: #6a6250; }
.tleaf .llang { margin-left: auto; font-size: 10px; font-weight: 700; color: #8a8168; padding-left: 8px; }
.tleaf .lsay { color: #8a8168; }
.tleaf .lsay .icon { font-size: 16px; vertical-align: -0.15em; }

/* 神話モード */
#mythView { display: flex; flex-direction: column; gap: 9px; }
.myth-intro { text-align: center; font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.mcard { background: var(--card); color: #2a2418; border-radius: 14px; box-shadow: 0 5px 14px rgba(0,0,0,0.3); overflow: hidden; }
.mhead { display: flex; align-items: center; gap: 12px; padding: 13px 15px; cursor: pointer; }
.memoji { font-size: 25px; line-height: 1; }
.mwm { flex: 1; min-width: 0; }
.mword { font-family: 'EB Garamond', serif; font-size: 22px; font-weight: 600; line-height: 1.1; }
.mword .mja { font-family: 'Outfit', sans-serif; font-size: 12px; color: #8a8168; font-weight: 700; margin-left: 6px; }
.msrc { font-size: 12px; color: #7a6a48; font-weight: 700; margin-top: 2px; }
.msrc .mcul { color: #a8977a; font-weight: 600; margin-left: 4px; }
.mexp { color: #b8a578; transition: transform 0.2s; }
.mcard.open .mexp { transform: rotate(180deg); }
.mstory { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s; padding: 0 15px; font-size: 13.5px; line-height: 1.8; color: #3a3222; }
.mcard.open .mstory { max-height: 640px; padding: 0 15px 14px; }
.mstory b { color: #14100a; }
.mderiv { margin-top: 9px; font-size: 12px; font-weight: 700; color: #6a5f42; }
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="/"><span class="icon">arrow_back</span> 戻る</a>
  <span style="font-size:11px;letter-spacing:0.24em;color:var(--muted);">ETYMOLOGY</span>
  <span style="width:64px;"></span>
</div>

<div class="wrap">
  <div class="brand">
    <div class="logo serif">Radi<span class="dot">x</span></div>
    <div class="tag">言葉の根をたどる</div>
  </div>
  <div class="hint">意味を選ぶと6言語が並び、<span class="hl">共通の子音が金色で光る</span>。単語や🔊をタップで発音。</div>

  <div class="concepts" id="concepts"></div>
  <div class="modetabs" id="modetabs">
    <button class="mtab on" data-m="compare" type="button">単語比較</button>
    <button class="mtab" data-m="tree" type="button">家系図</button>
    <button class="mtab" data-m="myth" type="button">神話</button>
  </div>
  <div id="mythView" style="display:none;"></div>
  <div id="compareView">
    <div class="ancestor" id="ancestor"></div>
    <div class="langs" id="langs"></div>
  </div>
  <div id="treeView" style="display:none;"></div>
  <div id="noteBox"></div>

  <div class="legend">
    <span><span class="d" style="background:var(--g)"></span>ゲルマン系</span>
    <span><span class="d" style="background:var(--r)"></span>ロマンス系</span>
    <span><span class="d" style="background:var(--h)"></span>ギリシャ系</span>
    <span><span class="d" style="background:var(--i)"></span>インド・イラン系</span>
  </div>
</div>

<script src="/config.js"></script>
<script>
// ── データ（1単語＝1エントリ。増やすのはここに足すだけ）──
// keys = 光らせる子音（ラテン+ギリシャ）。fam: g=ゲルマン r=ロマンス h=ギリシャ
const FAMC = { g: "var(--g)", r: "var(--r)", h: "var(--h)", i: "var(--i)" };
const FAMLABEL = { g: "Germanic", r: "Romance", h: "Hellenic", i: "Indo-Iranian" };
const CONCEPTS = [
  { key: "mother", ja: "母", root: "*méh₂tēr", gloss: "印欧祖語「母」", keys: "mtdrμτρ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "Mutter", ipa: "ˈmʊtɐ", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "mother", ipa: "ˈmʌðə", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "mère", ipa: "mɛʁ", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "madre", ipa: "ˈmaːdre", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "madre", ipa: "ˈmaðre", fam: "r" },
    { lang: "ポルトガル語", flag: "🇵🇹", text: "mãe", ipa: "mɐ̃j̃", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "μήτηρ", roman: "mḗtēr", fam: "h" },
    { lang: "アイスランド語", flag: "🇮🇸", text: "móðir", fam: "g" },
    { lang: "サンスクリット", flag: "🇮🇳", text: "मातृ", roman: "mātṛ́", fam: "i" },
    { lang: "ペルシャ語", flag: "🇮🇷", text: "مادر", roman: "mādar", fam: "i" },
  ], note: "「母」は最強の証拠。<b>英 mother・独 Mutter</b> だけでなく、<b>アイスランド móðir・ペルシャ mādar・サンスクリット mātṛ́</b> まで全部 *méh₂tēr から！ ヨーロッパの端からインドまで一本でつながる——だからこの家系を <b>「インド・ヨーロッパ語族」</b> と呼ぶ。" },
  { key: "father", ja: "父", root: "*ph₂tḗr", gloss: "印欧祖語「父」", keys: "pfvtdrπτρ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "Vater", ipa: "ˈfaːtɐ", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "father", ipa: "ˈfɑːðə", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "père", ipa: "pɛʁ", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "padre", ipa: "ˈpaːdre", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "padre", ipa: "ˈpaðre", fam: "r" },
    { lang: "ポルトガル語", flag: "🇵🇹", text: "pai", ipa: "paj", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "πατήρ", roman: "patḗr", fam: "h" },
    { lang: "アイスランド語", flag: "🇮🇸", text: "faðir", fam: "g" },
    { lang: "サンスクリット", flag: "🇮🇳", text: "पितृ", roman: "pitṛ́", fam: "i" },
    { lang: "ペルシャ語", flag: "🇮🇷", text: "پدر", roman: "pedar", fam: "i" },
  ]},
  { key: "name", ja: "名前", root: "*h₁nómn̥", gloss: "印欧祖語「名」", keys: "nmνμ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "Name", ipa: "ˈnaːmə", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "name", ipa: "neɪm", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "nom", ipa: "nɔ̃", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "nome", ipa: "ˈnoːme", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "nombre", ipa: "ˈnombre", fam: "r" },
    { lang: "ポルトガル語", flag: "🇵🇹", text: "nome", ipa: "ˈnomɨ", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "ὄνομα", roman: "ónoma", fam: "h" },
  ]},
  { key: "night", ja: "夜", root: "*nókʷts", gloss: "印欧祖語「夜」", keys: "ntντ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "Nacht", ipa: "naxt", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "night", ipa: "naɪt", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "nuit", ipa: "nɥi", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "notte", ipa: "ˈnɔtte", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "noche", ipa: "ˈnotʃe", fam: "r" },
    { lang: "ポルトガル語", flag: "🇵🇹", text: "noite", ipa: "ˈnojtɨ", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "νύξ", roman: "nýx（語幹 nykt-）", fam: "h" },
  ], note: "スペイン語とポルトガル語の違いが出る好例。ラテン noctem → 西 <b>noche</b>（ct→ch）／葡 <b>noite</b>（ct→it）。この「ラテン ct が スペイン=ch・ポルトガル=it」は超規則的で、leche/leite（乳）、ocho/oito（8）、hecho/feito（した）も全部同じパターン。" },
  { key: "star", ja: "星", root: "*h₂stḗr", gloss: "印欧祖語「星」", keys: "strστρ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "Stern", ipa: "ʃtɛʁn", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "star", ipa: "stɑː", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "étoile", ipa: "etwal", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "stella", ipa: "ˈstella", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "estrella", ipa: "esˈtreʎa", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "ἀστήρ", roman: "astḗr", fam: "h" },
    { lang: "アイスランド語", flag: "🇮🇸", text: "stjarna", fam: "g" },
    { lang: "サンスクリット", flag: "🇮🇳", text: "तारा", roman: "tārā", fam: "i" },
    { lang: "ペルシャ語", flag: "🇮🇷", text: "ستاره", roman: "setāre", fam: "i" },
  ], note: "英 star・独 Stern に加え、<b>ペルシャ setāre・サンスクリット tārā</b> も同じ祖語 *h₂stḗr。ヨーロッパからインド・イランまで届く＝“インド・ヨーロッパ語族”の名の通り。ギリシャ ἀστήρ → 英 astronomy・disaster（＝dis「悪い」+astro「星」＝星回りが悪い）。" },
  { key: "three", ja: "三", root: "*tréyes", gloss: "印欧祖語「3」", keys: "tdrτρ", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "drei", ipa: "dʁaɪ", fam: "g" },
    { lang: "英語", flag: "🇬🇧", text: "three", ipa: "θriː", fam: "g" },
    { lang: "フランス語", flag: "🇫🇷", text: "trois", ipa: "tʁwa", fam: "r" },
    { lang: "イタリア語", flag: "🇮🇹", text: "tre", ipa: "tre", fam: "r" },
    { lang: "スペイン語", flag: "🇪🇸", text: "tres", ipa: "tres", fam: "r" },
    { lang: "ポルトガル語", flag: "🇵🇹", text: "três", ipa: "tɾeʃ", fam: "r" },
    { lang: "ギリシャ語", flag: "🇬🇷", text: "τρεῖς", roman: "treîs", fam: "h" },
    { lang: "アイスランド語", flag: "🇮🇸", text: "þrír", fam: "g" },
    { lang: "サンスクリット", flag: "🇮🇳", text: "त्रि", roman: "trí", fam: "i" },
    { lang: "ペルシャ語", flag: "🇮🇷", text: "سه", roman: "se", fam: "i" },
  ]},
  { key: "new", ja: "新しい", root: "*néwos", gloss: "印欧祖語「新しい」", keys: "nvwν", words: [
    { lang: "ドイツ語", flag: "🇩🇪", text: "neu", ipa: "nɔɪ", fam: "g" },

  { emoji: "⚔️", word: "martial", ja: "マーシャル", source: "マルス Mars", culture: "ローマ神話", story: "軍神 <b>マルス</b>。martial arts（武術）、<b>火星</b>、そして3月 <b>March</b>（軍を進める季節）まで彼の名。" },
  { emoji: "💤", word: "morphine", ja: "モルヒネ", source: "モルペウス Morpheus", culture: "ギリシャ神話", story: "夢の神 <b>モルペウス</b>（眠りの神ヒュプノスの息子）。眠りに誘う鎮痛薬 morphine の名の由来。" },
  { emoji: "🌈", word: "iris", ja: "アイリス", source: "イリス Iris", culture: "ギリシャ神話", story: "虹の女神 <b>イリス</b>（神々の伝令）。虹のように色づく<b>目の虹彩</b>や、花の<b>アヤメ</b>も iris。" },
  { emoji: "😱", word: "phobia", ja: "フォビア", source: "フォボス Phobos", culture: "ギリシャ神話", story: "<b>恐怖の神フォボス</b>（軍神アレスの息子）。「〜恐怖症」＝〜phobia。火星の衛星フォボスも彼。" },
  { emoji: "🦢", word: "hypnosis", ja: "ヒプノシス", source: "ヒュプノス Hypnos", culture: "ギリシャ神話", story: "<b>眠りの神ヒュプノス</b>。眠りに似た状態＝hypnosis（催眠）。" },
];

const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function escAttr(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ── 発音（iPhone/ブラウザ内蔵の読み上げ。言語ごとの声を使う。追加API不要）──
const SPEECH = { "ドイツ語": "de-DE", "英語": "en-GB", "フランス語": "fr-FR", "イタリア語": "it-IT", "スペイン語": "es-ES", "ギリシャ語": "el-GR", "アイスランド語": "is-IS", "スウェーデン語": "sv-SE", "サンスクリット": "hi-IN", "ペルシャ語": "fa-IR", "ポルトガル語": "pt-PT" };
let VOICES = [];
function loadVoices() { try { VOICES = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch { VOICES = []; } }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, bcp, btn) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = bcp;
  const v = VOICES.find(x => x.lang === bcp) || VOICES.find(x => x.lang && x.lang.slice(0, 2) === bcp.slice(0, 2));
  if (v) u.voice = v;
  u.rate = 0.85;
  if (btn) { u.onend = u.onerror = () => btn.classList.remove("speaking"); btn.classList.add("speaking"); }
  speechSynthesis.speak(u);
}
function hl(text, keys) {
  if (!keys) return esc(text);
  const set = new Set(keys.toLowerCase().split(""));
  return [...text].map(ch => set.has(ch.toLowerCase()) ? `<span class="hl">${esc(ch)}</span>` : esc(ch)).join("");
}

const FAMS = [["g", "ゲルマン系", "var(--g)"], ["r", "ロマンス系", "var(--r)"], ["h", "ギリシャ系", "var(--h)"], ["i", "インド・イラン系", "var(--i)"]];
let cur = 0, mode = "compare";

function render() {
  const c = CONCEPTS[cur];
  const isMyth = mode === "myth";
  $("concepts").style.display = isMyth ? "none" : "";
  $("concepts").innerHTML = CONCEPTS.map((x, i) =>
    `<button class="cchip ${i === cur ? "on" : ""}" data-i="${i}" type="button">${esc(x.ja)}<span class="en">${x.key}</span></button>`
  ).join("");
  document.querySelectorAll(".cchip").forEach(b => b.addEventListener("click", () => { cur = Number(b.dataset.i); render(); }));

  document.querySelectorAll(".mtab").forEach(b => {
    b.classList.toggle("on", b.dataset.m === mode);
    b.onclick = () => { mode = b.dataset.m; render(); };
  });
  $("compareView").style.display = mode === "compare" ? "" : "none";
  $("treeView").style.display = mode === "tree" ? "" : "none";
  $("mythView").style.display = isMyth ? "" : "none";
  const lg = document.querySelector(".legend"); if (lg) lg.style.display = isMyth ? "none" : "";

  if (isMyth) { renderMyth(); $("noteBox").innerHTML = ""; return; }
  if (mode === "compare") renderCompare(c); else renderTree(c);
  $("noteBox").innerHTML = c.note ? `<div class="note"><span class="h">なぜ違う？</span>${c.note}</div>` : "";
}

function renderMyth() {
  $("mythView").innerHTML = `<div class="myth-intro">日常の言葉には、神々の名前が隠れている。タップで物語。</div>` +
    MYTH.map((m, i) => `
      <div class="mcard" data-i="${i}">
        <div class="mhead">
          <span class="memoji">${m.emoji}</span>
          <div class="mwm">
            <div class="mword">${esc(m.word)}<span class="mja">${esc(m.ja)}</span></div>
            <div class="msrc">← ${esc(m.source)}<span class="mcul">${esc(m.culture)}</span></div>
          </div>
          <span class="mexp icon">expand_more</span>
        </div>
        <div class="mstory">${m.story}${m.deriv ? `<div class="mderiv">派生：${esc(m.deriv)}</div>` : ""}</div>
      </div>`).join("");
  $("mythView").querySelectorAll(".mcard").forEach(card =>
    card.querySelector(".mhead").addEventListener("click", () => card.classList.toggle("open")));
}

function renderCompare(c) {
  $("ancestor").innerHTML = `<div class="lbl">祖先 · ANCESTOR</div>
    <div class="root">${esc(c.root)}</div><div class="gloss">${esc(c.gloss)}</div>`;
  $("langs").innerHTML = c.words.map(w => `
    <div class="lang" style="--famc:${FAMC[w.fam]}">
      <span class="flag">${w.flag}</span>
      <div class="mid">
        <div class="word">${hl(w.text, c.keys)}</div>
        ${w.roman ? `<div class="roman">${esc(w.roman)}</div>` : ""}
        <div class="meta">${esc(w.lang)}${w.ipa ? ` · <span class="ipa">/${esc(w.ipa)}/</span>` : ""}</div>
      </div>
      <div class="rcol">
        <span class="fam">${FAMLABEL[w.fam] || ""}</span>
        <button class="say" type="button" data-t="${escAttr(w.text)}" data-l="${SPEECH[w.lang] || "en-US"}" aria-label="発音"><span class="icon">volume_up</span></button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".lang").forEach(row => {
    const btn = row.querySelector(".say"), word = row.querySelector(".word");
    const go = () => speak(btn.dataset.t, btn.dataset.l, btn);
    btn.addEventListener("click", go);
    if (word) word.addEventListener("click", go);
  });
}

function renderTree(c) {
  let html = `<div class="tree">
    <div class="tnode root">${esc(c.root)}<span class="tsub">祖先（PIE）</span></div>
    <div class="tbranch">`;
  for (const [f, label, col] of FAMS) {
    const ws = c.words.filter(w => w.fam === f);
    if (!ws.length) continue;
    html += `<div class="tfam" style="--c:${col}"><span class="fam2">${esc(label)}</span>
      <div class="tleaves">` + ws.map(w => `
        <div class="tleaf" data-t="${escAttr(w.text)}" data-l="${SPEECH[w.lang] || "en-US"}">
          <span class="lflag">${w.flag}</span>
          <span class="lword">${esc(w.text)}</span>
          ${w.roman ? `<span class="lroman">${esc(w.roman)}</span>` : ""}
          <span class="llang">${esc(w.lang)}<span class="lsay"><span class="icon">volume_up</span></span></span>
        </div>`).join("") + `</div></div>`;
  }
  html += `</div></div>`;
  $("treeView").innerHTML = html;
  $("treeView").querySelectorAll(".tleaf").forEach(el =>
    el.addEventListener("click", () => speak(el.dataset.t, el.dataset.l)));
}

render();
</script>
</body>
</html>
