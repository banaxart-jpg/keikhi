<html lang="ja">
<head>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #0e7490;          /* 海色: 深い cyan / 海洋 */
  --correct: #2a8c3a;
  --incorrect: #b04040;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; gap: 8px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; text-decoration: none; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.wrap { padding: 18px 18px 40px; max-width: 600px; margin: 0 auto; }
.title { font-size: 26px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 2px; margin-bottom: 20px; }

/* 進捗バー */
.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 12px; color: var(--text2); font-weight: 700; }
.progress-bar { flex: 1; height: 8px; background: rgba(154,160,184,0.2); border-radius: 4px; overflow: hidden; box-shadow: inset 2px 2px 4px var(--sd); }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }

/* 問題カード */
.card { background: var(--bg); border-radius: 22px; padding: 20px; box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.cat-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 10px; background: rgba(14,116,144,0.18); color: var(--accent); margin-bottom: 12px; }
.q-img-wrap { margin: 0 -4px 14px; border-radius: 14px; overflow: hidden; background: #f0f1f6; display: flex; justify-content: center; }
.q-img { display: block; max-width: 100%; max-height: 260px; object-fit: contain; }
.q-text { font-size: 17px; font-weight: 700; line-height: 1.5; margin-bottom: 18px; }

.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { padding: 14px 16px; border-radius: 14px; border: none; background: var(--bg); color: var(--text); font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; font-family: inherit; box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); transition: transform 0.06s; }
.choice:active { transform: scale(0.98); }
.choice.correct { background: color-mix(in srgb, var(--correct) 16%, var(--bg) 84%); color: var(--correct); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.choice.incorrect { background: color-mix(in srgb, var(--incorrect) 16%, var(--bg) 84%); color: var(--incorrect); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.choice.dim { opacity: 0.55; }
.choice:disabled { cursor: default; }

/* 解説 */
.explain { margin-top: 16px; padding: 14px; border-radius: 14px; background: rgba(154,160,184,0.1); font-size: 13px; line-height: 1.65; color: var(--text); box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 6px var(--sl); }
.explain b { color: var(--accent); }

/* 次へ ボタン */
.next-row { margin-top: 18px; display: flex; justify-content: flex-end; }
.next-btn { padding: 12px 22px; border-radius: 20px; font-size: 14px; font-weight: 800; border: none; background: var(--accent); color: white; cursor: pointer; font-family: inherit; box-shadow: 5px 5px 12px var(--sd), -3px -3px 10px var(--sl); }
.next-btn:active { transform: scale(0.97); }

/* リトライバッジ */
.retry-tag { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: rgba(176,71,64,0.16); color: var(--incorrect); margin-left: 8px; letter-spacing: 0.08em; }

/* 結果画面 */
.result { text-align: center; padding: 30px 20px; }
.result-score { font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; }
.result-score .total { font-size: 28px; color: var(--text2); font-weight: 700; }
.result-lbl { font-size: 12px; color: var(--text2); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 6px; }
.result-msg { margin: 20px 0; font-size: 14px; font-weight: 600; color: var(--text); }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.result-actions .pill { padding: 12px 22px; font-size: 13px; font-weight: 800; color: var(--text); }
.result-actions .primary { background: var(--accent); color: white; }

/* ホーム画面 (モード選択) */
.home-stat { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 6px 0 18px; }
.home-stat .num { font-size: 28px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.02em; text-align: center; }
.home-stat .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-top: 4px; text-align: center; }
.mode-btn { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 18px; border: none; background: var(--bg); cursor: pointer; font-family: inherit; text-align: left; box-shadow: 6px 6px 14px var(--sd), -4px -4px 12px var(--sl); margin-bottom: 12px; width: 100%; color: var(--text); }
.mode-btn:active { transform: scale(0.98); box-shadow: inset 4px 4px 10px var(--sd), inset -3px -3px 8px var(--sl); }
.mode-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.mode-btn .micon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(14,116,144,0.18); flex-shrink: 0; }
.mode-btn .micon .icon { font-size: 24px; color: var(--accent); vertical-align: 0; }
.mode-btn .mlbl { flex: 1; min-width: 0; }
.mode-btn .mname { font-size: 15px; font-weight: 800; }
.mode-btn .msub { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 2px; }

/* 成績画面 */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 0 16px; }
.stats-cell { padding: 14px; border-radius: 14px; background: rgba(154,160,184,0.1); box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 6px var(--sl); }
.stats-cell .num { font-size: 26px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
.stats-cell .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-top: 4px; }
.weak-list { display: flex; flex-direction: column; gap: 6px; }
.weak-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(154,160,184,0.08); font-size: 12px; }
.weak-q { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weak-rate { font-size: 11px; font-weight: 800; color: var(--incorrect); white-space: nowrap; }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
</style>
</head>

</div>

  },
  {

  },

    answer: 0,
    cat: "生態",
    wikiTitle: "Scalloped_hammerhead",
    explain: "<b>シュモクザメ</b> (特にアカシュモクザメ Sphyrna lewini) は日中に数百匹の群れを作る。理由は完全には未解明 (繁殖・回遊集結説など)。",
  },
  {
    q: "発光器官を持つ深海サメ「カラスザメ科」(Etmopteridae) の主な発光の用途は?",
    choices: ["カウンターイルミネーション (腹を光らせて影を消す)", "求愛", "獲物を眩しさで麻痺", "光合成"],
    answer: 0,
    cat: "解剖",
    explain: "上から差す光に合わせて腹を発光させ、下から見たときに影を消す <b>カウンターイルミネーション</b>。深海捕食者の代表的擬態。",
  },

// セッション設定
// ─────────────────────────────
const SESSION_LEN = 10;   // 1 セッション当たりの出題数

// ─────────────────────────────
// State
// ─────────────────────────────
let currentScreen = "home";   // "home" | "quiz" | "result" | "stats"
let currentMode = "normal";   // "normal" | "review"
let queue = [];
let wrongOnceSet = null;
let attempts = 0;
let correct = 0;
let curIdx = null;
let curShuffle = null;        // { choices, answerIdx } — 表示用にシャッフルした選択肢
let answered = false;
let sessionResults = [];      // [{ id, correct }]
// 累積進捗 (Firestore と同期)
let progress = { totalSessions: 0, totalCorrect: 0, totalAttempts: 0, perQuestion: {} };
let db = null, progressDocRef = null, unsubscribeProgress = null;

const $ = (id) => document.getElementById(id);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleChoices(q) {
  // 表示順をランダムにして、新しい順序での正解 index を返す
  const order = shuffle(q.choices.map((_, i) => i));
  return {
    choices: order.map((i) => q.choices[i]),
    answerIdx: order.indexOf(q.answer),
  };
}

// 問題に安定 id を付与 (q + choices のハッシュ)。Firestore キーとして使用。
// 問題文を編集すると新しい id になる (= 旧成績が引き継がれない) ので注意。
async function ensureQuestionIds() {
  for (const q of QUESTIONS) {
    if (q.id) continue;
    const buf = new TextEncoder().encode(q.q + "|" + q.choices.join("|"));
    const hash = await crypto.subtle.digest("SHA-1", buf);
    q.id = Array.from(new Uint8Array(hash)).slice(0, 5)
      .map((b) => b.toString(16).padStart(2, "0")).join("");
  }
}

// ─────────────────────────────
// Firestore: 進捗保存
// ─────────────────────────────
async function setupFirestoreProgress() {
  const auth = getFbAuth();
  if (!auth?.currentUser) return;
  if (db) return;
  try {
    db = getFirestore(auth.app);
    progressDocRef = doc(db, "shark_progress", auth.currentUser.uid);
    unsubscribeProgress = onSnapshot(progressDocRef, (snap) => {
      if (snap.exists()) {
        const d = snap.data();
        progress = {
          totalSessions: d.totalSessions || 0,
          totalCorrect: d.totalCorrect || 0,
          totalAttempts: d.totalAttempts || 0,
          perQuestion: d.perQuestion || {},
        };
      }
      // ホームが表示中なら統計を再描画
      if (currentScreen === "home") showHome();
      else if (currentScreen === "stats") showStats();
    }, (err) => console.warn("[shark] subscription error:", err?.message || err));
  } catch (e) {
    console.warn("[shark] setupFirestoreProgress failed:", e?.message || e);
  }
}

async function saveSessionResult() {
  // ローカル先反映 (snapshot 待ちで UI が古いまま見えるのを防ぐ)
  const newPerQ = { ...progress.perQuestion };
  for (const r of sessionResults) {
    const pq = newPerQ[r.id] || { tries: 0, correct: 0 };
    pq.tries += 1;
    if (r.correct) pq.correct += 1;
    else pq.lastWrong = Date.now();
    newPerQ[r.id] = pq;
  }
  progress = {
    totalSessions: progress.totalSessions + 1,
    totalCorrect: progress.totalCorrect + correct,
    totalAttempts: progress.totalAttempts + attempts,
    perQuestion: newPerQ,
  };
  if (!progressDocRef) return;
  try {
    await setDoc(progressDocRef, {
      totalSessions: progress.totalSessions,
      totalCorrect: progress.totalCorrect,
      totalAttempts: progress.totalAttempts,
      perQuestion: progress.perQuestion,
      lastUpdated: serverTimestamp(),
    }, { merge: true });
  } catch (e) {
    console.warn("[shark] save failed:", e?.message || e);
  }
}

function getReviewPool() {
  const out = [];
  for (let i = 0; i < QUESTIONS.length; i++) {
    const pq = progress.perQuestion[QUESTIONS[i].id];
    if (pq && pq.correct < pq.tries) out.push(i);
  }
  return out;
}

// ─────────────────────────────
// 画面: ホーム / クイズ / 結果 / 成績
// ─────────────────────────────
function showHome() {
  currentScreen = "home";
  const pct = progress.totalAttempts > 0
    ? Math.round((progress.totalCorrect / progress.totalAttempts) * 100) : 0;
  const reviewPool = getReviewPool();
  $("subtitle").textContent = "モードを選んでスタート。";
  $("quizArea").innerHTML = `
    <div class="card">
      <div class="home-stat">
        <div><div class="num">${progress.totalSessions}</div><div class="lbl">SESSION</div></div>
        <div><div class="num">${pct}%</div><div class="lbl">ACCURACY</div></div>
        <div><div class="num">${QUESTIONS.length}</div><div class="lbl">QUESTIONS</div></div>
      </div>
      <button class="mode-btn" data-mode="normal" type="button">
        <span class="micon"><span class="icon">school</span></span>
        <span class="mlbl">
          <div class="mname">通常モード</div>
          <div class="msub">全 ${QUESTIONS.length} 問からランダムに ${SESSION_LEN} 問</div>
        </span>
      </button>
      <button class="mode-btn" data-mode="review" type="button" ${reviewPool.length === 0 ? "disabled" : ""}>
        <span class="micon"><span class="icon">replay</span></span>
        <span class="mlbl">
          <div class="mname">復習モード</div>
          <div class="msub">${reviewPool.length === 0 ? "まだ間違えた問題はありません" : `過去に間違えた ${reviewPool.length} 問から出題`}</div>
        </span>
      </button>
      <button class="mode-btn" data-mode="stats" type="button">
        <span class="micon"><span class="icon">leaderboard</span></span>
        <span class="mlbl">
          <div class="mname">成績</div>
          <div class="msub">累計正答率 / 苦手問題リスト</div>
        </span>
      </button>
    </div>
  `;
  document.querySelectorAll(".mode-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const m = btn.dataset.mode;
      if (m === "stats") showStats();
      else startSession(m);
    });
  });
}

function showStats() {
  currentScreen = "stats";
  const pct = progress.totalAttempts > 0
    ? Math.round((progress.totalCorrect / progress.totalAttempts) * 100) : 0;
  // 苦手 top 10: tries > 0 で誤答率の高い順
  const weak = QUESTIONS.map((q) => {
    const pq = progress.perQuestion[q.id] || { tries: 0, correct: 0 };
    if (pq.tries === 0) return null;
    return { q, pq, errRate: 1 - (pq.correct / pq.tries) };
  }).filter(Boolean).sort((a, b) => b.errRate - a.errRate || b.pq.tries - a.pq.tries).slice(0, 10);
  $("subtitle").textContent = "これまでの成績。端末をまたいで同期します。";
  $("quizArea").innerHTML = `
    <div class="card">
      <div class="stats-grid">
        <div class="stats-cell"><div class="num">${progress.totalSessions}</div><div class="lbl">セッション</div></div>
        <div class="stats-cell"><div class="num">${pct}%</div><div class="lbl">累計正答率</div></div>
        <div class="stats-cell"><div class="num">${progress.totalCorrect}</div><div class="lbl">正解</div></div>
        <div class="stats-cell"><div class="num">${progress.totalAttempts}</div><div class="lbl">回答数</div></div>
      </div>
      ${weak.length > 0 ? `
        <div style="font-size:11px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2);margin:8px 0;">苦手な問題</div>
        <div class="weak-list">
          ${weak.map((w) => `
            <div class="weak-row">
              <div class="weak-q">${escapeHtml(w.q.q)}</div>
              <div class="weak-rate">${w.pq.correct}/${w.pq.tries}</div>
            </div>
          `).join("")}
        </div>
      ` : `<div style="text-align:center;color:var(--text2);padding:24px;font-size:13px;font-weight:600;">まだ回答履歴がありません</div>`}
      <div style="margin-top:18px;text-align:center;">
        <button class="pill" id="statsHomeBtn" type="button"><span class="icon">arrow_back</span> ホームへ</button>
      </div>
    </div>
  `;
  $("statsHomeBtn").addEventListener("click", showHome);
}

function startSession(mode = "normal") {
  currentMode = mode;
  const sourcePool = mode === "review" ? getReviewPool() : QUESTIONS.map((_, i) => i);
  if (sourcePool.length === 0) {
    showHome();
    return;
  }
  // SESSION_LEN を満たすまでサンプリング (プールが少なければ繰り返し)
  const shuffled = shuffle(sourcePool);
  queue = [];
  while (queue.length < SESSION_LEN) queue.push(...shuffled);
  queue = queue.slice(0, SESSION_LEN);
  wrongOnceSet = new Set();
  attempts = 0;
  correct = 0;
  curIdx = null;
  curShuffle = null;
  answered = false;
  sessionResults = [];
  currentScreen = "quiz";
  $("subtitle").textContent = mode === "review"
    ? "復習モード: 間違えた問題だけ。"
    : "4 択クイズ。10 問 1 セッション。";
  nextQuestion();
}

function nextQuestion() {
  if (attempts >= SESSION_LEN || queue.length === 0) {
    showResult();
    return;
  }
  curIdx = queue.shift();
  curShuffle = shuffleChoices(QUESTIONS[curIdx]);
  answered = false;
  render();
}

function render() {
  const q = QUESTIONS[curIdx];
  const sh = curShuffle;
  const progressPct = Math.round((attempts / SESSION_LEN) * 100);
  const isRetry = wrongOnceSet.has(curIdx);
  $("quizArea").innerHTML = `
    <div class="progress-row">
      <span>${attempts} / ${SESSION_LEN}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <span>正解 ${correct}</span>
    </div>
    <div class="card">
      ${q.cat ? `<span class="cat-tag">${q.cat}</span>${isRetry ? `<span class="retry-tag">RETRY</span>` : ""}` : ""}
      ${q.img ? `<div class="q-img-wrap"><img class="q-img" src="${q.img}" alt=""></div>` : ""}
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="choices">
        ${sh.choices.map((c, i) => `<button class="choice" data-i="${i}" type="button">${escapeHtml(c)}</button>`).join("")}
      </div>
      <div id="explainSlot"></div>
      <div class="next-row" id="nextRow" style="display:none;">
        <button class="next-btn" id="nextBtn" type="button">次へ <span class="icon">arrow_forward</span></button>
      </div>
    </div>
  `;
  document.querySelectorAll(".choice").forEach((btn) => {
    btn.addEventListener("click", () => onAnswer(Number(btn.dataset.i)));
  });
  $("nextBtn")?.addEventListener("click", nextQuestion);
}

function onAnswer(picked) {
  if (answered) return;
  answered = true;
  attempts++;
  const q = QUESTIONS[curIdx];
  const sh = curShuffle;
  const isCorrect = picked === sh.answerIdx;
  if (isCorrect) correct++;
  sessionResults.push({ id: q.id, correct: isCorrect });
  // ボタンの色付け (シャッフル後の index で比較)
  document.querySelectorAll(".choice").forEach((btn) => {
    const i = Number(btn.dataset.i);
    btn.disabled = true;
    if (i === sh.answerIdx) btn.classList.add("correct");
    else if (i === picked) btn.classList.add("incorrect");
    else btn.classList.add("dim");
  });
  if (q.explain) {
    $("explainSlot").innerHTML = `<div class="explain">${q.explain}</div>`;
  }
  if (!isCorrect) {
    wrongOnceSet.add(curIdx);
    const remaining = SESSION_LEN - attempts;
    if (remaining > 0) {
      const insertAt = Math.min(2, queue.length);
      queue.splice(insertAt, 0, curIdx);
    }
  }
  $("nextRow").style.display = "flex";
}

async function showResult() {
  currentScreen = "result";
  await saveSessionResult();
  const pct = Math.round((correct / SESSION_LEN) * 100);
  const msg = pct >= 80 ? "上出来。"
            : pct >= 50 ? "半分以上。間違えたとこ復習しよう。"
            : "また回そう。間違えてる方が脳に残る。";
  const reviewPool = getReviewPool();
  $("quizArea").innerHTML = `
    <div class="card result">
      <div class="result-score">${correct}<span class="total"> / ${SESSION_LEN}</span></div>
      <div class="result-lbl">SCORE</div>
      <div class="result-msg">${msg}</div>
      <div class="result-actions">
        <button class="pill primary" id="againBtn" type="button"><span class="icon">replay</span> もう一回</button>
        ${reviewPool.length > 0 ? `<button class="pill" id="reviewBtn" type="button"><span class="icon">school</span> 復習へ</button>` : ""}
        <button class="pill" id="resultHomeBtn" type="button"><span class="icon">home</span> ホーム</button>
      </div>
    </div>
  `;
  $("againBtn").addEventListener("click", () => startSession(currentMode));
  $("reviewBtn")?.addEventListener("click", () => startSession("review"));
  $("resultHomeBtn").addEventListener("click", showHome);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ホームボタン (クイズ中なら確認)
$("homeBtn").addEventListener("click", () => {
  if (currentScreen === "quiz" && !confirm("途中で抜けますか? 結果は記録されません。")) return;
  showHome();
});

async function fetchWikiThumb(title, timeoutMs = 5000) {
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), timeoutMs);
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!r.ok) return null;
    const j = await r.json();
    return j.thumbnail?.source || j.originalimage?.source || null;
  } catch { return null; }
}

async function preloadWikiThumbs() {
  const tasks = QUESTIONS.filter((q) => !q.img && q.wikiTitle).map(async (q) => {
    const url = await fetchWikiThumb(q.wikiTitle);
    if (url) q.img = url;
  });
  await Promise.all(tasks);
}

initAuthBoot({
  returnPath: "/shark/",
  onReady: async () => {
    $("app").style.display = "";
    $("quizArea").innerHTML = '<div class="card" style="text-align:center;padding:50px;color:var(--text2);font-weight:700;">読み込み中…</div>';
    await Promise.all([
      ensureQuestionIds(),
      preloadWikiThumbs(),
      setupFirestoreProgress(),
    ]);
    showHome();
  },
});
</script>
