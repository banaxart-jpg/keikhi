<!DOCTYPE html>
<html lang="ja">
<!-- スプレッドシート：Google スプレッドシート風の表計算。データはこの端末 (localStorage) に保存 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シート">
<link rel="apple-touch-icon" href="/icon.png">
<title>スプレッドシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f8f9fa; --panel: #ffffff; --line: #e2e3e3; --head: #f8f9fa; --head-on: #d3e3fd;
  --text: #1f1f1f; --text2: #5f6368; --text3: #9aa0a6;
  --accent: #0b8043; --sel: #1a73e8; --sel-bg: rgba(26,115,232,0.10);
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; }

#app { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

/* ── ヘッダー ── */
.top { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; background: var(--panel); }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none; }
.book-name { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-size: 17px; font-weight: 600; font-family: inherit; background: transparent; color: var(--text); }
.book-name:hover { border-color: var(--line); }
.book-name:focus { outline: none; border-color: var(--sel); background: #fff; }
.ibtn { width: 34px; height: 34px; border: none; background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.ibtn:hover { background: #f1f3f4; }
.ibtn:active { background: #e8eaed; }
.ibtn.on { background: var(--head-on); color: #0b57d0; }
.ibtn:disabled { opacity: 0.35; cursor: default; }

/* ── ツールバー ── */
.toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; margin: 0 8px 6px; background: #edf2fa; border-radius: 22px; overflow-x: auto; flex-shrink: 0; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .ibtn { width: 30px; height: 30px; border-radius: 6px; }
.toolbar .ibtn .icon { font-size: 19px; }
.sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; flex-shrink: 0; }
.color-btn { position: relative; }
.color-btn .bar { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 1px; }

/* ── 数式バー ── */
.fbar { display: flex; align-items: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
.namebox { width: 78px; border: none; border-right: 1px solid var(--line); padding: 7px 8px; font-size: 13px; font-family: inherit; color: var(--text); background: transparent; text-align: center; }
.namebox:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 2px var(--sel); }
.fx { color: var(--text3); font-style: italic; font-weight: 700; padding: 0 8px; font-size: 13px; font-family: Georgia, serif; }
.finput { flex: 1; min-width: 0; border: none; padding: 7px 8px; font-size: 14px; font-family: inherit; background: transparent; color: var(--text); }
.finput:focus { outline: none; }

/* ── グリッド ── */
.grid-wrap { flex: 1; overflow: auto; position: relative; background: #fff; overscroll-behavior: contain; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; position: relative; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 23px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--head); color: var(--text2); font-weight: 400; font-size: 11px; text-align: center; border-bottom-color: #c4c7c5; user-select: none; -webkit-user-select: none; cursor: default; }
.grid tbody th { position: sticky; left: 0; z-index: 2; background: var(--head); color: var(--text2); font-weight: 400; font-size: 11px; text-align: center; border-right-color: #c4c7c5; user-select: none; -webkit-user-select: none; }
.grid thead th.corner { left: 0; z-index: 4; }
.grid th.on { background: var(--head-on); color: #0b57d0; font-weight: 700; }
.grid { -webkit-touch-callout: none; }
.grid td { background: #fff; cursor: cell; user-select: none; -webkit-user-select: none; line-height: 22px; }
.grid td.num { text-align: right; }
.grid td.bool, .grid td.err { text-align: center; }
.grid td.err { color: #d93025; }
.grid td.in { background-image: linear-gradient(var(--sel-bg), var(--sel-bg)); }
.col-resize { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; touch-action: none; }

/* 選択枠 */
.sel-box { position: absolute; border: 1px solid var(--sel); pointer-events: none; z-index: 1; display: none; }
.act-box { position: absolute; border: 2px solid var(--sel); pointer-events: none; z-index: 1; display: none; }
.fill-handle { position: absolute; width: 9px; height: 9px; background: var(--sel); border: 1.5px solid #fff; border-radius: 2px; z-index: 2; cursor: crosshair; display: none; touch-action: none; }
.fill-box { position: absolute; border: 1px dashed #5f6368; pointer-events: none; z-index: 1; display: none; }
.ref-box { position: absolute; border: 2px dashed #e37400; background: rgba(227,116,0,0.06); pointer-events: none; z-index: 1; display: none; }
.cell-editor { position: absolute; z-index: 6; border: 2px solid var(--sel); padding: 0 3px; font-family: inherit; font-size: 13px; line-height: 19px; background: #fff; color: var(--text); outline: none; resize: none; overflow: hidden; white-space: pre; box-shadow: 0 2px 6px rgba(60,64,67,0.3); }
.cell-editor.hidden { opacity: 0; pointer-events: none; width: 1px !important; height: 1px !important; border: none; box-shadow: none; }

/* 行追加 */
.more-rows { padding: 12px 0 30px 50px; }
.more-rows button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text2); display: inline-flex; align-items: center; gap: 4px; }

/* ── 下：シートタブ + 集計 ── */
.bottom { display: flex; align-items: center; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); gap: 4px; flex-shrink: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: none; background: transparent; padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--text2); display: flex; align-items: center; gap: 2px; }
.tab:hover { background: #f1f3f4; }
.tab.on { background: #e1e9f7; color: #0b57d0; font-weight: 700; }
.tab .icon { font-size: 16px; }
.stat { font-size: 12px; color: var(--text2); white-space: nowrap; padding: 0 6px; cursor: pointer; flex-shrink: 0; }

/* ── ポップアップメニュー ── */
.menu { position: fixed; z-index: 30; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(60,64,67,0.28); padding: 6px 0; min-width: 200px; max-height: 70vh; overflow-y: auto; display: none; }
.menu.open { display: block; }
.menu .mi { display: flex; align-items: center; gap: 12px; width: 100%; border: none; background: transparent; padding: 9px 16px; font-size: 14px; cursor: pointer; text-align: left; }
.menu .mi:hover { background: #f1f3f4; }
.menu .mi .icon { color: var(--text2); font-size: 19px; }
.menu .mi.danger { color: #c5221f; }
.menu .mi.danger .icon { color: #c5221f; }
.menu .mi.cur { font-weight: 700; color: #0b57d0; }
.menu .mi .sub { margin-left: auto; color: var(--text3); font-size: 12px; }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
.menu .mlabel { font-size: 11px; color: var(--text3); padding: 6px 16px 2px; font-weight: 700; letter-spacing: 0.05em; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 6px; padding: 8px 14px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; }
.sw.none { background: #fff; position: relative; }
.sw.none::after { content: ''; position: absolute; left: 10px; top: -2px; bottom: -2px; width: 1.5px; background: #d93025; transform: rotate(45deg); }
.menu-back { position: fixed; inset: 0; z-index: 29; display: none; }
.menu-back.open { display: block; }

.sync { color: var(--text3); font-size: 20px; padding: 0 4px; flex-shrink: 0; }
.sync.err { color: #d93025; }
.loading { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 14px; padding: 24px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 40; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="logo" href="/" title="ランチャーへ"><span class="icon">table_view</span></a>
    <input class="book-name" id="bookName" spellcheck="false">
    <span class="icon sync" id="sync" title="保存済み">cloud_done</span>
    <button class="ibtn" id="btnFile" title="ファイル"><span class="icon">folder_open</span></button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="ibtn" data-act="undo" title="元に戻す (Ctrl+Z)"><span class="icon">undo</span></button>
    <button class="ibtn" data-act="redo" title="やり直す (Ctrl+Y)"><span class="icon">redo</span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="fmt" title="表示形式"><span class="icon">123</span></button>
    <button class="ibtn" data-act="fmt-yen" title="通貨 (円)"><span class="icon">currency_yen</span></button>
    <button class="ibtn" data-act="fmt-pct" title="パーセント"><span class="icon">percent</span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="b" title="太字 (Ctrl+B)"><span class="icon">format_bold</span></button>
    <button class="ibtn" data-act="i" title="斜体 (Ctrl+I)"><span class="icon">format_italic</span></button>
    <button class="ibtn" data-act="s" title="取り消し線"><span class="icon">strikethrough_s</span></button>
    <button class="ibtn color-btn" data-act="fc" title="文字の色"><span class="icon">format_color_text</span><span class="bar" id="fcBar" style="background:#1f1f1f"></span></button>
    <button class="ibtn color-btn" data-act="bg" title="塗りつぶしの色"><span class="icon">format_color_fill</span><span class="bar" id="bgBar" style="background:#fff;outline:1px solid #ccc"></span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="al" title="配置"><span class="icon" id="alIcon">format_align_left</span></button>
    <button class="ibtn" data-act="sum" title="関数"><span class="icon">functions</span></button>
    <button class="ibtn" data-act="clear" title="書式をクリア"><span class="icon">format_clear</span></button>
  </div>

  <div class="fbar">
    <input class="namebox" id="nameBox" spellcheck="false">
    <span class="fx">fx</span>
    <input class="finput" id="fInput" spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>

  <div class="grid-wrap" id="gridWrap">
    <table class="grid" id="grid"></table>
    <div class="sel-box" id="selBox"></div>
    <div class="act-box" id="actBox"></div>
    <div class="fill-box" id="fillBox"></div>
    <div class="ref-box" id="refBox"></div>
    <div class="fill-handle" id="fillHandle"></div>
    <textarea class="cell-editor hidden" id="cellEditor" spellcheck="false" autocomplete="off" autocapitalize="off" rows="1"></textarea>
    <div class="more-rows"><button id="btnMoreRows"><span class="icon">add</span>行を 50 行追加</button></div>
  </div>

  <div class="bottom">
    <button class="ibtn" id="btnAddSheet" title="シートを追加"><span class="icon">add</span></button>
    <div class="tabs" id="tabs"></div>
    <div class="stat" id="stat"></div>
  </div>
</div>

<div class="loading" id="loading">読み込み中…</div>
<div id="signinOverlay" style="display:none;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:16px;">
  <div style="font-size:22px;font-weight:700;">スプレッドシート</div>
  <div style="font-size:13px;color:var(--text2);">トップでログインしてください</div>
  <a href="/" style="padding:10px 22px;border-radius:20px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;">トップに戻る</a>
  <div id="signinErr" style="font-size:11px;color:#b04040;max-width:340px;white-space:pre-wrap;"></div>
</div>
<div class="menu-back" id="menuBack"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<input type="file" id="csvFile" accept=".csv,.tsv,text/csv,text/plain" style="display:none">

<script src="/config.js"></script>
<script type="module">
// 数式エンジンは keihi-api が配る /sheet-engine.js (サーバー側で AI が MCP で読むときと同じファイル) を使う。
// データは keihi-api の /api/sheet/books (Cloud SQL)。社内で共有、AI も sheet_* ツールで同じファイルを読み書きする。
import { initAuthBoot, api } from "/api-auth.js";
const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
let ENG;
try { ENG = await import(API_BASE + "/sheet-engine.js?v=" + encodeURIComponent(window.APP_VERSION || "dev")); }
catch (e) { document.getElementById("loading").textContent = "読み込めませんでした。少し待ってから再読み込みしてください (" + e.message + ")"; throw e; }
const { colName, colIndex, key, parseKey, uid, clone, newSheet, setRaw, DEF_W, DEF_ROWS, DEF_COLS, isErr, parseLiteral, cmp, shiftFormula, fmtValue, FORMATS } = ENG;

// ═══════════════════════════════════════════════
//  ユーティリティ
// ═══════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const isTouch = () => matchMedia("(pointer: coarse)").matches;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// ═══════════════════════════════════════════════
//  データ (サーバーと同期)
//  cur  = 開いているファイル (画面で編集する実体)
//  base = 最後にサーバーと揃った状態。保存は base との差分だけ送る → AI や他の人の編集と消し合わない
// ═══════════════════════════════════════════════
let books = [];
let cur = null, base = null;
let dirty = false, inflight = false, editSeq = 0, saveTimer = null;

const book = () => cur;
const sheet = () => cur.sheets.find((s) => s.id === cur.active) || cur.sheets[0];
const calc = ENG.createCalc(() => (cur ? cur.sheets : []));
const findSheetByName = (name) => calc.findSheet(name);
const cellValue = (sh, c, r) => calc.value(sh, c, r);
const invalidate = () => calc.invalidate();
function setActive(id) { cur.active = id; lsSet("sheet.active." + cur.id, id); }

function setSync(state) {
  const el = $("sync");
  el.textContent = { ok: "cloud_done", saving: "sync", err: "cloud_off" }[state];
  el.title = { ok: "保存済み", saving: "保存中…", err: "保存できていません (自動で再試行します)" }[state];
  el.classList.toggle("err", state === "err");
}
function save() {
  if (!cur) return;
  dirty = true; editSeq++; setSync("saving");
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!cur || inflight) return;
  const diff = ENG.diffBook(base, cur), nameCh = cur.name !== base.name;
  if (!diff && !nameCh) { dirty = false; setSync("ok"); return; }
  inflight = true;
  const seq = editSeq, sent = clone({ sheets: cur.sheets }), sentName = cur.name, id = cur.id;
  try {
    const r = await api("PATCH", "/api/sheet/books/" + id, { diff, name: nameCh ? cur.name : undefined });
    if (!cur || cur.id !== id) return;
    // 送っている間に打った分は、サーバーの最新に重ね直す
    adopt(r, seq === editSeq ? null : ENG.diffBook(sent, cur), cur.name !== sentName);
    if (seq === editSeq) { dirty = false; setSync("ok"); }
    else { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
  } catch (e) {
    setSync("err");
    clearTimeout(saveTimer); saveTimer = setTimeout(flush, 5000);
  } finally { inflight = false; }
}
// サーバーの最新 r を取り込む。pending = まだ送っていない手元の編集 (差分)
function adopt(r, pending, keepName) {
  const layout = () => { const s = sheet(); return JSON.stringify([s.id, s.rows, s.cols, s.colW]); };
  base = { name: r.name, sheets: clone(r.data.sheets) };
  cur.version = r.version;
  if (!keepName) { cur.name = r.name; if (document.activeElement !== $("bookName")) $("bookName").value = r.name; document.title = r.name; }
  const next = pending ? ENG.applyDiff(clone(r.data), pending).sheets : clone(r.data.sheets);
  if (JSON.stringify(next) === JSON.stringify(cur.sheets)) return false;
  const before = layout();
  cur.sheets = next;
  if (!cur.sheets.some((s) => s.id === cur.active)) cur.active = cur.sheets[0].id;
  undoStack = []; redoStack = []; // 他の人の変更が入ったので、元に戻すで消してしまわないように
  if (layout() !== before) buildGrid(); else renderCells();
  renderTabs();
  return true;
}
// 数秒おきに更新を見る (AI や他の人が書いたら取り込む)
async function poll() {
  if (!cur || inflight || dirty || editing || drag || document.hidden) return;
  const id = cur.id;
  try {
    const r = await api("GET", `/api/sheet/books/${id}?v=${cur.version}`);
    if (r.unchanged || !cur || cur.id !== id || inflight || dirty || editing || drag) return;
    if (adopt(r, null) && r.updated_by) toast(`${r.updated_by === "AI" ? "AI" : r.updated_by.split("@")[0]} が更新しました`);
  } catch (e) {}
}
setInterval(poll, 4000);
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (dirty) flush(); } else poll(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { flush(); e.preventDefault(); e.returnValue = ""; } });
// ═══════════════════════════════════════════════
//  状態
// ═══════════════════════════════════════════════
let act = { c: 0, r: 0 };          // アクティブセル
let anchor = { c: 0, r: 0 };       // 範囲選択の起点
let selEnd = { c: 0, r: 0 };       // 範囲選択の終点
let editing = false;               // セル編集中
let editFromBar = false;           // 数式バーで編集中
let editOrig = "";
let undoStack = [], redoStack = [];
let clip = null;                   // 内部クリップボード

const selRect = () => ({ c1: Math.min(anchor.c, selEnd.c), r1: Math.min(anchor.r, selEnd.r), c2: Math.max(anchor.c, selEnd.c), r2: Math.max(anchor.r, selEnd.r) });

function pushUndo() {
  undoStack.push({ sheetId: sheet().id, data: clone(sheet()), act: { ...act }, anchor: { ...anchor }, selEnd: { ...selEnd } });
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
}
function applySnap(from, to) {
  const b = book(); const snap = from.pop(); if (!snap) return;
  const i = b.sheets.findIndex((s) => s.id === snap.sheetId); if (i < 0) return;
  to.push({ sheetId: snap.sheetId, data: clone(b.sheets[i]), act: { ...act }, anchor: { ...anchor }, selEnd: { ...selEnd } });
  b.sheets[i] = snap.data; b.active = snap.sheetId;
  act = snap.act; anchor = snap.anchor; selEnd = snap.selEnd;
  invalidate(); save(); buildGrid(); renderTabs();
}
const undo = () => { if (editing) return; applySnap(undoStack, redoStack); };
const redo = () => { if (editing) return; applySnap(redoStack, undoStack); };

function setStyle(fn) {
  pushUndo();
  const sh = sheet(), { c1, r1, c2, r2 } = selRect();
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    const k = key(c, r); const cell = sh.cells[k] || {}; cell.s = cell.s || {};
    fn(cell.s, c, r);
    for (const p in cell.s) if (cell.s[p] === undefined || cell.s[p] === "" || cell.s[p] === false) delete cell.s[p];
    if (!Object.keys(cell.s).length) delete cell.s;
    if (cell.v === undefined && !cell.s) delete sh.cells[k]; else sh.cells[k] = cell;
  }
  save(); renderCells(); updateToolbar();
}

// ═══════════════════════════════════════════════
//  グリッド描画
// ═══════════════════════════════════════════════
const gridEl = $("grid"), wrap = $("gridWrap");
let tdMap = []; // [r][c] -> td
let thCols = [], thRows = [];

function buildGrid() {

  let html = "<colgroup><col style='width:46px'>";
  for (let c = 0; c < sh.cols; c++) html += `<col style="width:${sh.colW[c] || DEF_W}px">`;
  html += "</colgroup><thead><tr><th class='corner'></th>";
  for (let c = 0; c < sh.cols; c++) html += `<th data-c="${c}">${colName(c)}<div class="col-resize" data-c="${c}"></div></th>`;
  html += "</tr></thead><tbody>";
  for (let r = 0; r < sh.rows; r++) {
    html += `<tr><th data-r="${r}">${r + 1}</th>`;
    for (let c = 0; c < sh.cols; c++) html += `<td data-c="${c}" data-r="${r}"></td>`;
    html += "</tr>";
  }
  html += "</tbody>";
  gridEl.innerHTML = html;
  gridEl.style.width = (46 + Array.from({ length: sh.cols }, (_, c) => sh.colW[c] || DEF_W).reduce((a, b) => a + b, 0)) + "px";
  tdMap = []; const rows = gridEl.tBodies[0].rows;
  thRows = [];
  for (let r = 0; r < sh.rows; r++) { const tr = rows[r]; thRows.push(tr.cells[0]); tdMap.push(Array.from(tr.cells).slice(1)); }
  thCols = Array.from(gridEl.tHead.rows[0].cells).slice(1);

function clampSel() {

function renderCells() {
  invalidate();

  for (let r = 0; r < sh.rows; r++) for (let c = 0; c < sh.cols; c++) {
    const td = tdMap[r][c]; const cell = sh.cells[key(c, r)];
    if (!cell) { if (td._d) { td.textContent = ""; td.className = ""; td.removeAttribute("style"); td._d = 0; } continue; }
    const v = cellValue(sh, c, r); const s = cell.s || {};
    let cls = "";
    if (isErr(v)) cls = "err"; else if (typeof v === "number" && s.fmt !== "plain") cls = "num"; else if (typeof v === "boolean") cls = "bool";
    td.className = cls;
    td.textContent = fmtValue(v, s.fmt);
    let st = "";
    if (s.b) st += "font-weight:700;";
    if (s.i) st += "font-style:italic;";
    if (s.st) st += "text-decoration:line-through;";
    if (s.fc) st += `color:${s.fc};`;
    if (s.bg) st += `background-color:${s.bg};`;
    if (s.al) st += `text-align:${s.al};`;
    td.setAttribute("style", st);
    td._d = 1;
  }

}

function cellRect(c, r) { const td = tdMap[r] && tdMap[r][c]; if (!td) return null; return { x: td.offsetLeft, y: td.offsetTop, w: td.offsetWidth, h: td.offsetHeight }; }

function place(el, rc, inset = 0) { if (!rc) { el.style.display = "none"; return; } el.style.display = "block"; el.style.left = rc.x - 1 + inset + "px"; el.style.top = rc.y - 1 + inset + "px"; el.style.width = rc.w + 1 - inset * 2 + "px"; el.style.height = rc.h + 1 - inset * 2 + "px"; }

let prevIn = [];
function renderSel() {
  const { c1, r1, c2, r2 } = selRect();
  prevIn.forEach((td) => td.classList.remove("in")); prevIn = [];
  thCols.forEach((th) => th.classList.remove("on")); thRows.forEach((th) => th.classList.remove("on"));
  const multi = c1 !== c2 || r1 !== r2;
  if (multi) for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { if (c === act.c && r === act.r) continue; const td = tdMap[r][c]; td.classList.add("in"); prevIn.push(td); }
  for (let c = c1; c <= c2; c++) thCols[c] && thCols[c].classList.add("on");
  for (let r = r1; r <= r2; r++) thRows[r] && thRows[r].classList.add("on");
  place($("selBox"), multi ? boxRect(c1, r1, c2, r2) : null);

  if (br && !editing) { fh.style.display = "block"; fh.style.left = br.x + br.w - 5 + "px"; fh.style.top = br.y + br.h - 5 + "px"; } else fh.style.display = "none";
  $("nameBox").value = multi ? `${key(c1, r1)}:${key(c2, r2)}` : key(act.c, act.r);
  if (!editing) { const cell = sheet().cells[key(act.c, act.r)]; $("fInput").value = cell && cell.v != null ? cell.v : ""; }

}
function renderStat() {
  const { c1, r1, c2, r2 } = selRect();
  const el = $("stat");
  if (c1 === c2 && r1 === r2) { el.textContent = ""; return; }
  const sh = sheet(); let sum = 0, n = 0, cnt = 0;
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) { const v = cellValue(sh, c, r); if (v != null && v !== "") cnt++; if (typeof v === "number") { sum += v; n++; } }
  const modes = n ? [["合計", fmtValue(sum, "num")], ["平均", fmtValue(sum / n, "num")], ["カウント", String(cnt)]] : [["カウント", String(cnt)]];

$("stat").onclick = () => { renderStat.mode = (renderStat.mode || 0) + 1; renderStat(); };

function scrollIntoCell(c, r) {
  const rc = cellRect(c, r); if (!rc) return;
  const headH = gridEl.tHead.offsetHeight, headW = 46;
  if (rc.y - headH < wrap.scrollTop) wrap.scrollTop = rc.y - headH;
  else if (rc.y + rc.h > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = rc.y + rc.h - wrap.clientHeight;
  if (rc.x - headW < wrap.scrollLeft) wrap.scrollLeft = rc.x - headW;

function select(c, r, extend) {

const COLORS = ["#000000", "#434343", "#666666", "#999999", "#cccccc", "#efefef", "#f3f3f3", "#ffffff",
  "#980000", "#ff0000", "#ff9900", "#ffff00", "#00ff00", "#00ffff", "#4a86e8", "#0000ff",
  "#e6b8af", "#f4cccc", "#fce5cd", "#fff2cc", "#d9ead3", "#d0e0e3", "#c9daf8", "#cfe2f3",
  "#cc4125", "#e06666", "#f6b26b", "#ffd966", "#93c47d", "#76a5af", "#6d9eeb", "#6fa8dc"];
const AL_ICONS = { "": "format_align_left", left: "format_align_left", center: "format_align_center", right: "format_align_right" };

function curStyle() { const c = sheet().cells[key(act.c, act.r)]; return (c && c.s) || {}; }
function updateToolbar() {
  const s = curStyle();

  tb.querySelector('[data-act="b"]').classList.toggle("on", !!s.b);
  tb.querySelector('[data-act="i"]').classList.toggle("on", !!s.i);

  tb.querySelector('[data-act="fmt-yen"]').classList.toggle("on", s.fmt === "yen");

  tb.querySelector('[data-act="redo"]').disabled = !redoStack.length;

}

$("toolbar").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn || !cur) return;
  if (editing) commitEdit();
  const a = btn.dataset.act;
  const s = curStyle();
  if (a === "undo") undo();
  else if (a === "redo") redo();
  else if (a === "b") { const v = !s.b; setStyle((x) => (x.b = v)); }
  else if (a === "i") { const v = !s.i; setStyle((x) => (x.i = v)); }
  else if (a === "s") { const v = !s.st; setStyle((x) => (x.st = v)); }
  else if (a === "fmt-yen") { const v = s.fmt === "yen" ? "" : "yen"; setStyle((x) => (x.fmt = v)); }
  else if (a === "fmt-pct") { const v = s.fmt === "pct" ? "" : "pct"; setStyle((x) => (x.fmt = v)); }
  else if (a === "clear") setStyle((x) => { for (const p in x) delete x[p]; });
  else if (a === "fmt") openMenu(btn, FORMATS.map((f) => ({ label: f.name, sub: f.ex, cur: (s.fmt || "") === f.id, fn: () => setStyle((x) => (x.fmt = f.id)) })));
  else if (a === "al") openMenu(btn, [["left", "左揃え"], ["center", "中央揃え"], ["right", "右揃え"]].map(([v, l]) => ({ icon: AL_ICONS[v], label: l, cur: s.al === v, fn: () => setStyle((x) => (x.al = v)) })));
  else if (a === "fc" || a === "bg") openColorMenu(btn, a);
  else if (a === "sum") openMenu(btn, ["SUM", "AVERAGE", "COUNT", "MAX", "MIN", "IF", "ROUND", "SUMIF", "VLOOKUP", "CONCATENATE"].map((f) => ({ label: f, fn: () => insertFunc(f) })));
});
function openColorMenu(btn, prop) {
  const m = openMenu(btn, []);
  m.innerHTML = `<div class="mlabel">${prop === "fc" ? "文字の色" : "塗りつぶしの色"}</div><div class="swatches">` +
    `<div class="sw none" data-col=""></div>` + COLORS.map((c) => `<div class="sw" data-col="${c}" style="background:${c}"></div>`).join("") + `</div>`;
  m.onclick = (e) => {

    const col = sw.dataset.col; closeMenu();

}
function insertFunc(f) {
  const { c1, r1, c2, r2 } = selRect();
  const sh = sheet();
  if (["SUM", "AVERAGE", "COUNT", "MAX", "MIN"].includes(f)) {
    // 範囲が選択されていれば、その下 (横長なら右) に結果を入れる (Σ ボタン的な動き)
    if (c1 !== c2 || r1 !== r2) {
      pushUndo();
      if (r1 !== r2 || c1 === c2) { for (let c = c1; c <= c2; c++) setRaw(sh, c, Math.min(r2 + 1, sh.rows - 1), `=${f}(${key(c, r1)}:${key(c, r2)})`); select(c1, Math.min(r2 + 1, sh.rows - 1)); }
      else { setRaw(sh, Math.min(c2 + 1, sh.cols - 1), r1, `=${f}(${key(c1, r1)}:${key(c2, r1)})`); select(Math.min(c2 + 1, sh.cols - 1), r1); }

    let r = act.r - 1; while (r >= 0 && typeof cellValue(sh, act.c, r) === "number") r--;

function openMenu(anchorEl, items, pos) {

  m.innerHTML = items.map((it, i) => it === "-" ? "<hr>" : it.label === undefined ? "" :
    `<button class="mi${it.danger ? " danger" : ""}${it.cur ? " cur" : ""}" data-i="${i}">${it.icon ? `<span class="icon">${it.icon}</span>` : ""}<span>${esc(it.label)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ""}</button>`).join("");
  m.onclick = (e) => { const b = e.target.closest(".mi"); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); it.fn && it.fn(); };
  m.classList.add("open"); $("menuBack").classList.add("open");

  let x, y;

  else { const r = anchorEl.getBoundingClientRect(); x = r.left; y = r.bottom + 4; }

}

$("menuBack").addEventListener("pointerdown", (e) => { e.preventDefault(); closeMenu(); });

    { icon: "delete", label: `列 ${colName(c1)}${nc > 1 ? "-" + colName(c2) : ""} を削除`, danger: true, fn: () => deleteCols(c1, nc) },
    { icon: "backspace", label: "値を削除", fn: () => clearValues() },

const ed = $("cellEditor"), fin = $("fInput");

function positionHiddenEditor() {
  // 非編集時もデスクトップでは隠しエディタにフォーカスを置き、日本語入力 (IME) をそのまま受ける
  const rc = cellRect(act.c, act.r); if (!rc) return;
  ed.classList.add("hidden");
  ed.style.left = rc.x + "px"; ed.style.top = rc.y + "px";
  if (!isTouch() && document.activeElement !== fin && document.activeElement !== $("nameBox") && document.activeElement !== $("bookName") && !$("menu").classList.contains("open")) {
    if (ed.value !== "") ed.value = "";
    ed.focus({ preventScroll: true });
  }
}
function showEditor() {
  const rc = cellRect(act.c, act.r); if (!rc) return;
  ed.classList.remove("hidden");
  ed.style.left = rc.x - 1 + "px"; ed.style.top = rc.y - 1 + "px";
  ed.style.minWidth = rc.w + 1 + "px"; ed.style.height = rc.h + 1 + "px";
  autosizeEditor();
  $("fillHandle").style.display = "none";
}
function autosizeEditor() {
  ed.style.width = "0px";
  const lines = ed.value.split("\n").length;
  ed.style.width = Math.max(parseFloat(ed.style.minWidth) || 0, Math.min(ed.scrollWidth + 8, 600)) + "px";
  ed.style.height = Math.max(24, lines * 19 + 4) + "px";
}

function startEdit(initial, fromBar) {
  if (editing) return;
  const cell = sheet().cells[key(act.c, act.r)];
  editOrig = cell && cell.v != null ? String(cell.v) : "";
  editing = true; editFromBar = !!fromBar;
  const val = initial !== undefined ? initial : editOrig;
  ed.value = val; fin.value = val;
  showEditor();
  if (fromBar) { fin.focus(); }

  refInsert = null;
}
function commitEdit(moveDc = 0, moveDr = 0) {
  if (!editing) return;
  lastTap.t = 0;
  const val = editFromBar ? fin.value : ed.value;
  editing = false; editFromBar = false; refInsert = null; $("refBox").style.display = "none";
  ed.classList.add("hidden"); ed.value = "";
  if (val !== editOrig) {
    pushUndo();
    let v = val;
    if (v[0] === "=") v = autoCloseParens(v);
    setRaw(sheet(), act.c, act.r, v);
    save();
  }
  renderCells();

}
function cancelEdit() {
  if (!editing) return;
  editing = false; editFromBar = false; refInsert = null; $("refBox").style.display = "none";
  ed.classList.add("hidden"); ed.value = "";
  renderSel();
}
function autoCloseParens(v) {
  let d = 0, inStr = false;
  for (const ch of v) { if (ch === '"') inStr = !inStr; else if (!inStr) { if (ch === "(") d++; else if (ch === ")") d--; } }
  return d > 0 ? v + ")".repeat(d) : v;
}

// 隠しエディタへの入力 = 編集開始 (IME 対応)
let composing = false;
ed.addEventListener("compositionstart", () => { composing = true; if (!editing) { const cell = sheet().cells[key(act.c, act.r)]; editOrig = cell && cell.v != null ? String(cell.v) : ""; editing = true; editFromBar = false; showEditor(); } });
ed.addEventListener("compositionend", () => { composing = false; autosizeEditor(); fin.value = ed.value; });
ed.addEventListener("input", () => {
  if (!editing) { const v = ed.value; const cell = sheet().cells[key(act.c, act.r)]; editOrig = cell && cell.v != null ? String(cell.v) : ""; editing = true; editFromBar = false; showEditor(); ed.value = v; refInsert = null; }
  fin.value = ed.value; autosizeEditor(); refInsert = null;
});
fin.addEventListener("focus", () => { if (!editing) startEdit(undefined, true); else if (!editFromBar) { editFromBar = true; fin.value = ed.value; } });
fin.addEventListener("input", () => { if (!editing) startEdit(fin.value, true); ed.value = fin.value; autosizeEditor(); refInsert = null; });
fin.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter") { e.preventDefault(); commitEdit(0, 1); if (isTouch()) fin.blur(); else ed.focus({ preventScroll: true }); }
  else if (e.key === "Escape") { e.preventDefault(); cancelEdit(); fin.blur(); }
  else if (e.key === "Tab") { e.preventDefault(); commitEdit(e.shiftKey ? -1 : 1, 0); }
});

// ── キーボード ──
ed.addEventListener("keydown", (e) => {
  if (!cur) return;
  if (e.isComposing || composing || e.keyCode === 229) return;
  const mod = e.ctrlKey || e.metaKey;
  if (editing) {
    if (e.key === "Enter" && e.altKey) { e.preventDefault(); insertAtCaret("\n"); return; }
    if (e.key === "Enter") { e.preventDefault(); commitEdit(0, e.shiftKey ? -1 : 1); return; }
    if (e.key === "Tab") { e.preventDefault(); commitEdit(e.shiftKey ? -1 : 1, 0); return; }
    if (e.key === "Escape") { e.preventDefault(); cancelEdit(); return; }
    // 数式入力中に矢印でセル参照を挿入
    if (e.key.startsWith("Arrow") && isRefInsertPoint()) {
      e.preventDefault();
      const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      const base = refInsert ? (e.shiftKey ? refInsert.end : refInsert.end) : { ...act };
      const end = { c: Math.max(0, base.c + d[0]), r: Math.max(0, base.r + d[1]) };
      insertRef(e.shiftKey && refInsert ? refInsert.start : end, end);
      return;
    }
    return;
  }
  lastTap.t = 0;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); const v = !curStyle().b; setStyle((x) => (x.b = v)); return; }
  if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); const v = !curStyle().i; setStyle((x) => (x.i = v)); return; }
  if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); anchor = { c: 0, r: 0 }; selEnd = { c: sheet().cols - 1, r: sheet().rows - 1 }; renderSel(); return; }
  if (mod) return; // コピー/貼り付けは copy/paste イベントで
  const arrows = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (arrows[e.key]) {
    e.preventDefault(); const [dc, dr] = arrows[e.key];
    if (e.shiftKey) select(selEnd.c + dc, selEnd.r + dr, true); else select(act.c + dc, act.r + dr);
    return;
  }
  if (e.key === "Enter") { e.preventDefault(); if (e.shiftKey) select(act.c, act.r - 1); else startEdit(); return; }
  if (e.key === "Tab") { e.preventDefault(); select(act.c + (e.shiftKey ? -1 : 1), act.r); return; }
  if (e.key === "F2") { e.preventDefault(); startEdit(); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearValues(); return; }
  if (e.key === "PageDown") { e.preventDefault(); select(act.c, act.r + 20); return; }

    ensureSize(a.r + 1, a.c + 1);
    select(a.c, a.r);
    if (m[3]) { const b = { c: colIndex(m[3]), r: +m[4] - 1 }; ensureSize(b.r + 1, b.c + 1); selEnd = b; renderSel(); }
  }
  e.target.blur(); if (!isTouch()) ed.focus({ preventScroll: true });
});

// ═══════════════════════════════════════════════
//  シートタブ
// ═══════════════════════════════════════════════
function renderTabs() {
  const b = book();
  $("tabs").innerHTML = b.sheets.map((s) => `<button class="tab${s.id === b.active ? " on" : ""}" data-id="${s.id}">${esc(s.name)}${s.id === b.active ? '<span class="icon">arrow_drop_down</span>' : ""}</button>`).join("");
}
$("tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab"); if (!t || !cur) return;
  if (editing) commitEdit();
  if (t.dataset.id === cur.active) { openSheetMenu(t); return; }
  setActive(t.dataset.id); act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  buildGrid(); renderTabs(); wrap.scrollTo(0, 0);
});
$("btnAddSheet").onclick = () => {
  if (!cur) return;
  if (editing) commitEdit();
  const b = book(); let n = b.sheets.length + 1; while (b.sheets.some((s) => s.name === "シート" + n)) n++;
  const s = newSheet("シート" + n); b.sheets.push(s); setActive(s.id);
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  save(); buildGrid(); renderTabs();
};
function openSheetMenu(tab) {
  const b = book(), sh = sheet(), i = b.sheets.indexOf(sh);
  openMenu(tab, [
    { icon: "edit", label: "名前を変更", fn: () => {
      const n = (prompt("シート名", sh.name) || "").trim(); if (!n || n === sh.name) return;
      if (findSheetByName(n)) { toast("同じ名前のシートがあります"); return; }
      ENG.renameSheet(cur, sh, n); // 他シートの数式内のシート名も置き換わる
      save(); renderTabs(); renderCells();
    } },
    { icon: "content_copy", label: "コピーを作成", fn: () => { const c = clone(sh); c.id = uid(); let nm = sh.name + " のコピー", j = 2; while (findSheetByName(nm)) nm = sh.name + " のコピー " + j++; c.name = nm; b.sheets.splice(i + 1, 0, c); setActive(c.id); save(); buildGrid(); renderTabs(); } },
    { icon: "arrow_back", label: "左に移動", fn: () => { if (i > 0) { b.sheets.splice(i, 1); b.sheets.splice(i - 1, 0, sh); save(); renderTabs(); } } },
    { icon: "arrow_forward", label: "右に移動", fn: () => { if (i < b.sheets.length - 1) { b.sheets.splice(i, 1); b.sheets.splice(i + 1, 0, sh); save(); renderTabs(); } } },
    "-",
    { icon: "delete", label: "削除", danger: true, fn: () => {
      if (b.sheets.length <= 1) { toast("最後のシートは削除できません"); return; }
      if (!confirm(`「${sh.name}」を削除しますか？`)) return;
      b.sheets.splice(i, 1); setActive(b.sheets[Math.max(0, i - 1)].id); undoStack = []; redoStack = [];
      save(); buildGrid(); renderTabs();
    } },
  ]);
}

// ═══════════════════════════════════════════════
//  ファイル (スプレッドシートの切替・新規・CSV)
// ═══════════════════════════════════════════════
$("bookName").addEventListener("change", (e) => { if (!cur) return; const n = e.target.value.trim() || "無題のスプレッドシート"; cur.name = n; e.target.value = n; document.title = n; save(); });
$("bookName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
$("bookName").addEventListener("blur", () => { if (!isTouch()) setTimeout(() => positionHiddenEditor(), 0); });

const who = (email) => (!email ? "" : email === "AI" ? "AI" : email.split("@")[0]);
$("btnFile").onclick = async () => {
  if (!cur) return;
  if (editing) commitEdit();
  try { books = await api("GET", "/api/sheet/books"); } catch (e) { toast("一覧を取れませんでした"); }
  const d = (t) => { const x = new Date(t || 0); return `${x.getMonth() + 1}/${x.getDate()}`; };
  openMenu($("btnFile"), [
    { icon: "add", label: "新しいスプレッドシート", fn: async () => { const r = await api("POST", "/api/sheet/books", { name: "無題のスプレッドシート" }); await openBook(r.id); setTimeout(() => $("bookName").select(), 50); } },
    { icon: "upload_file", label: "CSV を読み込む (新しいシート)", fn: () => $("csvFile").click() },
    { icon: "download", label: "このシートを CSV で保存", fn: exportCSV },
    { icon: "content_copy", label: "このファイルのコピーを作成", fn: async () => { await flush(); const r = await api("POST", "/api/sheet/books", { name: cur.name + " のコピー", data: { sheets: clone(cur.sheets) } }); await openBook(r.id); } },
    { icon: "delete", label: "このファイルを削除", danger: true, fn: async () => {
      if (!confirm(`「${cur.name}」を削除しますか？みんなの画面からも消えます。`)) return;
      const id = cur.id; dirty = false; clearTimeout(saveTimer);
      await api("DELETE", "/api/sheet/books/" + id);
      books = books.filter((b) => b.id !== id);
      if (books[0]) await openBook(books[0].id);
      else { const r = await api("POST", "/api/sheet/books", { name: "無題のスプレッドシート" }); await openBook(r.id); }
    } },
    "-",
    ...books.map((b) => ({ icon: "table_view", label: b.name, sub: `${d(b.updated_at)}${b.updated_by ? " " + who(b.updated_by) : ""}`, cur: b.id === cur.id, fn: () => openBook(b.id) })),
  ]);
};
async function openBook(id) {
  if (dirty) { clearTimeout(saveTimer); await flush(); }
  const r = await api("GET", "/api/sheet/books/" + id);
  cur = { id: r.id, name: r.name, version: r.version, sheets: clone(r.data.sheets), active: lsGet("sheet.active." + r.id) };
  if (!cur.sheets.some((s) => s.id === cur.active)) cur.active = cur.sheets[0].id;
  base = { name: r.name, sheets: clone(r.data.sheets) };
  dirty = false; undoStack = []; redoStack = [];
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  $("bookName").value = r.name; document.title = r.name;
  lsSet("sheet.last", r.id);
  history.replaceState(null, "", "?book=" + r.id);
  setSync("ok"); buildGrid(); renderTabs(); wrap.scrollTo(0, 0);
}
function exportCSV() {
  const sh = sheet(); let maxR = -1, maxC = -1;
  for (const k in sh.cells) { if (sh.cells[k].v === undefined) continue; const p = parseKey(k); maxR = Math.max(maxR, p.r); maxC = Math.max(maxC, p.c); }
  const lines = [];
  for (let r = 0; r <= maxR; r++) { const row = []; for (let c = 0; c <= maxC; c++) { const cell = sh.cells[key(c, r)]; let t = cell && cell.v !== undefined ? fmtValue(cellValue(sh, c, r), cell.s && cell.s.fmt === "yen" ? "" : cell.s && cell.s.fmt) : ""; if (/[",\n]/.test(t)) t = '"' + t.replace(/"/g, '""') + '"'; row.push(t); } lines.push(row.join(",")); }
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${cur.name}_${sh.name}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("csvFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f || !cur) return; e.target.value = "";
  const buf = await f.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  if (text.includes("�")) { try { text = new TextDecoder("shift_jis").decode(buf); } catch (err) {} } // Excel の Shift_JIS CSV
  text = text.replace(/^﻿/, "");
  const isTsv = /\.tsv$/i.test(f.name) || (text.includes("\t") && !text.split("\n")[0].includes(","));
  const rows = isTsv ? parseTSV(text) : parseCSV(text);
  const b = book(); let name = f.name.replace(/\.(csv|tsv|txt)$/i, ""), j = 2; while (findSheetByName(name)) name = f.name.replace(/\.(csv|tsv|txt)$/i, "") + " " + j++;
  const sh = newSheet(name);
  sh.rows = Math.max(DEF_ROWS, rows.length + 20); sh.cols = Math.max(DEF_COLS, ...rows.map((r) => r.length));
  b.sheets.push(sh); setActive(sh.id);
  rows.forEach((row, r) => row.forEach((v, c) => setRaw(sh, c, r, v)));
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  save(); buildGrid(); renderTabs();
  toast(`${rows.length} 行を読み込みました`);
});
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// ═══════════════════════════════════════════════
//  起動
// ═══════════════════════════════════════════════
window.addEventListener("resize", () => { if (cur) renderSel(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("menu").classList.contains("open")) closeMenu(); });
// メニュー・フィールド外をクリックしたらデスクトップでは隠しエディタへフォーカスを戻す
document.addEventListener("pointerup", () => { if (cur && !isTouch() && !editing && !isFieldFocused() && !$("menu").classList.contains("open")) setTimeout(() => { if (!isFieldFocused()) ed.focus({ preventScroll: true }); }, 0); });

// 前の版 (この端末だけに保存していた頃) のデータがあれば 1 回だけサーバーへ上げる
async function migrateLocal() {
  if (lsGet("sheet.v1.migrated")) return;
  let old = null; try { old = JSON.parse(lsGet("sheet.v1")); } catch (e) {}
  for (const b of (old && old.books) || []) {
    if (!b.sheets || !b.sheets.some((s) => Object.keys(s.cells || {}).length)) continue;
    try { await api("POST", "/api/sheet/books", { id: b.id, name: b.name, data: { sheets: b.sheets } }); }
    catch (e) { if (!/同じ ID/.test(e.message)) return; } // 通信エラーなら次回また試す
  }
  lsSet("sheet.v1.migrated", "1");
}
async function boot() {
  try {
    await migrateLocal();
    books = await api("GET", "/api/sheet/books");
    let id = new URLSearchParams(location.search).get("book") || lsGet("sheet.last");
    if (!books.some((b) => b.id === id)) id = books[0] && books[0].id;
    if (!id) { const r = await api("POST", "/api/sheet/books", { name: "無題のスプレッドシート" }); id = r.id; }
    await openBook(id);
    $("loading").remove();
  } catch (e) {
    $("loading").textContent = "読み込めませんでした: " + e.message;
  }
}
initAuthBoot({ returnPath: "/sheet/" + location.search, onReady: boot });
</script>
