<!DOCTYPE html>
<html lang="ja">
<!-- スプレッドシート：Google スプレッドシート風の表計算。データはこの端末 (localStorage) に保存 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シート">
<link rel="apple-touch-icon" href="/icon.png">
<title>スプレッドシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f8f9fa; --panel: #ffffff; --line: #e2e3e3; --head: #f8f9fa; --head-on: #d3e3fd;
  --text: #1f1f1f; --text2: #5f6368; --text3: #9aa0a6;
  --accent: #0b8043; --sel: #1a73e8; --sel-bg: rgba(26,115,232,0.10);
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; display: inline-block; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; }

#app { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

/* ── ヘッダー ── */
.top { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; background: var(--panel); }
.logo { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none; }
.book-name { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-size: 17px; font-weight: 600; font-family: inherit; background: transparent; color: var(--text); }
.book-name:hover { border-color: var(--line); }
.book-name:focus { outline: none; border-color: var(--sel); background: #fff; }
.ibtn { width: 34px; height: 34px; border: none; background: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.ibtn:hover { background: #f1f3f4; }
.ibtn:active { background: #e8eaed; }
.ibtn.on { background: var(--head-on); color: #0b57d0; }
.ibtn:disabled { opacity: 0.35; cursor: default; }

/* ── ツールバー ── */
.toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 8px; margin: 0 8px 6px; background: #edf2fa; border-radius: 22px; overflow-x: auto; flex-shrink: 0; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar .ibtn { width: 30px; height: 30px; border-radius: 6px; }
.toolbar .ibtn .icon { font-size: 19px; }
.sep { width: 1px; height: 20px; background: #c7c7c7; margin: 0 4px; flex-shrink: 0; }
.color-btn { position: relative; }
.color-btn .bar { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 1px; }

/* ── 数式バー ── */
.fbar { display: flex; align-items: center; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
.namebox { width: 78px; border: none; border-right: 1px solid var(--line); padding: 7px 8px; font-size: 13px; font-family: inherit; color: var(--text); background: transparent; text-align: center; }
.namebox:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 2px var(--sel); }
.fx { color: var(--text3); font-style: italic; font-weight: 700; padding: 0 8px; font-size: 13px; font-family: Georgia, serif; }
.finput { flex: 1; min-width: 0; border: none; padding: 7px 8px; font-size: 14px; font-family: inherit; background: transparent; color: var(--text); }
.finput:focus { outline: none; }

/* ── グリッド ── */
.grid-wrap { flex: 1; overflow: auto; position: relative; background: #fff; overscroll-behavior: contain; }
table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; position: relative; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 23px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--head); color: var(--text2); font-weight: 400; font-size: 11px; text-align: center; border-bottom-color: #c4c7c5; user-select: none; -webkit-user-select: none; cursor: default; }
.grid tbody th { position: sticky; left: 0; z-index: 2; background: var(--head); color: var(--text2); font-weight: 400; font-size: 11px; text-align: center; border-right-color: #c4c7c5; user-select: none; -webkit-user-select: none; }
.grid thead th.corner { left: 0; z-index: 4; }
.grid th.on { background: var(--head-on); color: #0b57d0; font-weight: 700; }
.grid { -webkit-touch-callout: none; }
.grid td { background: #fff; cursor: cell; user-select: none; -webkit-user-select: none; line-height: 22px; }
.grid td.num { text-align: right; }
.grid td.bool, .grid td.err { text-align: center; }
.grid td.err { color: #d93025; }
.grid td.in { background-image: linear-gradient(var(--sel-bg), var(--sel-bg)); }
.col-resize { position: absolute; right: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; touch-action: none; }

/* 選択枠 */
.sel-box { position: absolute; border: 1px solid var(--sel); pointer-events: none; z-index: 1; display: none; }
.act-box { position: absolute; border: 2px solid var(--sel); pointer-events: none; z-index: 1; display: none; }
.fill-handle { position: absolute; width: 9px; height: 9px; background: var(--sel); border: 1.5px solid #fff; border-radius: 2px; z-index: 2; cursor: crosshair; display: none; touch-action: none; }
.fill-box { position: absolute; border: 1px dashed #5f6368; pointer-events: none; z-index: 1; display: none; }
.ref-box { position: absolute; border: 2px dashed #e37400; background: rgba(227,116,0,0.06); pointer-events: none; z-index: 1; display: none; }
.cell-editor { position: absolute; z-index: 6; border: 2px solid var(--sel); padding: 0 3px; font-family: inherit; font-size: 13px; line-height: 19px; background: #fff; color: var(--text); outline: none; resize: none; overflow: hidden; white-space: pre; box-shadow: 0 2px 6px rgba(60,64,67,0.3); }
.cell-editor.hidden { opacity: 0; pointer-events: none; width: 1px !important; height: 1px !important; border: none; box-shadow: none; }

/* 行追加 */
.more-rows { padding: 12px 0 30px 50px; }
.more-rows button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text2); display: inline-flex; align-items: center; gap: 4px; }

/* ── 下：シートタブ + 集計 ── */
.bottom { display: flex; align-items: center; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); gap: 4px; flex-shrink: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: none; background: transparent; padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--text2); display: flex; align-items: center; gap: 2px; }
.tab:hover { background: #f1f3f4; }
.tab.on { background: #e1e9f7; color: #0b57d0; font-weight: 700; }
.tab .icon { font-size: 16px; }
.stat { font-size: 12px; color: var(--text2); white-space: nowrap; padding: 0 6px; cursor: pointer; flex-shrink: 0; }

/* ── ポップアップメニュー ── */
.menu { position: fixed; z-index: 30; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(60,64,67,0.28); padding: 6px 0; min-width: 200px; max-height: 70vh; overflow-y: auto; display: none; }
.menu.open { display: block; }
.menu .mi { display: flex; align-items: center; gap: 12px; width: 100%; border: none; background: transparent; padding: 9px 16px; font-size: 14px; cursor: pointer; text-align: left; }
.menu .mi:hover { background: #f1f3f4; }
.menu .mi .icon { color: var(--text2); font-size: 19px; }
.menu .mi.danger { color: #c5221f; }
.menu .mi.danger .icon { color: #c5221f; }
.menu .mi.cur { font-weight: 700; color: #0b57d0; }
.menu .mi .sub { margin-left: auto; color: var(--text3); font-size: 12px; }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
.menu .mlabel { font-size: 11px; color: var(--text3); padding: 6px 16px 2px; font-weight: 700; letter-spacing: 0.05em; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 6px; padding: 8px 14px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; }
.sw.none { background: #fff; position: relative; }
.sw.none::after { content: ''; position: absolute; left: 10px; top: -2px; bottom: -2px; width: 1.5px; background: #d93025; transform: rotate(45deg); }
.menu-back { position: fixed; inset: 0; z-index: 29; display: none; }
.menu-back.open { display: block; }

.toast { position: fixed; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; z-index: 40; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <a class="logo" href="/" title="ランチャーへ"><span class="icon">table_view</span></a>
    <input class="book-name" id="bookName" spellcheck="false">
    <button class="ibtn" id="btnFile" title="ファイル"><span class="icon">folder_open</span></button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="ibtn" data-act="undo" title="元に戻す (Ctrl+Z)"><span class="icon">undo</span></button>
    <button class="ibtn" data-act="redo" title="やり直す (Ctrl+Y)"><span class="icon">redo</span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="fmt" title="表示形式"><span class="icon">123</span></button>
    <button class="ibtn" data-act="fmt-yen" title="通貨 (円)"><span class="icon">currency_yen</span></button>
    <button class="ibtn" data-act="fmt-pct" title="パーセント"><span class="icon">percent</span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="b" title="太字 (Ctrl+B)"><span class="icon">format_bold</span></button>
    <button class="ibtn" data-act="i" title="斜体 (Ctrl+I)"><span class="icon">format_italic</span></button>
    <button class="ibtn" data-act="s" title="取り消し線"><span class="icon">strikethrough_s</span></button>
    <button class="ibtn color-btn" data-act="fc" title="文字の色"><span class="icon">format_color_text</span><span class="bar" id="fcBar" style="background:#1f1f1f"></span></button>
    <button class="ibtn color-btn" data-act="bg" title="塗りつぶしの色"><span class="icon">format_color_fill</span><span class="bar" id="bgBar" style="background:#fff;outline:1px solid #ccc"></span></button>
    <span class="sep"></span>
    <button class="ibtn" data-act="al" title="配置"><span class="icon" id="alIcon">format_align_left</span></button>
    <button class="ibtn" data-act="sum" title="関数"><span class="icon">functions</span></button>
    <button class="ibtn" data-act="clear" title="書式をクリア"><span class="icon">format_clear</span></button>
  </div>

  <div class="fbar">
    <input class="namebox" id="nameBox" spellcheck="false">
    <span class="fx">fx</span>
    <input class="finput" id="fInput" spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>

  <div class="grid-wrap" id="gridWrap">
    <table class="grid" id="grid"></table>
    <div class="sel-box" id="selBox"></div>
    <div class="act-box" id="actBox"></div>
    <div class="fill-box" id="fillBox"></div>
    <div class="ref-box" id="refBox"></div>
    <div class="fill-handle" id="fillHandle"></div>
    <textarea class="cell-editor hidden" id="cellEditor" spellcheck="false" autocomplete="off" autocapitalize="off" rows="1"></textarea>
    <div class="more-rows"><button id="btnMoreRows"><span class="icon">add</span>行を 50 行追加</button></div>
  </div>

  <div class="bottom">
    <button class="ibtn" id="btnAddSheet" title="シートを追加"><span class="icon">add</span></button>
    <div class="tabs" id="tabs"></div>
    <div class="stat" id="stat"></div>
  </div>
</div>

<div class="menu-back" id="menuBack"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<input type="file" id="csvFile" accept=".csv,.tsv,text/csv,text/plain" style="display:none">

<script src="/config.js"></script>
<script>
"use strict";
// ═══════════════════════════════════════════════
//  ユーティリティ
// ═══════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const colName = (c) => { let s = ""; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; };
const colIndex = (s) => { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
const key = (c, r) => colName(c) + (r + 1);
const parseKey = (k) => { const m = /^([A-Z]+)(\d+)$/.exec(k); return m ? { c: colIndex(m[1]), r: +m[2] - 1 } : null; };
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = (o) => JSON.parse(JSON.stringify(o));
const isTouch = () => matchMedia("(pointer: coarse)").matches;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }

// ═══════════════════════════════════════════════
//  データ (localStorage)
// ═══════════════════════════════════════════════
const STORE_KEY = "sheet.v1";
const DEF_COLS = 26, DEF_ROWS = 100, DEF_W = 100;

function newSheet(name) { return { id: uid(), name, cells: {}, colW: {}, rows: DEF_ROWS, cols: DEF_COLS }; }
function newBook(name) { const s = newSheet("シート1"); return { id: uid(), name, sheets: [s], active: s.id, updated: Date.now() }; }

let store;
try { store = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { store = null; }
if (!store || !store.books || !store.books.length) { const b = newBook("無題のスプレッドシート"); store = { books: [b], current: b.id }; }

let saveTimer = null;
function save() {
  book().updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
    catch (e) { toast("保存できませんでした (容量オーバー?)"); }
  }, 250);
}
window.addEventListener("pagehide", () => { clearTimeout(saveTimer); try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} });

const book = () => store.books.find((b) => b.id === store.current) || store.books[0];
const sheet = () => { const b = book(); return b.sheets.find((s) => s.id === b.active) || b.sheets[0]; };
const findSheetByName = (name) => book().sheets.find((s) => s.name.toLowerCase() === String(name).toLowerCase());

// ═══════════════════════════════════════════════
//  数式エンジン
// ═══════════════════════════════════════════════
class FErr { constructor(code) { this.code = code; } toString() { return this.code; } }
const E = { DIV0: new FErr("#DIV/0!"), VALUE: new FErr("#VALUE!"), REF: new FErr("#REF!"), NAME: new FErr("#NAME?"), NA: new FErr("#N/A"), ERR: new FErr("#ERROR!"), NUM: new FErr("#NUM!") };
const isErr = (v) => v instanceof FErr;

// 入力文字列 → 値 (数式以外)
function parseLiteral(raw) {
  if (raw === "" || raw == null) return { v: null };
  const t = raw.trim();
  if (/^(true|false)$/i.test(t)) return { v: /^true$/i.test(t) };
  let m;
  if ((m = /^([-+]?)[¥￥]\s?([\d,]*\.?\d+)$/.exec(t))) return { v: +(m[1] + m[2].replace(/,/g, "")), fmt: "yen" };
  if ((m = /^([-+]?[\d,]*\.?\d+)\s?%$/.exec(t))) return { v: +m[1].replace(/,/g, "") / 100, fmt: "pct" };
  if (/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) return { v: +t.replace(/,/g, ""), fmt: "num" };
  if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return { v: +t };
  return { v: raw };
}

// トークナイザ
function tokenize(src) {
  const toks = []; let i = 0;
  const refRe = /^(?:('(?:[^']|'')+'|[^\s!'"(),+\-*/&=<>^:;%{}]+)!)?(\$?[A-Za-z]{1,3}\$?\d+)(?::(\$?[A-Za-z]{1,3}\$?\d+))?/;
  const colRangeRe = /^(?:('(?:[^']|'')+'|[^\s!'"(),+\-*/&=<>^:;%{}]+)!)?\$?([A-Za-z]{1,3}):\$?([A-Za-z]{1,3})(?![\w(])/;
  while (i < src.length) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    const rest = src.slice(i);
    if (/^#REF!/i.test(rest)) throw E.REF;
    if (ch === '"') {
      let j = i + 1, s = "";
      while (j < src.length) { if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } break; } s += src[j++]; }
      if (j >= src.length) throw E.ERR;
      toks.push({ t: "str", v: s }); i = j + 1; continue;
    }
    let m;
    if ((m = /^(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i.exec(rest))) { toks.push({ t: "num", v: +m[0] }); i += m[0].length; continue; }
    if ((m = colRangeRe.exec(rest))) {
      toks.push({ t: "colrange", sheet: m[1] ? m[1].replace(/^'|'$/g, "").replace(/''/g, "'") : null, a: m[2].toUpperCase(), b: m[3].toUpperCase() });
      i += m[0].length; continue;
    }
    if ((m = refRe.exec(rest)) && !/^[\w(]/.test(rest.slice(m[0].length))) {
      toks.push({ t: "ref", sheet: m[1] ? m[1].replace(/^'|'$/g, "").replace(/''/g, "'") : null, a: m[2].replace(/\$/g, "").toUpperCase(), b: m[3] ? m[3].replace(/\$/g, "").toUpperCase() : null });
      i += m[0].length; continue;
    }
    if ((m = /^[A-Za-z_][A-Za-z0-9_.]*/.exec(rest))) { toks.push({ t: "id", v: m[0].toUpperCase() }); i += m[0].length; continue; }
    if ((m = /^(<=|>=|<>|[-+*/^&=<>(),:;%])/.exec(rest))) { toks.push({ t: "op", v: m[0] === ";" ? "," : m[0] }); i += m[0].length; continue; }
    throw E.ERR;
  }
  return toks;
}

// 再帰下降パーサ + 評価器
function evaluate(src, ctx) {
  const toks = tokenize(src); let p = 0;
  const peek = () => toks[p];
  const isOp = (v) => toks[p] && toks[p].t === "op" && toks[p].v === v;
  const eat = (v) => { if (!isOp(v)) throw E.ERR; p++; };

  const num = (v) => {
    if (isErr(v)) throw v;
    if (v && v.range) { if (v.range.length === 1 && v.range[0].length === 1) return num(v.range[0][0]); throw E.VALUE; }
    if (v == null || v === "") return 0;
    if (typeof v === "boolean") return v ? 1 : 0;
    if (typeof v === "number") return v;
    const lit = parseLiteral(String(v)); if (typeof lit.v === "number") return lit.v;
    throw E.VALUE;
  };
  const str = (v) => {
    if (isErr(v)) throw v;
    if (v && v.range) { if (v.range.length === 1 && v.range[0].length === 1) return str(v.range[0][0]); throw E.VALUE; }
    if (v == null) return "";
    if (typeof v === "boolean") return v ? "TRUE" : "FALSE";
    if (typeof v === "number") return fmtAuto(v);
    return String(v);
  };
  const scalar = (v) => { if (v && v.range) { if (v.range.length === 1 && v.range[0].length === 1) return v.range[0][0]; throw E.VALUE; } return v; };

  function expr() { return compare(); }
  function compare() {
    let l = concat();
    while (peek() && peek().t === "op" && ["=", "<>", "<", ">", "<=", ">="].includes(peek().v)) {
      const op = toks[p++].v; const r = concat();
      l = cmp(scalar(l), scalar(r), op);
    }
    return l;
  }
  function concat() { let l = add(); while (isOp("&")) { p++; const r = add(); l = str(l) + str(r); } return l; }
  function add() { let l = mul(); while (isOp("+") || isOp("-")) { const op = toks[p++].v; const r = mul(); l = op === "+" ? num(l) + num(r) : num(l) - num(r); } return l; }
  function mul() {
    let l = pow();
    while (isOp("*") || isOp("/")) { const op = toks[p++].v; const r = pow(); if (op === "*") l = num(l) * num(r); else { const d = num(r); if (d === 0) throw E.DIV0; l = num(l) / d; } }
    return l;
  }
  function pow() { let l = unary(); while (isOp("^")) { p++; const r = unary(); l = Math.pow(num(l), num(r)); } return l; }
  function unary() { if (isOp("-")) { p++; return -num(unary()); } if (isOp("+")) { p++; return num(unary()); } return postfix(); }
  function postfix() { let v = primary(); while (isOp("%")) { p++; v = num(v) / 100; } return v; }
  function primary() {
    const t = toks[p++];
    if (!t) throw E.ERR;
    if (t.t === "num" || t.t === "str") return t.v;
    if (t.t === "op" && t.v === "(") { const v = expr(); eat(")"); return v; }
    if (t.t === "ref") return ctx.ref(t);

const ed = $("cellEditor"), fin = $("fInput");

// 隠しエディタへの入力 = 編集開始 (IME 対応)

  if (!editing) { const v = ed.value; const cell = sheet().cells[key(act.c, act.r)]; editOrig = cell && cell.v != null ? String(cell.v) : ""; editing = true; editFromBar = false; showEditor(); ed.value = v; refInsert = null; }

// ── キーボード ──
ed.addEventListener("keydown", (e) => {
  if (e.isComposing || composing || e.keyCode === 229) return;
  const mod = e.ctrlKey || e.metaKey;
  if (editing) {
    if (e.key === "Enter" && e.altKey) { e.preventDefault(); insertAtCaret("\n"); return; }
    if (e.key === "Enter") { e.preventDefault(); commitEdit(0, e.shiftKey ? -1 : 1); return; }
    if (e.key === "Tab") { e.preventDefault(); commitEdit(e.shiftKey ? -1 : 1, 0); return; }
    if (e.key === "Escape") { e.preventDefault(); cancelEdit(); return; }
    // 数式入力中に矢印でセル参照を挿入
    if (e.key.startsWith("Arrow") && isRefInsertPoint()) {
      e.preventDefault();
      const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      const base = refInsert ? (e.shiftKey ? refInsert.end : refInsert.end) : { ...act };
      const end = { c: Math.max(0, base.c + d[0]), r: Math.max(0, base.r + d[1]) };
      insertRef(e.shiftKey && refInsert ? refInsert.start : end, end);
      return;
    }

  lastTap.t = 0;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); const v = !curStyle().b; setStyle((x) => (x.b = v)); return; }
  if (mod && e.key.toLowerCase() === "i") { e.preventDefault(); const v = !curStyle().i; setStyle((x) => (x.i = v)); return; }
  if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); anchor = { c: 0, r: 0 }; selEnd = { c: sheet().cols - 1, r: sheet().rows - 1 }; renderSel(); return; }
  if (mod) return; // コピー/貼り付けは copy/paste イベントで

  if (e.key === "Tab") { e.preventDefault(); select(act.c + (e.shiftKey ? -1 : 1), act.r); return; }
  if (e.key === "F2") { e.preventDefault(); startEdit(); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearValues(); return; }
  if (e.key === "PageDown") { e.preventDefault(); select(act.c, act.r + 20); return; }

  const w = {}; for (const c in sh.colW) { if (+c >= at && +c < at + n) continue; w[+c >= at + n ? +c - n : c] = sh.colW[c]; } sh.colW = w;
  sh.cols = Math.max(1, sh.cols - n); select(at, act.r); save(); buildGrid();
}
function sortSel(dir) {
  const { c1, r1, c2, r2 } = selRect(), sh = sheet();
  if (r1 === r2) return;
  pushUndo();
  const rows = [];
  for (let r = r1; r <= r2; r++) { const row = []; for (let c = c1; c <= c2; c++) row.push(sh.cells[key(c, r)] || null); rows.push({ key: cellValue(sh, act.c, r), row }); }
  rows.sort((a, b) => { const x = a.key, y = b.key; if (x == null || x === "") return 1; if (y == null || y === "") return -1; return (cmp(x, y, "<") ? -1 : cmp(x, y, ">") ? 1 : 0) * dir; });
  rows.forEach((o, i) => o.row.forEach((cell, j) => { const k = key(c1 + j, r1 + i); if (cell) sh.cells[k] = cell; else delete sh.cells[k]; }));
  save(); renderCells();
}

$("btnMoreRows").onclick = () => { pushUndo(); sheet().rows += 50; save(); buildGrid(); };

// ═══════════════════════════════════════════════
//  名前ボックス (A1 や B2:D5 を入れるとジャンプ)
// ═══════════════════════════════════════════════
$("nameBox").addEventListener("focus", (e) => e.target.select());
$("nameBox").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const m = /^\s*([A-Za-z]{1,3})(\d+)(?::([A-Za-z]{1,3})(\d+))?\s*$/.exec(e.target.value);
  if (m) {
    const a = { c: colIndex(m[1]), r: +m[2] - 1 };
    ensureSize(a.r + 1, a.c + 1);
    select(a.c, a.r);
    if (m[3]) { const b = { c: colIndex(m[3]), r: +m[4] - 1 }; ensureSize(b.r + 1, b.c + 1); selEnd = b; renderSel(); }
  }
  e.target.blur(); if (!isTouch()) ed.focus({ preventScroll: true });
});

// ═══════════════════════════════════════════════
//  シートタブ
// ═══════════════════════════════════════════════
function renderTabs() {
  const b = book();
  $("tabs").innerHTML = b.sheets.map((s) => `<button class="tab${s.id === b.active ? " on" : ""}" data-id="${s.id}">${esc(s.name)}${s.id === b.active ? '<span class="icon">arrow_drop_down</span>' : ""}</button>`).join("");
}
$("tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab"); if (!t) return;
  if (editing) commitEdit();
  const b = book();
  if (t.dataset.id === b.active) { openSheetMenu(t); return; }
  b.active = t.dataset.id; act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  save(); buildGrid(); renderTabs(); wrap.scrollTo(0, 0);
});
$("btnAddSheet").onclick = () => {
  if (editing) commitEdit();
  const b = book(); let n = b.sheets.length + 1; while (b.sheets.some((s) => s.name === "シート" + n)) n++;
  const s = newSheet("シート" + n); b.sheets.push(s); b.active = s.id;
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  save(); buildGrid(); renderTabs();
};
function openSheetMenu(tab) {
  const b = book(), sh = sheet(), i = b.sheets.indexOf(sh);
  openMenu(tab, [
    { icon: "edit", label: "名前を変更", fn: () => {
      const n = prompt("シート名", sh.name); if (!n || n === sh.name) return;
      if (findSheetByName(n)) { toast("同じ名前のシートがあります"); return; }
      const old = sh.name;
      // 他シートの数式内のシート名も置き換え
      for (const s of b.sheets) for (const k in s.cells) { const c = s.cells[k]; if (typeof c.v === "string" && c.v[0] === "=") c.v = renameSheetInFormula(c.v, old, n); }
      sh.name = n; save(); renderTabs(); renderCells();
    } },
    { icon: "content_copy", label: "コピーを作成", fn: () => { const c = clone(sh); c.id = uid(); let nm = sh.name + " のコピー", j = 2; while (findSheetByName(nm)) nm = sh.name + " のコピー " + j++; c.name = nm; b.sheets.splice(i + 1, 0, c); b.active = c.id; save(); buildGrid(); renderTabs(); } },
    { icon: "arrow_back", label: "左に移動", fn: () => { if (i > 0) { b.sheets.splice(i, 1); b.sheets.splice(i - 1, 0, sh); save(); renderTabs(); } } },
    { icon: "arrow_forward", label: "右に移動", fn: () => { if (i < b.sheets.length - 1) { b.sheets.splice(i, 1); b.sheets.splice(i + 1, 0, sh); save(); renderTabs(); } } },
    "-",
    { icon: "delete", label: "削除", danger: true, fn: () => {
      if (b.sheets.length <= 1) { toast("最後のシートは削除できません"); return; }
      if (!confirm(`「${sh.name}」を削除しますか？`)) return;
      b.sheets.splice(i, 1); b.active = b.sheets[Math.max(0, i - 1)].id; undoStack = []; redoStack = [];
      save(); buildGrid(); renderTabs();
    } },
  ]);
}
function renameSheetInFormula(f, oldN, newN) {
  const q = (n) => (/^[A-Za-z0-9_぀-ヿ㐀-鿿＀-￯]+$/.test(n) ? n : "'" + n.replace(/'/g, "''") + "'");
  const parts = f.split(/("(?:[^"]|"")*")/);
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(^|[^A-Za-z0-9_.$'!])(?:'" + reEsc(oldN.replace(/'/g, "''")) + "'|" + reEsc(oldN) + ")!", "gi");
  return parts.map((p, i) => (i % 2 ? p : p.replace(re, (all, pre) => pre + q(newN) + "!"))).join("");
}

// ═══════════════════════════════════════════════
//  ファイル (スプレッドシートの切替・新規・CSV)
// ═══════════════════════════════════════════════
$("bookName").addEventListener("change", (e) => { const n = e.target.value.trim() || "無題のスプレッドシート"; book().name = n; e.target.value = n; document.title = n; save(); });
$("bookName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
$("bookName").addEventListener("blur", () => { if (!isTouch()) setTimeout(() => positionHiddenEditor(), 0); });

$("btnFile").onclick = (e) => {
  if (editing) commitEdit();
  const books = [...store.books].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  const d = (t) => { const x = new Date(t || 0); return `${x.getMonth() + 1}/${x.getDate()}`; };
  openMenu($("btnFile"), [
    { icon: "add", label: "新しいスプレッドシート", fn: () => { const b = newBook("無題のスプレッドシート"); store.books.push(b); openBook(b.id); setTimeout(() => $("bookName").select(), 50); } },
    { icon: "upload_file", label: "CSV を読み込む (新しいシート)", fn: () => $("csvFile").click() },
    { icon: "download", label: "このシートを CSV で保存", fn: exportCSV },
    { icon: "content_copy", label: "このファイルのコピーを作成", fn: () => { const b = clone(book()); b.id = uid(); b.name += " のコピー"; store.books.push(b); openBook(b.id); } },
    { icon: "delete", label: "このファイルを削除", danger: true, fn: () => {
      if (!confirm(`「${book().name}」を削除しますか？元に戻せません。`)) return;
      store.books = store.books.filter((b) => b.id !== store.current);
      if (!store.books.length) store.books.push(newBook("無題のスプレッドシート"));
      openBook(store.books[0].id);
    } },
    "-",
    ...books.map((b) => ({ icon: "table_view", label: b.name, sub: d(b.updated), cur: b.id === store.current, fn: () => openBook(b.id) })),
  ]);
};
function openBook(id) {
  store.current = id; undoStack = []; redoStack = [];
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  $("bookName").value = book().name; document.title = book().name;
  save(); buildGrid(); renderTabs(); wrap.scrollTo(0, 0);
}
function exportCSV() {
  const sh = sheet(); let maxR = -1, maxC = -1;
  for (const k in sh.cells) { if (sh.cells[k].v === undefined) continue; const p = parseKey(k); maxR = Math.max(maxR, p.r); maxC = Math.max(maxC, p.c); }
  const lines = [];
  for (let r = 0; r <= maxR; r++) { const row = []; for (let c = 0; c <= maxC; c++) { const cell = sh.cells[key(c, r)]; let t = cell && cell.v !== undefined ? fmtValue(cellValue(sh, c, r), cell.s && cell.s.fmt === "yen" ? "" : cell.s && cell.s.fmt) : ""; if (/[",\n]/.test(t)) t = '"' + t.replace(/"/g, '""') + '"'; row.push(t); } lines.push(row.join(",")); }
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${book().name}_${sh.name}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("csvFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return; e.target.value = "";
  const buf = await f.arrayBuffer();
  let text = new TextDecoder("utf-8").decode(buf);
  if (text.includes("�")) { try { text = new TextDecoder("shift_jis").decode(buf); } catch (err) {} } // Excel の Shift_JIS CSV
  text = text.replace(/^﻿/, "");
  const isTsv = /\.tsv$/i.test(f.name) || (text.includes("\t") && !text.split("\n")[0].includes(","));
  const rows = isTsv ? parseTSV(text) : parseCSV(text);
  const b = book(); let name = f.name.replace(/\.(csv|tsv|txt)$/i, ""), j = 2; while (findSheetByName(name)) name = f.name.replace(/\.(csv|tsv|txt)$/i, "") + " " + j++;
  const sh = newSheet(name);
  sh.rows = Math.max(DEF_ROWS, rows.length + 20); sh.cols = Math.max(DEF_COLS, ...rows.map((r) => r.length));
  b.sheets.push(sh); b.active = sh.id;
  rows.forEach((row, r) => row.forEach((v, c) => setRaw(sh, c, r, v)));
  act = { c: 0, r: 0 }; anchor = { ...act }; selEnd = { ...act };
  save(); buildGrid(); renderTabs();
  toast(`${rows.length} 行を読み込みました`);
});
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// ═══════════════════════════════════════════════
//  起動
// ═══════════════════════════════════════════════
window.addEventListener("resize", () => renderSel());
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("menu").classList.contains("open")) closeMenu(); });
// メニュー・フィールド外をクリックしたらデスクトップでは隠しエディタへフォーカスを戻す
document.addEventListener("pointerup", () => { if (!isTouch() && !editing && !isFieldFocused() && !$("menu").classList.contains("open")) setTimeout(() => { if (!isFieldFocused()) ed.focus({ preventScroll: true }); }, 0); });

$("bookName").value = book().name; document.title = book().name;
buildGrid(); renderTabs();
window.__sheet = { evaluate, shiftFormula, store, sheet }; // デバッグ用
</script>
