<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="世界制覇めし">
<link rel="apple-touch-icon" href="/icon.png">
<title>世界制覇めし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #e8590c; --done: #2a8c3a;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 18px 0; gap: 8px; }
.pill { padding: 8px 15px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; text-decoration: none; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }
.pill.primary { background: var(--accent); color: #fff; }
.pill:disabled { opacity: 0.5; }

.wrap { padding: 14px 16px 40px; max-width: 680px; margin: 0 auto; }
.title { font-size: 22px; font-weight: 800; }

/* 世界ピン地図 */
.wmap { width: 100%; aspect-ratio: 20 / 11; display: block; border-radius: 18px; background: #0e1730; box-shadow: 6px 6px 16px var(--sd), -5px -5px 14px var(--sl); margin: 10px 0 12px; cursor: pointer; }

/* 制覇サマリー */
.summary { background: var(--bg); border-radius: 20px; padding: 18px; box-shadow: 6px 6px 16px var(--sd), -5px -5px 14px var(--sl); margin: 0 0 16px; }
.pct { font-size: 44px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
.pct .u { font-size: 20px; }
.pct-sub { font-size: 12px; color: var(--text2); font-weight: 700; margin-top: 4px; }
.pbar { height: 10px; background: rgba(154,160,184,0.22); border-radius: 6px; overflow: hidden; box-shadow: inset 2px 2px 5px var(--sd); margin-top: 12px; }
.pfill { height: 100%; background: linear-gradient(90deg, var(--accent), #f59e0b); border-radius: 6px; transition: width .35s; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; border: none; background: var(--bg); color: var(--text2); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); cursor: pointer; font-family: inherit; }
.chip.on { background: var(--accent); color: #fff; }

.region-label { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: var(--text2); margin: 18px 4px 10px; display: flex; justify-content: space-between; }
.region-label .cnt { color: var(--text3); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 360px){ .grid { grid-template-columns: repeat(3, 1fr); } }
.tile { position: relative; aspect-ratio: 1; border-radius: 14px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 4px; font-family: inherit; }
.tile:active { transform: scale(0.96); }
.tile .fl { font-size: 30px; line-height: 1; }
.tile:not(.done) .fl { filter: grayscale(1); opacity: 0.32; }
.tile .nm { font-size: 10px; font-weight: 700; color: var(--text); line-height: 1.15; text-align: center; }
.tile:not(.done) .nm { color: var(--text3); }
.tile.done { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.tile.done::after { content: "check"; font-family: 'Material Symbols Outlined'; position: absolute; top: 5px; right: 5px; font-size: 14px; color: #fff; background: var(--done); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

/* シート */
.modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(180,184,205,0); visibility: hidden; opacity: 0; transition: background .2s, opacity .2s, visibility 0s linear .2s; }
.modal.open { background: rgba(180,184,205,0.42); visibility: visible; opacity: 1; transition: background .2s, opacity .2s; }
.sheet { background: var(--bg); border-radius: 28px 28px 0 0; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 6px 18px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .2s cubic-bezier(.2,.8,.2,1); box-shadow: -2px -10px 30px rgba(148,152,176,0.35); }
.modal.open .sheet { transform: translateY(0); }
.grab { padding: 14px 18px 6px; margin: 0 -18px 4px; touch-action: none; user-select: none; }
.grab .handle { width: 46px; height: 5px; border-radius: 3px; background: rgba(168,172,192,0.45); margin: 0 auto; }
.sheet-head { display: flex; align-items: center; gap: 10px; margin: 4px 2px 12px; }
.sheet-head .fl { font-size: 30px; }
.sheet-head .t { font-size: 19px; font-weight: 900; }
.sheet-head .s { font-size: 11px; color: var(--text2); font-weight: 700; }

.visit { border-radius: 16px; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); padding: 14px; margin-bottom: 10px; }
.visit .rname { font-size: 15px; font-weight: 800; }
.visit .rmeta { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 3px; }
.visit .photos { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.visit .photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; box-shadow: 2px 2px 6px var(--sd); }
.visit .vedit { font-size: 11px; font-weight: 800; color: var(--accent); margin-top: 8px; cursor: pointer; display: inline-block; }

.field-label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--text2); margin: 14px 2px 6px; }
input.inp, textarea.inp { width: 100%; padding: 11px 14px; border-radius: 12px; border: none; font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); outline: none; }
textarea.inp { min-height: 60px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.photo-thumb { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; box-shadow: 2px 2px 6px var(--sd); }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .rm { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.add-photo { width: 76px; height: 76px; border-radius: 10px; border: 1px dashed var(--accent); background: transparent; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.add-photo .icon { font-size: 24px; vertical-align: 0; }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.actions .pill { flex: 1; text-align: center; padding: 13px; font-size: 14px; }
.danger { color: #b04040; }
.empty { text-align: center; color: var(--text2); font-weight: 600; font-size: 13px; padding: 22px; }

.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; z-index: 500; display: none; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.toast.err { background: #b04040; }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
</style>
</head>
<body>
<div id="signinOverlay">
  <div style="font-size:24px;font-weight:800;">世界制覇めし</div>
  <a class="pill" href="/" style="text-decoration:none;">トップに戻る</a>
  <div id="signinErr" style="font-size:11px;color:#b04040;font-family:monospace;"></div>
</div>

<div id="app" style="display:none;">
  <div class="bar">
    <a class="pill" href="/"><span class="icon">arrow_back</span> 戻る</a>
    <span style="font-size:11px;letter-spacing:0.2em;color:var(--text3);font-weight:700;text-transform:uppercase;">WORLD MESHI</span>
    <span style="width:52px;"></span>
  </div>
  <div class="wrap">
    <div class="title">世界制覇めし</div>
    <canvas class="wmap" id="wmap"></canvas>
    <div class="summary">
      <div class="pct" id="pct">0<span class="u">%</span></div>
      <div class="pct-sub" id="pctSub">0 / 0 か国 制覇</div>
      <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<!-- 国の詳細シート -->
<div class="modal" id="cModal">
  <div class="sheet" id="cSheet">
    <div class="grab" id="cGrab"><div class="handle"></div></div>
    <div id="cBody"></div>
  </div>
</div>

<!-- 記録の追加/編集シート -->
<div class="modal" id="eModal">
  <div class="sheet" id="eSheet">
    <div class="grab" id="eGrab"><div class="handle"></div></div>
    <div id="eBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/config.js"></script>
<script type="module">
import { initAuthBoot, api } from "/api-auth.js";

const $ = (id) => document.getElementById(id);
const REGIONS = [
  { name: "アジア", items: [["日本","🇯🇵"],["韓国","🇰🇷"],["中国","🇨🇳"],["台湾","🇹🇼"],["タイ","🇹🇭"],["ベトナム","🇻🇳"],["インド","🇮🇳"],["ネパール","🇳🇵"],["インドネシア","🇮🇩"],["マレーシア","🇲🇾"],["シンガポール","🇸🇬"],["フィリピン","🇵🇭"],["スリランカ","🇱🇰"],["ミャンマー","🇲🇲"],["モンゴル","🇲🇳"],["カンボジア","🇰🇭"]] },
  { name: "中東", items: [["トルコ","🇹🇷"],["レバノン","🇱🇧"],["イスラエル","🇮🇱"],["イラン","🇮🇷"],["シリア","🇸🇾"]] },
  { name: "ヨーロッパ", items: [["イタリア","🇮🇹"],["フランス","🇫🇷"],["スペイン","🇪🇸"],["ドイツ","🇩🇪"],["イギリス","🇬🇧"],["ポルトガル","🇵🇹"],["ギリシャ","🇬🇷"],["ロシア","🇷🇺"],["ハンガリー","🇭🇺"],["ポーランド","🇵🇱"],["スイス","🇨🇭"],["ベルギー","🇧🇪"],["オランダ","🇳🇱"],["スウェーデン","🇸🇪"],["ジョージア","🇬🇪"],["ウクライナ","🇺🇦"]] },
  { name: "アフリカ", items: [["エジプト","🇪🇬"],["モロッコ","🇲🇦"],["エチオピア","🇪🇹"],["チュニジア","🇹🇳"],["ナイジェリア","🇳🇬"],["南アフリカ","🇿🇦"],["セネガル","🇸🇳"],["ケニア","🇰🇪"]] },
  { name: "北中米", items: [["アメリカ","🇺🇸"],["メキシコ","🇲🇽"],["カナダ","🇨🇦"],["キューバ","🇨🇺"],["ジャマイカ","🇯🇲"]] },
  { name: "南米", items: [["ブラジル","🇧🇷"],["ペルー","🇵🇪"],["アルゼンチン","🇦🇷"],["コロンビア","🇨🇴"],["チリ","🇨🇱"]] },
  { name: "オセアニア", items: [["オーストラリア","🇦🇺"],["ハワイ","🌺"],["ニュージーランド","🇳🇿"]] },
];
const FLAG = {}; REGIONS.forEach(r => r.items.forEach(([n, f]) => FLAG[n] = f));
const TOTAL = Object.keys(FLAG).length;
// 各国のおおよその緯度・経度（世界ピン地図用）[lat, lng]
const COORD = {
  "日本":[36,138],"韓国":[37,127.5],"中国":[35,105],"台湾":[23.7,121],"タイ":[15,101],"ベトナム":[16,106],"インド":[22,79],"ネパール":[28,84],"インドネシア":[-2,118],"マレーシア":[4,102],"シンガポール":[1.3,103.8],"フィリピン":[13,122],"スリランカ":[7.5,80.7],"ミャンマー":[21,96],"モンゴル":[46,105],"カンボジア":[12.5,105],
  "トルコ":[39,35],"レバノン":[33.8,35.8],"イスラエル":[31.5,34.8],"イラン":[32,53],"シリア":[35,38],
  "イタリア":[42,12.5],"フランス":[46,2],"スペイン":[40,-4],"ドイツ":[51,10],"イギリス":[54,-2],"ポルトガル":[39.5,-8],"ギリシャ":[39,22],"ロシア":[57,60],"ハンガリー":[47,19.5],"ポーランド":[52,19],"スイス":[47,8],"ベルギー":[50.5,4.5],"オランダ":[52.3,5.5],"スウェーデン":[62,15],"ジョージア":[42,43.5],"ウクライナ":[49,32],
  "エジプト":[26,30],"モロッコ":[32,-6],"エチオピア":[9,40],"チュニジア":[34,9],"ナイジェリア":[9,8],"南アフリカ":[-30,25],"セネガル":[14.5,-14.5],"ケニア":[0.5,38],
  "アメリカ":[39,-98],"メキシコ":[23,-102],"カナダ":[56,-106],"キューバ":[22,-79],"ジャマイカ":[18,-77],
  "ブラジル":[-10,-52],"ペルー":[-10,-76],"アルゼンチン":[-34,-64],"コロンビア":[4,-73],"チリ":[-33,-71],
  "オーストラリア":[-25,133],"ハワイ":[20,-157],"ニュージーランド":[-41,174],
};

let visits = [];
let filter = "みんな";
let myName = localStorage.getItem("tabemap_me") || "";
const photoCache = {};   // visitId -> [base64]

// ── utils ──
let _tt = null;
function toast(m, e = false) { const t = $("toast"); t.textContent = m; t.classList.toggle("err", !!e); t.style.display = "block"; clearTimeout(_tt); _tt = setTimeout(() => t.style.display = "none", e ? 4000 : 1800); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function toBase64(file, maxSize = 1200, q = 0.6) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(maxSize / img.width, maxSize / img.height, 1); const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q).split(",")[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像失敗")); };
    img.src = url;
  });
}

// ── データ ──
async function load() {
  try { visits = await api("GET", "/api/tabemap"); }
  catch (e) { toast("読み込み失敗: " + e.message, true); visits = []; }
  render();
}
// 「誰と食べた」はカンマ等区切りで複数人。どんちゃんで絞ると どんちゃんと食べた記録だけ。
function membersOf(v) { return (v.eater || "").split(/[,、\/・\s]+/).map(s => s.trim()).filter(Boolean); }
function inFilter(v) { return filter === "みんな" || membersOf(v).includes(filter); }
function members() {
  const s = new Set(); visits.forEach(v => membersOf(v).forEach(m => s.add(m)));
  return [...s];
}
function conqueredSet() {
  const s = new Set();
  visits.forEach(v => { if (inFilter(v)) s.add(v.country); });
  return s;
}

// ── 塗り絵ワールド地図（各国を位置ごとのタイルに。食べた国を塗りつぶす）──
// 緯度経度をグリッドに投影し、重なったら近いマスへずらして配置（決定論的）
const GRID = (() => {
  const cols = 20, rows = 11, taken = {}, layout = {};
  const key = (c, r) => c + "," + r;
  for (const [name, [lat, lng]] of Object.entries(COORD)) {
    let c = Math.max(0, Math.min(cols - 1, Math.round((lng + 180) / 360 * (cols - 1))));
    let r = Math.max(0, Math.min(rows - 1, Math.round((90 - lat) / 180 * (rows - 1))));
    if (taken[key(c, r)]) {
      let found = null;
      for (let rad = 1; rad < Math.max(cols, rows) && !found; rad++)
        for (let dc = -rad; dc <= rad && !found; dc++)
          for (let dr = -rad; dr <= rad && !found; dr++) {
            if (Math.max(Math.abs(dc), Math.abs(dr)) !== rad) continue;
            const nc = c + dc, nr = r + dr;
            if (nc < 0 || nc >= cols || nr < 0 || nr >= rows || taken[key(nc, nr)]) continue;
            found = [nc, nr];
          }
      if (found) { c = found[0]; r = found[1]; }
    }
    taken[key(c, r)] = 1; layout[name] = { col: c, row: r };
  }
  return { cols, rows, layout };
})();
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function drawMap(conq) {
  const cv = $("wmap"); if (!cv) return;
  const cssW = cv.clientWidth || 340, cell = cssW / GRID.cols, cssH = cell * GRID.rows;
  const DPR = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(cssW * DPR); cv.height = Math.round(cssH * DPR);
  const g = cv.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, cssW, cssH);
  const pad = cell * 0.09, radius = cell * 0.22;
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const [name, pos] of Object.entries(GRID.layout)) {
    const x = pos.col * cell + pad, y = pos.row * cell + pad, w = cell - 2 * pad, h = cell - 2 * pad;
    const done = conq.has(name);
    rr(g, x, y, w, h, radius);
    if (done) { g.fillStyle = "#e8590c"; g.fill(); }
    else { g.fillStyle = "rgba(150,162,196,0.10)"; g.fill(); g.lineWidth = 1; g.strokeStyle = "rgba(150,162,196,0.25)"; g.stroke(); }
    g.globalAlpha = done ? 1 : 0.3;
    g.font = `${Math.round(cell * 0.5)}px serif`;
    g.fillText(FLAG[name], x + w / 2, y + h / 2 + 1);
    g.globalAlpha = 1;
  }
}
$("wmap").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect(), cell = r.width / GRID.cols;
  const col = Math.floor((e.clientX - r.left) / cell), row = Math.floor((e.clientY - r.top) / cell);
  for (const [name, pos] of Object.entries(GRID.layout)) if (pos.col === col && pos.row === row) { openCountry(name); return; }
});
addEventListener("resize", () => { if ($("app").style.display !== "none") render(); });

// ── 描画 ──
function render() {
  const conq = conqueredSet();
  drawMap(conq);
  const done = [...conq].filter(c => FLAG[c]).length;
  const pct = Math.round((done / TOTAL) * 100);
  $("pct").innerHTML = `${pct}<span class="u">%</span>`;
  $("pctSub").textContent = `${done} / ${TOTAL} か国 制覇`;
  $("pfill").style.width = pct + "%";

  $("board").innerHTML = REGIONS.map(r => {
    const dcount = r.items.filter(([n]) => conq.has(n)).length;
    return `<div class="region-label">${r.name}<span class="cnt">${dcount}/${r.items.length}</span></div>
      <div class="grid">${r.items.map(([n, f]) => `
        <button class="tile ${conq.has(n) ? "done" : ""}" data-c="${esc(n)}" type="button">
          <span class="fl">${f}</span><span class="nm">${esc(n)}</span>
        </button>`).join("")}</div>`;
  }).join("");
  document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => openCountry(t.dataset.c)));
}

// ── 国の詳細シート ──
async function openCountry(country) {
  const vs = visits.filter(v => v.country === country);
  $("cBody").innerHTML = `
    <div class="sheet-head">
      <span class="fl">${FLAG[country] || "🍽"}</span>
      <div><div class="t">${esc(country)}</div><div class="s">${vs.length ? vs.length + " 件の記録" : "まだ未制覇"}</div></div>
    </div>
    <div id="cVisits">${vs.length ? '<div class="empty">写真を読み込み中…</div>' : '<div class="empty">この国の料理はまだ。食べたら記録しよう！</div>'}</div>
    <div class="actions"><button class="pill primary" id="cAddBtn" type="button"><span class="icon">add</span> この国を記録する</button></div>
  `;
  $("cAddBtn").addEventListener("click", () => { closeModal("cModal"); openEdit({ country }); });
  openModal("cModal");
  if (vs.length) {
    // 写真を読み込んで描画
    for (const v of vs) { if (!photoCache[v.id]) { try { photoCache[v.id] = (await api("GET", `/api/tabemap/${v.id}/photos`)).photos || []; } catch { photoCache[v.id] = []; } } }
    $("cVisits").innerHTML = vs.map(v => `
      <div class="visit">
        <div class="rname">${esc(v.restaurant || "(店名なし)")}</div>
        <div class="rmeta">${[v.area, v.eater, v.visitedOn].filter(Boolean).map(esc).join(" · ")}</div>
        ${v.memo ? `<div class="rmeta" style="margin-top:6px;color:var(--text)">${esc(v.memo)}</div>` : ""}
        ${(photoCache[v.id] || []).length ? `<div class="photos">${photoCache[v.id].map(p => `<img src="data:image/jpeg;base64,${p}" alt="">`).join("")}</div>` : ""}
        <span class="vedit" data-id="${v.id}">編集</span>
      </div>`).join("");
    document.querySelectorAll(".vedit").forEach(el => el.addEventListener("click", () => {
      const v = vs.find(x => x.id === el.dataset.id);
      closeModal("cModal");
      openEdit({ ...v, photos: photoCache[v.id] ? [...photoCache[v.id]] : [] });
    }));
  }
}

// ── 追加/編集シート ──
let cur = null;
function openEdit(v) {
  cur = { id: v.id || null, country: v.country || "", restaurant: v.restaurant || "", area: v.area || "",
          eater: v.eater || myName, memo: v.memo || "", visitedOn: v.visitedOn || new Date().toISOString().slice(0, 10),
          photos: Array.isArray(v.photos) ? v.photos : [] };
  renderEdit();
  openModal("eModal");
}
function renderEdit() {
  $("eBody").innerHTML = `
    <div class="sheet-head"><span class="fl">${FLAG[cur.country] || "🍽"}</span>
      <div><div class="t">${esc(cur.country || "記録")}</div><div class="s">${cur.id ? "編集" : "食べた記録を追加"}</div></div></div>
    <div class="field-label">店名</div>
    <input class="inp" id="fRest" placeholder="例：ガネーシャ" value="${esc(cur.restaurant)}">
    <div class="two">
      <div><div class="field-label">エリア</div><input class="inp" id="fArea" placeholder="例：新大久保" value="${esc(cur.area)}"></div>
      <div><div class="field-label">日付</div><input class="inp" id="fDate" type="date" value="${esc(cur.visitedOn)}"></div>
    </div>
    <div class="field-label">メモ</div>
    <textarea class="inp" id="fMemo" placeholder="美味しかったもの・感想">${esc(cur.memo)}</textarea>
    <div class="field-label">写真（最大3枚）</div>
    <div class="photo-row" id="photoRow"></div>
    <div class="actions">
      ${cur.id ? `<button class="pill danger" id="delBtn" type="button"><span class="icon">delete</span></button>` : ""}
      <button class="pill primary" id="saveBtn" type="button"><span class="icon">save</span> ${cur.id ? "保存" : "制覇に追加"}</button>
    </div>
    <input type="file" id="photoIn" accept="image/*" multiple style="display:none">
  `;
  $("fRest").addEventListener("input", e => cur.restaurant = e.target.value);
  $("fArea").addEventListener("input", e => cur.area = e.target.value);
  $("fDate").addEventListener("input", e => cur.visitedOn = e.target.value);
  $("fMemo").addEventListener("input", e => cur.memo = e.target.value);
  $("saveBtn").addEventListener("click", save);
  $("delBtn")?.addEventListener("click", del);
  renderPhotos();
  $("photoIn").addEventListener("change", async (ev) => {
    const files = [...(ev.target.files || [])]; ev.target.value = "";
    for (const f of files) { if (cur.photos.length >= 3) break; try { cur.photos.push(await toBase64(f)); } catch {} }
    renderPhotos();
  });
}
function renderPhotos() {
  const row = $("photoRow");
  row.innerHTML = cur.photos.map((p, i) => `<div class="photo-thumb"><img src="data:image/jpeg;base64,${p}" alt=""><button class="rm" data-i="${i}" type="button">×</button></div>`).join("")
    + (cur.photos.length < 3 ? `<button class="add-photo" id="addPhoto" type="button"><span class="icon">add_a_photo</span></button>` : "");
  $("addPhoto")?.addEventListener("click", () => $("photoIn").click());
  row.querySelectorAll(".rm").forEach(b => b.addEventListener("click", () => { cur.photos.splice(Number(b.dataset.i), 1); renderPhotos(); }));
}
async function save() {
  const btn = $("saveBtn"); btn.disabled = true;
  if ((cur.eater || "").trim()) { myName = cur.eater.trim(); localStorage.setItem("tabemap_me", myName); }
  const payload = { country: cur.country, restaurant: cur.restaurant, area: cur.area, eater: cur.eater, memo: cur.memo, visitedOn: cur.visitedOn || null, photos: cur.photos };
  try {
    if (!cur.id) { const s = await api("POST", "/api/tabemap", payload); cur.id = s.id; }
    else await api("PUT", `/api/tabemap/${cur.id}`, payload);
    photoCache[cur.id] = [...cur.photos];
    toast("記録しました🎉");
    closeModal("eModal");
    await load();
  } catch (e) { toast("保存失敗: " + e.message, true); btn.disabled = false; }
}
async function del() {
  if (!cur?.id || !confirm("この記録を削除しますか？")) return;
  try { await api("DELETE", `/api/tabemap/${cur.id}`); delete photoCache[cur.id]; toast("削除しました"); closeModal("eModal"); await load(); }
  catch (e) { toast("削除失敗: " + e.message, true); }
}

// ── モーダル共通（下ドラッグで閉じる）──
function openModal(id) { $(id).classList.add("open"); }
function closeModal(id) { $(id).classList.remove("open"); const s = $(id).querySelector(".sheet"); s.style.transition = ""; s.style.transform = ""; }
function wireModal(modalId, grabId) {
  $(modalId).addEventListener("click", e => { if (e.target === $(modalId)) closeModal(modalId); });
  const grab = $(grabId), sheet = $(modalId).querySelector(".sheet"); let sy = null, dy = 0;
  grab.addEventListener("pointerdown", e => { sy = e.clientY; dy = 0; sheet.style.transition = "none"; try { grab.setPointerCapture(e.pointerId); } catch {} });
  grab.addEventListener("pointermove", e => { if (sy === null) return; dy = e.clientY - sy; if (dy > 0) sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (sy === null) return; sy = null; sheet.style.transition = ""; if (dy > 100) closeModal(modalId); else sheet.style.transform = ""; dy = 0; };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
}
wireModal("cModal", "cGrab"); wireModal("eModal", "eGrab");

initAuthBoot({
  returnPath: "/tabemap/",
  guestEmails: ["dddddoro@gmail.com"],   // どんちゃん (社外ゲスト) も tabemap だけ入場OK
  onReady: async () => { $("app").style.display = ""; $("board").innerHTML = '<div class="empty">読み込み中…</div>'; await load(); },
});
</script>
