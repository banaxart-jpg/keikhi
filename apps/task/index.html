<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク">
<link rel="apple-touch-icon" href="/task/icon.svg">
<title>タスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #4961ff; --accent2: #6a7eff; --accent-glow: rgba(73,97,255,0.35);
  --hi: #e85b5b; --mid: #e0a040; --lo: #9098b0;
  /* Google カレンダー準拠 */
  --role-natori: #7986cb;     /* ラベンダー */
  --role-konishi: #616161;    /* グラファイト */
  --role-both: #e67c73;       /* フラミンゴ */
}
body { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 400; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

#signinOverlay { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay .pill { padding: 14px 28px; border-radius: 30px; background: var(--bg); box-shadow: 6px 6px 16px var(--sd), -6px -6px 16px var(--sl); font-weight: 700; }
.signin-err { font-size: 11px; color: #b04040; max-width: 340px; white-space: pre-wrap; font-family: monospace; word-break: break-word; }

.top { padding: 54px 18px 12px; display: flex; justify-content: space-between; align-items: center; }
.back, .signout { font-size: 13px; font-weight: 800; color: var(--text2); background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; padding: 6px 10px; }
.title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.me-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 30px; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); font-size: 11px; font-weight: 700; color: var(--text2); margin: 0 18px 14px; }
.me-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* 現場タブ (kaimono と同パターン)。雑務 + /api/sites の各現場 */
.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: 'Outfit', sans-serif; transition: all 200ms ease; position: relative; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(50,70,200,0.35), -3px -3px 10px var(--sl); }
.tab .count { font-size: 10px; font-weight: 800; margin-left: 6px; opacity: 0.7; }

/* SQL 移行ボタン (初回だけ表示、移行済んだら非表示) */
.migrate-btn { display: block; margin: 30px auto; padding: 10px 18px; border-radius: 14px; border: 1px dashed var(--text3); background: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; color: var(--text3); }
.migrate-btn:hover { color: var(--accent); border-color: var(--accent); }
.migrate-btn:disabled { opacity: 0.5; cursor: wait; }

.list { padding: 0 16px 130px; display: flex; flex-direction: column; gap: 9px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; font-weight: 600; }

/* カード本体: 外側 .card-wrap がシャドウ + 背景を持ち、展開時はそのまま下に
   actions を内包して縦に伸びる。.card 自体は透明な inner row。 */
.card-wrap { position: relative; background: var(--bg); border-radius: 16px; box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); transition: box-shadow 200ms ease; overflow: hidden; }
.card-wrap.expanded { box-shadow: 9px 9px 20px var(--sd), -6px -6px 14px var(--sl); }
.card-wrap.done { opacity: 0.55; }
.card { background: transparent; padding: 11px 14px 11px 11px; display: flex; align-items: center; gap: 11px; touch-action: pan-y; user-select: none; transition: transform 200ms ease, opacity 200ms ease, box-shadow 200ms ease; position: relative; }
/* 横スワイプ中の card は wrap から浮き上がって見せる */
.card.dragging { z-index: 100; background: var(--bg); border-radius: 16px; box-shadow: 12px 12px 28px var(--sd), -4px -4px 14px var(--sl); }
.card-wrap.done .card-title { text-decoration: line-through; }

/* 担当ピッカー (左端)。
   socket: subtle inset shadow で「板に空いた穴」の凹みを表現 (background は無し、
   card の地色を透過、影だけで深さを出す)。
   コインは flipping 中、rotateY が --flip-angle で動的に回転、中身は:
     - .role-edge: コインの「側面」を表す細長い縦バー (rotateY(-90deg))
     - .role-face.front / .back: 表裏の disc */
.role-picker { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.role-socket {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  perspective: 700px;
  transform-style: preserve-3d;
  box-shadow:
    inset 2px 2px 5px var(--sd),
    inset -1.5px -1.5px 4px var(--sl);
}
.role-picker:not(.open) .role-socket { display: none; }
.role-picker:not(.open) .role-socket.current-socket { display: flex; }
.role-picker.open .role-socket:not(.current-socket) { opacity: 0.6; }

.role-btn {
  position: relative;
  z-index: 2;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: white;
  cursor: pointer; flex-shrink: 0;
  transition: all 200ms ease;
  box-shadow:
    2px 2px 4px rgba(0,0,0,0.30),
    -1px -1px 3px var(--sl),
    inset 0 0 0 1.2px rgba(255,255,255,0.20),
    inset 0 -2px 3px rgba(0,0,0,0.20);
}
.role-btn.role-natori { background: var(--role-natori); }
.role-btn.role-konishi { background: var(--role-konishi); }
.role-btn.role-both { background: var(--role-both); }
.role-picker.open .role-btn:active { transform: scale(0.92); }

/* flipping クラスが付いた瞬間、コインは edge + 2 面構造に切り替わる。
   --flip-angle (deg) で rotateY を動的駆動。.swiping 中は transition off で
   指の動きに即座に追従、release 後は transition 復活で滑らかにアニメ。 */
.role-btn.flipping {
  transform-style: preserve-3d;
  background: transparent !important;
  box-shadow: none !important;
  transform: rotateY(var(--flip-angle, 0deg));
  transition: transform 220ms cubic-bezier(.4, .2, .3, 1);
}
.role-btn.flipping.swiping { transition: none; }

/* コインの「側面」: 1 枚の細長い縦バーを rotateY(-90deg) で予めコイン面に
   直交させてある。coin が rotateY(90°) 回転した瞬間にこのバーの法線が +Z
   (カメラ方向) を向くため、edge-on 表示で「コインの厚みのある側面」が現れる。
   コインが 0° / 180° のときはバーは edge-on で 1 ピクセル線、face に隠されて
   実質非表示。 */
.role-edge {
  position: absolute;
  left: 50%; top: 1px;
  width: 7px; height: 30px;
  margin-left: -3.5px;
  background: var(--coin-side, #444);
  border-radius: 1.5px;
  transform: rotateY(-90deg);
  pointer-events: none;
  box-shadow:
    inset 0 -2px 3px rgba(0,0,0,0.30),
    inset 0 1px 2px rgba(255,255,255,0.15);
}
.role-btn.role-natori   { --coin-side: #5a6498; }
.role-btn.role-konishi  { --coin-side: #444444; }
.role-btn.role-both     { --coin-side: #b35850; }

.role-face {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: white;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow:
    2px 2px 4px rgba(0,0,0,0.25),
    inset 0 0 0 1.2px rgba(255,255,255,0.22),
    inset 0 -2px 3px rgba(0,0,0,0.22);
}
.role-face.front { transform: translateZ(2.7px); }
.role-face.back  { transform: rotateY(180deg) translateZ(2.7px); }
.role-face.role-natori { background: var(--role-natori); }
.role-face.role-konishi { background: var(--role-konishi); }
.role-face.role-both { background: var(--role-both); }

/* タイトル + メタ */
.pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pip.p1 { background: var(--hi); box-shadow: 0 0 6px rgba(232,91,91,0.6); }
.pip.p2 { background: var(--mid); box-shadow: 0 0 6px rgba(224,160,64,0.5); }
.pip.p3 { background: var(--lo); }
.body { flex: 1; min-width: 0; }
.row-top { display: flex; align-items: center; gap: 7px; }
.card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.card-meta { font-size: 10px; color: var(--text3); font-weight: 700; margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.deadline { color: var(--accent); font-weight: 800; }
.deadline.soon { color: var(--mid); }
.deadline.over { color: var(--hi); }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hi); box-shadow: 0 0 5px rgba(232,91,91,0.7); flex-shrink: 0; }

/* アクションバー (展開時) */
.actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 11px 12px; border-top: 1px solid rgba(168,172,192,0.18); margin-top: 2px; overflow: hidden; animation: slide-down 200ms ease-out; transform-origin: top; }
@keyframes slide-down {
  from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; border-top-color: transparent; }
  to   { opacity: 1; max-height: 200px; padding-top: 8px; padding-bottom: 12px; }
}
.act-btn { padding: 7px 11px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11px; color: var(--text2); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); }
.act-btn:active { box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl); transform: scale(0.96); }
.act-btn.del { color: #b04040; }
.act-btn.done { color: #3a9a6a; }

/* FAB */
.fab { position: fixed; right: 22px; bottom: 28px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 32px; font-weight: 300; line-height: 1; border: none; cursor: pointer; box-shadow: 8px 8px 22px rgba(50,70,200,0.45), -3px -3px 10px var(--sl); z-index: 10; transition: transform 200ms ease, box-shadow 200ms ease; }
.fab:active { transform: scale(0.93); }

/* モーダル: 開閉とも transition 駆動 */
.modal {
  position: fixed; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(180,184,205,0);
  visibility: hidden; opacity: 0; pointer-events: none;
  z-index: 50;
  transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 200ms;
}
.modal.open {
  background: rgba(180,184,205,0.42);
  visibility: visible; opacity: 1; pointer-events: auto;
  transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 0s;
}
.sheet {
  background: var(--bg); border-radius: 32px 32px 0 0;
  box-shadow: -2px -10px 35px rgba(148,152,176,0.4);
  width: 100%; max-width: 480px; padding: 14px 20px 32px; max-height: 90vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform 200ms cubic-bezier(.2,.8,.2,1);
}
.modal.open .sheet { transform: translateY(0); }
.handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(100,104,130,0.22); margin: 0 auto 16px; }
.sheet h3 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 700; }
.inp { width: 100%; padding: 12px 14px; font-size: 15px; color: var(--text); outline: none; border: none; border-radius: 14px; font-family: 'Outfit', sans-serif; font-weight: 600; background: var(--bg2); box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl); -webkit-appearance: none; appearance: none; }
.inp::placeholder { color: var(--text3); }
.choice { display: flex; gap: 8px; }
.choice button { flex: 1; padding: 12px 6px; border-radius: 14px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); }
.choice button.sel { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); color: var(--accent); }
.choice button.sel.p1 { color: var(--hi); }
.choice button.sel.p2 { color: var(--mid); }
.choice button.sel.p3 { color: var(--lo); }
.save { width: 100%; padding: 16px; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: 800; color: white; font-family: 'Outfit', sans-serif; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 18px rgba(50,70,200,0.45), -3px -3px 10px var(--sl); margin-top: 10px; transition: opacity 200ms ease; }
.save:active { transform: scale(0.97); }
.save:disabled { opacity: 0.6; cursor: wait; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, reactive, computed, onMounted, onBeforeUnmount, nextTick } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { gateInternal } from "/internal-gate.js";

const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
const LAST_SEEN_KEY = "task_last_seen";

const NAME_BY_EMAIL = {
  "info@banax.tokyo": "名取",
  "banaxart@gmail.com": "名取",
  "konishi0221@gmail.com": "小西",
};
const PARTNER_OF = {
  "info@banax.tokyo": "konishi0221@gmail.com",
  "banaxart@gmail.com": "konishi0221@gmail.com",
  "konishi0221@gmail.com": "info@banax.tokyo",
};
const PERSON_KEY = {
  "info@banax.tokyo": "natori",
  "banaxart@gmail.com": "natori",
  "konishi0221@gmail.com": "konishi",
};

const TEMPLATE = `
<div>
  <div v-if="!signedIn" id="signinOverlay">
    <div class="pill">サインインしてください</div>
    <button class="pill" @click="goLauncher">ランチャーへ戻る</button>
    <div class="signin-err">{{ signinErr }}</div>
  </div>

  <div v-else>
    <div class="top">
      <button class="back" @click="goLauncher">← 戻る</button>
      <div class="title">タスク</div>
      <button class="signout" @click="doSignOut">⏻</button>
    </div>
    <div class="me-pill"><span class="me-dot"></span><span>{{ meLabel }}</span></div>

    <div class="tabs">
      <button v-for="tab in tabs" :key="tab.key"
              class="tab" :class="{ on: currentSite === tab.key }"
              @click="onTabClick(tab.key)">
        {{ tab.label }}<span v-if="tabCount(tab.key)" class="count">{{ tabCount(tab.key) }}</span>
      </button>
    </div>

    <div class="list">
      <div v-if="!sortedTasks.length" class="empty">「{{ currentLabel }}」のタスクはありません</div>
      <div v-for="t in sortedTasks" :key="t.id"
           class="card-wrap"
           :class="{ done: t.status === 'done', expanded: expandedId === t.id }">
        <div class="card"
             :class="{ dragging: swipe.taskId === t.id && swipe.dragging }"
             :style="cardStyleFor(t)"
             :data-task-id="t.id"
             @pointerdown="onCardDown($event, t)">
          <div class="role-picker" :class="{ open: pickerOpenId === t.id }">
            <div v-for="pos in ['left','center','right']" :key="pos"
                 class="role-socket"
                 :class="{ 'current-socket': pos === posOf(t) }">
              <button class="role-btn"
                      :class="roleBtnClass(t, pos)"
                      :style="roleBtnStyle(t, pos)"
                      @click.stop="onRoleClick(t, pos)">
                <template v-if="isFlipping(t, pos)">
                  <span class="role-edge"></span>
                  <span class="role-face front" :class="'role-' + colorKey(swipe.fromPos)">{{ roleLabel(swipe.fromPos) }}</span>
                  <span class="role-face back" :class="'role-' + colorKey(swipe.nextPos)">{{ roleLabel(swipe.nextPos) }}</span>
                </template>
                <template v-else>{{ roleLabel(pos) }}</template>
              </button>
            </div>
          </div>
          <div class="body">
            <div class="row-top">
              <div class="pip" :class="'p' + (Number(t.priority) || 2)"></div>
              <div class="card-title">{{ t.title || '(無題)' }}</div>
              <div v-if="isUnread(t)" class="unread-dot"></div>
            </div>
            <div v-if="t.deadline" class="card-meta">
              <span class="deadline" :class="deadlineClass(t.deadline)">⏰ {{ fmtDate(t.deadline) }}</span>
            </div>
          </div>
        </div>
        <div v-if="expandedId === t.id" class="actions">
          <button class="act-btn done" @click.stop="onToggleDone(t)">{{ t.status === 'done' ? '戻す' : '完了' }}</button>
          <button class="act-btn" @click.stop="onCyclePriority(t)">優先度 {{ ['高','中','低'][((t.priority || 2) - 1)] }}</button>
          <button class="act-btn" @click.stop="openModal(t)">編集</button>
          <button class="act-btn del" @click.stop="onDelete(t)">削除</button>
        </div>
      </div>
    </div>

    <button v-if="tasks.length === 0" class="migrate-btn" :disabled="migrating" @click="onMigrate">
      {{ migrating ? '取り込み中…' : '📥 Cloud SQL から既存タスクを取り込み' }}
    </button>

    <button class="fab" @click="openModal(null)">＋</button>

    <div class="modal" :class="{ open: modalOpen }" @click.self="closeModal">
      <div class="sheet">
        <div class="handle"></div>
        <h3>{{ editingId ? '編集' : '新規タスク' }}</h3>
        <div class="field">
          <label>内容</label>
          <input class="inp" v-model="form.title" placeholder="やること（1行）" maxlength="120" ref="titleInput">
        </div>
        <div class="field">
          <label>誰がやる</label>
          <div class="choice">
            <button :class="{ sel: form.who === 'left' }" @click="form.who = 'left'">相手</button>
            <button :class="{ sel: form.who === 'center' }" @click="form.who = 'center'">共同</button>
            <button :class="{ sel: form.who === 'right' }" @click="form.who = 'right'">自分</button>
          </div>
        </div>
        <div class="field">
          <label>優先度</label>
          <div class="choice">
            <button :class="['p1', { sel: form.priority === 1 }]" @click="form.priority = 1">高</button>
            <button :class="['p2', { sel: form.priority === 2 }]" @click="form.priority = 2">中</button>
            <button :class="['p3', { sel: form.priority === 3 }]" @click="form.priority = 3">低</button>
          </div>
        </div>
        <div class="field">
          <label>期限（任意）</label>
          <input class="inp" type="date" v-model="form.deadline">
        </div>
        <div class="field">
          <label>現場（雑務 = 会社全般）</label>
          <select class="inp" v-model="form.site">
            <option value="">雑務</option>
            <option v-for="s in sites" :key="s" :value="s">{{ s }}</option>
          </select>
        </div>
        <button class="save" :disabled="saving" @click="saveModal">{{ saving ? '保存中…' : '保存' }}</button>
      </div>
    </div>
  </div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    // ───── state ─────
    const signedIn = ref(false);
    const signinErr = ref("");
    const me = ref("");
    const partner = ref("");
    const tasks = ref([]);
    const sites = ref([]);
    const currentSite = ref("*");  // '*' = 全部, '' = 雑務, else = 現場名
    const pickerOpenId = ref(null);
    const expandedId = ref(null);
    const modalOpen = ref(false);
    const editingId = ref(null);
    const form = reactive({ title: "", who: "left", priority: 2, deadline: "", site: "" });
    const saving = ref(false);
    const migrating = ref(false);
    const titleInput = ref(null);
    // スワイプ + コインフリップ状態 (1 度に 1 つだけアクティブ)
    const swipe = reactive({
      taskId: null,
      dragging: false,
      startX: 0, startY: 0,
      deltaX: 0,
      angle: 0,
      fromPos: null,
      nextPos: null,
    });

    let fbAuth = null;
    let fbDb = null;
    let unsubscribeTasks = null;

    // ───── helpers (純粋関数) ─────
    function nameOf(em) { return NAME_BY_EMAIL[(em || "").toLowerCase()] || em || "?"; }
    function shortOf(em) { return (nameOf(em) || "?").slice(0, 1); }
    function posOf(t) {
      const to = (t.toEmail || "").toLowerCase();
      if (to === "both") return "center";
      if (to === me.value) return "right";
      return "left";
    }
    function emailOfPos(pos) {
      if (pos === "center") return "both";
      if (pos === "right") return me.value;
      return partner.value;
    }
    function roleLabel(pos) {
      if (pos === "center") return "共";
      if (pos === "right") return shortOf(me.value);
      return shortOf(partner.value);
    }
    function colorKey(pos) {
      if (pos === "center") return "both";
      const em = pos === "right" ? me.value : partner.value;
      return PERSON_KEY[em] || "konishi";
    }
    function toMillis(ts) {
      if (!ts) return 0;
      if (typeof ts.toMillis === "function") return ts.toMillis();
      return new Date(ts).getTime() || 0;
    }
    function toIso(ts) {
      if (!ts) return "";
      if (typeof ts.toDate === "function") return ts.toDate().toISOString();
      return new Date(ts).toISOString();
    }
    function fmtDate(d) {
      if (!d) return "";
      return String(d).slice(0, 10).replace(/^\d{4}-/, "").replace("-", "/");
    }
    function deadlineClass(d) {
      if (!d) return "";
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(String(d).slice(0, 10) + "T00:00:00");
      const days = (due - today) / 86400000;
      if (days < 0) return "over";
      if (days <= 3) return "soon";
      return "";
    }
    function getLastSeen() { return localStorage.getItem(LAST_SEEN_KEY) || "1970-01-01T00:00:00Z"; }
    function setLastSeen() { localStorage.setItem(LAST_SEEN_KEY, new Date().toISOString()); }

    // ───── computeds ─────
    const meLabel = computed(() => nameOf(me.value) + (partner.value ? `（相手: ${nameOf(partner.value)}）` : ""));
    const tabs = computed(() => [
      { key: "*", label: "全部" },
      { key: "", label: "雑務" },
      ...sites.value.map((s) => ({ key: s, label: s })),
    ]);
    const currentLabel = computed(() =>
      currentSite.value === "*" ? "全部" : (currentSite.value || "雑務")
    );
    function tabCount(key) {
      if (key === "*") return tasks.value.filter((t) => t.status === "active").length;
      return tasks.value.filter((t) => (t.site || "") === key && t.status === "active").length;
    }
    function sortKey(t) {
      return [
        t.status === "active" ? 0 : 1,
        Number(t.priority) || 2,
        t.deadline || "9999-12-31",
        -toMillis(t.createdAt),
      ];
    }
    function cmp(a, b) {
      const ka = sortKey(a), kb = sortKey(b);
      for (let i = 0; i < ka.length; i++) {
        if (ka[i] < kb[i]) return -1;
        if (ka[i] > kb[i]) return 1;
      }
      return 0;
    }
    const sortedTasks = computed(() => {
      const filtered = currentSite.value === "*"
        ? tasks.value
        : tasks.value.filter((t) => (t.site || "") === currentSite.value);
      return filtered.slice().sort(cmp);
    });
    function isUnread(t) {
      const isMine = (t.toEmail || "").toLowerCase() === me.value || (t.toEmail || "").toLowerCase() === "both";
      return isMine && t.status === "active"
        && toIso(t.createdAt) > getLastSeen()
        && (t.fromEmail || "").toLowerCase() !== me.value;
    }

    // ───── role-btn 動的 class / style (スワイプ中だけコイン構造) ─────
    function isFlipping(t, pos) {
      // current の role-btn のみフリップ表示 (open でも current だけ)
      return swipe.taskId === t.id
        && swipe.nextPos
        && pos === posOf(t);
    }
    function roleBtnClass(t, pos) {
      const cls = ["role-" + colorKey(pos)];
      if (pos === posOf(t)) cls.push("current");
      if (isFlipping(t, pos)) {
        cls.push("flipping");
        if (swipe.dragging) cls.push("swiping");
      }
      return cls;
    }
    function roleBtnStyle(t, pos) {
      if (isFlipping(t, pos)) {
        return { "--flip-angle": swipe.angle + "deg" };
      }
      return {};
    }
    function cardStyleFor(t) {
      if (swipe.taskId === t.id && (swipe.dragging || swipe.deltaX !== 0)) {
        const visual = rubberBand(swipe.deltaX);
        return { transform: `translateX(${visual}px)` };
      }
      return {};
    }

    // ───── スワイプ + コインフリップ ─────
    const DRAG_THRESHOLD = 6;
    const FULL_SWIPE = 50;
    const RUBBER_CUSHION = 28;
    function rubberBand(dx) {
      const sign = dx >= 0 ? 1 : -1;
      const abs = Math.abs(dx);
      if (abs <= FULL_SWIPE) return dx;
      const over = abs - FULL_SWIPE;
      return sign * (FULL_SWIPE + RUBBER_CUSHION * (1 - RUBBER_CUSHION / (over + RUBBER_CUSHION)));
    }

    function clearSwipe() {
      swipe.taskId = null;
      swipe.dragging = false;
      swipe.deltaX = 0;
      swipe.angle = 0;
      swipe.fromPos = null;
      swipe.nextPos = null;
    }

    function onCardDown(e, t) {
      // role-picker / act-btn 直接タップは別ハンドラ (= 何もしない、stop で吸う)
      if (e.target.closest(".role-picker") || e.target.closest(".act-btn")) return;
      swipe.taskId = t.id;
      swipe.dragging = false;
      swipe.startX = e.clientX;
      swipe.startY = e.clientY;
      swipe.deltaX = 0;
      swipe.angle = 0;
      swipe.fromPos = posOf(t);
      swipe.nextPos = null;
      // ドキュメント全体に move/up を貼って、指がカード外へ出ても継続できるようにする
    }

    function onPointerMove(e) {
      if (!swipe.taskId) return;
      const t = tasks.value.find((x) => x.id === swipe.taskId);
      if (!t) { clearSwipe(); return; }
      const dx = e.clientX - swipe.startX;
      const dy = e.clientY - swipe.startY;
      if (!swipe.dragging) {
        if (Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
          swipe.dragging = true;
          // 方向確定: 遷移先決定
          const order = ["left", "center", "right"];
          const idx = order.indexOf(swipe.fromPos);
          const dir = dx > 0 ? 1 : -1;
          const nIdx = Math.max(0, Math.min(2, idx + dir));
          if (nIdx !== idx) swipe.nextPos = order[nIdx];
        } else if (Math.abs(dy) > DRAG_THRESHOLD) {
          // 縦スクロール優先 → スワイプ放棄
          clearSwipe();
          return;
        }
      }
      if (swipe.dragging) {
        e.preventDefault();
        swipe.deltaX = dx;
        if (swipe.nextPos) {
          const sign = dx > 0 ? 1 : -1;
          const ratio = Math.min(1, Math.abs(dx) / FULL_SWIPE);
          swipe.angle = sign * ratio * 180;
        }
      }
    }

    async function onPointerUp(e) {
      if (!swipe.taskId) return;
      const t = tasks.value.find((x) => x.id === swipe.taskId);
      if (!t) { clearSwipe(); return; }
      const wasDragging = swipe.dragging;
      const dx = swipe.deltaX;
      const nextPos = swipe.nextPos;
      // タップ (未ドラッグ + 未移動) → 展開トグル
      if (!wasDragging && Math.abs(dx) < DRAG_THRESHOLD) {
        expandedId.value = expandedId.value === t.id ? null : t.id;
        pickerOpenId.value = null;
        clearSwipe();
        return;
      }
      const shouldCommit = nextPos && Math.abs(dx) >= FULL_SWIPE * 0.5;
      // dragging オフでスナップ用 transition を効かせる
      swipe.dragging = false;
      if (shouldCommit) {
        // 残り角度を ±180° まで補完
        swipe.angle = (dx > 0 ? 1 : -1) * 180;
        swipe.deltaX = 0;
        await new Promise((r) => setTimeout(r, 200));
        try { await patchTask(t.id, { toEmail: emailOfPos(nextPos) }); }
        catch (err) { alert("移動失敗: " + err.message); }
        // onSnapshot で tasks 更新 → 再描画。swipe 状態をクリア
        clearSwipe();
      } else if (nextPos) {
        // スナップバック
        swipe.angle = 0;
        swipe.deltaX = 0;
        setTimeout(clearSwipe, 220);
      } else {
        clearSwipe();
      }
    }

    function onPointerCancel() {
      if (!swipe.taskId) return;
      swipe.dragging = false;
      swipe.angle = 0;
      swipe.deltaX = 0;
      setTimeout(clearSwipe, 220);
    }

    // ───── Firestore CRUD ─────
    async function saveTask(id, fields) {
      const ref = id ? doc(fbDb, "tasks", id) : doc(collection(fbDb, "tasks"));
      await setDoc(ref, {
        ...fields,
        updatedAt: serverTimestamp(),
        ...(id ? {} : {
          fromEmail: me.value,
          status: "active",
          createdAt: serverTimestamp(),
        }),
      }, { merge: true });
    }
    async function patchTask(id, fields) {
      await updateDoc(doc(fbDb, "tasks", id), { ...fields, updatedAt: serverTimestamp() });
    }
    async function removeTask(id) {
      await deleteDoc(doc(fbDb, "tasks", id));
    }

    // ───── アクション ─────
    function onTabClick(key) {
      currentSite.value = key;
      expandedId.value = null;
      pickerOpenId.value = null;
    }
    async function onRoleClick(t, pos) {
      if (pickerOpenId.value !== t.id) {
        pickerOpenId.value = t.id;
        return;
      }
      pickerOpenId.value = null;
      const cur = posOf(t);
      if (pos !== cur) {
        try { await patchTask(t.id, { toEmail: emailOfPos(pos) }); }
        catch (err) { alert("移動失敗: " + err.message); }
      }
    }
    async function onToggleDone(t) {
      try { await patchTask(t.id, { status: t.status === "done" ? "active" : "done" }); }
      catch (err) { alert("更新失敗: " + err.message); }
    }
    async function onCyclePriority(t) {
      const next = ((Number(t.priority) || 2) % 3) + 1;
      try { await patchTask(t.id, { priority: next }); }
      catch (err) { alert("更新失敗: " + err.message); }
    }
    async function onDelete(t) {
      if (!confirm("削除しますか？")) return;
      expandedId.value = null;
      try { await removeTask(t.id); }
      catch (err) { alert("削除失敗: " + err.message); }
    }

    // ───── モーダル ─────
    function openModal(t) {
      editingId.value = t ? t.id : null;
      form.title = t ? (t.title || "") : "";
      form.deadline = t && t.deadline ? String(t.deadline).slice(0, 10) : "";
      form.who = t ? posOf(t) : "left";
      form.priority = t ? (Number(t.priority) || 2) : 2;
      form.site = t ? (t.site || "") : (currentSite.value === "*" ? "" : currentSite.value);
      modalOpen.value = true;
      nextTick(() => titleInput.value?.focus());
    }
    function closeModal() {
      modalOpen.value = false;
      editingId.value = null;
    }
    async function saveModal() {
      const title = (form.title || "").trim();
      if (!title) { titleInput.value?.focus(); return; }
      saving.value = true;
      try {
        await saveTask(editingId.value, {
          title,
          toEmail: emailOfPos(form.who),
          priority: Number(form.priority) || 2,
          deadline: form.deadline || null,
          site: form.site || "",
        });
        closeModal();
      } catch (e) {
        alert("保存に失敗: " + e.message);
      } finally {
        saving.value = false;
      }
    }

    // ───── 移行: SQL → Firestore ─────
    async function onMigrate() {
      if (migrating.value) return;
      if (!confirm("Cloud SQL に残っている既存タスクを Firestore に取り込みます。続けますか?")) return;
      migrating.value = true;
      try {
        const token = await fbAuth.currentUser.getIdToken();
        const r = await fetch(API_BASE + "/api/tasks", {
          headers: { authorization: "Bearer " + token },
        });
        if (!r.ok) throw new Error(r.status + ": " + await r.text());
        const j = await r.json();
        const sqlTasks = j.tasks || [];
        let count = 0;
        for (const t of sqlTasks) {
          await setDoc(doc(fbDb, "tasks", t.id), {
            title: t.title || "",
            fromEmail: (t.fromEmail || "").toLowerCase(),
            toEmail: (t.toEmail || "").toLowerCase(),
            priority: Number(t.priority) || 2,
            deadline: t.deadline ? String(t.deadline).slice(0, 10) : null,
            status: t.status || "active",
            site: "",
            createdAt: t.createdAt ? new Date(t.createdAt) : new Date(),
            updatedAt: t.updatedAt ? new Date(t.updatedAt) : new Date(),
          }, { merge: true });
          count++;
        }
        alert(`${count} 件を取り込みました`);
      } catch (e) {
        alert("失敗: " + (e.message || e));
      } finally {
        migrating.value = false;
      }
    }

    // ───── auth + 初期化 ─────
    function goLauncher() { location.href = "/?next=" + encodeURIComponent("/task/"); }
    async function doSignOut() {
      if (fbAuth) await signOut(fbAuth);
      location.reload();
    }

    async function boot(email) {
      me.value = (email || "").toLowerCase();
      partner.value = PARTNER_OF[me.value] || "";
      // 現場一覧
      try {
        const token = fbAuth?.currentUser ? await fbAuth.currentUser.getIdToken() : null;
        const r = await fetch(API_BASE + "/api/sites", {
          headers: token ? { authorization: "Bearer " + token } : {},
        });
        if (r.ok) {
          const sj = await r.json();
          sites.value = (Array.isArray(sj) ? sj : []).map((s) => s.name).filter(Boolean);
        }
      } catch (_) { sites.value = []; }
      // Firestore リアルタイム購読 (自分関連だけクライアント側で絞る)
      unsubscribeTasks = onSnapshot(
        collection(fbDb, "tasks"),
        (snap) => {
          tasks.value = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
            .filter((t) => {
              const fe = (t.fromEmail || "").toLowerCase();
              const te = (t.toEmail || "").toLowerCase();
              return fe === me.value || te === me.value || te === "both";
            });
        },
        (e) => { console.warn("[task] snapshot failed", e); }
      );
      signedIn.value = true;
      setTimeout(setLastSeen, 1500);
    }

    onMounted(async () => {
      // 開発バイパス
      if (window.DEV_NO_AUTH) {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        const app = initializeApp(cfg);
        fbDb = getFirestore(app);
        boot("dev@local");
        return;
      }
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        fbAuth = getAuth(app);
        fbDb = getFirestore(app);
        await setPersistence(fbAuth, browserLocalPersistence);
        gateInternal(fbAuth);
        let entered = false;
        onAuthStateChanged(fbAuth, async (user) => {
          if (user) {
            if (entered) return;
            entered = true;
            sessionStorage.removeItem("authBounce");
            await boot((user.email || "").toLowerCase());
            return;
          }
          if (sessionStorage.getItem("authBounce")) {
            signedIn.value = false;
            return;
          }
          sessionStorage.setItem("authBounce", "1");
          location.replace("/?next=" + encodeURIComponent("/task/"));
        });
      } catch (e) {
        signedIn.value = false;
        signinErr.value = "init失敗: " + (e.message || e);
      }

      // グローバル pointer リスナ (passive:false で preventDefault 可)
      document.addEventListener("pointermove", onPointerMove, { passive: false });
      document.addEventListener("pointerup", onPointerUp);
      document.addEventListener("pointercancel", onPointerCancel);
      // ピッカー外タップで閉じる
      document.addEventListener("click", (e) => {
        if (pickerOpenId.value && !e.target.closest(".role-picker")) {
          pickerOpenId.value = null;
        }
      });
    });

    onBeforeUnmount(() => {
      if (unsubscribeTasks) unsubscribeTasks();
      document.removeEventListener("pointermove", onPointerMove);
      document.removeEventListener("pointerup", onPointerUp);
      document.removeEventListener("pointercancel", onPointerCancel);
    });

    return {
      signedIn, signinErr, me, partner, tasks, sites, currentSite,
      pickerOpenId, expandedId, modalOpen, editingId, form, saving, migrating,
      titleInput, swipe,
      meLabel, tabs, currentLabel, tabCount, sortedTasks,
      posOf, emailOfPos, roleLabel, colorKey,
      fmtDate, deadlineClass, isUnread,
      isFlipping, roleBtnClass, roleBtnStyle, cardStyleFor,
      onCardDown,
      onTabClick, onRoleClick, onToggleDone, onCyclePriority, onDelete,
      openModal, closeModal, saveModal,
      onMigrate,
      goLauncher, doSignOut,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
