<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク">
<link rel="apple-touch-icon" href="/task/icon.svg">
<title>タスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4; --bg3: #ededf3;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #4961ff; --accent2: #6a7eff; --accent-glow: rgba(73,97,255,0.35);
  --hi: #e85b5b; --mid: #e0a040; --lo: #9098b0;
  /* Google カレンダー準拠 */
  --role-natori: #7986cb;     /* ラベンダー */
  --role-konishi: #616161;    /* グラファイト */
  --role-both: #e67c73;       /* フラミンゴ */
}
body { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 400; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

#signinOverlay { display: none; position: fixed; inset: 0; z-index: 400; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 18px; }
#signinOverlay .pill { padding: 14px 28px; border-radius: 30px; background: var(--bg); box-shadow: 6px 6px 16px var(--sd), -6px -6px 16px var(--sl); font-weight: 700; }
#signinErr { font-size: 11px; color: #b04040; max-width: 340px; white-space: pre-wrap; font-family: monospace; word-break: break-word; }

.top { padding: 54px 18px 12px; display: flex; justify-content: space-between; align-items: center; }
.back, .signout { font-size: 13px; font-weight: 800; color: var(--text2); background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; padding: 6px 10px; }
.title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.me-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 30px; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); font-size: 11px; font-weight: 700; color: var(--text2); margin: 0 18px 14px; }
.me-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* 現場タブ (kaimono と同パターン)。雑務 + /api/sites の各現場 */
.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: 'Outfit', sans-serif; transition: all 200ms ease; position: relative; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(50,70,200,0.35), -3px -3px 10px var(--sl); }
.tab .count { font-size: 10px; font-weight: 800; margin-left: 6px; opacity: 0.7; }

/* SQL 移行ボタン (初回だけ表示、移行済んだら非表示) */
.migrate-btn { display: block; margin: 30px auto; padding: 10px 18px; border-radius: 14px; border: 1px dashed var(--text3); background: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; color: var(--text3); }
.migrate-btn:hover { color: var(--accent); border-color: var(--accent); }
.migrate-btn:disabled { opacity: 0.5; cursor: wait; }

.list { padding: 0 16px 130px; display: flex; flex-direction: column; gap: 9px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; font-weight: 600; }

/* カード本体: 外側 .card-wrap がシャドウ + 背景を持ち、展開時はそのまま下に
   actions を内包して縦に伸びる。.card 自体は透明な inner row。 */
.card-wrap { position: relative; background: var(--bg); border-radius: 16px; box-shadow: 6px 6px 14px var(--sd), -5px -5px 12px var(--sl); transition: box-shadow 200ms ease; overflow: hidden; }
.card-wrap.expanded { box-shadow: 9px 9px 20px var(--sd), -6px -6px 14px var(--sl); }
.card-wrap.done { opacity: 0.55; }
.card { background: transparent; padding: 11px 14px 11px 11px; display: flex; align-items: center; gap: 11px; touch-action: pan-y; user-select: none; transition: transform 200ms ease, opacity 200ms ease, box-shadow 200ms ease; position: relative; }
/* 横スワイプ中の card は wrap から浮き上がって見せる */
.card.dragging { z-index: 100; background: var(--bg); border-radius: 16px; box-shadow: 12px 12px 28px var(--sd), -4px -4px 14px var(--sl); }
.card-wrap.done .card-title { text-decoration: line-through; }

/* 担当ピッカー (左端)。
   構造: .role-picker > .role-socket (穴) > .role-rim (穴の底) + .role-btn (コイン)
   socket は inset シャドウで「板に空いた穴」感、rim はその穴の底のダーク disc。
   coin が回転して edge-on (90°) になるとリムが見える。
   コインは flipping 中、--flip-angle 変数で rotateY を動的に駆動 (スワイプ中に
   リアルタイム回転)。中身は複数 .role-slice (厚みレイヤ) + .role-face.front/back。 */
.role-picker { display: flex; gap: 6px; align-items: center; flex-shrink: 0; perspective: 700px; }
.role-socket {
  position: relative;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--bg2);
  box-shadow:
    inset 3px 3px 7px var(--sd),
    inset -2px -2px 5px var(--sl);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.role-picker:not(.open) .role-socket { display: none; }
.role-picker:not(.open) .role-socket.current-socket { display: flex; }
.role-picker.open .role-socket:not(.current-socket) { opacity: 0.6; }

/* 穴の底 (dark disc)。コインが立ってるときは隠れ、edge-on で露出する */
.role-rim {
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, #565666 0%, #2a2a36 60%, #1a1a22 100%);
  box-shadow:
    inset 1px 1px 2px rgba(255,255,255,0.10),
    inset -1px -2px 3px rgba(0,0,0,0.5);
  pointer-events: none;
  z-index: 1;
}

.role-btn {
  position: relative;
  z-index: 2;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: white;
  cursor: pointer; flex-shrink: 0;
  transition: all 200ms ease;
  box-shadow:
    2px 2px 4px rgba(0,0,0,0.30),
    -1px -1px 3px var(--sl),
    inset 0 0 0 1.2px rgba(255,255,255,0.20),
    inset 0 -2px 3px rgba(0,0,0,0.20);
}
.role-btn.role-natori { background: var(--role-natori); }
.role-btn.role-konishi { background: var(--role-konishi); }
.role-btn.role-both { background: var(--role-both); }
.role-picker.open .role-btn:active { transform: scale(0.92); }

/* flipping クラスが付いた瞬間、コインは多層スライス + 2 面構造に切り替わる。
   --flip-angle (deg) で rotateY を動的駆動。.swiping 中は transition off で
   指の動きに即座に追従、release 後は transition 復活で滑らかにアニメ。 */
.role-btn.flipping {
  transform-style: preserve-3d;
  background: transparent !important;
  box-shadow: none !important;
  transform: rotateY(var(--flip-angle, 0deg));
  transition: transform 220ms cubic-bezier(.4, .2, .3, 1);
}
.role-btn.flipping.swiping { transition: none; }

/* スライス: コインの「厚み」を構成する円盤の層。9 枚で約 5px の厚みを実現。
   全てダーク色で、各種角度で側面のシルエットとして見える。 */
.role-slice {
  position: absolute; inset: 1px;
  border-radius: 50%;
  background: linear-gradient(135deg, #353545 0%, #4a4a5c 50%, #2a2a36 100%);
  transform: translateZ(calc(var(--z) * 1px));
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  pointer-events: none;
}

/* 表裏の面: スライスより少し外側 (+/-2.7px) に置いてコインの「表面」になる */
.role-face {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: white;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow:
    2px 2px 4px rgba(0,0,0,0.25),
    inset 0 0 0 1.2px rgba(255,255,255,0.22),
    inset 0 -2px 3px rgba(0,0,0,0.22);
}
.role-face.front { transform: translateZ(2.7px); }
.role-face.back  { transform: rotateY(180deg) translateZ(2.7px); }
.role-face.role-natori { background: var(--role-natori); }
.role-face.role-konishi { background: var(--role-konishi); }
.role-face.role-both { background: var(--role-both); }

/* タイトル + メタ */
.pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pip.p1 { background: var(--hi); box-shadow: 0 0 6px rgba(232,91,91,0.6); }
.pip.p2 { background: var(--mid); box-shadow: 0 0 6px rgba(224,160,64,0.5); }
.pip.p3 { background: var(--lo); }
.body { flex: 1; min-width: 0; }
.row-top { display: flex; align-items: center; gap: 7px; }
.card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.card-meta { font-size: 10px; color: var(--text3); font-weight: 700; margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.deadline { color: var(--accent); font-weight: 800; }
.deadline.soon { color: var(--mid); }
.deadline.over { color: var(--hi); }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hi); box-shadow: 0 0 5px rgba(232,91,91,0.7); flex-shrink: 0; }

/* スワイプ中の左右ヒント */
.swipe-hint { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 11px; font-weight: 800; color: var(--text3); padding: 0 18px; pointer-events: none; opacity: 0; transition: opacity 200ms ease; }
.swipe-hint.left { left: 0; }
.swipe-hint.right { right: 0; }
.card.swiping-left ~ .swipe-hint.left,
.card.swiping-right ~ .swipe-hint.right { opacity: 1; }

/* アクションバー (展開時) */
/* 展開時に card-wrap 内部の下に追加される操作行。
   card と wrap が同じ背景なので継ぎ目なく「カードが伸びた」風に見える。 */
.actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 11px 12px; border-top: 1px solid rgba(168,172,192,0.18); margin-top: 2px; overflow: hidden; animation: slide-down 200ms ease-out; transform-origin: top; }
@keyframes slide-down {
  from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; border-top-color: transparent; }
  to   { opacity: 1; max-height: 200px; padding-top: 8px; padding-bottom: 12px; }
}
.act-btn { padding: 7px 11px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11px; color: var(--text2); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -3px -3px 8px var(--sl); }
.act-btn:active { box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl); transform: scale(0.96); }
.act-btn.del { color: #b04040; }
.act-btn.done { color: #3a9a6a; }

/* FAB */
.fab { position: fixed; right: 22px; bottom: 28px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 32px; font-weight: 300; line-height: 1; border: none; cursor: pointer; box-shadow: 8px 8px 22px rgba(50,70,200,0.45), -3px -3px 10px var(--sl); z-index: 10; transition: transform 200ms ease, box-shadow 200ms ease; }
.fab:active { transform: scale(0.93); }

/* モーダル: 開閉とも transition 駆動。
   display:none ではなく visibility/opacity で「居るけど触れない」状態にして、
   .open を外したときも閉じるアニメ (sheet が下に滑る + 背景フェードアウト) が走るようにする。 */
.modal {
  position: fixed; inset: 0;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(180,184,205,0);
  visibility: hidden; opacity: 0; pointer-events: none;
  z-index: 50;
  transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 200ms;
}
.modal.open {
  background: rgba(180,184,205,0.42);
  visibility: visible; opacity: 1; pointer-events: auto;
  transition: background 200ms ease, opacity 200ms ease, visibility 0s linear 0s;
}
.sheet {
  background: var(--bg); border-radius: 32px 32px 0 0;
  box-shadow: -2px -10px 35px rgba(148,152,176,0.4);
  width: 100%; max-width: 480px; padding: 14px 20px 32px; max-height: 90vh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform 200ms cubic-bezier(.2,.8,.2,1);
}
.modal.open .sheet { transform: translateY(0); }
.handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(100,104,130,0.22); margin: 0 auto 16px; }
.sheet h3 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 6px; font-weight: 700; }
.inp { width: 100%; padding: 12px 14px; font-size: 15px; color: var(--text); outline: none; border: none; border-radius: 14px; font-family: 'Outfit', sans-serif; font-weight: 600; background: var(--bg2); box-shadow: inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl); -webkit-appearance: none; appearance: none; }
.inp::placeholder { color: var(--text3); }
.choice { display: flex; gap: 8px; }
.choice button { flex: 1; padding: 12px 6px; border-radius: 14px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); }
.choice button.sel { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); color: var(--accent); }
.choice button.sel.p1 { color: var(--hi); }
.choice button.sel.p2 { color: var(--mid); }
.choice button.sel.p3 { color: var(--lo); }
.save { width: 100%; padding: 16px; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: 800; color: white; font-family: 'Outfit', sans-serif; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 18px rgba(50,70,200,0.45), -3px -3px 10px var(--sl); margin-top: 10px; transition: opacity 200ms ease; }
.save:active { transform: scale(0.97); }
.save:disabled { opacity: 0.6; cursor: wait; }
</style>
</head>
<body>

<div id="signinOverlay">
  <div class="pill">サインインしてください</div>
  <button class="pill" onclick="location.href='/?next=' + encodeURIComponent('/task/')">ランチャーへ戻る</button>
  <div id="signinErr"></div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <button class="back" onclick="location.href='/'">← 戻る</button>
    <div class="title">タスク</div>
    <button class="signout" onclick="window.doSignOut && window.doSignOut()">⏻</button>
  </div>
  <div class="me-pill"><span class="me-dot"></span><span id="meLabel">…</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <button class="migrate-btn" id="migrateBtn" style="display:none">📥 Cloud SQL から既存タスクを取り込み</button>
  <button class="fab" id="fabAdd">＋</button>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="modalTitle">新規タスク</h3>
    <div class="field">
      <label>内容</label>
      <input class="inp" id="iTitle" placeholder="やること（1行）" maxlength="120">
    </div>
    <div class="field">
      <label>誰がやる</label>
      <div class="choice">
        <button data-who="left">相手</button>
        <button data-who="center">共同</button>
        <button data-who="right">自分</button>
      </div>
    </div>
    <div class="field">
      <label>優先度</label>
      <div class="choice">
        <button data-p="1">高</button>
        <button data-p="2">中</button>
        <button data-p="3">低</button>
      </div>
    </div>
    <div class="field">
      <label>期限（任意）</label>
      <input class="inp" type="date" id="iDeadline">
    </div>
    <div class="field">
      <label>現場（雑務 = 会社全般）</label>
      <select class="inp" id="iSite">
        <option value="">雑務</option>
      </select>
    </div>
    <button class="save" id="saveBtn">保存</button>
  </div>
</div>

<script src="/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence,
  onAuthStateChanged, signOut,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { gateInternal } from "/internal-gate.js";

const API_BASE = (window.API_BASE || "").replace(/\/$/, "");
let fbAuth = null;
let db = null;            // Firestore (realtime 同期用)
let unsubscribeTasks = null;
async function idToken() {
  const u = fbAuth?.currentUser;
  return u ? await u.getIdToken() : null;
}

(async function initAuth() {
  if (window.DEV_NO_AUTH) {
    document.getElementById("signinOverlay").style.display = "none";
    boot("dev@local");
    return;
  }
  try {
    const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
    cfg.authDomain = location.hostname;
    const app = initializeApp(cfg);
    fbAuth = getAuth(app);
    db = getFirestore(app);
    await setPersistence(fbAuth, browserLocalPersistence);
    gateInternal(fbAuth);
    let entered = false;
    onAuthStateChanged(fbAuth, async (user) => {
      if (user) {
        if (entered) return;
        entered = true;
        sessionStorage.removeItem("authBounce");
        document.getElementById("signinOverlay").style.display = "none";
        boot((user.email || "").toLowerCase());
        return;
      }
      if (sessionStorage.getItem("authBounce")) {
        document.getElementById("signinOverlay").style.display = "flex";
        return;
      }
      sessionStorage.setItem("authBounce", "1");
      location.replace("/?next=" + encodeURIComponent("/task/"));
    });
  } catch (e) {
    document.getElementById("signinOverlay").style.display = "flex";
    document.getElementById("signinErr").textContent = "init失敗: " + e.message;
  }
})();
window.doSignOut = async () => { if (fbAuth) await signOut(fbAuth); location.reload(); };

const NAME_BY_EMAIL = {
  "info@banax.tokyo": "名取",
  "banaxart@gmail.com": "名取",
  "konishi0221@gmail.com": "小西",
};
const PARTNER_OF = {
  "info@banax.tokyo": "konishi0221@gmail.com",
  "banaxart@gmail.com": "konishi0221@gmail.com",
  "konishi0221@gmail.com": "info@banax.tokyo",
};
const PERSON_KEY = {
  "info@banax.tokyo": "natori",
  "banaxart@gmail.com": "natori",
  "konishi0221@gmail.com": "konishi",
};
function colorKey(pos) {
  if (pos === "center") return "both";
  const em = pos === "right" ? me : partner;
  return PERSON_KEY[em] || "konishi";
}
let me = "";
let partner = "";
function nameOf(em) { return NAME_BY_EMAIL[(em || "").toLowerCase()] || em || "?"; }
function shortOf(em) { return (nameOf(em) || "?").slice(0, 1); }

async function api(method, path, body) {
  const token = await idToken();
  const r = await fetch(API_BASE + path, {
    method,
    headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) { const t = await r.text().catch(() => ""); throw new Error(`${r.status}: ${t}`); }
  return r.status === 204 ? null : r.json();
}

let tasks = [];
let sites = [];          // /api/sites から取得した現場名一覧
let currentSite = "*";   // タブの現在選択。'*' = 全部 (現場問わず) / '' = 雑務 / それ以外 = 現場名
let expandedId = null;
let editingId = null;
let modalWho = "left";
let modalPriority = 2;
let modalSite = "";
let pickerOpenId = null;

const LAST_SEEN_KEY = "task_last_seen";
function getLastSeen() { return localStorage.getItem(LAST_SEEN_KEY) || "1970-01-01T00:00:00Z"; }
function setLastSeen() { localStorage.setItem(LAST_SEEN_KEY, new Date().toISOString()); }
function $(id) { return document.getElementById(id); }

async function boot(email) {
  me = (email || "").toLowerCase();
  partner = PARTNER_OF[me] || "";
  $("meLabel").textContent = nameOf(me) + (partner ? `（相手: ${nameOf(partner)}）` : "");
  $("app").style.display = "block";
  // 現場一覧を keihi 共通 API から取得 (kaimono と同ソース)
  try {
    const sj = await api("GET", "/api/sites");
    sites = (Array.isArray(sj) ? sj : []).map((s) => s.name).filter(Boolean);
  } catch (_) { sites = []; }
  refreshSiteSelect();
  setupModal();
  setupMigrate();
  // Firestore リアルタイム購読: tasks コレクション全件 → 自分関連のみクライアント側で絞る
  unsubscribeTasks = onSnapshot(collection(db, "tasks"), (snap) => {
    tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((t) => {
        const fe = (t.fromEmail || "").toLowerCase();
        const te = (t.toEmail || "").toLowerCase();
        return fe === me || te === me || te === "both";
      });
    render();
  }, (e) => { console.warn("[task] snapshot failed", e); });
  renderTabs();
  setTimeout(setLastSeen, 1500);
}

// 移行ボタンのセットアップ。タスクが 0 件なら表示、押されたら SQL → Firestore コピー。
// クライアント側で実行: GET /api/tasks (SQL) → 各タスクを Firestore に setDoc。
// この方法だと Cloud Run SA に Firestore 権限不要 (ユーザの Firebase auth + rules で通る)。
function setupMigrate() {
  const btn = $("migrateBtn");
  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    if (!confirm("Cloud SQL に残っている既存タスクを Firestore に取り込みます。続けますか?")) return;
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = "取り込み中…";
    try {
      const j = await api("GET", "/api/tasks");
      const sqlTasks = j.tasks || [];
      let migrated = 0;
      for (const t of sqlTasks) {
        const ref = doc(db, "tasks", t.id);
        await setDoc(ref, {
          title: t.title || "",
          fromEmail: (t.fromEmail || "").toLowerCase(),
          toEmail: (t.toEmail || "").toLowerCase(),
          priority: Number(t.priority) || 2,
          deadline: t.deadline ? String(t.deadline).slice(0, 10) : null,
          status: t.status || "active",
          site: "",                                    // 既存は雑務扱いで初期化
          createdAt: t.createdAt ? new Date(t.createdAt) : new Date(),
          updatedAt: t.updatedAt ? new Date(t.updatedAt) : new Date(),
        }, { merge: true });
        migrated++;
      }
      alert(`${migrated} 件を取り込みました`);
      // onSnapshot が自動発火、ボタンは render() 内で非表示に
    } catch (e) {
      alert("失敗: " + (e.message || e));
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  });
}

function refreshSiteSelect() {
  const sel = $("iSite");
  sel.innerHTML = '<option value="">雑務</option>';
  for (const s of sites) {
    const o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    sel.appendChild(o);
  }
}

function posOf(t) {
  const to = (t.toEmail || "").toLowerCase();
  if (to === "both") return "center";
  if (to === me) return "right";
  return "left";
}
function emailOfPos(pos) {
  if (pos === "center") return "both";
  if (pos === "right") return me;
  return partner;
}
function roleLabel(pos) {
  if (pos === "center") return "共";
  if (pos === "right") return shortOf(me);
  return shortOf(partner);
}

function fmtDate(d) {
  if (!d) return "";
  return String(d).slice(0, 10).replace(/^\d{4}-/, "").replace("-", "/");
}
function deadlineClass(d) {
  if (!d) return "";
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const due = new Date(String(d).slice(0, 10) + "T00:00:00");
  const days = (due - today) / 86400000;
  if (days < 0) return "over";
  if (days <= 3) return "soon";
  return "";
}

// Firestore Timestamp / ISO 文字列 / null どれが来てもミリ秒に揃える
function toMillis(ts) {
  if (!ts) return 0;
  if (typeof ts.toMillis === "function") return ts.toMillis();
  return new Date(ts).getTime() || 0;
}
function toIso(ts) {
  if (!ts) return "";
  if (typeof ts.toDate === "function") return ts.toDate().toISOString();
  return new Date(ts).toISOString();
}
function sortKey(t) {
  return [
    t.status === "active" ? 0 : 1,
    Number(t.priority) || 2,
    t.deadline || "9999-12-31",
    -toMillis(t.createdAt),
  ];
}
function cmp(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  for (let i = 0; i < ka.length; i++) {
    if (ka[i] < kb[i]) return -1;
    if (ka[i] > kb[i]) return 1;
  }
  return 0;
}

// 現場別件数 + 全タスク 0 件時の移行ボタン表示判定
function countActiveBySite(site) {
  if (site === "*") return tasks.filter((t) => t.status === "active").length;
  return tasks.filter((t) => (t.site || "") === site && t.status === "active").length;
}

function renderTabs() {
  const tabsEl = $("tabs");
  tabsEl.innerHTML = "";
  const all = [
    { key: "*", label: "全部" },
    { key: "", label: "雑務" },
    ...sites.map((s) => ({ key: s, label: s })),
  ];
  for (const it of all) {
    const btn = document.createElement("button");
    btn.className = "tab" + (it.key === currentSite ? " on" : "");
    btn.textContent = it.label;
    const cnt = countActiveBySite(it.key);
    if (cnt > 0) {
      const c = document.createElement("span");
      c.className = "count";
      c.textContent = cnt;
      btn.appendChild(c);
    }
    btn.addEventListener("click", () => {
      currentSite = it.key;
      expandedId = null;
      pickerOpenId = null;
      renderTabs();
      render();
    });
    tabsEl.appendChild(btn);
  }
}

function render() {
  const lastSeen = getLastSeen();
  // 現在のタブにマッチするタスクだけ表示 ('*' = 全部、フィルタなし)
  const filtered = currentSite === "*"
    ? tasks
    : tasks.filter((t) => (t.site || "") === currentSite);
  const sorted = filtered.slice().sort(cmp);
  const el = $("list");
  el.innerHTML = "";
  // 全タスク 0 件 → 初回想定 → 移行ボタン表示。それ以外は非表示
  $("migrateBtn").style.display = tasks.length === 0 ? "block" : "none";
  if (!sorted.length) {
    const label = currentSite === "*" ? "全部" : (currentSite || "雑務");
    el.innerHTML = `<div class="empty">「${label}」のタスクはありません</div>`;
    renderTabs(); // count 更新
    return;
  }
  for (const t of sorted) {
    const wrap = renderRow(t, lastSeen);
    el.appendChild(wrap);
    if (expandedId === t.id) wrap.appendChild(renderActions(t));
  }
  renderTabs(); // count 更新
}

// ───── Firestore 書き込みヘルパー ─────
async function saveTask(id, fields) {
  // id 指定で update、未指定で新規作成 (自動 id)
  const ref = id ? doc(db, "tasks", id) : doc(collection(db, "tasks"));
  await setDoc(ref, {
    ...fields,
    updatedAt: serverTimestamp(),
    ...(id ? {} : {
      fromEmail: me,
      status: "active",
      createdAt: serverTimestamp(),
    }),
  }, { merge: true });
}
async function patchTask(id, fields) {
  await updateDoc(doc(db, "tasks", id), { ...fields, updatedAt: serverTimestamp() });
}
async function removeTask(id) {
  await deleteDoc(doc(db, "tasks", id));
}

function renderRow(t, lastSeen) {
  const wrap = document.createElement("div");
  wrap.className = "card-wrap" +
    (t.status === "done" ? " done" : "") +
    (expandedId === t.id ? " expanded" : "");
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = t.id;

  // 担当ピッカー (各役割を socket でラップ。socket は穴、内側に rim と coin)
  const cur = posOf(t);
  const picker = document.createElement("div");
  picker.className = "role-picker" + (pickerOpenId === t.id ? " open" : "");
  for (const pos of ["left", "center", "right"]) {
    const socket = document.createElement("div");
    socket.className = "role-socket" + (pos === cur ? " current-socket" : "");
    const rim = document.createElement("span");
    rim.className = "role-rim";
    socket.appendChild(rim);
    const btn = document.createElement("button");
    btn.className = "role-btn role-" + colorKey(pos) + (pos === cur ? " current" : "");
    btn.textContent = roleLabel(pos);
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (pickerOpenId !== t.id) {
        pickerOpenId = t.id;
        render();
        return;
      }
      pickerOpenId = null;
      if (pos !== cur) {
        try { await patchTask(t.id, { toEmail: emailOfPos(pos) }); }
        catch (err) { alert("移動失敗: " + err.message); }
        // onSnapshot が自動で再描画
      } else {
        render();
      }
    });
    socket.appendChild(btn);
    picker.appendChild(socket);
  }
  card.appendChild(picker);

  // 本体
  const body = document.createElement("div");
  body.className = "body";
  const rowTop = document.createElement("div");
  rowTop.className = "row-top";
  const pip = document.createElement("div");
  pip.className = "pip p" + (Number(t.priority) || 2);
  const ttl = document.createElement("div");
  ttl.className = "card-title";
  ttl.textContent = t.title || "(無題)";
  rowTop.append(pip, ttl);
  // 未読
  const isMine = (t.toEmail || "").toLowerCase() === me || (t.toEmail || "").toLowerCase() === "both";
  if (isMine && t.status === "active" && toIso(t.createdAt) > lastSeen && (t.fromEmail || "").toLowerCase() !== me) {
    const u = document.createElement("div");
    u.className = "unread-dot";
    rowTop.appendChild(u);
  }
  body.appendChild(rowTop);
  if (t.deadline) {
    const meta = document.createElement("div");
    meta.className = "card-meta";
    const dl = document.createElement("span");
    dl.className = "deadline " + deadlineClass(t.deadline);
    dl.textContent = "⏰ " + fmtDate(t.deadline);
    meta.appendChild(dl);
    body.appendChild(meta);
  }
  card.appendChild(body);

  wrap.appendChild(card);
  makeSwipeable(card, t);
  return wrap;
}

function renderActions(t) {
  const bar = document.createElement("div");
  bar.className = "actions";
  const doneBtn = document.createElement("button");
  doneBtn.className = "act-btn done";
  doneBtn.textContent = t.status === "done" ? "戻す" : "完了";
  doneBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    try { await patchTask(t.id, { status: t.status === "done" ? "active" : "done" }); }
    catch (err) { alert("更新失敗: " + err.message); }
  });
  const priBtn = document.createElement("button");
  priBtn.className = "act-btn";
  priBtn.textContent = "優先度 " + ["高","中","低"][((t.priority || 2) - 1)];
  priBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const next = ((t.priority || 2) % 3) + 1;
    try { await patchTask(t.id, { priority: next }); }
    catch (err) { alert("更新失敗: " + err.message); }
  });
  const editBtn = document.createElement("button");
  editBtn.className = "act-btn";
  editBtn.textContent = "編集";
  editBtn.addEventListener("click", (e) => { e.stopPropagation(); openModal(t); });
  const delBtn = document.createElement("button");
  delBtn.className = "act-btn del";
  delBtn.textContent = "削除";
  delBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!confirm("削除しますか？")) return;
    expandedId = null;
    try { await removeTask(t.id); }
    catch (err) { alert("削除失敗: " + err.message); }
  });
  bar.append(doneBtn, priBtn, editBtn, delBtn);
  return bar;
}

// ───── 厚み付きコインを構築 (スライス + 2 面) ─────
// 9 枚のスライスで約 5px の厚みを作る。スライスはダーク色の disc を translateZ で
// 並べたもの。表裏面は更にその両端に貼る。引数 fromKey/toKey/fromLbl/toLbl で
// 表 (現在) と裏 (next) の色 + 文字を決める。
function buildCoinFaces(roleBtn, fromKey, fromLbl, toKey, toLbl) {
  roleBtn.classList.add("flipping");
  const slices = [-2.4, -1.8, -1.2, -0.6, 0, 0.6, 1.2, 1.8, 2.4]
    .map((z) => `<span class="role-slice" style="--z:${z}"></span>`).join("");
  roleBtn.innerHTML =
    slices +
    `<span class="role-face front role-${fromKey}">${fromLbl}</span>` +
    `<span class="role-face back role-${toKey}">${toLbl}</span>`;
}

// スワイプ中はリアルタイム回転、ピッカータップ時はプログラム的に 180° 回す
function animateRoleFlip(card, fromPos, toPos) {
  return new Promise((resolve) => {
    const picker = card.querySelector(".role-picker");
    if (!picker) { resolve(); return; }
    picker.classList.remove("open");
    const roleBtn = picker.querySelector(".role-btn.current");
    if (!roleBtn) { resolve(); return; }
    buildCoinFaces(
      roleBtn,
      colorKey(fromPos), roleLabel(fromPos),
      colorKey(toPos), roleLabel(toPos)
    );
    roleBtn.style.setProperty("--flip-angle", "0deg");
    requestAnimationFrame(() => {
      roleBtn.style.setProperty("--flip-angle", "180deg");
    });
    setTimeout(resolve, 240);
  });
}

// ───── スワイプ (左右で担当を1段階シフト + タップで展開) ─────
function makeSwipeable(card, t) {
  let startX = null, startY = null, deltaX = 0, dragging = false, moved = false;
  let roleBtnEl = null;       // 現在の current コイン
  let nextPos = null;          // スワイプ方向で確定する遷移先 (null = 未確定)
  let curPos = null;           // スワイプ開始時の役割
  const DRAG_THRESHOLD = 6;
  const SHIFT_THRESHOLD = 50;

  function setAngle(deg, instant) {
    if (!roleBtnEl) return;
    if (instant) roleBtnEl.classList.add("swiping");
    else roleBtnEl.classList.remove("swiping");
    roleBtnEl.style.setProperty("--flip-angle", deg + "deg");
  }

  card.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".role-picker") || e.target.closest(".act-btn")) return;
    startX = e.clientX; startY = e.clientY; deltaX = 0; dragging = false; moved = false;
    curPos = posOf(t);
    nextPos = null;
    roleBtnEl = card.querySelector(".role-btn.current");
  });
  card.addEventListener("pointermove", (e) => {
    if (startX == null) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging) {
      if (Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        dragging = true;
        card.setPointerCapture(e.pointerId);
        card.classList.add("dragging");
        // 方向確定 → 遷移先を決めてコイン 2 面構造を構築 (リアルタイム回転に備える)
        const order = ["left", "center", "right"];
        const idx = order.indexOf(curPos);
        const dir = dx > 0 ? 1 : -1;
        const nIdx = Math.max(0, Math.min(2, idx + dir));
        if (nIdx !== idx && roleBtnEl) {
          nextPos = order[nIdx];
          buildCoinFaces(
            roleBtnEl,
            colorKey(curPos), roleLabel(curPos),
            colorKey(nextPos), roleLabel(nextPos)
          );
        }
      } else if (Math.abs(dy) > DRAG_THRESHOLD) {
        startX = null;
        return;
      }
    }
    if (dragging) {
      e.preventDefault();           // 縦スクロールをロック (斜めスワイプのジッタ防止)
      deltaX = dx;
      moved = true;
      card.style.transform = `translateX(${dx}px)`;
      // リアルタイム回転: dx を [-180, 180]° に線形マップ (SHIFT_THRESHOLD で 90°、その 2 倍で完全裏返り)
      if (nextPos && roleBtnEl) {
        const sign = dx > 0 ? 1 : -1;
        const ratio = Math.min(1, Math.abs(dx) / (2 * SHIFT_THRESHOLD));
        setAngle(sign * ratio * 180, true);
      }
    }
  }, { passive: false });
  card.addEventListener("pointerup", async () => {
    if (startX == null) return;
    const wasDragging = dragging;
    card.classList.remove("dragging");
    card.style.transform = "";
    startX = null;
    if (!wasDragging && !moved) {
      // タップ → 展開
      expandedId = expandedId === t.id ? null : t.id;
      pickerOpenId = null;
      render();
      return;
    }
    const shouldCommit = nextPos && Math.abs(deltaX) >= SHIFT_THRESHOLD;
    if (shouldCommit) {
      // 残り角度をなめらかに 180° (sign 付き) まで持っていく → DB 更新
      const sign = deltaX > 0 ? 1 : -1;
      setAngle(sign * 180, false);
      await new Promise((r) => setTimeout(r, 200));
      try { await patchTask(t.id, { toEmail: emailOfPos(nextPos) }); }
      catch (err) { alert("移動失敗: " + err.message); }
    } else if (nextPos && roleBtnEl) {
      // スナップバック (0° 戻し)
      setAngle(0, false);
    }
  });
  card.addEventListener("pointercancel", () => {
    card.classList.remove("dragging");
    card.style.transform = "";
    startX = null;
    if (nextPos && roleBtnEl) setAngle(0, false);
  });
}

// ───── modal ─────
function setupModal() {
  document.querySelectorAll('[data-who]').forEach((b) => {
    b.addEventListener("click", () => {
      modalWho = b.dataset.who;
      document.querySelectorAll('[data-who]').forEach((x) => x.classList.toggle("sel", x === b));
    });
  });
  document.querySelectorAll('[data-p]').forEach((b) => {
    b.addEventListener("click", () => {
      modalPriority = Number(b.dataset.p);
      document.querySelectorAll('[data-p]').forEach((x) => {
        const isSel = x === b;
        x.classList.toggle("sel", isSel);
        x.classList.toggle("p1", isSel && modalPriority === 1);
        x.classList.toggle("p2", isSel && modalPriority === 2);
        x.classList.toggle("p3", isSel && modalPriority === 3);
      });
    });
  });
  $("fabAdd").addEventListener("click", () => openModal(null));
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  // 現場 select の変更を modalSite に反映
  $("iSite").addEventListener("change", (e) => { modalSite = e.target.value || ""; });
  $("saveBtn").addEventListener("click", async () => {
    const btn = $("saveBtn");
    if (btn.disabled) return;            // 多重発火ガード (連打対策)
    const title = $("iTitle").value.trim();
    if (!title) { $("iTitle").focus(); return; }
    const deadline = $("iDeadline").value || null;
    const toEmail = emailOfPos(modalWho);
    const site = modalSite || "";
    const origText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "保存中…";
    try {
      await saveTask(editingId, { title, toEmail, priority: modalPriority, deadline, site });
      closeModal();
    } catch (e) {
      alert("保存に失敗: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = origText;
    }
  });
}
function openModal(t) {
  editingId = t ? t.id : null;
  $("modalTitle").textContent = t ? "編集" : "新規タスク";
  $("iTitle").value = t ? (t.title || "") : "";
  $("iDeadline").value = t && t.deadline ? String(t.deadline).slice(0, 10) : "";
  modalWho = t ? posOf(t) : "left";
  modalPriority = t ? (t.priority || 2) : 2;
  // 編集 → そのタスクの site、新規 → 表示中タブの現場 (全部タブのときは雑務='') を初期値に
  modalSite = t ? (t.site || "") : (currentSite === "*" ? "" : currentSite);
  $("iSite").value = modalSite;
  document.querySelectorAll('[data-who]').forEach((x) => x.classList.toggle("sel", x.dataset.who === modalWho));
  document.querySelectorAll('[data-p]').forEach((x) => {
    const isSel = Number(x.dataset.p) === modalPriority;
    x.classList.toggle("sel", isSel);
    x.classList.toggle("p1", isSel && modalPriority === 1);
    x.classList.toggle("p2", isSel && modalPriority === 2);
    x.classList.toggle("p3", isSel && modalPriority === 3);
  });
  $("modal").classList.add("open");
  setTimeout(() => $("iTitle").focus(), 50);
}
function closeModal() {
  $("modal").classList.remove("open");
  editingId = null;
}

// ピッカー以外をタップしたら閉じる
document.addEventListener("click", (e) => {
  if (pickerOpenId && !e.target.closest(".role-picker")) {
    pickerOpenId = null;
    render();
  }
});
</script>
