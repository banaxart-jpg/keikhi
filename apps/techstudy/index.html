<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>techstudy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75);
  --text: #42455e; --text2: rgba(66,69,94,0.52); --text3: rgba(66,69,94,0.28);
  --accent: #6d28d9; /* 紫: 学習・知識 */
  --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--bg) 82%);
  --correct: #2a8c3a; --incorrect: #b04040;
  --cat-ui: #ec4899; --cat-db: #0891b2; --cat-api: #f59e0b;
  --cat-ai: #8b5cf6; --cat-infra: #10b981; --cat-concept: #6366f1;
  --cat-project: #f43f5e; --cat-prompt: #14b8a6;
}
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 120px; }
.icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 1.1em; display: inline-block; line-height: 1; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 40px 20px 0; }
.hint { font-size: 11px; letter-spacing: 0.22em; color: var(--text3); font-weight: 700; text-transform: uppercase; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

.wrap { padding: 24px 18px 40px; max-width: 600px; margin: 0 auto; }
.title { font-size: 26px; font-weight: 800; }
.subtitle { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 2px; margin-bottom: 22px; }

.card { background: var(--bg); border-radius: 22px; padding: 18px; margin-bottom: 16px; box-shadow: 8px 8px 18px var(--sd), -6px -6px 16px var(--sl); }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--text3); text-transform: uppercase; margin-bottom: 12px; }

/* ホーム画面 */
.level-hero { text-align: center; padding: 6px 0; }
.level-num { font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.03em; }
.level-lbl { font-size: 11px; color: var(--text2); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 4px; }
.hero-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; padding: 8px 0 0; }
.hero-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hero-num { font-size: 36px; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
.hero-num .hero-unit { font-size: 18px; font-weight: 800; margin-left: 2px; }
.hero-lbl { font-size: 10px; color: var(--text2); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.streak-recovered { color: #f59e0b; }
.streak-today-pending { opacity: 0.55; }

.cats { display: flex; flex-direction: column; gap: 8px; }
.cat-row { display: grid; grid-template-columns: 80px 1fr 50px; align-items: center; gap: 10px; font-size: 12px; }
.cat-name { font-weight: 700; color: var(--text); font-size: 11px; }
.cat-bar { height: 8px; background: rgba(154,160,184,0.2); border-radius: 4px; overflow: hidden; box-shadow: inset 2px 2px 4px var(--sd); }
.cat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
.cat-count { text-align: right; color: var(--text2); font-weight: 700; font-variant-numeric: tabular-nums; }

/* グループ × ジャンル */
.group-list { display: flex; flex-direction: column; gap: 12px; }
.group-card { background: var(--bg); border-radius: 18px; padding: 14px 16px; box-shadow: 5px 5px 12px var(--sd), -3px -3px 10px var(--sl); }

/* レーダーチャート */
.radar-wrap { display: flex; flex-direction: column; align-items: center; padding: 4px 0 4px; }
.radar-svg { width: 100%; max-width: 360px; display: block; }
.radar-svg .axis { stroke: rgba(154,160,184,0.22); stroke-width: 1; }
.radar-svg .grid { fill: none; stroke: rgba(154,160,184,0.18); stroke-width: 1; }
.radar-svg .grid-100 { stroke: rgba(154,160,184,0.35); }
.radar-svg .me-poly { fill: rgba(109,40,217,0.32); stroke: #6d28d9; stroke-width: 2; stroke-linejoin: round; }
.radar-svg .peer-poly { fill: rgba(245,158,11,0.15); stroke: #f59e0b; stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 5 3; }
.radar-svg .label { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 800; pointer-events: none; }
.radar-svg .axis-hit { fill: transparent; cursor: pointer; }
.radar-legend-title { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 8px 0 10px; font-size: 11px; color: var(--text2); font-weight: 700; }
.radar-legend-title .swatch { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.radar-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.legend-item { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }
.legend-name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend-pct { font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.legend-pct .peer { color: var(--text3); font-weight: 700; font-size: 9px; margin-left: 3px; }
.group-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; margin-bottom: 10px; }
.group-name { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.group-color { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; box-shadow: 2px 2px 4px var(--sd); }
.group-title { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-chev { font-size: 18px; color: var(--text3); transition: transform 0.2s; flex-shrink: 0; }
.group-card.open .group-chev { transform: rotate(90deg); }

/* 比較バー: あなた vs peer */
.compare-bars { display: flex; flex-direction: column; gap: 6px; }
.compare-row { display: grid; grid-template-columns: 54px 1fr 42px; align-items: center; gap: 10px; font-size: 11px; }
.compare-who { font-weight: 700; color: var(--text2); font-size: 10px; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compare-who.me { color: var(--text); }
.compare-bar { height: 14px; background: rgba(154,160,184,0.18); border-radius: 8px; overflow: hidden; box-shadow: inset 2px 2px 5px var(--sd), inset -1px -1px 3px var(--sl); position: relative; }
.compare-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; background-image: linear-gradient(180deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.08) 100%); position: relative; }
.compare-bar-fill.me {}
.compare-bar-fill.peer { opacity: 0.85; }
.compare-pct { font-weight: 800; color: var(--text); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.compare-pct.peer { color: var(--text2); font-weight: 700; }
.genre-list { margin-top: 12px; display: none; flex-direction: column; gap: 6px; padding-top: 4px; }
.group-card.open .genre-list { display: flex; }
.genre-row { display: grid; grid-template-columns: 1fr 80px 36px 24px; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
.genre-row:hover { background: rgba(154,160,184,0.08); }
.genre-row:active { transform: scale(0.98); }
.genre-row.done { opacity: 0.55; }
.genre-name-txt { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.genre-bar { height: 5px; background: rgba(154,160,184,0.2); border-radius: 3px; overflow: hidden; }
.genre-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.genre-pct { font-size: 11px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.genre-go { color: var(--text3); font-size: 14px; text-align: right; }
.total-progress { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.total-progress .num { font-size: 28px; font-weight: 900; color: var(--accent); line-height: 1; }
.total-progress .lbl { font-size: 11px; color: var(--text2); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

.start-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 6px 6px 14px var(--sd); }
.start-btn:active { transform: scale(0.98); box-shadow: inset 3px 3px 8px rgba(0,0,0,0.15); }
.start-btn:disabled { opacity: 0.5; }

.recent-words { display: flex; flex-wrap: wrap; gap: 6px; }
.word-chip { background: var(--accent-soft); color: var(--accent); padding: 5px 11px; border-radius: 12px; font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.word-row { padding: 10px 14px; background: var(--bg); border-radius: 10px; box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); cursor: pointer; transition: transform 0.1s; }
.word-row:active { transform: scale(0.98); }
.word-row .row-label { font-weight: 700; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.word-row .row-dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
.word-row .row-explain { display: none; font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.7; padding-left: 16px; border-left: 2px solid var(--accent); }
.word-row.open .row-explain { display: block; }
.word-row.open .row-chev { transform: rotate(90deg); }
.word-row .row-chev { font-family: 'Material Symbols Outlined'; margin-left: auto; transition: transform 0.2s; color: var(--text3); font-size: 16px; }

.peer-card { background: var(--bg); border-radius: 18px; padding: 14px; margin-bottom: 10px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); }
.peer-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.peer-name { font-size: 14px; font-weight: 700; }
.peer-level { font-size: 11px; color: var(--text2); font-weight: 600; }
.peer-level strong { color: var(--accent); font-size: 14px; }

/* セッション画面 */
.session-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.session-progress .text { font-size: 11px; color: var(--text2); font-weight: 700; min-width: 50px; }
.session-progress .bar-wrap { flex: 1; height: 6px; background: rgba(154,160,184,0.2); border-radius: 3px; overflow: hidden; }
.session-progress .bar-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #6d28d9); border-radius: 3px; transition: width 0.4s; }

.q-category { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px; color: white; letter-spacing: 0.06em; margin-bottom: 12px; }
.q-text { font-size: 16px; font-weight: 700; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
.q-image { width: 100%; max-height: 280px; object-fit: contain; border-radius: 12px; margin-bottom: 14px; background: rgba(154,160,184,0.1); }
.q-demo { width: 100%; height: 280px; border: none; border-radius: 12px; margin-bottom: 14px; background: #f5f5f7; box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 4px var(--sl); }
.q-demo-hint { font-size: 10px; color: var(--text3); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }

.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice-btn { width: 100%; padding: 14px 16px; border-radius: 14px; border: none; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; color: var(--text); background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); line-height: 1.5; }
.choice-btn:active:not(:disabled) { transform: scale(0.98); }
.choice-btn.correct { background: rgba(42,140,58,0.15); color: var(--correct); font-weight: 800; box-shadow: inset 2px 2px 6px rgba(42,140,58,0.2); animation: btn-glow 0.6s ease-out; }
.choice-btn.incorrect { background: rgba(176,64,64,0.12); color: var(--incorrect); box-shadow: inset 2px 2px 6px rgba(176,64,64,0.2); animation: btn-shake 0.4s ease-out; }
@keyframes btn-glow { 0% { box-shadow: 0 0 0 0 rgba(42,140,58,0); } 50% { box-shadow: 0 0 0 16px rgba(42,140,58,0); transform: scale(1.04); } 100% { box-shadow: 0 0 0 0 rgba(42,140,58,0); transform: scale(1); } }
@keyframes btn-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* 派手目フィードバック演出 */
.fb-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; }
.fb-overlay.show { animation: fb-flash 0.7s ease-out; }
.fb-overlay.show.correct { background: radial-gradient(circle at center, rgba(42,140,58,0.4), rgba(42,140,58,0.05) 40%, transparent 70%); }
.fb-overlay.show.incorrect { background: radial-gradient(circle at center, rgba(176,64,64,0.35), rgba(176,64,64,0.05) 40%, transparent 70%); }
.fb-icon { font-size: 200px; font-weight: 900; line-height: 1; text-shadow: 0 8px 30px rgba(0,0,0,0.2); font-family: 'Outfit', sans-serif; }
.fb-icon.correct { color: #2a8c3a; animation: fb-pop 0.7s cubic-bezier(0.5, 1.6, 0.6, 1); }
.fb-icon.incorrect { color: #b04040; animation: fb-shake 0.5s ease-out; }
@keyframes fb-flash { 0% { opacity: 0; } 25% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fb-pop { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.3) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes fb-shake { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-20px) rotate(-5deg); } 40% { transform: translateX(20px) rotate(5deg); } 60% { transform: translateX(-15px) rotate(-3deg); } 80% { transform: translateX(15px) rotate(3deg); } }

.confetti { position: fixed; top: 50%; font-size: 32px; pointer-events: none; z-index: 1001; animation: confetti-rise 1.6s ease-out forwards; }
@keyframes confetti-rise { 0% { transform: translateY(0) translateX(0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-100vh) translateX(var(--dx, 0px)) rotate(720deg); opacity: 0; } }

.result-card { animation: card-in 0.45s ease-out; }
@keyframes card-in { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
.result-status { font-size: 18px !important; letter-spacing: 0.04em; }
.choice-btn:disabled { cursor: default; }

.free-input { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--bg); box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); font-family: inherit; font-size: 15px; color: var(--text); }
.free-input:focus { outline: none; box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl), 0 0 0 2px rgba(109,40,217,0.3); }
.free-submit { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: none; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: white; background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.free-submit:disabled { opacity: 0.5; background: #aaa; }

.result-card { padding: 14px; border-radius: 14px; margin-top: 14px; line-height: 1.7; }
.result-card.correct { background: rgba(42,140,58,0.1); border-left: 4px solid var(--correct); }
.result-card.incorrect { background: rgba(176,64,64,0.08); border-left: 4px solid var(--incorrect); }
.result-status { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
.result-status.correct { color: var(--correct); }
.result-status.incorrect { color: var(--incorrect); }
.result-answer { font-size: 13px; margin-bottom: 8px; }
.result-answer strong { color: var(--accent); }
.result-explanation { font-size: 13px; color: var(--text); line-height: 1.7; }
.result-claude { margin-top: 10px; padding: 10px 12px; background: rgba(109,40,217,0.06); border-radius: 10px; font-size: 12px; line-height: 1.6; color: var(--text2); }
.result-claude .lbl { font-size: 10px; font-weight: 800; color: var(--accent); margin-bottom: 4px; letter-spacing: 0.1em; text-transform: uppercase; }

.next-btn { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; border: none; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; color: white; background: linear-gradient(135deg, #6b7eff, #4961ff); }
.next-btn:active { transform: scale(0.98); }

/* 結果画面 */
.summary-hero { text-align: center; padding: 20px 0; }
.summary-score { font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; }
.summary-score-label { font-size: 12px; color: var(--text2); font-weight: 700; margin-top: 6px; }
.summary-level-change { font-size: 14px; margin-top: 14px; font-weight: 700; }
.summary-level-change.up { color: var(--correct); }
.summary-level-change.down { color: var(--incorrect); }
.summary-level-change.same { color: var(--text2); }

.empty { text-align: center; color: var(--text3); font-size: 12px; padding: 24px 0; font-weight: 600; }
.err { color: var(--incorrect); font-size: 11px; margin-top: 10px; font-weight: 600; padding: 10px 12px; border-radius: 12px; background: rgba(176, 64, 64, 0.08); white-space: pre-wrap; word-break: break-all; line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
.err:empty { display: none; padding: 0; }

.view { display: none; }
.view.active { display: block; }
</style>
</head>
<body>

<div class="fb-overlay" id="fbOverlay"><span class="fb-icon" id="fbIcon"></span></div>

<div class="bar">
  <span class="hint" id="appHint">techstudy</span>
  <button class="pill" onclick="location.href='/'">← 戻る</button>
</div>

<div class="wrap">
  <div class="title" id="appTitle">techstudy</div>
  <div class="subtitle" id="appSubtitle">ITまわりの用語・仕組み・歴史を、知らぬ間に</div>

  <!-- ホーム画面 -->
  <div class="view active" id="homeView">
    <div class="card">
      <div class="label">あなた</div>
      <div class="level-hero">
        <div class="hero-row">
          <div class="hero-stat">
            <div class="hero-num" id="myLevel">-</div>
            <div class="hero-lbl">LEVEL</div>
          </div>
          <div class="hero-stat">
            <div class="hero-num" id="myTotalPct">0<span class="hero-unit">%</span></div>
            <div class="hero-lbl">習得率</div>
          </div>
          <div class="hero-stat">
            <div class="hero-num"><span id="myStreak">0</span><span class="hero-unit">🔥</span></div>
            <div class="hero-lbl" id="myStreakLbl">連続0日</div>
          </div>
        </div>
        <div class="level-lbl" id="myLevelStats" style="margin-top:14px;"></div>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startSession()">
      <span class="icon" style="vertical-align:-0.18em;">play_circle</span>
      20問にチャレンジ (弱いジャンル優先)
    </button>


    <div class="card" style="margin-top: 16px;">
      <div class="label">ジャンル別の達成度</div>
      <div class="radar-wrap">
        <svg id="radarSvg" class="radar-svg" viewBox="0 0 360 360"></svg>
      </div>
      <div class="radar-legend-title" id="radarLegendTitle"></div>
      <div class="radar-legend" id="radarLegend"></div>
    </div>

    <div class="card">
      <div class="label">最近覚えた言葉 <span id="wordsCount" style="color:var(--text3);font-weight:600;"></span></div>
      <div class="recent-words" id="myWords"><div class="empty">まだなし</div></div>
      <button id="wordsToggle" onclick="toggleWordsExpand()" style="display:none; margin-top:10px; padding:7px 14px; border:none; border-radius:8px; background:var(--bg); box-shadow: inset 2px 2px 6px var(--sd), inset -2px -2px 6px var(--sl); color:var(--accent); font-weight:700; font-size:11px; cursor:pointer; width:100%;">全部見る ▼</button>
      <div id="wordsExpanded" style="display:none; flex-direction:column; gap:6px; margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="label">みんなの進捗</div>
      <div id="peerList"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="err" id="homeErr"></div>

const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

// ───── 認証 + API ─────
let authToken = null;
let fbUser = null;
async function api(method, path, body) {
  if (!authToken && fbUser) authToken = await fbUser.getIdToken();
  if (!authToken) throw new Error("ログインが切れました");
  const res = await fetch(window.API_BASE + path, {
    method,
    headers: {
      authorization: "Bearer " + authToken,
      ...(body ? { "content-type": "application/json" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

// ───── ホーム画面 ─────
async function loadHome() {
  $("homeErr").textContent = "";
  try {
    const [me, peers, genresData] = await Promise.all([
      api("GET", "/api/kotonoha/me"),
      api("GET", "/api/kotonoha/peers"),
      api("GET", "/api/kotonoha/genres").catch(() => null),
    ]);
    // domain config からタイトル/サブタイトル動的設定
    const dom = genresData?.domain;
    if (dom) {
      if (dom.title) {
        document.title = dom.title;
        $("appTitle").textContent = dom.title;
        $("appHint").textContent = dom.title;
      }
      if (dom.subtitle) $("appSubtitle").textContent = dom.subtitle;
    }
    renderMe(me, peers);
    renderPeers(peers);
  } catch (e) {
    $("homeErr").textContent = e.message;
  }
}

function renderMe(me, peers) {
  $("myLevel").textContent = me.user.level;
  $("myLevelStats").textContent =
    `通算 正解 ${me.user.total_correct} / ${me.user.total_answers}`;

  // 全ジャンル平均%
  let totT = 0, totC = 0;
  for (const g of (me.groups || [])) {
    state.groupColorMap.set(g.id, g.color);
    state.groupNameMap.set(g.id, g.name);
    for (const gen of g.genres) { totT += gen.target; totC += gen.correct; }
  }
  $("myTotalPct").firstChild.textContent = totT ? Math.round((totC / totT) * 100) : 0;

  // 連続日数 (streak)
  const s = me.streak || { streak: 0, today_active: false, today_correct: 0, daily_min: 5 };
  $("myStreak").textContent = s.streak;
  const streakEl = $("myStreakLbl");
  const streakStat = $("myStreak").parentElement;
  streakStat.classList.remove("streak-today-pending");
  if (s.streak === 0 && !s.today_active) {
    streakEl.textContent = `今日 ${s.daily_min}問で開始`;
  } else if (s.today_active) {
    streakEl.textContent = `連続 ${s.streak}日`;
  } else {
    // 昨日まで連続 N 日、今日まだ未達
    streakEl.textContent = `あと${Math.max(0, s.daily_min - s.today_correct)}問で継続`;
    streakStat.classList.add("streak-today-pending");
  }

  // 比較対象 peer (最初のメンバー)
  const peer = (peers || [])[0] || null;
  const peerGroupMap = new Map();
  if (peer) {
    for (const g of (peer.groups || [])) peerGroupMap.set(g.id, g);
  }
  const myName = (me.user?.display_name) || "あなた";
  const peerName = peer?.display_name || null;

  // レーダーチャート + 凡例
  renderRadarChart(me.groups || [], peerGroupMap, myName, peerName);

  // 覚えた言葉: chip 6 個 + 「全部見る」で list 展開
  const words = $("myWords");
  const toggle = $("wordsToggle");
  const expanded = $("wordsExpanded");
  const countEl = $("wordsCount");
  const learnedList = me.learned || me.recentWords || [];
  state.learnedAll = learnedList;
  if (countEl) countEl.textContent = learnedList.length ? `(${learnedList.length})` : "";
  if (!learnedList.length) {
    words.innerHTML = `<div class="empty">まだなし</div>`;
    if (toggle) toggle.style.display = "none";
    if (expanded) { expanded.style.display = "none"; expanded.innerHTML = ""; }
  } else {
    words.innerHTML = "";
    for (const w of learnedList.slice(0, 6)) {
      const chip = document.createElement("span");
      chip.className = "word-chip";
      chip.textContent = w.label || w.answer || "";
      const c = state.groupColorMap.get(w.group_id) || "var(--accent)";
      chip.style.color = c;
      chip.style.background = `color-mix(in srgb, ${c} 14%, var(--bg) 86%)`;
      words.appendChild(chip);
    }
    if (toggle) toggle.style.display = learnedList.length > 6 ? "block" : "none";
  }
}

function toggleWordsExpand() {
  const expanded = $("wordsExpanded");
  const toggle = $("wordsToggle");
  const words = $("myWords");
  if (!expanded || !toggle) return;
  const isOpen = expanded.style.display === "flex";
  if (isOpen) {
    expanded.style.display = "none";
    toggle.textContent = `全部見る (${state.learnedAll?.length || 0}) ▼`;
    if (words) words.style.display = "flex";
  } else {
    if (words) words.style.display = "none";
    expanded.style.display = "flex";
    expanded.innerHTML = "";
    for (const w of (state.learnedAll || [])) {
      const row = document.createElement("div");
      row.className = "word-row";
      const c = state.groupColorMap.get(w.group_id) || "var(--accent)";
      row.innerHTML =
        `<div class="row-label">
           <div class="row-dot" style="background:${c};"></div>
           <span>${escapeHtml(w.label || "")}</span>
           <span class="row-chev">chevron_right</span>
         </div>
         <div class="row-explain">${escapeHtml(w.explanation || "解説なし")}</div>`;
      row.addEventListener("click", () => row.classList.toggle("open"));
      expanded.appendChild(row);
    }
    toggle.textContent = "閉じる ▲";
  }
}
window.toggleWordsExpand = toggleWordsExpand;

// グループ ID → 短縮ラベル (レーダー軸の表示用)
const GROUP_SHORT = {
  banax_os: "BANAX",
  graphics3d: "3D",
  engineer_mindset: "心得",
  wonders: "仕組み",
  monetize: "収益",
  history: "歴史",
  algorithms: "アルゴ",
  ai_basics: "AI基礎",
  ai_agents: "Agent",
  web3: "Web3",
  ui_parts: "UI部品",
  ui_design: "UI設計",
  db: "DB",
  api: "API",
  infra: "インフラ",
  security: "Sec",
  devflow: "Dev",
};

function renderRadarChart(myGroups, peerGroupMap, myName, peerName) {
  const svg = $("radarSvg");
  const W = 360, H = 360, cx = W / 2, cy = H / 2, R = 110;
  const N = myGroups.length;
  if (N === 0) {
    svg.innerHTML = `<text x="180" y="180" font-size="12" fill="#888" text-anchor="middle">ジャンル未読込</text>`;
    return;
  }
  const point = (i, pct) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const r = (R * Math.min(100, Math.max(0, pct))) / 100;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let html = "";
  // 同心 polygon (25/50/75/100%)
  for (const grid of [25, 50, 75, 100]) {
    const pts = myGroups.map((_, i) => point(i, grid).join(",")).join(" ");
    html += `<polygon class="grid ${grid === 100 ? "grid-100" : ""}" points="${pts}"/>`;
  }
  // 軸線
  for (let i = 0; i < N; i++) {
    const [x, y] = point(i, 100);
    html += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
  }
  // peer polygon (背面に)
  const peerArr = myGroups.map((g) => peerGroupMap.get(g.id));
  if (peerName) {
    const peerPts = peerArr.map((pg, i) => point(i, pg?.pct || 0).join(",")).join(" ");
    html += `<polygon class="peer-poly" points="${peerPts}"/>`;
  }
  // 自分 polygon
  const myPts = myGroups.map((g, i) => point(i, g.pct).join(",")).join(" ");
  html += `<polygon class="me-poly" points="${myPts}"/>`;
  // ラベル (短縮名、軸の外側に)
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / N;
    const lr = R + 22;
    const lx = cx + lr * Math.cos(a);
    const ly = cy + lr * Math.sin(a) + 4;
    const cosA = Math.cos(a);
    const anchor = cosA > 0.35 ? "start" : cosA < -0.35 ? "end" : "middle";
    const short = GROUP_SHORT[myGroups[i].id] || myGroups[i].name.slice(0, 4);
    html += `<text class="label" x="${lx}" y="${ly}" fill="${myGroups[i].color}" text-anchor="${anchor}">${escapeHtml(short)}</text>`;
  }
  svg.innerHTML = html;

  // 凡例タイトル (色の意味)
  const lt = $("radarLegendTitle");
  lt.innerHTML = `<span><span class="swatch" style="background:#6d28d9;"></span>${escapeHtml(myName)}</span>`
    + (peerName ? `<span><span class="swatch" style="background:#f59e0b;border:1px dashed #f59e0b;"></span>${escapeHtml(peerName)}</span>` : "");

  // 凡例リスト (情報表示のみ)
  const legend = $("radarLegend");
  legend.innerHTML = "";
  for (const g of myGroups) {
    const pg = peerGroupMap.get(g.id);
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML =
      `<div class="legend-dot" style="background:${g.color};"></div>` +
      `<div class="legend-name">${escapeHtml(g.name)}</div>` +
      `<div class="legend-pct">${g.pct}%${peerName ? `<span class="peer">/ ${pg?.pct || 0}%</span>` : ""}</div>`;
    legend.appendChild(item);
  }
}

function renderPeers(peers) {
  const list = $("peerList");
  if (!peers?.length) {
    list.innerHTML = `<div class="empty">他のメンバーがまだいません</div>`;
    return;
  }
  list.innerHTML = "";
  for (const p of peers) {
    const div = document.createElement("div");
    div.className = "peer-card";
    // 平均%
    let tt = 0, tc = 0;
    for (const g of (p.groups || [])) for (const gen of g.genres) { tt += gen.target; tc += gen.correct; }
    const avg = tt ? Math.round((tc/tt)*100) : 0;
    // 上位5グループだけ表示
    const topGroups = (p.groups || []).slice().sort((a, b) => b.pct - a.pct).slice(0, 5);
    let bars = "";
    for (const g of topGroups) {
      bars += `<div class="cat-row">
        <div class="cat-name" style="font-size:10px;">${escapeHtml(g.name)}</div>
        <div class="cat-bar"><div class="cat-bar-fill" style="width:${g.pct}%; background:${g.color};"></div></div>
        <div class="cat-count">${g.pct}%</div>
      </div>`;
    }
    const ps = p.streak;
    const streakBadge = ps && ps.streak > 0
      ? ` ・ 🔥<strong>${ps.streak}</strong>日`
      : "";
    div.innerHTML = `
      <div class="peer-header">
        <div class="peer-name">${escapeHtml(p.display_name)}</div>
        <div class="peer-level">LV. <strong>${p.level}</strong> ・ 平均 ${avg}%${streakBadge}</div>
      </div>
      <div class="cats">${bars}</div>`;
    list.appendChild(div);
  }
}

// ───── セッション (キュー方式 + リトライループ) ─────
async function startSession(genre) {
  if (state.busy) return;
  state.busy = true;
  const btn = $("startBtn");
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="icon" style="vertical-align:-0.18em;">hourglass_top</span> 問題を準備中…`;
  $("homeErr").textContent = "";
  state.focusGenre = genre || null;
  try {
    const sessionRes = await api("POST", "/api/kotonoha/sessions/start", genre ? { genre } : {});
    const { questions } = sessionRes;
    if (!questions.length) throw new Error("問題がありません。シード DB の投入が必要かも。");
    // キュー初期化
    state.questionMap = new Map();
    state.queue = [];
    for (const q of questions) {
      state.questionMap.set(q.id, q);
      state.queue.push(q.id);
    }
    state.completedIds = new Set();
    state.totalUnique = questions.length;
    state.attemptCount = 0;
    state.currentQId = null;
    showSession();
    nextQuestion();
  } catch (e) {
    $("homeErr").textContent = e.message;
  } finally {
    state.busy = false;
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}
window.startSession = startSession;

function renderCurrentQuestion() {
  const q = state.questionMap.get(state.currentQId);
  if (!q) {
    endSession();
    return;
  }
  // 進捗: 完了 unique 数 / total
  const done = state.completedIds.size;
  const total = state.totalUnique;
  const pct = (done / total) * 100;
  const remaining = state.queue.length; // 残キュー (現在の問題を除く)
  const inRetryPhase = state.attemptCount >= total; // 初回20問を超えたらリトライ中
  $("sessionProgressText").textContent = inRetryPhase
    ? `🔁 リトライ あと${remaining + 1}問`
    : `${done} / ${total}`;
  $("sessionProgressFill").style.width = `${pct}%`;

  // ジャンル名は答えを spoiler するので、グループ名 (広い分類) を表示
  $("qCategory").textContent = state.groupNameMap.get(q.group_id) || q.category || "学習";
  $("qCategory").style.background = state.groupColorMap.get(q.group_id) || "var(--accent)";
  $("qText").textContent = q.question;
  // UI部品の HTML 実物デモ
  // ハードコード優先 (動作確認済の 11 種)、それ以外は AI 生成 (DB) を使う
  const demoHtml = UI_DEMOS[q.genre] || UI_DEMOS[q.answer] || q.demo_html;
  if (demoHtml) {
    $("qDemo").srcdoc = demoHtml;
    $("qDemoWrap").style.display = "";
    $("qImage").style.display = "none";
  } else if (q.image_url) {
    $("qImage").src = q.image_url;
    $("qImage").style.display = "";
    $("qDemoWrap").style.display = "none";
  } else {
    $("qImage").style.display = "none";
    $("qDemoWrap").style.display = "none";
  }
  $("resultArea").style.display = "none";
  $("resultArea").innerHTML = "";

  if (q.type === "choice") {
    $("choiceList").style.display = "";
    $("freeArea").style.display = "none";
    const cl = $("choiceList");
    cl.innerHTML = "";
    for (const opt of (q.options || [])) {
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = opt;
      b.onclick = () => submitChoice(opt, b);
      cl.appendChild(b);
    }
  } else {
    $("choiceList").style.display = "none";
    $("freeArea").style.display = "";
    $("freeInput").value = "";
    $("freeInput").disabled = false;
    $("freeSubmit").disabled = false;
    setTimeout(() => $("freeInput").focus(), 50);
  }
}

function handleAnswerResult(qId, r) {
  state.attemptCount++;
  if (r.is_correct) {
    state.completedIds.add(qId);
  } else {
    // 不正解 → キュー末尾に再追加 (正解出るまで終わらない)
    state.queue.push(qId);
  }
  showFeedback(r.is_correct);
}

// 派手目フィードバック演出
function showFeedback(isCorrect) {
  const ov = $("fbOverlay");
  const ic = $("fbIcon");
  const cls = isCorrect ? "correct" : "incorrect";
  ov.className = "fb-overlay show " + cls;
  ic.className = "fb-icon " + cls;
  ic.textContent = isCorrect ? "✓" : "✕";
  // 振動 (Android 等で効く)
  try { navigator.vibrate?.(isCorrect ? [25] : [40, 40, 40]); } catch (e) {}
  // 紙吹雪 (正解時)
  if (isCorrect) spawnConfetti();
  setTimeout(() => { ov.className = "fb-overlay"; }, 700);
}

function spawnConfetti() {
  const emojis = ["🎉", "✨", "⭐", "🌟", "💫", "🎊"];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = (5 + Math.random() * 90) + "%";
    p.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    p.style.animationDelay = (Math.random() * 0.25) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1900);
  }
}

async function submitChoice(opt, btn) {
  if (state.busy) return;
  state.busy = true;
  document.querySelectorAll(".choice-btn").forEach((b) => b.disabled = true);
  try {
    const qId = state.currentQId;
    const r = await api("POST", "/api/kotonoha/answer", { question_id: qId, user_answer: opt });
    document.querySelectorAll(".choice-btn").forEach((b) => {
      if (b.textContent === r.answer) b.classList.add("correct");
      else if (b === btn && !r.is_correct) b.classList.add("incorrect");
    });
    handleAnswerResult(qId, r);
    renderResult(r);
  } catch (e) {
    $("sessionErr").textContent = e.message;
    document.querySelectorAll(".choice-btn").forEach((b) => b.disabled = false);
  } finally {
    state.busy = false;
  }
}

async function submitFree() {
  if (state.busy) return;
  const ua = $("freeInput").value.trim();
  if (!ua) return;
  state.busy = true;
  $("freeInput").disabled = true;
  $("freeSubmit").disabled = true;
  $("freeSubmit").textContent = "判定中…";
  try {
    const qId = state.currentQId;
    const r = await api("POST", "/api/kotonoha/answer", { question_id: qId, user_answer: ua });
    handleAnswerResult(qId, r);
    renderResult(r);
  } catch (e) {
    $("sessionErr").textContent = e.message;
    $("freeInput").disabled = false;
    $("freeSubmit").disabled = false;
    $("freeSubmit").textContent = "送信";
  } finally {
    state.busy = false;
  }
}
window.submitFree = submitFree;

function renderResult(r) {
  $("freeSubmit").textContent = "送信";
  const ra = $("resultArea");
  ra.style.display = "";
  // 次に何が来るか判定 (キュー空 = 終了)
  const isLast = state.queue.length === 0;
  const nextLabel = isLast
    ? "🎉 結果を見る →"
    : (r.is_correct ? `次の問題へ → (あと${state.queue.length}問)` : `もう一度挑戦 → (あと${state.queue.length}問)`);
  const cls = r.is_correct ? "correct" : "incorrect";
  const statusText = r.is_correct ? "🎉 正解！" : "💧 おしい";
  ra.innerHTML = `
    <div class="result-card ${cls}">
      <div class="result-status ${cls}">${statusText}</div>
      ${!r.is_correct ? `<div class="result-answer">正解: <strong>${escapeHtml(r.answer)}</strong></div>` : ""}
      <div class="result-explanation">${escapeHtml(r.explanation)}</div>
      ${r.claude_example ? `
      <div class="result-claude">
        <div class="lbl">Claude Code への指示の例</div>
        ${escapeHtml(r.claude_example)}
      </div>` : ""}
      ${r.ai_reason ? `<div style="font-size:10px;color:var(--text3);margin-top:8px;">AI 判定: ${escapeHtml(r.ai_reason)}</div>` : ""}
    </div>
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>`;
  // 結果カードまでスクロール
  setTimeout(() => ra.scrollIntoView({ behavior: "smooth", block: "center" }), 50);
}

function nextQuestion() {
  if (state.queue.length === 0) {
    endSession();
    return;
  }
  state.currentQId = state.queue.shift();
  renderCurrentQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
window.nextQuestion = nextQuestion;

async function endSession() {
  try {
    const r = await api("POST", "/api/kotonoha/sessions/end");
    showSummary(r);
  } catch (e) {
    $("sessionErr").textContent = e.message;
  }
}

function showSummary(r) {
  state.view = "summary";
  $("homeView").classList.remove("active");
  $("sessionView").classList.remove("active");
  $("summaryView").classList.add("active");

  // 全問正解までやる仕組み: 結果は「unique完了数 / 総ユニーク数」
  // 総回答数 (attemptCount) も表示してリトライ回数が分かるように
  $("summaryScore").textContent = `${state.completedIds.size}`;
  const sl = $("summaryScoreLabel");
  if (sl) sl.textContent = `${state.totalUnique} 問中の完了 (総回答 ${state.attemptCount})`;
  const lc = $("summaryLevelChange");
  if (r.levelChanged && r.newLevel > r.oldLevel) {
    lc.textContent = `🎓 レベルアップ ${r.oldLevel} → ${r.newLevel}`;
    lc.className = "summary-level-change up";
  } else if (r.levelChanged && r.newLevel < r.oldLevel) {
    lc.textContent = `レベル ${r.oldLevel} → ${r.newLevel} (基礎を復習しよう)`;
    lc.className = "summary-level-change down";
  } else {
    lc.textContent = `レベル ${r.newLevel} 継続`;
    lc.className = "summary-level-change same";
  }
}

// ───── view 切替 ─────
function showHome() {
  state.view = "home";
  $("homeView").classList.add("active");
  $("sessionView").classList.remove("active");
  $("summaryView").classList.remove("active");
  loadHome();
  window.scrollTo({ top: 0 });
}
function showSession() {
  state.view = "session";
  $("homeView").classList.remove("active");
  $("sessionView").classList.add("active");
  $("summaryView").classList.remove("active");
  window.scrollTo({ top: 0 });
}
window.showHome = showHome;

// Enter で自由記述送信
$("freeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    submitFree();
  }
});
