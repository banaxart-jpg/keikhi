<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宿">
<link rel="apple-touch-icon" href="/yado/icon.svg">
<title>宿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #b45309; --accent2: #d97706;     /* 旅館の暖色 */
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg) 88%);
  --danger: #b04040;
  /* 予約チャネル色 (各社のブランド色寄せ) */
  --ch-airbnb: #FF5A5F;
  --ch-booking: #003580;
  --ch-direct: #2a8c3a;
  --ch-other: #707390;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 60px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

/* タブ */
.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: inherit; transition: all 200ms ease; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(180,83,9,0.35), -3px -3px 10px var(--sl); }

/* 月切り替えバー */
.month-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; gap: 12px; }
.month-bar .nav { width: 38px; height: 38px; border-radius: 19px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); font-size: 18px; color: var(--text2); cursor: pointer; font-family: inherit; }
.month-bar .nav:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.month-bar .label { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; flex: 1; text-align: center; }
.today-btn { font-size: 11px; padding: 6px 12px; border-radius: 14px; }

/* カレンダーグリッド */
.cal { padding: 0 12px 18px; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 4px 6px; }
.dow > div { text-align: center; font-size: 10px; font-weight: 800; color: var(--text2); letter-spacing: 0.06em; }
.dow .sat { color: #3a6ad6; }
.dow .sun { color: #c34a4a; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 4px; }
.cell { aspect-ratio: 1 / 1.25; background: var(--bg); border-radius: 10px; box-shadow: 2px 2px 6px var(--sd), -1px -1px 4px var(--sl); padding: 4px 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: transform 120ms ease; min-width: 0; overflow: hidden; }
.cell.other { opacity: 0.32; }
.cell.today { box-shadow: 0 0 0 2px var(--accent2), 2px 2px 6px var(--sd); }
.cell.selected { box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }
.cell:active { transform: scale(0.96); }
.cell .num { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1; }
.cell .num.sat { color: #3a6ad6; }
.cell .num.sun { color: #c34a4a; }
.cell .bars { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.bar { height: 5px; border-radius: 3px; flex-shrink: 0; }
.bar.airbnb  { background: var(--ch-airbnb); }
.bar.booking { background: var(--ch-booking); }
.bar.direct  { background: var(--ch-direct); }
.bar.other   { background: var(--ch-other); }
.more { font-size: 8px; font-weight: 700; color: var(--text3); text-align: right; line-height: 1; }

/* 凡例 */
.legend { display: flex; gap: 10px; padding: 0 18px 16px; font-size: 11px; color: var(--text2); font-weight: 700; flex-wrap: wrap; }
.legend > span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 3px; }
.dot.airbnb { background: var(--ch-airbnb); }
.dot.booking { background: var(--ch-booking); }
.dot.direct { background: var(--ch-direct); }
.dot.other { background: var(--ch-other); }

/* 選択日の詳細 */
.detail { padding: 0 18px 18px; }
.detail .head { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
.book-card { background: var(--bg); border-radius: 14px; padding: 12px 14px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.book-card .ch-pill { width: 6px; align-self: stretch; border-radius: 3px; }
.book-card .ch-pill.airbnb { background: var(--ch-airbnb); }
.book-card .ch-pill.booking { background: var(--ch-booking); }
.book-card .ch-pill.direct { background: var(--ch-direct); }
.book-card .ch-pill.other { background: var(--ch-other); }
.book-card .body { flex: 1; min-width: 0; }
.book-card .name { font-size: 13px; font-weight: 700; }
.book-card .meta { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 2px; letter-spacing: 0.02em; }
.book-card .price { font-size: 14px; font-weight: 800; color: var(--accent); }

/* サマリータブ */
.summary { padding: 0 18px 30px; }
.kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--bg); border-radius: 16px; padding: 16px 14px; box-shadow: 6px 6px 14px var(--sd), -4px -4px 10px var(--sl); }
.kpi .lbl { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.kpi .val { font-size: 22px; font-weight: 800; color: var(--text); }
.kpi .sub { font-size: 10px; color: var(--text3); font-weight: 600; margin-top: 4px; }
.bar-chart { background: var(--bg); border-radius: 16px; padding: 16px 14px; box-shadow: 6px 6px 14px var(--sd), -4px -4px 10px var(--sl); margin-bottom: 18px; }
.bar-chart .h { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.bars-grid { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-bottom: 4px; border-bottom: 1px solid var(--text3); }
.bars-grid .col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; gap: 1px; }
.bars-grid .seg { width: 100%; border-radius: 2px; }
.bars-grid .lbl { font-size: 9px; font-weight: 700; color: var(--text2); text-align: center; margin-top: 6px; }
.bars-grid .seg.airbnb { background: var(--ch-airbnb); }
.bars-grid .seg.booking { background: var(--ch-booking); }
.bars-grid .seg.direct { background: var(--ch-direct); }
.bars-grid .seg.other { background: var(--ch-other); }

/* シート同期ボタン (サマリータブ末尾) */
.sync-btn { width: 100%; padding: 14px 16px; border-radius: 18px; border: none; background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
.sync-btn:disabled { opacity: 0.55; }
.sync-btn:active { box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }
.sync-btn .icon { font-size: 18px; }
.sync-msg { font-size: 11px; color: var(--text2); text-align: center; margin-top: 8px; font-weight: 600; }

/* 戦略タブ */
.strategy { padding: 0 18px 40px; }
.strategy .intro { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 14px; }
.strategy .gen-btn { width: 100%; padding: 16px 18px; border-radius: 20px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 6px 6px 16px rgba(180,83,9,0.35), -4px -4px 10px var(--sl); font-family: inherit; }
.strategy .gen-btn:disabled { opacity: 0.55; }
.strategy .gen-btn:active { transform: scale(0.97); }
.strategy .result { margin-top: 18px; background: var(--bg); border-radius: 16px; padding: 16px; box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.strategy .meta { font-size: 11px; color: var(--text3); margin-top: 10px; font-weight: 600; }

/* 生 JSON モーダル */
.raw-controls { display: flex; gap: 8px; }
.raw-meta { font-size: 11px; color: var(--text3); margin: 10px 4px 4px; font-family: ui-monospace, Menlo, monospace; }
.raw-pre { background: var(--bg2); border-radius: 12px; padding: 12px; margin-top: 6px;
  font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5; color: var(--text);
  white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow-y: auto;
  box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }

/* 空状態 / エラー */
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 40px 18px; }
.warn { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fff3d6; color: #7a5b18; font-size: 12px; font-weight: 600; line-height: 1.6; box-shadow: 3px 3px 8px var(--sd); }
.warn .icon { vertical-align: -0.18em; margin-right: 4px; }
.err { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fde0e0; color: #8a2727; font-size: 12px; font-weight: 600; }
.loading { text-align: center; color: var(--text2); font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { BottomSheet } from "/bottom-sheet.js";

const CHANNELS = ["airbnb", "booking", "direct", "other"];
const CHANNEL_LABEL = { airbnb: "Airbnb", booking: "Booking.com", direct: "自社サイト", other: "その他" };

// Beds24 の referer 文字列をうちのチャネル分類に正規化。
// 完全リストは把握してないので名前ヒューリスティック。マッチしないものは "other"。
function normalizeChannel(referer) {
  const s = (referer || "").toLowerCase();
  if (s.includes("airbnb")) return "airbnb";
  if (s.includes("booking")) return "booking";
  if (s.includes("direct") || s.includes("website") || s.includes("自社") || s.includes("manual")) return "direct";
  return "other";
}

// 当月のサンプル予約 (トークン未設定時の表示用)。
function sampleBookings(yyyymm) {
  const [y, m] = yyyymm.split("-").map(Number);
  const mk = (d, nights, ch, name, price) => {
    const a = new Date(y, m - 1, d);
    const dep = new Date(y, m - 1, d + nights);
    const fmt = (dt) => dt.toISOString().slice(0, 10);
    return { id: `sample-${d}-${ch}`, arrival: fmt(a), departure: fmt(dep), channel: ch, guestName: name, price, nights, adult: 2, child: 0 };
  };
  return [
    mk(3, 2, "airbnb",  "佐藤様", 38000),
    mk(7, 1, "booking", "Smith様", 21500),
    mk(10, 3, "direct", "田中様", 72000),
    mk(14, 2, "airbnb", "鈴木様", 41000),
    mk(18, 1, "other",  "電話予約", 18000),
    mk(22, 2, "booking", "Chen様", 39800),
    mk(27, 3, "direct", "山田様", 78000),
  ];
}

const TEMPLATE = `
<div>
  <div class="header-fix">
    <div class="top">
      <span class="title"><span class="icon">hotel</span> 宿</span>
      <div style="display:flex; gap:6px;">
        <button class="pill" @click="showRaw = true" title="生 JSON"><span class="icon">code</span></button>
        <button class="pill" @click="back">← 戻る</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab" :class="{ on: tab === 'cal' }" @click="tab = 'cal'">カレンダー</button>
      <button class="tab" :class="{ on: tab === 'sum' }" @click="tab = 'sum'">サマリー</button>
      <button class="tab" :class="{ on: tab === 'str' }" @click="tab = 'str'">戦略</button>
    </div>
  </div>

  <div v-if="usingSample && !err" class="warn">
    <span class="icon">info</span>
    Beds24 の API トークンがまだ未設定です。下のはサンプル予約。Cloud Run の env var
    (MANCHIKAN_BEDS_KEY) に入れたら本物に切り替わります。
  </div>
  <div v-if="err" class="err">{{ err }}</div>

  <!-- ───── カレンダータブ ───── -->
  <div v-if="tab === 'cal'">
    <div class="month-bar">
      <button class="nav" @click="shiftMonth(-1)">‹</button>
      <div class="label">{{ monthLabel }}</div>
      <button class="nav" @click="shiftMonth(1)">›</button>
    </div>

    <div v-if="loading" class="loading">読み込み中…</div>
    <template v-else>
      <div class="cal">
        <div class="dow">
          <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
        </div>
        <div class="grid7">
          <div
            v-for="(cell, i) in calendarCells" :key="i"
            class="cell"
            :class="{ other: !cell.inMonth, today: cell.isToday, selected: selectedDate === cell.iso }"
            @click="selectedDate = cell.iso"
          >
            <div class="num" :class="{ sat: cell.dow === 6, sun: cell.dow === 0 }">{{ cell.day }}</div>
            <div class="bars">
              <div v-for="b in cell.bars" :key="b.id" class="bar" :class="b.channel"></div>
              <div v-if="cell.more" class="more">+{{ cell.more }}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="legend">
        <span v-for="c in channels" :key="c"><span class="dot" :class="c"></span>{{ chLabel(c) }}</span>
      </div>

      <div class="detail" v-if="selectedDayBookings.length">
        <div class="head">{{ formatJP(selectedDate) }} の宿泊</div>
        <div v-for="b in selectedDayBookings" :key="b.id" class="book-card">
          <div class="ch-pill" :class="b.channel"></div>
          <div class="body">
            <div class="name">{{ b.guestName || '名無し' }}</div>
            <div class="meta">{{ chLabel(b.channel) }} · {{ b.nights }}泊 · {{ b.adult || 0 }}名{{ b.child ? ' + 小' + b.child : '' }} · {{ b.arrival.slice(5) }}〜{{ b.departure.slice(5) }}</div>
          </div>
          <div class="price" v-if="b.price">¥{{ formatYen(b.price) }}</div>
        </div>
      </div>
      <div class="detail" v-else-if="selectedDate">
        <div class="empty">この日の宿泊なし</div>
      </div>
    </template>
  </div>

  <!-- ───── サマリータブ ───── -->
  <div v-else-if="tab === 'sum'" class="summary">
    <div class="month-bar">
      <button class="nav" @click="shiftMonth(-1)">‹</button>
      <div class="label">{{ monthLabel }}</div>
      <button class="nav" @click="shiftMonth(1)">›</button>
    </div>
    <div class="kpi-row">
      <div class="kpi">
        <div class="lbl">売上</div>
        <div class="val">¥{{ formatYen(monthlyRevenue) }}</div>
        <div class="sub">{{ monthlyBookings.length }}件 · {{ totalNights }}泊</div>
      </div>
      <div class="kpi">
        <div class="lbl">稼働率</div>
        <div class="val">{{ occupancyPct }}%</div>
        <div class="sub">{{ totalNights }} / {{ availableNights }} 室泊</div>
      </div>
    </div>

    <div class="bar-chart">
      <div class="h">チャネル別売上</div>
      <div class="bars-grid">
        <div v-for="c in channels" :key="c" class="col" :style="{ height: '100%' }">
          <div class="seg" :class="c" :style="{ height: revenueBarPct(c) + '%' }"></div>
        </div>
      </div>
      <div class="bars-grid" style="border:0; height:auto; padding:0;">
        <div v-for="c in channels" :key="c" class="col">
          <div class="lbl">{{ chLabel(c) }}<br>¥{{ formatYen(revenueByChannel[c] || 0) }}</div>
        </div>
      </div>
    </div>

    <div class="bar-chart">
      <div class="h">日別売上（{{ monthLabel }}）</div>
      <div class="bars-grid">
        <div v-for="(day, i) in dailyRevenue" :key="i" class="col">
          <div v-for="c in channels" :key="c" class="seg" :class="c"
               :style="{ height: ((day[c] || 0) / Math.max(1, maxDayRevenue)) * 100 + '%' }"></div>
        </div>
      </div>
    </div>

    <button class="sync-btn" :disabled="syncing" @click="syncToSheet">
      <span class="icon">cloud_upload</span>
      {{ syncing ? '同期中…' : '取引シートに同期' }}
    </button>
    <div v-if="syncMsg" class="sync-msg">{{ syncMsg }}</div>
  </div>

  <!-- ───── 生 JSON 取得モーダル (debug 用、サンプル取れたら削除) ───── -->
  <bottom-sheet v-model="showRaw" title="beds24 生 JSON">
    <div class="raw-controls">
      <button class="pill" :disabled="rawLoading" @click="fetchRaw">
        {{ rawLoading ? '取得中…' : (rawText ? '再取得' : 'この月を取得') }}
      </button>
      <button class="pill" :disabled="!rawText" @click="copyRaw">
        {{ rawCopied ? 'コピーした' : 'コピー' }}
      </button>
    </div>
    <div v-if="rawErr" class="err" style="margin:8px 0 0;">{{ rawErr }}</div>
    <div v-if="rawText" class="raw-meta">{{ rawSize }} bytes / {{ rawCount }} bookings</div>
    <pre v-if="rawText" class="raw-pre">{{ rawText }}</pre>
  </bottom-sheet>

  <!-- ───── 戦略タブ ───── -->
  <div v-else-if="tab === 'str'" class="strategy">
    <div class="intro">
      この月のデータと、季節 / 周辺の民泊状況 / 物価 / 世界情勢を踏まえて、AIが宿泊数を増やす戦略を提案します。
    </div>
    <button class="gen-btn" :disabled="generating || loading" @click="generateStrategy">
      {{ generating ? '分析中… (30秒くらい)' : (strategy ? '🔄 再生成' : '✨ 戦略を分析する') }}
    </button>
    <div v-if="strategy" class="result">{{ strategy }}</div>
    <div v-if="strategyAt" class="meta">生成: {{ strategyAt }}</div>
  </div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const tab = ref("cal");
    const cur = ref(new Date());
    const bookings = ref([]);
    const loading = ref(false);
    const err = ref("");
    const usingSample = ref(false);
    const selectedDate = ref(null);
    const strategy = ref("");
    const strategyAt = ref("");
    const generating = ref(false);
    const user = ref(null);
    // 生 JSON モーダル
    const showRaw = ref(false);
    const rawLoading = ref(false);
    const rawText = ref("");
    const rawErr = ref("");
    const rawCopied = ref(false);
    const rawSize = computed(() => rawText.value.length);
    const rawCount = computed(() => {
      try {
        const j = JSON.parse(rawText.value);
        const arr = Array.isArray(j) ? j : (j.data || j.bookings || []);
        return Array.isArray(arr) ? arr.length : "?";
      } catch (_) { return "?"; }
    });

    const channels = CHANNELS;
    const chLabel = (c) => CHANNEL_LABEL[c] || c;

    const yyyymm = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    });
    const monthLabel = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
    });
    const daysInMonth = computed(() => {
      const d = cur.value;
      return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    });

    function shiftMonth(delta) {
      const d = new Date(cur.value);
      d.setMonth(d.getMonth() + delta);
      cur.value = d;
      selectedDate.value = null;
      fetchBookings();
    }

    function isoDate(dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function formatYen(n) { return Math.round(n).toLocaleString("ja-JP"); }
    function formatJP(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${Number(m)}月${Number(d)}日`;
    }

    // 月のセル (前月末〜次月頭の埋め草込みで42日 = 6週分)
    const calendarCells = computed(() => {
      const d = cur.value;
      const first = new Date(d.getFullYear(), d.getMonth(), 1);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      const startDow = first.getDay();              // 0=日
      const totalDays = last.getDate();
      const cells = [];
      const today = isoDate(new Date());
      // 前月の埋め草
      const prevLast = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
      for (let i = startDow - 1; i >= 0; i--) {
        const day = prevLast - i;
        const dt = new Date(d.getFullYear(), d.getMonth() - 1, day);
        cells.push({ day, iso: isoDate(dt), inMonth: false, dow: dt.getDay(), bars: [], more: 0, isToday: false });
      }
      for (let day = 1; day <= totalDays; day++) {
        const dt = new Date(d.getFullYear(), d.getMonth(), day);
        const iso = isoDate(dt);
        const dayBookings = bookings.value.filter((b) => iso >= b.arrival && iso < b.departure);
        const bars = dayBookings.slice(0, 3).map((b) => ({ id: b.id, channel: b.channel }));
        const more = Math.max(0, dayBookings.length - bars.length);
        cells.push({ day, iso, inMonth: true, dow: dt.getDay(), bars, more, isToday: iso === today });
      }
      // 残りを次月埋め草で42に揃える
      while (cells.length < 42) {
        const day = cells.length - startDow - totalDays + 1;
        const dt = new Date(d.getFullYear(), d.getMonth() + 1, day);
        cells.push({ day, iso: isoDate(dt), inMonth: false, dow: dt.getDay(), bars: [], more: 0, isToday: false });
      }
      return cells;
    });

    const selectedDayBookings = computed(() => {
      if (!selectedDate.value) return [];
      return bookings.value
        .filter((b) => selectedDate.value >= b.arrival && selectedDate.value < b.departure)
        .sort((a, b) => (a.channel || "").localeCompare(b.channel || ""));
    });

    // ───── 集計 (当月) ─────
    // 売上は「予約あたり総額」を「宿泊日数」で按分して当月に該当する泊数だけ計上。
    // (チェックイン月で全額計上だと月跨ぎが歪むので)
    const monthlyBookings = computed(() => {
      const d = cur.value;
      const monthStart = isoDate(new Date(d.getFullYear(), d.getMonth(), 1));
      const monthEnd = isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 1));
      return bookings.value.filter((b) => b.departure > monthStart && b.arrival < monthEnd);
    });
    function nightsInMonth(b) {
      const d = cur.value;
      const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
      const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      const ai = new Date(b.arrival);
      const de = new Date(b.departure);
      const start = ai > monthStart ? ai : monthStart;
      const end = de < monthEnd ? de : monthEnd;
      const nights = Math.round((end - start) / 86400000);
      return Math.max(0, nights);
    }
    const totalNights = computed(() => monthlyBookings.value.reduce((s, b) => s + nightsInMonth(b), 0));
    const monthlyRevenue = computed(() => monthlyBookings.value.reduce((s, b) => {
      const n = nightsInMonth(b);
      const totalNightsB = Math.max(1, b.nights || 1);
      return s + (b.price || 0) * (n / totalNightsB);
    }, 0));
    // 仮: 部屋数1室として稼働率を出す。実際は Beds24 から拾いたい。
    const NUM_ROOMS = 1;
    const availableNights = computed(() => daysInMonth.value * NUM_ROOMS);
    const occupancyPct = computed(() => Math.round((totalNights.value / Math.max(1, availableNights.value)) * 100));

    const revenueByChannel = computed(() => {
      const m = { airbnb: 0, booking: 0, direct: 0, other: 0 };
      for (const b of monthlyBookings.value) {
        const n = nightsInMonth(b);
        const totalNightsB = Math.max(1, b.nights || 1);
        m[b.channel] = (m[b.channel] || 0) + (b.price || 0) * (n / totalNightsB);
      }
      return m;
    });
    function revenueBarPct(c) {
      const max = Math.max(...Object.values(revenueByChannel.value), 1);
      return ((revenueByChannel.value[c] || 0) / max) * 100;
    }
    const dailyRevenue = computed(() => {
      const days = daysInMonth.value;
      const arr = Array.from({ length: days }, () => ({ airbnb: 0, booking: 0, direct: 0, other: 0 }));
      const d = cur.value;
      for (const b of monthlyBookings.value) {
        const totalNightsB = Math.max(1, b.nights || 1);
        const per = (b.price || 0) / totalNightsB;
        const ai = new Date(b.arrival);
        const de = new Date(b.departure);
        for (let dt = new Date(ai); dt < de; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === d.getFullYear() && dt.getMonth() === d.getMonth()) {
            arr[dt.getDate() - 1][b.channel] = (arr[dt.getDate() - 1][b.channel] || 0) + per;
          }
        }
      }
      return arr;
    });
    const maxDayRevenue = computed(() => {
      let mx = 0;
      for (const row of dailyRevenue.value) {
        const s = Object.values(row).reduce((a, b) => a + b, 0);
        if (s > mx) mx = s;
      }
      return mx;
    });

    // ───── サーバー呼び出し ─────
    async function fetchBookings() {
      if (!user.value) return;
      loading.value = true;
      err.value = "";
      usingSample.value = false;
      try {
        const d = cur.value;
        const from = isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1));   // 前月から
        const to   = isoDate(new Date(d.getFullYear(), d.getMonth() + 2, 0));   // 次月末まで
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + `/api/yado/bookings?from=${from}&to=${to}`, {
          headers: { authorization: "Bearer " + token },
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(`${res.status}: ${t.slice(0, 200)}`);
        }
        const j = await res.json();
        if (j.sample) {
          // サーバーがトークン未設定でサンプルを返してきたパターン
          usingSample.value = true;
          bookings.value = sampleBookings(yyyymm.value);
        } else {
          bookings.value = (j.bookings || []).map((b) => ({
            ...b,
            channel: normalizeChannel(b.referer || b.channel),
          }));
        }
      } catch (e) {
        // 通信失敗時もサンプルで画面を埋める (試せるように)。ただし usingSample は
        // 立てない (= サーバが明示的に sample 返した時だけ警告出す)。err と区別。
        err.value = "取得失敗: " + (e.message || e) + " (サンプル表示中)";
        bookings.value = sampleBookings(yyyymm.value);
      } finally {
        loading.value = false;
      }
    }

    async function generateStrategy() {
      if (!user.value || generating.value) return;
      generating.value = true;
      err.value = "";
      try {
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + "/api/yado/strategy", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({
            month: yyyymm.value,
            bookings: bookings.value,
            revenue: monthlyRevenue.value,
            occupancyPct: occupancyPct.value,
            revenueByChannel: revenueByChannel.value,
            usingSample: usingSample.value,
          }),
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(`${res.status}: ${t.slice(0, 300)}`);
        }
        const j = await res.json();
        strategy.value = j.strategy || "(空のレスポンス)";
        strategyAt.value = new Date().toLocaleString("ja-JP", { hour12: false });
      } catch (e) {
        err.value = "戦略生成失敗: " + (e.message || e);
      } finally {
        generating.value = false;
      }
    }

    const syncing = ref(false);
    const syncMsg = ref("");
    async function syncToSheet() {
      if (!user.value || syncing.value) return;
      syncing.value = true;
      syncMsg.value = "";
      try {
        const token = await user.value.getIdToken();
        const d = cur.value;
        const from = isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1));
        const to = isoDate(new Date(d.getFullYear(), d.getMonth() + 2, 0));
        const res = await fetch((window.API_BASE || "") + "/api/yado/sync", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({
            from, to,
            // BEDS24 トークンが未設定の場合に備えて、フロントで持ってる bookings も渡す。
            // サーバー側で BEDS24_API_TOKEN があれば本物を再取得して上書きされる。
            bookings: usingSample.value ? [] : bookings.value.map((b) => ({
              id: b.id, arrival: b.arrival, departure: b.departure,
              referer: b.referer || b.channel, price: b.price,
              numAdult: b.adult, numChild: b.child,
              firstName: b.guestName, lastName: "",
            })),
          }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        syncMsg.value = `${j.synced}/${j.total} 件をシートに送信しました`;
      } catch (e) {
        syncMsg.value = "同期失敗: " + (e.message || e);
      } finally {
        syncing.value = false;
      }
    }

    async function fetchRaw() {
      if (!user.value || rawLoading.value) return;
      rawLoading.value = true; rawErr.value = ""; rawCopied.value = false;
      try {
        const d = cur.value;
        const from = isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1));
        const to   = isoDate(new Date(d.getFullYear(), d.getMonth() + 2, 0));
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + `/api/yado/raw?from=${from}&to=${to}`, {
          headers: { authorization: "Bearer " + token },
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`${res.status}: ${text.slice(0, 200)}`);
        // 整形して見やすく
        try { rawText.value = JSON.stringify(JSON.parse(text), null, 2); }
        catch (_) { rawText.value = text; }
      } catch (e) {
        rawErr.value = "取得失敗: " + (e.message || e);
        rawText.value = "";
      } finally {
        rawLoading.value = false;
      }
    }
    async function copyRaw() {
      try {
        await navigator.clipboard.writeText(rawText.value);
        rawCopied.value = true;
        setTimeout(() => { rawCopied.value = false; }, 1500);
      } catch (e) { rawErr.value = "コピー失敗: " + (e.message || e); }
    }

    function back() { location.href = "/"; }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        await setPersistence(auth, browserLocalPersistence);
        onAuthStateChanged(auth, async (u) => {
          if (!u) {
            location.href = "/?next=" + encodeURIComponent(location.pathname);
            return;
          }
          user.value = u;
          await fetchBookings();
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        usingSample.value = true;
        bookings.value = sampleBookings(yyyymm.value);
      }
    });

    return {
      tab, cur, bookings, loading, err, usingSample, selectedDate, strategy, strategyAt, generating,
      syncing, syncMsg,
      showRaw, rawLoading, rawText, rawErr, rawCopied, rawSize, rawCount, fetchRaw, copyRaw,
      channels, chLabel, monthLabel, yyyymm, calendarCells, selectedDayBookings,
      monthlyBookings, totalNights, monthlyRevenue, availableNights, occupancyPct,
      revenueByChannel, revenueBarPct, dailyRevenue, maxDayRevenue,
      shiftMonth, formatYen, formatJP, fetchBookings, generateStrategy, syncToSheet, back,
    };
  },
};

createApp(App).component("bottom-sheet", BottomSheet).mount("#app");
</script>
</body>
</html>
