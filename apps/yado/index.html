<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宿">
<link rel="apple-touch-icon" href="/yado/icon.svg">
<title>宿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #e4e6ee; --bg2: #d8dae4;
  --sl: rgba(255,255,255,1); --sd: rgba(168,172,192,0.75); --sd2: rgba(148,152,176,0.55);
  --text: #42455e; --text2: rgba(66,69,94,0.5); --text3: rgba(66,69,94,0.28);
  --accent: #b45309; --accent2: #d97706;     /* 旅館の暖色 */
  --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg) 88%);
  --danger: #b04040;
  /* 予約チャネル色 (各社のブランド色寄せ) */
  --ch-airbnb: #FF5A5F;
  --ch-booking: #003580;
  --ch-direct: #2a8c3a;
  --ch-other: #707390;
}
html, body { height: 100%; }
body { font-family: 'Outfit', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 60px; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 1.1em; display: inline-block; vertical-align: -0.18em; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
.icon.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

.header-fix { position: sticky; top: 0; z-index: 10; background: var(--bg); box-shadow: 0 2px 10px rgba(168,172,192,0.18); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 54px 18px 14px; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.pill { padding: 8px 16px; border-radius: 24px; font-size: 12px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; font-family: inherit; }
.pill:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); transform: scale(0.97); }

/* タブ */
.tabs { display: flex; gap: 8px; padding: 4px 18px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 700; border: none; color: var(--text2); background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); cursor: pointer; flex-shrink: 0; font-family: inherit; transition: all 200ms ease; }
.tab.on { color: white; background: linear-gradient(145deg, var(--accent2), var(--accent)); box-shadow: 6px 6px 14px rgba(180,83,9,0.35), -3px -3px 10px var(--sl); }

/* 月切り替えバー */
.month-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; gap: 12px; }
.month-bar .nav { width: 38px; height: 38px; border-radius: 19px; border: none; background: var(--bg); box-shadow: 4px 4px 10px var(--sd), -4px -4px 10px var(--sl); font-size: 18px; color: var(--text2); cursor: pointer; font-family: inherit; }
.month-bar .nav:active { box-shadow: inset 3px 3px 8px var(--sd), inset -3px -3px 8px var(--sl); }
.month-bar .label { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; flex: 1; text-align: center; }
.today-btn { font-size: 11px; padding: 6px 12px; border-radius: 14px; }

/* カレンダーグリッド */
.cal { padding: 0 12px 18px; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 4px 6px; }
.dow > div { text-align: center; font-size: 10px; font-weight: 800; color: var(--text2); letter-spacing: 0.06em; }
.dow .sat { color: #3a6ad6; }
.dow .sun { color: #c34a4a; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 4px; }
.cell { aspect-ratio: 1 / 1.25; background: var(--bg); border-radius: 10px; box-shadow: 2px 2px 6px var(--sd), -1px -1px 4px var(--sl); padding: 4px 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: transform 120ms ease; min-width: 0; overflow: hidden; }
.cell.other { opacity: 0.32; }
.cell.today { box-shadow: 0 0 0 2px var(--accent2), 2px 2px 6px var(--sd); }
.cell.selected { box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }
.cell:active { transform: scale(0.96); }
.cell .num { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1; }
.cell .num.sat { color: #3a6ad6; }
.cell .num.sun { color: #c34a4a; }
.cell .bars { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.bar { height: 5px; border-radius: 3px; flex-shrink: 0; }
.bar.airbnb  { background: var(--ch-airbnb); }
.bar.booking { background: var(--ch-booking); }
.bar.direct  { background: var(--ch-direct); }
.bar.other   { background: var(--ch-other); }
.more { font-size: 8px; font-weight: 700; color: var(--text3); text-align: right; line-height: 1; }

/* 凡例 */
.legend { display: flex; gap: 10px; padding: 0 18px 16px; font-size: 11px; color: var(--text2); font-weight: 700; flex-wrap: wrap; }
.legend > span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 3px; }
.dot.airbnb { background: var(--ch-airbnb); }
.dot.booking { background: var(--ch-booking); }
.dot.direct { background: var(--ch-direct); }
.dot.other { background: var(--ch-other); }

/* 選択日の詳細 */
.detail { padding: 0 18px 18px; }
.detail .head { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
.book-card { background: var(--bg); border-radius: 14px; box-shadow: 4px 4px 10px var(--sd), -3px -3px 8px var(--sl); margin-bottom: 8px; overflow: hidden; }
.book-top { padding: 12px 14px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.book-card .ch-pill { width: 6px; align-self: stretch; border-radius: 3px; }
.book-card .ch-pill.airbnb { background: var(--ch-airbnb); }
.book-card .ch-pill.booking { background: var(--ch-booking); }
.book-card .ch-pill.direct { background: var(--ch-direct); }
.book-card .ch-pill.other { background: var(--ch-other); }
.book-card .body { flex: 1; min-width: 0; }
.book-card .name { font-size: 13px; font-weight: 700; word-break: break-word; }
.book-card .meta { font-size: 11px; color: var(--text2); font-weight: 600; margin-top: 2px; letter-spacing: 0.02em; }
.book-card .price { font-size: 14px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.book-card .chev { font-family: 'Material Symbols Outlined'; font-size: 20px; color: var(--text3); flex-shrink: 0; transition: transform 200ms ease; }
.book-card.open .chev { transform: rotate(180deg); color: var(--text2); }

.book-detail { border-top: 1px solid rgba(168,172,192,0.22); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.bd-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.bd-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 11px; font-size: 11px; font-weight: 700; color: var(--text2); background: var(--bg); box-shadow: inset 2px 2px 5px var(--sd), inset -1px -1px 4px var(--sl); }
.bd-chip.mono { font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
.bd-chip.danger { color: var(--danger); }
.bd-price { background: var(--bg2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 2px 2px 6px var(--sd), inset -1px -1px 4px var(--sl); }
.bd-price-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--text2); }
.bd-price-row.sub { font-size: 11px; color: var(--text3); }
.bd-price-row.primary { color: var(--text); font-weight: 700; padding-top: 4px; margin-top: 2px; border-top: 1px dashed rgba(168,172,192,0.4); }
.bd-price-row b { color: var(--text); font-size: 14px; font-weight: 800; }
.bd-price-row.primary b { color: var(--accent); font-size: 15px; }
.bd-block { display: flex; flex-direction: column; gap: 4px; }
.bd-block-lbl { font-size: 10px; font-weight: 800; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; padding-left: 2px; }
.bd-pre { background: var(--bg2); border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; box-shadow: inset 2px 2px 6px var(--sd), inset -1px -1px 4px var(--sl); }
.bd-pre.small { font-size: 10px; max-height: 220px; }
.bd-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; color: var(--text3); font-family: ui-monospace, Menlo, monospace; padding-top: 4px; border-top: 1px solid rgba(168,172,192,0.18); }

/* サマリータブ */
.summary { padding: 0 18px 30px; }
.kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
/* 国別 chip 行 */
.country-row { margin-bottom: 18px; }
.country-lbl { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 0.1em; text-transform: uppercase; margin: 4px 4px 8px; }
.country-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: var(--text2); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 5px var(--sl); }
.cc-chip b { color: var(--accent); font-weight: 800; }
.kpi { background: var(--bg); border-radius: 16px; padding: 16px 14px; box-shadow: 6px 6px 14px var(--sd), -4px -4px 10px var(--sl); }
.kpi .lbl { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.kpi .val { font-size: 22px; font-weight: 800; color: var(--text); }
.kpi .sub { font-size: 10px; color: var(--text3); font-weight: 600; margin-top: 4px; }
.bar-chart { background: var(--bg); border-radius: 16px; padding: 16px 14px; box-shadow: 6px 6px 14px var(--sd), -4px -4px 10px var(--sl); margin-bottom: 18px; }
.bar-chart .h { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
.bars-grid { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-bottom: 4px; border-bottom: 1px solid var(--text3); }
.bars-grid .col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 0; gap: 1px; }
.bars-grid .seg { width: 100%; border-radius: 2px; }
.bars-grid .lbl { font-size: 9px; font-weight: 700; color: var(--text2); text-align: center; margin-top: 6px; }
.bars-grid .seg.airbnb { background: var(--ch-airbnb); }
.bars-grid .seg.booking { background: var(--ch-booking); }
.bars-grid .seg.direct { background: var(--ch-direct); }
.bars-grid .seg.other { background: var(--ch-other); }

/* シート同期ボタン (サマリータブ末尾) */
.sync-btn { width: 100%; padding: 14px 16px; border-radius: 18px; border: none; background: var(--bg); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 5px 5px 12px var(--sd), -4px -4px 10px var(--sl); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
.sync-btn:disabled { opacity: 0.55; }
.sync-btn:active { box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); }
.sync-btn .icon { font-size: 18px; }
.sync-msg { font-size: 11px; color: var(--text2); text-align: center; margin-top: 8px; font-weight: 600; }

/* 戦略タブ */
.strategy { padding: 0 18px 40px; }
.strategy .intro { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 14px; }
.strategy .intro b { color: var(--text); font-weight: 800; }
.reviews-block { background: var(--bg); border-radius: 16px; padding: 14px 14px 16px; box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
.reviews-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.reviews-head .icon { font-size: 16px; color: var(--accent); }
.reviews-title { font-size: 13px; font-weight: 800; color: var(--text); }
.saved-dot { font-size: 9px; color: var(--ch-direct); margin-left: auto; }
.rv-label { font-size: 11px; font-weight: 700; color: var(--text2); padding-left: 4px; margin-top: 8px; line-height: 1.5; }
.rv-label a { color: var(--accent); text-decoration: underline; }
.rv-area { padding: 10px 12px; border: none; border-radius: 12px; font-size: 12px; font-family: inherit; color: var(--text); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); outline: none; min-height: 70px; resize: vertical; line-height: 1.6; }
.rv-area::placeholder { color: var(--text3); font-size: 11px; }
.rv-area:focus { box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl), 0 0 0 2px var(--accent2); }
.rv-upload-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--bg); box-shadow: 3px 3px 8px var(--sd), -2px -2px 6px var(--sl); cursor: pointer; margin: -2px 0 4px 4px; transition: transform 100ms ease; }
.rv-upload-btn:active { box-shadow: inset 2px 2px 6px var(--sd), inset -1px -1px 4px var(--sl); transform: scale(0.97); }
.rv-upload-btn.loading { color: var(--text2); cursor: wait; }
.rv-upload-btn .icon { font-size: 16px; }
.strategy .gen-btn { width: 100%; padding: 16px 18px; border-radius: 20px; border: none; background: linear-gradient(145deg, var(--accent2), var(--accent)); color: white; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 6px 6px 16px rgba(180,83,9,0.35), -4px -4px 10px var(--sl); font-family: inherit; }
.strategy .gen-btn:disabled { opacity: 0.55; }
.strategy .gen-btn:active { transform: scale(0.97); }
.strategy .result { margin-top: 18px; background: var(--bg); border-radius: 16px; padding: 16px; box-shadow: inset 3px 3px 8px var(--sd), inset -2px -2px 6px var(--sl); font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.strategy .meta { font-size: 11px; color: var(--text3); margin-top: 10px; font-weight: 600; }

/* 空状態 / エラー */
.empty { text-align: center; color: var(--text3); font-size: 13px; font-weight: 600; padding: 40px 18px; }
.warn { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fff3d6; color: #7a5b18; font-size: 12px; font-weight: 600; line-height: 1.6; box-shadow: 3px 3px 8px var(--sd); }
.warn .icon { vertical-align: -0.18em; margin-right: 4px; }
.err { margin: 0 18px 14px; padding: 12px 14px; border-radius: 14px; background: #fde0e0; color: #8a2727; font-size: 12px; font-weight: 600; }
.loading { text-align: center; color: var(--text2); font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>

<div id="app"></div>

<script src="/config.js"></script>
<script type="module">
import { createApp, ref, computed, onMounted } from "https://unpkg.com/vue@3.4.27/dist/vue.esm-browser.prod.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const CHANNELS = ["airbnb", "booking", "direct", "other"];
const CHANNEL_LABEL = { airbnb: "Airbnb", booking: "Booking.com", direct: "自社サイト", other: "その他" };

// Beds24 の referer 文字列をうちのチャネル分類に正規化。
// 完全リストは把握してないので名前ヒューリスティック。マッチしないものは "other"。
function normalizeChannel(referer) {
  const s = (referer || "").toLowerCase();
  if (s.includes("airbnb")) return "airbnb";
  if (s.includes("booking")) return "booking";
  if (s.includes("direct") || s.includes("website") || s.includes("自社") || s.includes("manual")) return "direct";
  return "other";
}

const TEMPLATE = `
<div>
  <div class="header-fix">
    <div class="top">
      <span class="title"><span class="icon">hotel</span> 宿</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="pill" :disabled="syncingNow" @click="runSync" :title="needsBackfill ? '全期間取込' : '差分同期'">
          <span class="icon" :class="{ 'spin': syncingNow }">{{ syncingNow ? 'sync' : 'refresh' }}</span>
        </button>
        <button class="pill" @click="back">← 戻る</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab" :class="{ on: tab === 'cal' }" @click="tab = 'cal'">カレンダー</button>
      <button class="tab" :class="{ on: tab === 'sum' }" @click="tab = 'sum'">サマリー</button>
      <button class="tab" :class="{ on: tab === 'str' }" @click="tab = 'str'">戦略</button>
    </div>
  </div>

  <div v-if="usingSample && !err" class="warn">
    <span class="icon">info</span>
    Beds24 の API トークンがまだ未設定です。Cloud Run の env var
    (MANCHIKAN_BEDS_KEY) を入れて再読込してください。
  </div>
  <div v-if="needsBackfill && !err && !usingSample" class="warn">
    <span class="icon">info</span>
    ローカル DB がまだ空です。上の <span class="icon" style="vertical-align:-0.18em;">refresh</span> を押すと Beds24 から取込開始 (初回は 5-30 秒)。
  </div>
  <div v-if="syncMsgTop && !err" class="warn" style="background:#e8f5d8; color:#3a6018;">
    <span class="icon">check_circle</span> {{ syncMsgTop }}
  </div>
  <div v-if="err" class="err">{{ err }}</div>

  <!-- ───── カレンダータブ ───── -->
  <div v-if="tab === 'cal'">
    <div class="month-bar">
      <button class="nav" @click="shiftMonth(-1)">‹</button>
      <div class="label">{{ monthLabel }}</div>
      <button class="nav" @click="shiftMonth(1)">›</button>
    </div>

    <div v-if="loading" class="loading">読み込み中…</div>
    <template v-else>
      <div class="cal">
        <div class="dow">
          <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
        </div>
        <div class="grid7">
          <div
            v-for="(cell, i) in calendarCells" :key="i"
            class="cell"
            :class="{ other: !cell.inMonth, today: cell.isToday, selected: selectedDate === cell.iso }"
            @click="selectedDate = cell.iso"
          >
            <div class="num" :class="{ sat: cell.dow === 6, sun: cell.dow === 0 }">{{ cell.day }}</div>
            <div class="bars">
              <div v-for="b in cell.bars" :key="b.id" class="bar" :class="b.channel"></div>
              <div v-if="cell.more" class="more">+{{ cell.more }}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="legend">
        <span v-for="c in channels" :key="c"><span class="dot" :class="c"></span>{{ chLabel(c) }}</span>
      </div>

      <div class="detail" v-if="selectedDayBookings.length">
        <div class="head">{{ formatJP(selectedDate) }} の宿泊</div>
        <div v-for="b in selectedDayBookings" :key="b.id" class="book-card" :class="{ open: expandedBookingId === b.id }">
          <div class="book-top" @click="toggleBooking(b.id)">
            <div class="ch-pill" :class="b.channel"></div>
            <div class="body">
              <div class="name">{{ b.guestName || '名無し' }}</div>
              <div class="meta">{{ chLabel(b.channel) }} · {{ b.nights }}泊 · {{ b.adult || 0 }}名{{ b.child ? ' + 小' + b.child : '' }} · {{ b.arrival.slice(5) }}〜{{ b.departure.slice(5) }}</div>
            </div>
            <div class="price" v-if="b.price">¥{{ formatYen(b.price) }}</div>
            <span class="chev">expand_more</span>
          </div>
          <div v-if="expandedBookingId === b.id" class="book-detail">
            <!-- 属性 chips -->
            <div class="bd-chips">
              <span v-if="b.country" class="bd-chip">{{ countryEmoji(b.country) }} {{ b.country }}</span>
              <span v-if="b.lang" class="bd-chip">lang {{ b.lang }}</span>
              <span v-if="b.leadDays != null" class="bd-chip">リード {{ b.leadDays }} 日前予約</span>
              <span v-if="b.flagText" class="bd-chip">{{ b.flagText }}</span>
              <span v-if="b.status && b.status !== 'new'" class="bd-chip danger">{{ b.status }}</span>
              <span v-if="b.apiReference" class="bd-chip mono">#{{ b.apiReference }}</span>
            </div>
            <!-- 価格内訳 -->
            <div class="bd-price">
              <div class="bd-price-row"><span>売上 (gross)</span><b>¥{{ formatYen(b.price) }}</b></div>
              <div class="bd-price-row sub"><span>手数料</span><span>-¥{{ formatYen(b.commission) }} ({{ b.price ? Math.round(b.commission / b.price * 1000) / 10 : 0 }}%)</span></div>
              <div class="bd-price-row primary"><span>手取り (net)</span><b>¥{{ formatYen(b.net) }}</b></div>
              <div class="bd-price-row sub"><span>ADR</span><span>¥{{ formatYen(Math.round(b.price / Math.max(1, b.nights))) }} / 泊</span></div>
            </div>
            <!-- コメント (Booking.com BOOKING NOTE 等) -->
            <div v-if="b.comments" class="bd-block">
              <div class="bd-block-lbl">コメント / 特記</div>
              <pre class="bd-pre">{{ b.comments }}</pre>
            </div>
            <!-- 日次料金 (rateDescription) -->
            <div v-if="b.rateDescription" class="bd-block">
              <div class="bd-block-lbl">料金明細</div>
              <pre class="bd-pre small">{{ b.rateDescription }}</pre>
            </div>
            <!-- 部屋情報 (apiMessage、Booking のみ持ってる) -->
            <div v-if="b.apiMessage" class="bd-block">
              <div class="bd-block-lbl">部屋情報</div>
              <pre class="bd-pre small">{{ b.apiMessage }}</pre>
            </div>
            <!-- メタ -->
            <div class="bd-meta">
              <span v-if="b.bookingTime">予約: {{ formatTs(b.bookingTime) }}</span>
              <span>ID {{ b.id }}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="detail" v-else-if="selectedDate">
        <div class="empty">この日の宿泊なし</div>
      </div>
    </template>
  </div>

  <!-- ───── サマリータブ ───── -->
  <div v-else-if="tab === 'sum'" class="summary">
    <div class="month-bar">
      <button class="nav" @click="shiftMonth(-1)">‹</button>
      <div class="label">{{ monthLabel }}</div>
      <button class="nav" @click="shiftMonth(1)">›</button>
    </div>
    <div class="kpi-row">
      <div class="kpi">
        <div class="lbl">売上 (gross)</div>
        <div class="val">¥{{ formatYen(monthlyRevenue) }}</div>
        <div class="sub">{{ monthlyBookings.length }}件 · {{ totalNights }}泊</div>
      </div>
      <div class="kpi">
        <div class="lbl">手取り (net)</div>
        <div class="val">¥{{ formatYen(monthlyNet) }}</div>
        <div class="sub">手取り率 {{ netRate }}% / 手数料 ¥{{ formatYen(monthlyCommission) }}</div>
      </div>
      <div class="kpi">
        <div class="lbl">ADR</div>
        <div class="val">¥{{ formatYen(adrGross) }}</div>
        <div class="sub">net ¥{{ formatYen(adrNet) }} / 泊</div>
      </div>
      <div class="kpi">
        <div class="lbl">稼働率</div>
        <div class="val">{{ occupancyPct }}%</div>
        <div class="sub">{{ totalNights }}/{{ availableNights }}泊 · 平均リード {{ avgLeadDays != null ? avgLeadDays + '日' : '—' }}</div>
      </div>
    </div>

    <div v-if="countryDist.length" class="country-row">
      <div class="country-lbl">国別 ({{ countryDist.length }} か国)</div>
      <div class="country-chips">
        <span v-for="[cc, n] in countryDist" :key="cc" class="cc-chip">
          {{ countryEmoji(cc) }} {{ cc }} <b>{{ n }}</b>
        </span>
      </div>
    </div>

    <div class="bar-chart">
      <div class="h">チャネル別売上</div>
      <div class="bars-grid">
        <div v-for="c in channels" :key="c" class="col" :style="{ height: '100%' }">
          <div class="seg" :class="c" :style="{ height: revenueBarPct(c) + '%' }"></div>
        </div>
      </div>
      <div class="bars-grid" style="border:0; height:auto; padding:0;">
        <div v-for="c in channels" :key="c" class="col">
          <div class="lbl">{{ chLabel(c) }}<br>¥{{ formatYen(revenueByChannel[c] || 0) }}</div>
        </div>
      </div>
    </div>

    <div class="bar-chart">
      <div class="h">日別売上（{{ monthLabel }}）</div>
      <div class="bars-grid">
        <div v-for="(day, i) in dailyRevenue" :key="i" class="col">
          <div v-for="c in channels" :key="c" class="seg" :class="c"
               :style="{ height: ((day[c] || 0) / Math.max(1, maxDayRevenue)) * 100 + '%' }"></div>
        </div>
      </div>
    </div>

    <button class="sync-btn" :disabled="syncing" @click="syncToSheet">
      <span class="icon">cloud_upload</span>
      {{ syncing ? '同期中…' : '取引シートに同期' }}
    </button>
    <div v-if="syncMsg" class="sync-msg">{{ syncMsg }}</div>
  </div>

  <!-- ───── 戦略タブ ───── -->
  <div v-else-if="tab === 'str'" class="strategy">
    <div class="intro">
      この月のデータと、季節 / 周辺の民泊状況 / 物価 / 世界情勢、それに <b>下の貼り付け欄に入れたレビュー</b> を踏まえて、AIが宿泊数を増やす戦略を提案します。
    </div>

    <div class="reviews-block">
      <div class="reviews-head">
        <span class="icon">rate_review</span>
        <span class="reviews-title">ゲストレビュー貼り付け</span>
        <span v-if="reviewsSaved" class="saved-dot" title="保存済">●</span>
      </div>
      <label class="rv-label">Airbnb（<a href="https://www.airbnb.jp/hosting/reviews" target="_blank" rel="noopener">ホスト→レビュー</a>）</label>
      <textarea class="rv-area" v-model="reviews.airbnb" placeholder="貼り付け or 下のボタンでスクショから読み取り" @input="onReviewInput"></textarea>
      <label class="rv-upload-btn" :class="{ loading: ocrLoading.airbnb }">
        <span class="icon">{{ ocrLoading.airbnb ? 'hourglass_empty' : 'add_photo_alternate' }}</span>
        {{ ocrLoading.airbnb ? '読み取り中 ' + ocrProgress.airbnb : 'スクショから読み取り' }}
        <input type="file" accept="image/*" multiple :disabled="ocrLoading.airbnb" @change="onUploadReviews('airbnb', $event)" hidden>
      </label>

      <label class="rv-label">Booking.com（<a href="https://admin.booking.com" target="_blank" rel="noopener">Extranet→ゲスト評価</a>）</label>
      <textarea class="rv-area" v-model="reviews.booking" placeholder="貼り付け or 下のボタンでスクショから読み取り" @input="onReviewInput"></textarea>
      <label class="rv-upload-btn" :class="{ loading: ocrLoading.booking }">
        <span class="icon">{{ ocrLoading.booking ? 'hourglass_empty' : 'add_photo_alternate' }}</span>
        {{ ocrLoading.booking ? '読み取り中 ' + ocrProgress.booking : 'スクショから読み取り' }}
        <input type="file" accept="image/*" multiple :disabled="ocrLoading.booking" @change="onUploadReviews('booking', $event)" hidden>
      </label>

      <label class="rv-label">その他（楽天トラベル / じゃらん / Google マップ / 直接の声 など）</label>
      <textarea class="rv-area" v-model="reviews.other" placeholder="貼り付け or スクショ読み取り or 雑メモでもOK" @input="onReviewInput"></textarea>
      <label class="rv-upload-btn" :class="{ loading: ocrLoading.other }">
        <span class="icon">{{ ocrLoading.other ? 'hourglass_empty' : 'add_photo_alternate' }}</span>
        {{ ocrLoading.other ? '読み取り中 ' + ocrProgress.other : 'スクショから読み取り' }}
        <input type="file" accept="image/*" multiple :disabled="ocrLoading.other" @change="onUploadReviews('other', $event)" hidden>
      </label>
    </div>

    <button class="gen-btn" :disabled="generating || loading" @click="generateStrategy">
      {{ generating ? '分析中… (30秒くらい)' : (strategy ? '🔄 再生成' : '✨ 戦略を分析する') }}
    </button>
    <div v-if="strategy" class="result">{{ strategy }}</div>
    <div v-if="strategyAt" class="meta">生成: {{ strategyAt }}</div>
  </div>
</div>
`;

const App = {
  template: TEMPLATE,
  setup() {
    const tab = ref("cal");
    const cur = ref(new Date());
    const bookings = ref([]);
    const loading = ref(false);
    const err = ref("");
    const usingSample = ref(false);
    const needsBackfill = ref(false);
    const syncingNow = ref(false);
    const syncMsgTop = ref("");
    let syncMsgTimer = null;
    const selectedDate = ref(null);
    const expandedBookingId = ref(null);
    function toggleBooking(id) {
      expandedBookingId.value = expandedBookingId.value === id ? null : id;
    }
    function formatTs(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return "";
      return d.toLocaleString("ja-JP", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    const strategy = ref("");
    const strategyAt = ref("");
    const generating = ref(false);
    const user = ref(null);
    // ゲストレビュー貼り付け欄。各チャネル分けて持つ。Firestore yado_reviews/data に永続化。
    const reviews = ref({ airbnb: "", booking: "", other: "" });
    const reviewsSaved = ref(false);
    const ocrLoading = ref({ airbnb: false, booking: false, other: false });
    const ocrProgress = ref({ airbnb: "", booking: "", other: "" });
    let db = null;
    let reviewsSaveTimer = null;

    const channels = CHANNELS;
    const chLabel = (c) => CHANNEL_LABEL[c] || c;

    const yyyymm = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    });
    const monthLabel = computed(() => {
      const d = cur.value;
      return `${d.getFullYear()}年 ${d.getMonth() + 1}月`;
    });
    const daysInMonth = computed(() => {
      const d = cur.value;
      return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    });

    function shiftMonth(delta) {
      const d = new Date(cur.value);
      d.setMonth(d.getMonth() + delta);
      cur.value = d;
      selectedDate.value = null;
      expandedBookingId.value = null;
      fetchBookings();
    }

    function isoDate(dt) {
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
    }
    function formatYen(n) { return Math.round(n).toLocaleString("ja-JP"); }
    // ISO 2 文字国コード → 国旗絵文字。?? や 1 文字なら 🌐。ユーザーデータ由来なので
    // 例外的に絵文字 OK (CLAUDE.md §6.5 ルール 4 の例外: 入力データ内)
    function countryEmoji(cc) {
      const s = (cc || "").toUpperCase();
      if (s.length !== 2 || /[^A-Z]/.test(s)) return "🌐";
      const A = 0x1F1E6 - 65;
      return String.fromCodePoint(s.charCodeAt(0) + A, s.charCodeAt(1) + A);
    }
    function formatJP(iso) {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${Number(m)}月${Number(d)}日`;
    }

    // 月のセル (前月末〜次月頭の埋め草込みで42日 = 6週分)
    const calendarCells = computed(() => {
      const d = cur.value;
      const first = new Date(d.getFullYear(), d.getMonth(), 1);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      const startDow = first.getDay();              // 0=日
      const totalDays = last.getDate();
      const cells = [];
      const today = isoDate(new Date());
      // 前月の埋め草
      const prevLast = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
      for (let i = startDow - 1; i >= 0; i--) {
        const day = prevLast - i;
        const dt = new Date(d.getFullYear(), d.getMonth() - 1, day);
        cells.push({ day, iso: isoDate(dt), inMonth: false, dow: dt.getDay(), bars: [], more: 0, isToday: false });
      }
      for (let day = 1; day <= totalDays; day++) {
        const dt = new Date(d.getFullYear(), d.getMonth(), day);
        const iso = isoDate(dt);
        const dayBookings = bookings.value.filter((b) => iso >= b.arrival && iso < b.departure);
        const bars = dayBookings.slice(0, 3).map((b) => ({ id: b.id, channel: b.channel }));
        const more = Math.max(0, dayBookings.length - bars.length);
        cells.push({ day, iso, inMonth: true, dow: dt.getDay(), bars, more, isToday: iso === today });
      }
      // 残りを次月埋め草で42に揃える
      while (cells.length < 42) {
        const day = cells.length - startDow - totalDays + 1;
        const dt = new Date(d.getFullYear(), d.getMonth() + 1, day);
        cells.push({ day, iso: isoDate(dt), inMonth: false, dow: dt.getDay(), bars: [], more: 0, isToday: false });
      }
      return cells;
    });

    const selectedDayBookings = computed(() => {
      if (!selectedDate.value) return [];
      return bookings.value
        .filter((b) => selectedDate.value >= b.arrival && selectedDate.value < b.departure)
        .sort((a, b) => (a.channel || "").localeCompare(b.channel || ""));
    });

    // ───── 集計 (当月) ─────
    // 売上は「予約あたり総額」を「宿泊日数」で按分して当月に該当する泊数だけ計上。
    // (チェックイン月で全額計上だと月跨ぎが歪むので)
    const monthlyBookings = computed(() => {
      const d = cur.value;
      const monthStart = isoDate(new Date(d.getFullYear(), d.getMonth(), 1));
      const monthEnd = isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 1));
      return bookings.value.filter((b) => b.departure > monthStart && b.arrival < monthEnd);
    });
    function nightsInMonth(b) {
      const d = cur.value;
      const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
      const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      const ai = new Date(b.arrival);
      const de = new Date(b.departure);
      const start = ai > monthStart ? ai : monthStart;
      const end = de < monthEnd ? de : monthEnd;
      const nights = Math.round((end - start) / 86400000);
      return Math.max(0, nights);
    }
    // 月跨ぎ予約は「対象月にかかる泊数」で按分。gross/net/commission 全て同じ係数。
    function prorate(b, amount) {
      const n = nightsInMonth(b);
      const totalNightsB = Math.max(1, b.nights || 1);
      return (amount || 0) * (n / totalNightsB);
    }
    const totalNights = computed(() => monthlyBookings.value.reduce((s, b) => s + nightsInMonth(b), 0));
    const monthlyRevenue = computed(() => monthlyBookings.value.reduce((s, b) => s + prorate(b, b.price), 0));
    const monthlyCommission = computed(() => monthlyBookings.value.reduce((s, b) => s + prorate(b, b.commission || 0), 0));
    const monthlyNet = computed(() => monthlyRevenue.value - monthlyCommission.value);
    const netRate = computed(() => monthlyRevenue.value > 0
      ? Math.round(monthlyNet.value / monthlyRevenue.value * 1000) / 10 : 0);
    const adrGross = computed(() => totalNights.value > 0
      ? Math.round(monthlyRevenue.value / totalNights.value) : 0);
    const adrNet = computed(() => totalNights.value > 0
      ? Math.round(monthlyNet.value / totalNights.value) : 0);
    const avgLeadDays = computed(() => {
      const ls = monthlyBookings.value.map((b) => b.leadDays).filter((l) => l != null);
      return ls.length ? Math.round(ls.reduce((s, x) => s + x, 0) / ls.length) : null;
    });
    // 当月の国別カウント (chip 表示用)。降順、未設定は ??
    const countryDist = computed(() => {
      const m = {};
      for (const b of monthlyBookings.value) {
        const c = (b.country || "??").toUpperCase() || "??";
        m[c] = (m[c] || 0) + 1;
      }
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    });
    // 仮: 部屋数1室として稼働率を出す。実際は Beds24 から拾いたい。
    const NUM_ROOMS = 1;
    const availableNights = computed(() => daysInMonth.value * NUM_ROOMS);
    const occupancyPct = computed(() => Math.round((totalNights.value / Math.max(1, availableNights.value)) * 100));

    const revenueByChannel = computed(() => {
      const m = { airbnb: 0, booking: 0, direct: 0, other: 0 };
      for (const b of monthlyBookings.value) {
        const n = nightsInMonth(b);
        const totalNightsB = Math.max(1, b.nights || 1);
        m[b.channel] = (m[b.channel] || 0) + (b.price || 0) * (n / totalNightsB);
      }
      return m;
    });
    function revenueBarPct(c) {
      const max = Math.max(...Object.values(revenueByChannel.value), 1);
      return ((revenueByChannel.value[c] || 0) / max) * 100;
    }
    const dailyRevenue = computed(() => {
      const days = daysInMonth.value;
      const arr = Array.from({ length: days }, () => ({ airbnb: 0, booking: 0, direct: 0, other: 0 }));
      const d = cur.value;
      for (const b of monthlyBookings.value) {
        const totalNightsB = Math.max(1, b.nights || 1);
        const per = (b.price || 0) / totalNightsB;
        const ai = new Date(b.arrival);
        const de = new Date(b.departure);
        for (let dt = new Date(ai); dt < de; dt.setDate(dt.getDate() + 1)) {
          if (dt.getFullYear() === d.getFullYear() && dt.getMonth() === d.getMonth()) {
            arr[dt.getDate() - 1][b.channel] = (arr[dt.getDate() - 1][b.channel] || 0) + per;
          }
        }
      }
      return arr;
    });
    const maxDayRevenue = computed(() => {
      let mx = 0;
      for (const row of dailyRevenue.value) {
        const s = Object.values(row).reduce((a, b) => a + b, 0);
        if (s > mx) mx = s;
      }
      return mx;
    });

    // ───── サーバー呼び出し ─────
    async function fetchBookings() {
      if (!user.value) return;
      loading.value = true;
      err.value = "";
      usingSample.value = false;
      needsBackfill.value = false;
      try {
        const d = cur.value;
        const from = isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1));   // 前月から
        const to   = isoDate(new Date(d.getFullYear(), d.getMonth() + 2, 0));   // 次月末まで
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + `/api/yado/bookings?from=${from}&to=${to}`, {
          headers: { authorization: "Bearer " + token },
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(`${res.status}: ${t.slice(0, 200)}`);
        }
        const j = await res.json();
        if (j.sample) {
          // サーバーがトークン未設定でサンプルを返してきたパターン → 空のまま
          usingSample.value = true;
          bookings.value = [];
        } else if (j.needsBackfill) {
          // BEDS24 設定済だが SQL がまだ空。バックフィル誘導。空のまま表示。
          needsBackfill.value = true;
          bookings.value = [];
        } else {
          bookings.value = (j.bookings || []).map((b) => ({
            ...b,
            channel: normalizeChannel(b.referer || b.channel),
          }));
        }
      } catch (e) {
        err.value = "取得失敗: " + (e.message || e);
        bookings.value = [];
      } finally {
        loading.value = false;
      }
    }

    async function generateStrategy() {
      if (!user.value || generating.value) return;
      generating.value = true;
      err.value = "";
      try {
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + "/api/yado/strategy", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({
            // 集計はサーバが DB から直接引くので month と reviews だけ送る
            month: yyyymm.value,
            reviews: reviews.value,
          }),
        });
        if (!res.ok) {
          const t = await res.text();
          throw new Error(`${res.status}: ${t.slice(0, 300)}`);
        }
        const j = await res.json();
        strategy.value = j.strategy || "(空のレスポンス)";
        strategyAt.value = new Date().toLocaleString("ja-JP", { hour12: false });
      } catch (e) {
        err.value = "戦略生成失敗: " + (e.message || e);
      } finally {
        generating.value = false;
      }
    }

    // レビュー欄の自動保存 (debounce 800ms)。Firestore yado_reviews/data に setDoc。
    async function loadReviews() {
      if (!db) return;
      try {
        const snap = await getDoc(doc(db, "yado_reviews", "data"));
        if (snap.exists()) {
          const x = snap.data() || {};
          reviews.value = { airbnb: x.airbnb || "", booking: x.booking || "", other: x.other || "" };
          reviewsSaved.value = true;
        }
      } catch (e) { /* silent */ }
    }
    function onReviewInput() {
      reviewsSaved.value = false;
      clearTimeout(reviewsSaveTimer);
      reviewsSaveTimer = setTimeout(async () => {
        if (!db || !user.value) return;
        try {
          await setDoc(doc(db, "yado_reviews", "data"), {
            airbnb: reviews.value.airbnb || "",
            booking: reviews.value.booking || "",
            other: reviews.value.other || "",
            updatedAt: serverTimestamp(),
            updatedBy: (user.value.email || "").toLowerCase(),
          }, { merge: true });
          reviewsSaved.value = true;
        } catch (e) { console.warn("review save failed:", e.message); }
      }, 800);
    }

    // ファイル → base64 (data URL の先頭部分は捨てて純 base64 だけ返す)
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // スクショ複数を順次 Gemini OCR にかけて、抽出されたテキストを各チャネルの textarea に追記。
    async function onUploadReviews(channel, ev) {
      const files = Array.from(ev.target.files || []);
      if (!files.length || !user.value) return;
      ocrLoading.value[channel] = true;
      ocrProgress.value[channel] = "";
      const results = [];
      try {
        const token = await user.value.getIdToken();
        for (let i = 0; i < files.length; i++) {
          ocrProgress.value[channel] = `(${i + 1}/${files.length})`;
          const file = files[i];
          const base64 = await fileToBase64(file);
          const res = await fetch((window.API_BASE || "") + "/api/yado/ocr-reviews", {
            method: "POST",
            headers: { authorization: "Bearer " + token, "content-type": "application/json" },
            body: JSON.stringify({ image: base64, mimeType: file.type || "image/jpeg", channel }),
          });
          if (res.ok) {
            const j = await res.json();
            if (j.text && j.text.trim()) results.push(j.text.trim());
          } else {
            const t = await res.text();
            console.warn(`OCR failed for ${file.name}: ${res.status} ${t.slice(0, 120)}`);
          }
        }
        if (results.length) {
          const existing = (reviews.value[channel] || "").trim();
          const joined = results.join("\n\n---\n\n");
          reviews.value[channel] = existing ? existing + "\n\n---\n\n" + joined : joined;
          onReviewInput();
        }
      } catch (e) {
        err.value = "スクショ読取失敗: " + (e.message || e);
      } finally {
        ocrLoading.value[channel] = false;
        ocrProgress.value[channel] = "";
        ev.target.value = ""; // input をリセット (同じファイル再選択できるように)
      }
    }

    const syncing = ref(false);
    const syncMsg = ref("");
    async function syncToSheet() {
      if (!user.value || syncing.value) return;
      syncing.value = true;
      syncMsg.value = "";
      try {
        const token = await user.value.getIdToken();
        const d = cur.value;
        const from = isoDate(new Date(d.getFullYear(), d.getMonth() - 1, 1));
        const to = isoDate(new Date(d.getFullYear(), d.getMonth() + 2, 0));
        const res = await fetch((window.API_BASE || "") + "/api/yado/sync", {
          method: "POST",
          headers: { authorization: "Bearer " + token, "content-type": "application/json" },
          body: JSON.stringify({
            from, to,
            // BEDS24 トークンが未設定の場合に備えて、フロントで持ってる bookings も渡す。
            // サーバー側で BEDS24_API_TOKEN があれば本物を再取得して上書きされる。
            bookings: usingSample.value ? [] : bookings.value.map((b) => ({
              id: b.id, arrival: b.arrival, departure: b.departure,
              referer: b.referer || b.channel, price: b.price,
              numAdult: b.adult, numChild: b.child,
              firstName: b.guestName, lastName: "",
            })),
          }),
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        syncMsg.value = `${j.synced}/${j.total} 件をシートに送信しました`;
      } catch (e) {
        syncMsg.value = "同期失敗: " + (e.message || e);
      } finally {
        syncing.value = false;
      }
    }

    // ワンタップ同期: サーバが「初回=全取込 / 以降=差分」を自動判定する /api/yado/sync を叩く。
    // 完了したら fetchBookings を再走して画面反映、結果メッセージを 3 秒表示。
    async function runSync() {
      if (!user.value || syncingNow.value) return;
      syncingNow.value = true;
      syncMsgTop.value = "";
      clearTimeout(syncMsgTimer);
      try {
        const token = await user.value.getIdToken();
        const res = await fetch((window.API_BASE || "") + "/api/yado/refresh", {
          method: "POST",
          headers: { authorization: "Bearer " + token },
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j.error || res.status);
        const label = j.kind === "backfill" ? "全期間取込" : "差分同期";
        syncMsgTop.value = `${label}完了: ${j.fetched} 件取得 / ${j.upserted} 件保存`;
        await fetchBookings();
      } catch (e) {
        syncMsgTop.value = "同期失敗: " + (e.message || e);
      } finally {
        syncingNow.value = false;
        syncMsgTimer = setTimeout(() => { syncMsgTop.value = ""; }, 5000);
      }
    }

    function back() { location.href = "/"; }

    onMounted(async () => {
      try {
        const cfg = await fetch("/__/firebase/init.json").then((r) => r.json());
        cfg.authDomain = location.hostname;
        const app = initializeApp(cfg);
        const auth = getAuth(app);
        await setPersistence(auth, browserLocalPersistence);
        db = getFirestore(app);
        onAuthStateChanged(auth, async (u) => {
          if (!u) {
            location.href = "/?next=" + encodeURIComponent(location.pathname);
            return;
          }
          user.value = u;
          await fetchBookings();
          await loadReviews();
        });
      } catch (e) {
        err.value = "初期化失敗: " + (e.message || e);
        bookings.value = [];
      }
    });

    return {
      tab, cur, bookings, loading, err, usingSample, selectedDate, strategy, strategyAt, generating,
      syncing, syncMsg, reviews, reviewsSaved,
      needsBackfill, syncingNow, syncMsgTop, runSync,
      expandedBookingId, toggleBooking, formatTs,
      channels, chLabel, monthLabel, yyyymm, calendarCells, selectedDayBookings,
      monthlyBookings, totalNights, monthlyRevenue, monthlyNet, monthlyCommission, netRate,
      adrGross, adrNet, avgLeadDays, countryDist, countryEmoji,
      availableNights, occupancyPct,
      revenueByChannel, revenueBarPct, dailyRevenue, maxDayRevenue,
      shiftMonth, formatYen, formatJP, fetchBookings, generateStrategy, syncToSheet, back,
      onReviewInput, onUploadReviews, ocrLoading, ocrProgress,
    };
  },
};

createApp(App).mount("#app");
</script>
</body>
</html>
